name: NOA social signup presentation repair
on:
  pull_request:
    paths: ['deploy/noa-social-signup.*','scripts/noa_social_signup_release.py','scripts/qa/noa-social-signup.mjs','tests/social-signup/**','.github/workflows/noa-social-signup.yml']
  push:
    branches: [main]
    paths: ['deploy/noa-social-signup.*','scripts/noa_social_signup_release.py','scripts/qa/noa-social-signup.mjs','tests/social-signup/**','.github/workflows/noa-social-signup.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Prepare existing transport and verification tools
        run: |
          python -m pip install 'paramiko>=3,<5'
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-social" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          python scripts/qa/noa-qa-font.py
          cp scripts/qa/noa-social-signup.mjs "$RUNNER_TEMP/noa-social/check.mjs"
      - name: Inspect actual installed native skins without account or database writes
        run: python scripts/noa_social_signup_release.py snapshot
      - name: Validate and render the installed skins offline
        run: |
          php -l deploy/noa-social-signup.extend.php
          php tests/social-signup/render.php
          node "$RUNNER_TEMP/noa-social/check.mjs"
      - name: Activate only reviewed presentation files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: activate
        run: python scripts/noa_social_signup_release.py
      - name: Restore owned source on activation failure
        if: failure() && steps.activate.outcome == 'failure'
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_social_signup_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-social-signup-${{ github.run_id }}
          path: |
            social-signup-proof/qa.json
            social-signup-proof/native-hashes.json
            social-signup-proof/deployment.json
            social-signup-proof/screenshots/
          retention-days: 7
