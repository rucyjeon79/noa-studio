name: Verify and publish AI LAB entry
on:
  pull_request:
    paths: ['.github/actions/n80-daily-shorts/**','scripts/noa_shorts_github.py','bridge/lab-oauth.php','scripts/qa/noa-drive-connect.mjs','lab/daily_shorts.py','bridge/worker-shorts.php','deploy/noa-app/engine/service-runtime.php','scripts/noa_daily_shorts.py','scripts/noa_shorts_assembly.py','scripts/noa_shorts_storage.py','config/n80-automation.json','.github/workflows/noa-ai-worker.yml','config/n80-daily-shorts.json','bridge/session*.php','bridge/lab-api.php','deploy/noa-ai-lab.*','lab/session-subtitles.py','lab/subtitle-requirements.txt','lab/subtitles.mjs','lab/session-assemble.mjs','tests/session-agent/**','tests/gpt/flow.py','scripts/qa/noa-session-agent.mjs','.github/workflows/noa-lab-entry.yml']
  push:
    branches: [main, work/n80-browser-media, work/n80-duration-cuts, work/n80-session-agent]
    paths: ['.github/actions/n80-daily-shorts/**','scripts/noa_shorts_github.py','bridge/lab-oauth.php','scripts/qa/noa-drive-connect.mjs','lab/daily_shorts.py','bridge/worker-shorts.php','deploy/noa-app/engine/service-runtime.php','scripts/noa_daily_shorts.py','scripts/noa_shorts_assembly.py','scripts/noa_shorts_storage.py','config/n80-automation.json','.github/workflows/noa-ai-worker.yml','config/n80-daily-shorts.json','bridge/session-subtitles.php','lab/session-subtitles.py','lab/subtitles.mjs','bridge/session*.php','lab/session-assemble.mjs','tests/session-agent/**','scripts/qa/noa-session-agent.mjs','deploy/noa-app/engine/ai-lab.php','deploy/noa-gpt.php','.github/workflows/noa-lab-entry.yml','bridge/lab-browser-assets.php','tests/lab/browser_assets_test.php','tests/lab/http_test.py','tests/lab/clip_fixture.b64','bridge/lab-core.php','bridge/lab-api.php','bridge/catalog.php','deploy/noa-ai-lab.js','deploy/noa-ai-lab.php','bridge/muvy*.php','deploy/noa-muvy*','tests/muvy/**','scripts/qa/noa-muvy.mjs']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_mysql,pdo_sqlite,mbstring,curl,fileinfo'}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Verify native clip receipt and existing worker contracts
        run: |
          for f in bridge/muvy*.php deploy/noa-muvy-panel.php; do php -l "$f"; done
          php -l deploy/noa-gpt.php
          php -l bridge/session-agent.php
          php -l bridge/session-agent-media.php
          php -l bridge/session-subtitles.php
          php -l bridge/session-shorts.php
          php -l bridge/session-shorts-prepare.php
          php -l bridge/session-shorts-subtitles.php
          php -l bridge/session-shorts-assemble.php
          php -l bridge/session-shorts-storage.php
          php -l bridge/session-shorts-github.php
          php -l bridge/lab-oauth.php
          php -l bridge/session-shorts-drive.php
          php -l bridge/session-shorts-drive-view.php
          php tests/session-agent/drive.php
          python tests/session-agent/drive_http_test.py
          php tests/session-agent/storage.php
          python tests/session-agent/storage_test.py
          python -m pip install cryptography==46.0.3
          python tests/session-agent/github_storage_test.py
          php tests/session-agent/github-storage.php
          php tests/session-agent/preparation.php
          php tests/session-agent/caption-preparation.php
          php tests/lab/oauth_test.php
          python tests/session-agent/preparation_test.py
          php -l bridge/worker-shorts.php
          php tests/session-agent/schedule.php
          node tests/session-agent/assembly.mjs /tmp/n80-session-fixture
          node tests/session-agent/shorts.mjs /tmp/n80-shorts-fixture
          php tests/session-agent/auto-assembly.php /tmp/n80-shorts-fixture
          python tests/session-agent/auto_assembly_test.py
          php tests/session-agent/core.php /tmp/n80-session-fixture
          python tests/session-agent/subtitles_test.py
          node tests/session-agent/subtitles.mjs /tmp/n80-session-fixture
          php tests/session-agent/subtitles.php /tmp/n80-session-fixture
          python tests/gpt/flow.py
          php tests/muvy/timeline.php
          php tests/muvy/fixture.php
          node --check deploy/noa-muvy.js
          php -l bridge/lab-core.php
          php -l bridge/lab-browser-assets.php
          php -l bridge/lab-api.php
          php -l bridge/catalog.php
          php -l deploy/noa-ai-lab.php
          node --check deploy/noa-ai-lab.js
          ffmpeg -v error -f lavfi -i 'color=c=blue:s=512x288:r=24' -t 0.5 -an -c:v libx264 -pix_fmt yuv420p /tmp/n80-clip.mp4
          php tests/lab/browser_assets_test.php /tmp/n80-clip.mp4
          php tests/lab/core_test.php
          python tests/lab/http_test.py
          python tests/explorer/lab_choices.py
          php tests/engine/service_runtime_test.php
          php tests/engine/single_runtime_policy_test.php
      - name: Verify stored scenes and layouts with an isolated provider
        run: |
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/muvy-check" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-muvy.mjs "$RUNNER_TEMP/muvy-check/check.mjs"
          node "$RUNNER_TEMP/muvy-check/check.mjs"
          cp scripts/qa/noa-session-agent.mjs "$RUNNER_TEMP/muvy-check/session.mjs"
          node "$RUNNER_TEMP/muvy-check/session.mjs"
          cp scripts/qa/noa-drive-connect.mjs "$RUNNER_TEMP/muvy-check/drive.mjs"
          node "$RUNNER_TEMP/muvy-check/drive.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'n80-duration-check-${{ github.run_id }}', path: 'muvy-proof/', retention-days: 7}
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[n80-browser]'))
    runs-on: ubuntu-24.04
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Publish and verify AI LAB entry
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES = {
              'noa-bridge/muvy-timeline.php': 'bridge/muvy-timeline.php',
              'noa-bridge/muvy-rules.php': 'bridge/muvy-rules.php',
              'noa-bridge/muvy-prompts.php': 'bridge/muvy-prompts.php',
              'noa-bridge/muvy-core.php': 'bridge/muvy-core.php',
              'noa-bridge/muvy.php': 'bridge/muvy.php',
              'noa-muvy.js': 'deploy/noa-muvy.js',
              'noa-muvy-panel.php': 'deploy/noa-muvy-panel.php',
              'noa-bridge/lab-browser-assets.php': 'bridge/lab-browser-assets.php',
              'noa-app/engine/daily-shorts.json': 'config/n80-daily-shorts.json',
              'noa-bridge/session-shorts.php': 'bridge/session-shorts.php',
              'noa-bridge/session-shorts-prepare.php': 'bridge/session-shorts-prepare.php',
              'noa-bridge/session-shorts-subtitles.php': 'bridge/session-shorts-subtitles.php',
              'noa-bridge/session-shorts-assemble.php': 'bridge/session-shorts-assemble.php',
              'noa-bridge/session-shorts-drive.php': 'bridge/session-shorts-drive.php',
              'noa-bridge/session-shorts-drive-view.php': 'bridge/session-shorts-drive-view.php',
              'noa-bridge/lab-oauth.php': 'bridge/lab-oauth.php',
              'noa-bridge/session-shorts-github.php': 'bridge/session-shorts-github.php',
              'noa-bridge/session-shorts-storage.php': 'bridge/session-shorts-storage.php',
              'noa-bridge/youtube-store.php': 'bridge/youtube-store.php',
              'noa-bridge/lab-oauth-core.php': 'bridge/lab-oauth-core.php',
              'noa-bridge/worker-shorts.php': 'bridge/worker-shorts.php',
              'noa-app/engine/service-runtime.php': 'deploy/noa-app/engine/service-runtime.php',
              'noa-bridge/session-agent-media.php': 'bridge/session-agent-media.php',
              'noa-bridge/session-subtitles.php': 'bridge/session-subtitles.php',
              'noa-bridge/session-agent.php': 'bridge/session-agent.php',
              'noa-gpt.php': 'deploy/noa-gpt.php',
              'noa-bridge/lab-core.php': 'bridge/lab-core.php',
              'noa-bridge/catalog.php': 'bridge/catalog.php',
              'noa-bridge/lab-api.php': 'bridge/lab-api.php',
              'noa-ai-lab.js': 'deploy/noa-ai-lab.js',
              'noa-app/engine/ai-lab.php': 'deploy/noa-app/engine/ai-lab.php',
              'noa-ai-lab.php': 'deploy/noa-ai-lab.php',
          }
          release.NEW = {'noa-bridge/session-shorts-github.php','noa-bridge/session-shorts-drive.php','noa-bridge/session-shorts-drive-view.php','noa-bridge/session-shorts-storage.php','noa-bridge/session-shorts-assemble.php','noa-bridge/session-shorts-subtitles.php','noa-bridge/session-shorts-prepare.php','noa-app/engine/daily-shorts.json','noa-bridge/session-shorts.php','noa-bridge/worker-shorts.php','noa-bridge/session-subtitles.php','noa-bridge/session-agent.php','noa-bridge/session-agent-media.php','noa-bridge/lab-browser-assets.php','noa-bridge/muvy-timeline.php'}
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
          PYTHONPATH=scripts python - <<'PY'
          import json
          from noa_n80_ai_worker import worker_key,signed_tick
          result=signed_tick(worker_key(),'n80_daily_shorts_tick')
          campaign=result['campaign']
          assert campaign['stateOwner']=='N80 Engine' and campaign['conversationDependent'] is False
          assert campaign['policy']['publishLocalTime']=='12:00'
          assert campaign['policy']['publishIsoWeekdays']==[1,3,5]
          from datetime import datetime
          assert datetime.fromisoformat(campaign['nextPublicationAt']).isoweekday() in (1,3,5)
          print('N80_DAILY_SHORTS_PERSISTED',json.dumps({k:campaign.get(k) for k in ('state','schedulerOwner','stateOwner','conversationDependent','nextPreparationAt','nextPublicationAt','policy','productionReady')},ensure_ascii=False))
          import subprocess
          if '[n80-auto-assembly]' in subprocess.check_output(['git','log','-1','--format=%s'],text=True):
              attachment=signed_tick(worker_key(),'n80_daily_shorts_tick',json.dumps({'command':'assembly_attach','id':'8491b2cebbdb452ac654d152f3455685','expectedRevision':26,'originalVideoId':'ovdE-E9Rjm4'}).encode())
              assert attachment['attached'] is True
              print('N80_SHORTS_EXISTING_PILOT_ATTACHED',attachment['attached'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'n80-browser-activation-${{ github.run_id }}', path: 'ainoa-proof/', retention-days: 7}
