name: Verify and publish AI LAB entry
on:
  push:
    branches: [main, work/n80-browser-media]
    paths: ['.github/workflows/noa-lab-entry.yml','bridge/lab-browser-assets.php','tests/lab/browser_assets_test.php']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_mysql,pdo_sqlite,mbstring,curl,fileinfo'}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Verify native clip receipt and existing worker contracts
        run: |
          php -l bridge/lab-core.php
          php -l bridge/lab-browser-assets.php
          php -l bridge/lab-api.php
          php -l bridge/catalog.php
          php -l deploy/noa-ai-lab.php
          node --check deploy/noa-ai-lab.js
          ffmpeg -v error -f lavfi -i 'color=c=blue:s=512x288:r=24' -t 0.5 -an -c:v libx264 -pix_fmt yuv420p /tmp/n80-clip.mp4
          php tests/lab/browser_assets_test.php /tmp/n80-clip.mp4
          php tests/lab/core_test.php
          python tests/lab/http_test.py
          php tests/engine/service_runtime_test.php
          php tests/engine/single_runtime_policy_test.php
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[n80-browser]'))
    runs-on: ubuntu-24.04
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Publish and verify AI LAB entry
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES = {
              'noa-bridge/lab-browser-assets.php': 'bridge/lab-browser-assets.php',
              'noa-bridge/lab-core.php': 'bridge/lab-core.php',
              'noa-bridge/catalog.php': 'bridge/catalog.php',
              'noa-bridge/lab-api.php': 'bridge/lab-api.php',
              'noa-ai-lab.js': 'deploy/noa-ai-lab.js',
              'noa-ai-lab.php': 'deploy/noa-ai-lab.php',
          }
          release.NEW = {'noa-bridge/lab-browser-assets.php'}
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'n80-browser-activation-${{ github.run_id }}', path: 'ainoa-proof/', retention-days: 7}
