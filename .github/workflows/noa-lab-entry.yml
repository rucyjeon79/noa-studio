name: Verify and publish AI LAB entry
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-lab-entry.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          php -l bridge/lab-core.php
          php -l bridge/ainoa-generation.php
          php -l bridge/lab-api.php
          php -l bridge/lab-file.php
          php -l bridge/lab-creator.php
          php -l bridge/catalog.php
          node --check deploy/noa-ai-lab.js
          node --check deploy/noa-muvy.js
          php -l deploy/noa-ai-lab.php
          python -m pip install 'paramiko>=3,<5'
      - name: Publish and verify AI LAB entry
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES = {
              'noa-bridge/lab-core.php': 'bridge/lab-core.php',
              'noa-bridge/ainoa-generation.php': 'bridge/ainoa-generation.php',
              'noa-bridge/lab-api.php': 'bridge/lab-api.php',
              'noa-bridge/lab-file.php': 'bridge/lab-file.php',
              'noa-bridge/lab-creator.php': 'bridge/lab-creator.php',
              'noa-bridge/catalog.php': 'bridge/catalog.php',
              'noa-ai-lab.js': 'deploy/noa-ai-lab.js',
              'noa-muvy.js': 'deploy/noa-muvy.js',
              'noa-ai-lab.php': 'deploy/noa-ai-lab.php',
          }
          release.NEW = set()
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
