name: NOA Unified Categories and Administrator Workspace
on:
  pull_request:
    paths: ['bridge/**','deploy/**','scripts/noa_workspace_release.py','scripts/qa/noa-quality.mjs','tests/workspace/**','.github/workflows/noa-workspace.yml']
  push:
    branches: [main]
    paths: ['scripts/noa_workspace_release.py','scripts/noa_release_freshness.py','scripts/noa_ainoa_deploy.py','scripts/qa/noa-workspace*.mjs','tests/workspace/**','.github/workflows/noa-workspace.yml']
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-test-only, MYSQL_DATABASE: noa_workspace_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pnoa-test-only" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=noa_workspace_test;charset=utf8mb4
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: noa-test-only
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_mysql,pdo_sqlite,mbstring'}
      - name: Validate changed sources and existing category, permission and record contracts
        run: |
          python -m pip install 'paramiko>=3,<5'
          python tests/workspace/release_freshness_test.py
          python tests/uiux/recovery_contract_test.py
          python - <<'PY'
          import sys,subprocess
          sys.path.insert(0,'scripts')
          import noa_workspace_release as r
          for source in r.release.FILES.values():
              if source.endswith('.php'): subprocess.run(['php','-l',source],check=True)
              if source.endswith('.js'): subprocess.run(['node','--check',source],check=True)
          PY
          php tests/sitemap/registry_test.php
          php tests/member/access_test.php
          php tests/uiux/browse_cache_revision.php
          php tests/catalog/sound_test.php
          php tests/catalog/music_readmodel_test.php
          php tests/catalog/package_record_test.php
          php tests/catalog/recovery_test.php
          php tests/workspace/classification_test.php
          php tests/workspace/duplicates_test.php
          php tests/catalog/inline_edit_projection_test.php
          php tests/youtube/coming_catalog_test.php
          node --test scripts/qa/noa-browse.test.mjs scripts/qa/noa-four-level.test.mjs tests/pwa/launch_test.cjs tests/playlists/drag_order_test.cjs tests/youtube/lazy_details_test.cjs
          php tests/workspace/seed.php
          php tests/workspace/trash_test.php
          php tests/workspace/fixture.php
          python scripts/qa/noa-qa-font.py
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-workspace" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-quality.mjs "$RUNNER_TEMP/noa-workspace/quality.mjs"
          cp scripts/qa/noa-workspace.mjs "$RUNNER_TEMP/noa-workspace/check.mjs"
          cp scripts/qa/noa-workspace-live.mjs "$RUNNER_TEMP/noa-workspace/live.mjs"
          cp scripts/qa/noa-workspace-surfaces.mjs "$RUNNER_TEMP/noa-workspace/surfaces.mjs"
          cp scripts/qa/noa-navigation.mjs "$RUNNER_TEMP/noa-workspace/navigation.mjs"
      - name: Verify mobile, desktop, native permissions and actual isolated mutations
        run: |
          node "$RUNNER_TEMP/noa-workspace/check.mjs"
      - name: Verify reviewed repairs and all common form entry points
        run: |
          php tests/workspace/quality_test.php
          node "$RUNNER_TEMP/noa-workspace/quality.mjs"
      - name: Verify actual music projections, link states and native board styling
        run: |
          php tests/workspace/surfaces_fixture.php
          node "$RUNNER_TEMP/noa-workspace/surfaces.mjs"
      - name: Verify existing Chromium and WebKit navigation
        run: |
          timeout 300s "$RUNNER_TEMP/noa-workspace/node_modules/.bin/playwright" install --with-deps webkit
          node "$RUNNER_TEMP/noa-workspace/navigation.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-workspace-candidate-${{ github.run_id }}
          path: |
            workspace-proof/
            navigation-proof/
          retention-days: 14
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[creator-release]')
    needs: candidate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Prepare verified deployment and read-only browser tools
        run: |
          python -m pip install 'paramiko>=3,<5'
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-workspace" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-workspace-live.mjs "$RUNNER_TEMP/noa-workspace/live.mjs"
      - name: Deploy only verified workspace sources with preimage and unchanged-file guards
        id: upload
        env: &production
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_workspace_release.py
      - name: Verify actual public production pages without data writes
        id: live
        run: node "$RUNNER_TEMP/noa-workspace/live.mjs"
      - name: Restore only owned source if deployment or live acceptance fails
        if: failure() && (steps.upload.outcome == 'failure' || steps.live.outcome == 'failure')
        env: *production
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_workspace_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-workspace-live-${{ github.run_id }}
          path: |
            workspace-proof/
            navigation-proof/
          retention-days: 14
