env:
  NOA_DRIVE_RCLONE_CONFIG_B64: ${{ secrets.NOA_DRIVE_RCLONE_CONFIG_B64 }}
name: NOA full reviewed runtime release
# P0: preserve active music work; fail closed before any unbacked replacement.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/noa-full-runtime-release.yml'
      - 'scripts/noa_full_runtime_deploy.py'
      - 'scripts/noa_release_identity.py'
      - 'tests/deploy_guard_test.py'
  workflow_dispatch:
  release:
    types: [published]
permissions: {contents: read, pull-requests: read}
concurrency: {group: noa-dothome-production, cancel-in-progress: false}
jobs:
  candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify deploy safety without production credentials
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 -m py_compile scripts/noa_full_runtime_deploy.py scripts/noa_full_inventory.py scripts/noa_deploy_guard.py scripts/noa_release_identity.py
          python3 -m unittest discover -s tests -p deploy_guard_test.py -v
  runtime:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0, ref: main}
      - name: Verify merged PR provenance or explicit release approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOA_APPROVED_RELEASE_SHA: ${{ vars.NOA_APPROVED_RELEASE_SHA }}
        run: python3 scripts/noa_release_identity.py
      - name: Verify approved commit and release manifest
        run: |
          test "$(git rev-parse HEAD)" = "${NOA_RELEASE_COMMIT}"
          git diff --exit-code
      - name: Verify release gate rejects unapproved candidates
        run: |
          python3 - <<'PY'
          import pathlib
          workflow=pathlib.Path('.github/workflows/noa-full-runtime-release.yml').read_text()
          deploy=pathlib.Path('scripts/noa_full_runtime_deploy.py').read_text()
          required=['NOA_APPROVED_RELEASE_SHA','release_checkout_mismatch','unapproved_release_identity']
          for term in required:
              assert term in workflow+deploy, term
          assert 'NOA_RELEASE_SHA_VALIDATED' in deploy
          assert 'concurrent_change_before_activation' in deploy
          assert 'rollback_concurrent_change' in deploy
          print('DIRECT_RELEASE_GUARD_CONTRACT_OK')
          PY
      - name: Validate deployment workflow syntax
        run: |
          python3 -m pip install --user PyYAML==6.0.2
          python3 -c 'import yaml; d=yaml.safe_load(open(".github/workflows/noa-full-runtime-release.yml")); assert "jobs" in d and "runtime" in d["jobs"]; t=d.get("on",d.get(True)); assert "release" in t and "workflow_dispatch" in t and "push" in t'
      - name: Validate deployment script syntax
        run: |
          python3 -m pip install --user PyYAML==6.0.2
          python3 -m py_compile scripts/noa_full_runtime_deploy.py scripts/noa_full_inventory.py scripts/noa_deploy_guard.py
          python3 -m unittest discover -s tests -p deploy_guard_test.py -v
      - name: Verify production release is not a draft or pull request
        run: |
          test "${GITHUB_EVENT_NAME}" = release || test "${GITHUB_EVENT_NAME}" = workflow_dispatch || test "${GITHUB_EVENT_NAME}" = push
          test "$(git rev-parse HEAD)" = "${NOA_RELEASE_COMMIT}"
      - name: Validate all active runtime sources and read-only feature tests
        run: |
          find bridge deploy/noa-app deploy/theme/noa_studio -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          for f in deploy/noa*.php deploy/index.php; do php -l "$f"; done
          for f in deploy/noa*.js; do node --check "$f"; done
          php tests/catalog/home_test.php
          php tests/catalog/world_test.php
          php tests/catalog/world_mv_test.php
          php tests/database/grammar.php
          node --test scripts/noa_player_regression.test.mjs scripts/qa/*.test.mjs
          python3 -m pip install --user paramiko==3.5.1
      - name: Validate integrated mobile tablet desktop visual experience
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-uiux" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-uiux/node_modules/.bin/playwright" install --with-deps chromium
          cp scripts/qa/noa-uiux-release.mjs "$RUNNER_TEMP/noa-uiux/verify.mjs"
          NOA_SOURCE_ROOT="$GITHUB_WORKSPACE" NOA_UIUX_PHASE=candidate node "$RUNNER_TEMP/noa-uiux/verify.mjs"
      - name: Validate integrated MUSIC and YOUTUBE playback
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-media" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-media/node_modules/.bin/playwright" install --with-deps chromium
          cp scripts/qa/noa-p0-media.mjs "$RUNNER_TEMP/noa-media/verify.mjs"
          NOA_SOURCE_ROOT="$GITHUB_WORKSPACE" node "$RUNNER_TEMP/noa-media/verify.mjs"
      - name: Deploy safe known-main changes only, with private backups
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_INCLUDE_MUSIC_VIEW: '1'
        run: |
          python3 scripts/noa_full_runtime_deploy.py
          python3 scripts/noa_p0_storage_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-full-runtime-release
          path: full-release-proof/
          retention-days: 14
