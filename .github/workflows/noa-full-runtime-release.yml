name: NOA full reviewed runtime release
# P0: preserve active music work; fail closed before any unbacked replacement.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-full-runtime-release.yml']
  workflow_dispatch:
  release:
    types: [published]
permissions: {contents: read}
concurrency: {group: noa-dothome-production, cancel-in-progress: false}
jobs:
  runtime:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Require reviewed main and explicit release authorization
        env:
          NOA_RELEASE_SHA: ${{ vars.NOA_APPROVED_RELEASE_SHA }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = release ]; then
            test "${{ github.event.release.prerelease }}" = 'false' || { echo 'Prerelease is not deployable'; exit 1; }
            test "${{ github.event.release.draft }}" = 'false' || { echo 'Draft is not deployable'; exit 1; }
            test "$(git rev-list -n 1 \"${{ github.event.release.tag_name }}\")" = "${GITHUB_SHA}" || { echo 'Release tag does not match checkout SHA'; exit 1; }
            test "${GITHUB_SHA}" = "$(git rev-parse origin/main)" || { echo 'Release must match current main'; exit 1; }
          else
            test "${GITHUB_REF}" = 'refs/heads/main' || { echo 'Release must use main'; exit 1; }
          fi
          test -n "${NOA_RELEASE_SHA}" || { echo 'Approved SHA is not configured'; exit 1; }
          test "${GITHUB_SHA}" = "${NOA_RELEASE_SHA}" || { echo 'SHA is not approved'; exit 1; }
      - name: Validate all active runtime sources and read-only feature tests
        run: |
          find bridge deploy/noa-app deploy/theme/noa_studio -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          for f in deploy/noa*.php deploy/index.php; do php -l "$f"; done
          for f in deploy/noa*.js; do node --check "$f"; done
          php tests/catalog/home_test.php
          php tests/catalog/world_test.php
          php tests/catalog/world_mv_test.php
          php tests/database/grammar.php
          node --test scripts/noa_player_regression.test.mjs scripts/qa/*.test.mjs
          python3 tests/deploy_guard_test.py
          python3 -m pip install --user paramiko==3.5.1
      - name: Deploy safe known-main changes only, with private backups
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_APPROVED_RELEASE_SHA: ${{ vars.NOA_APPROVED_RELEASE_SHA }}
          NOA_INCLUDE_MUSIC_VIEW: '1'
        run: |
          python3 scripts/noa_full_runtime_deploy.py
          python3 scripts/noa_p0_storage_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-full-runtime-release
          path: full-release-proof/
          retention-days: 14
