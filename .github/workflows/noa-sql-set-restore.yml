name: NOA Five SQL Isolated Restoration Proof
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-sql-set-restore.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: noa-five-sql-readonly-restore, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-isolated-only, MYSQL_DATABASE: noa_restore_verification}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pnoa-isolated-only" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install isolated verification tools
        run: |
          python -m pip install 'paramiko>=3,<5'
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-mysql mysql-client
      - name: Restore each exact backup in isolated MySQL and verify schemas and rows
        run: python scripts/noa_verify_host_sql_set.py
