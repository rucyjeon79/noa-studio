name: N80 JukeBox integration
on:
  pull_request:
    paths: &paths ['scripts/noa_navigation_release.py','.github/workflows/noa-navigation-player.yml','deploy/noa-app/jukebox/player.js','deploy/noa-app/jukebox/presentation.js','deploy/noa-app/jukebox/navigation-policy.js','deploy/noa-app/engine/jukebox.php','scripts/qa/noa-navigation-player.mjs','tests/engine/jukebox*']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_sqlite,mbstring'}
      - run: |
          for path in bridge/music-readmodel.php bridge/youtube-catalog.php bridge/channel-view.php deploy/noa-music.php; do php -l "$path"; done
          php tests/cover-title.php
          for path in deploy/noa-app/jukebox/*.js; do node --check "$path"; done
          php tests/engine/jukebox_test.php
          php tests/engine/jukebox_references_test.php
          php tests/engine/live_observer_test.php
          php tests/engine/app_data_test.php
          python -m unittest discover -s tests/engine -p 'test_live_music_consumer.py' -v
          python tests/catalog/inline_edit_music_page_test.py
          node --test scripts/noa_player_regression.test.mjs scripts/qa/noa-browse.test.mjs tests/engine/jukebox_navigation.test.mjs tests/jukebox/playback_recovery.test.cjs tests/android/native_bridge_test.mjs tests/playlists/drag_order_test.cjs tests/popularity/player_tracker_test.cjs tests/pwa/launch_test.cjs
      - run: |
          npm install --prefix "$RUNNER_TEMP/noa-navigation" --no-save --ignore-scripts --package-lock=false playwright@1.56.1 pixelmatch@7.1.0 pngjs@7.0.0
          "$RUNNER_TEMP/noa-navigation/node_modules/.bin/playwright" install chromium
          cp scripts/qa/noa-navigation-player.mjs "$RUNNER_TEMP/noa-navigation/verify.mjs"
          NOA_SOURCE_ROOT="$GITHUB_WORKSPACE" node "$RUNNER_TEMP/noa-navigation/verify.mjs"
          python scripts/qa/noa-qa-font.py
          git show "$GITHUB_SHA^:deploy/noa-music.php" > "$RUNNER_TEMP/jukebox-before.php"
          cp scripts/qa/noa-design-gate.mjs "$RUNNER_TEMP/noa-navigation/design.mjs"
          N80_JUKEBOX_BASELINE_TEMPLATE="$RUNNER_TEMP/jukebox-before.php" node "$RUNNER_TEMP/noa-navigation/design.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'n80-jukebox-${{ github.run_id }}', path: jukebox-proof/, retention-days: 7}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'n80-jukebox-design-${{ github.run_id }}', path: design-proof/, retention-days: 7}
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Activate owned JukeBox sources and verify public assets
        run: python scripts/noa_navigation_release.py
      - name: Restore only this activation after failed verification
        if: failure()
        run: |
          test ! -f "$RUNNER_TEMP/noa-ainoa-before.json" || python scripts/noa_navigation_release.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'navigation-player-deploy-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 7}
