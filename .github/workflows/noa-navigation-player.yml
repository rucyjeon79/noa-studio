name: NOA persistent playback across app navigation
on:
  pull_request:
    paths: &paths ['scripts/noa_navigation_release.py','.github/workflows/noa-navigation-player.yml']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: |
          for path in bridge/music-readmodel.php bridge/youtube-catalog.php bridge/channel-view.php deploy/noa-music.php; do php -l "$path"; done
          php tests/cover-title.php
          node --check deploy/noa-app/p0-player.js
          node --test scripts/noa_player_regression.test.mjs scripts/qa/noa-browse.test.mjs
      - run: |
          npm install --prefix "$RUNNER_TEMP/noa-navigation" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-navigation/node_modules/.bin/playwright" install --with-deps chromium
          cp scripts/qa/noa-navigation-player.mjs "$RUNNER_TEMP/noa-navigation/verify.mjs"
          NOA_SOURCE_ROOT="$GITHUB_WORKSPACE" node "$RUNNER_TEMP/noa-navigation/verify.mjs"
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_navigation_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'navigation-player-deploy-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 7}
