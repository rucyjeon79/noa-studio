name: NOA Inline Final Paging Guard
on:
  pull_request:
    paths: ['scripts/noa_inline_final_deploy.py','scripts/noa_inline_final_drive_receipt.json','scripts/qa/noa-inline-final.mjs','.github/workflows/noa-inline-final.yml']
  push:
    branches: [main]
    paths: ['scripts/noa_inline_final_deploy.py','scripts/noa_inline_final_drive_receipt.json','scripts/qa/noa-inline-final.mjs','.github/workflows/noa-inline-final.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: |
          node --test scripts/qa/noa-browse.test.mjs
          php -l deploy/noa-design.extend.php
          php tests/uiux/policy_assets.php
          python -m py_compile scripts/noa_inline_final_deploy.py
      - name: Inline list stays complete and general pagination still works
        env: {NOA_SOURCE_ROOT: '${{ github.workspace }}', NOA_INLINE_PHASE: candidate}
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-inline-final" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-inline-final.mjs "$RUNNER_TEMP/noa-inline-final/check.mjs"
          node "$RUNNER_TEMP/noa-inline-final/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-inline-final-candidate-${{ github.run_id }}', path: inline-final-proof/candidate/, retention-days: 1}
  production:
    if: github.event_name != 'pull_request'
    needs: candidate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          python -m pip install 'paramiko>=3,<5'
          npm install --prefix "$RUNNER_TEMP/noa-inline-final" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-inline-final.mjs "$RUNNER_TEMP/noa-inline-final/check.mjs"
      - name: Apply only final browse JS and cache revision
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_inline_final_deploy.py
      - name: Verify actual inline and general pages
        id: live
        env: {NOA_SOURCE_ROOT: '${{ github.workspace }}', NOA_INLINE_PHASE: live}
        run: node "$RUNNER_TEMP/noa-inline-final/check.mjs"
      - name: Restore unchanged release-owned bytes if acceptance fails
        if: failure() && steps.live.outcome == 'failure'
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_inline_final_deploy.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-inline-final-live-${{ github.run_id }}
          path: |
            inline-final-deploy-proof.json
            inline-final-proof/live/
          retention-days: 1
