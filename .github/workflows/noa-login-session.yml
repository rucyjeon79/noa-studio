name: N80 login continuity
# This scoped release owns login changes; membership and presentation deploys skip its tag.
on:
  push:
    branches: [main]
    paths: ['deploy/noa-app/engine/session-policy.php','scripts/noa_login_session_*.py','tests/login-session/**','.github/workflows/noa-login-session.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Verify real session cookies, migration and logout
        run: |
          php -l deploy/noa-app/engine/session-policy.php
          php -l deploy/noa-login.php
          php tests/login-session/policy.php
          python tests/login-session/test.py
          python -m py_compile scripts/noa_login_session_release.py scripts/noa_login_session_live.py
          php tests/membership/social.php
          php tests/login-presentation/render.php
      - name: Verify mobile and desktop login navigation
        run: |
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/login" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-login-presentation.mjs "$RUNNER_TEMP/login/check.mjs"
          cp tests/login-session/navigation.mjs "$RUNNER_TEMP/login/navigation.mjs"
          node "$RUNNER_TEMP/login/check.mjs"
          node "$RUNNER_TEMP/login/navigation.mjs"
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Verify candidate is current before creating QA data
        run: PYTHONPATH=scripts python -c "from noa_ainoa_deploy import check_current_candidate; check_current_candidate()"
      - name: Prepare isolated real login before activation
        run: python scripts/noa_login_session_live.py prepare
      - name: Activate N80 continuity through guarded native hooks
        id: activate
        run: python scripts/noa_login_session_release.py
      - name: Verify existing login, browser restart and explicit logout
        id: live
        run: python scripts/noa_login_session_live.py verify
      - name: Restore only owned sources on failed acceptance
        if: failure() && (steps.activate.outcome == 'failure' || steps.live.outcome == 'failure')
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_login_session_release.py rollback; fi
      - name: Remove isolated QA account and helper
        if: always()
        run: python scripts/noa_login_session_live.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-continuity-${{ github.run_id }}
          path: |
            login-proof/live.json
            ainoa-proof/deployment.json
          retention-days: 7
