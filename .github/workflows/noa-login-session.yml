name: N80 login continuity
on:
  push:
    branches: [main]
    paths: ['scripts/noa_login_session_audit.py','.github/workflows/noa-login-session.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Read native login and session control flow
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: python scripts/noa_login_session_audit.py
