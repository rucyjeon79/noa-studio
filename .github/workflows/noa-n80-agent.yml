name: N80 ChatGPT commander
on:
  push:
    branches: [main, work/n80-agent-upgrade]
    paths: ['deploy/noa-app/engine/agent-runtime.php','integrations/private-worker/**','tests/gpt/**','tests/creative/agent.php','scripts/noa_agent_release.py','.github/workflows/noa-n80-agent.yml']
  pull_request:
    paths: ['deploy/noa-app/engine/agent-runtime.php','integrations/private-worker/**','tests/gpt/**','tests/creative/agent.php']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-test-only, MYSQL_DATABASE: noa_inline_edit_test}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pnoa-test-only" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NOA_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noa_inline_edit_test;charset=utf8mb4'
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: noa-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_mysql,pdo_sqlite,mbstring,gd,curl,dom,fileinfo'}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Verify commander, canonical validators and real SQL save boundaries
        run: |
          python tests/gpt/test_agent.py
          python tests/gpt/test_gemini.py
          python -m py_compile integrations/private-worker/*.py scripts/noa_agent_release.py
          php -l deploy/noa-app/engine/agent-runtime.php
          php -l deploy/noa-app/engine/creative.php
          php -l deploy/noa-gpt.php
          php tests/gpt/agent_runtime.php
          python tests/gpt/flow.py
          python tests/creative/setup.py
          php scripts/qa/inline-edit-seed.php
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=1' -ac 2 -codec:a libmp3lame tests/creative/fixture.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=gray:s=64x64' -frames:v 1 tests/creative/fixture.webp
          php tests/creative/core.php
          php tests/engine/service_runtime_test.php
          php tests/engine/single_runtime_policy_test.php
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[n80-agent]')
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Activate with preimage, source readback and owned rollback
        run: python scripts/noa_agent_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'n80-agent-activation-${{ github.run_id }}', path: 'ainoa-proof/', retention-days: 7}
