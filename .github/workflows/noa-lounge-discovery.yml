name: NOA lounge discovery
on:
  workflow_dispatch: {}
  pull_request:
    paths: ['bridge/lounge-discovery.php','deploy/noa-lounge-discovery.*','scripts/noa_lounge_discovery_release.py','tests/lounge-discovery/**','.github/workflows/noa-lounge-discovery.yml']
  push:
    branches: [main]
    paths: ['bridge/lounge-discovery.php','deploy/noa-lounge-discovery.*','scripts/noa_lounge_discovery_release.py','tests/lounge-discovery/**','.github/workflows/noa-lounge-discovery.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated, MYSQL_DATABASE: lounge_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated" --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      NOA_MYSQL_DSN: mysql:host=127.0.0.1;dbname=lounge_test;charset=utf8mb4
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: isolated
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mbstring,pdo_mysql'}
      - run: |
          php -l deploy/noa-app/ecosystem-view.php
          php -l deploy/noa-my.php
          php -l deploy/noa-lounge-discovery.php
          php tests/lounge-discovery/check.php
          npm install --prefix "$RUNNER_TEMP/lounge" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/lounge-discovery/browser.mjs "$RUNNER_TEMP/lounge/check.mjs"
          php -S 127.0.0.1:8174 tests/lounge-discovery/router.php >"$RUNNER_TEMP/lounge/fixture.log" 2>&1 &
          trap 'kill $!' EXIT
          node "$RUNNER_TEMP/lounge/check.mjs"
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          python -m pip install 'paramiko>=3,<5'
          npm install --prefix "$RUNNER_TEMP/lounge" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/lounge-discovery/browser.mjs "$RUNNER_TEMP/lounge/check.mjs"
      - id: activate
        run: python scripts/noa_lounge_discovery_release.py
      - id: live
        run: NOA_DISCOVERY_LIVE=1 node "$RUNNER_TEMP/lounge/check.mjs"
      - if: failure() && (steps.activate.outcome == 'failure' || steps.live.outcome == 'failure')
        run: if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_lounge_discovery_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: lounge-discovery-deployment, path: ainoa-proof/deployment.json, retention-days: 7}
