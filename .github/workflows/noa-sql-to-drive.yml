name: NOA SQL Backup to Google Drive
on:
  push:
    branches: [main]
    paths:
      - 'scripts/noa_sql_backup_to_runner.py'
      - '.github/workflows/noa-sql-to-drive.yml'
      - 'scripts/noa_verify_drive_sql.py'
      - 'scripts/noa_verify_private_backup.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: noa-isolated-only
          MYSQL_DATABASE: noa_restore_verification
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pnoa-isolated-only" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check script and credentials
        env:
          DRIVE_CONFIG_B64: ${{ secrets.NOA_DRIVE_RCLONE_CONFIG_B64 }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          python -m py_compile scripts/noa_sql_backup_to_runner.py scripts/noa_verify_private_backup.py scripts/noa_verify_drive_sql.py
          python - <<'PY'
          import os,sys
          names=['DRIVE_CONFIG_B64','NOA_SSH_HOST','NOA_SSH_USER','NOA_SSH_PASSWORD','NOA_SSH_HOST_FINGERPRINT']
          missing=[name for name in names if not os.environ.get(name)]
          if missing:
              print('::error::Missing required secret names: '+', '.join(missing))
              sys.exit(1)
          PY
      - name: Install SFTP and Drive clients
        run: |
          python -m pip install 'paramiko>=3,<5'
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone php-cli php-mysql mysql-client
      - name: Configure private Drive credentials
        env:
          DRIVE_CONFIG_B64: ${{ secrets.NOA_DRIVE_RCLONE_CONFIG_B64 }}
        run: |
          python - <<'PY'
          import base64,os,pathlib
          cfg=base64.b64decode(os.environ['DRIVE_CONFIG_B64'],validate=True)
          if b'[noa-backup]' not in cfg:raise RuntimeError('expected_noa_backup_remote_missing')
          if b'root_folder_id = 1N4ddmFbGpMEMGLB3zg4XJYBzLk3mHds2' not in cfg:raise RuntimeError('drive_folder_not_pinned')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'rclone.conf'
          path.write_bytes(cfg);path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('RCLONE_CONFIG='+str(path)+'\n')
          PY
      - name: Fetch five known SQL backups (read only)
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_sql_backup_to_runner.py
      - name: Transfer and verify Google Drive copies
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/noa-db-backups"
          rclone copy "$src" noa-backup: --checksum --transfers 2 --checkers 2 --retries 3 --stats 0
          rclone check "$src" noa-backup: --one-way --checksum --checkers 2
          mkdir -m 700 "$RUNNER_TEMP/noa-drive-readback"
          rclone copy noa-backup: "$RUNNER_TEMP/noa-drive-readback" --include '*.sql' --include '*.json' --transfers 2 --checkers 2 --stats 0
          rclone lsjson noa-backup: --files-only > "$RUNNER_TEMP/noa-drive-listing.json"
      - name: Verify downloaded Drive SHA-256 and restore every SQL in isolated MySQL
        run: python scripts/noa_verify_drive_sql.py
      - name: Preserve non-sensitive verification report in Drive
        run: rclone copyto "$RUNNER_TEMP/noa-drive-restore-proof.json" "noa-backup:verification-${{ github.run_id }}-${{ github.run_attempt }}.json" --checksum --stats 0
      - name: Remove ephemeral runner copies
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/noa-db-backups" "$RUNNER_TEMP/noa-drive-readback"
          rm -f "$RUNNER_TEMP/noa-drive-listing.json" "$RUNNER_TEMP/noa-drive-restore-proof.json"
          rm -f "$RUNNER_TEMP/rclone.conf"

