name: NOA SQL Backup to Google Drive
on:
  push:
    branches: [main]
    paths:
      - 'scripts/noa_sql_backup_to_runner.py'
      - '.github/workflows/noa-sql-to-drive.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check script and credentials
        env:
          DRIVE_CONFIG_B64: ${{ secrets.NOA_DRIVE_RCLONE_CONFIG_B64 }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          python -m py_compile scripts/noa_sql_backup_to_runner.py
          test -n "$DRIVE_CONFIG_B64"
          test -n "$NOA_SSH_HOST"
          test -n "$NOA_SSH_USER"
          test -n "$NOA_SSH_PASSWORD"
          test -n "$NOA_SSH_HOST_FINGERPRINT"
      - name: Install SFTP and Drive clients
        run: |
          python -m pip install 'paramiko>=3,<5'
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
      - name: Configure private Drive credentials
        env:
          DRIVE_CONFIG_B64: ${{ secrets.NOA_DRIVE_RCLONE_CONFIG_B64 }}
        run: |
          python - <<'PY'
          import base64,os,pathlib
          cfg=base64.b64decode(os.environ['DRIVE_CONFIG_B64'],validate=True)
          if b'[noa-backup]' not in cfg:raise RuntimeError('expected_noa_backup_remote_missing')
          if b'root_folder_id = 1N4ddmFbGpMEMGLB3zg4XJYBzLk3mHds2' not in cfg:raise RuntimeError('drive_folder_not_pinned')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'rclone.conf'
          path.write_bytes(cfg);path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('RCLONE_CONFIG='+str(path)+'\n')
          PY
      - name: Fetch five known SQL backups (read only)
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_sql_backup_to_runner.py
      - name: Transfer and verify Google Drive copies
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/noa-db-backups"
          rclone copy "$src" noa-backup: --checksum --transfers 2 --checkers 2 --retries 3 --stats 0
          rclone check "$src" noa-backup: --one-way --checksum --checkers 2
          echo "DRIVE_COPY_CHECKSUM_VERIFIED"
      - name: Remove ephemeral runner copies
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/noa-db-backups"
          rm -f "$RUNNER_TEMP/rclone.conf"
