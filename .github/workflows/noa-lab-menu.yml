name: Verify and publish N80 AI LAB
on:
  pull_request:
    paths: ['deploy/noa-app/engine/ai-lab.php','deploy/noa-app/engine/workspaces.php','deploy/noa-app/engine/lab-home.php','tests/lab-menu/**','.github/workflows/noa-lab-menu.yml']
  push:
    branches: [main]
    paths: ['deploy/noa-app/engine/ai-lab.php','deploy/noa-app/engine/workspaces.php','deploy/noa-app/engine/lab-home.php','tests/lab-menu/**','.github/workflows/noa-lab-menu.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mbstring,pdo_sqlite'}
      - name: Verify contextual routes, menu ownership and role restrictions
        run: |
          for file in deploy/noa-app/engine/ai-lab.php deploy/noa-app/engine/workspaces.php deploy/noa-app/engine/lab-home.php; do php -l "$file"; done
          php tests/lab-menu/menu.php
          python tests/member/lab_routes.py
          php tests/sitemap/registry_test.php
          python tests/sitemap/menu_tree_fixture.py
          python tests/lab-menu/fixture.py
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/lab-menu" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/lab-menu/browser.mjs "$RUNNER_TEMP/lab-menu/check.mjs"
      - name: Verify mobile and desktop menus, descriptions and navigation
        run: node "$RUNNER_TEMP/lab-menu/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'lab-menu-${{ github.run_id }}', path: 'lab-menu-proof/', retention-days: 7}
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[lab-menu]'))
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Publish only the shared menu definition and hub
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES = {
              'noa-app/engine/ai-lab.php': 'deploy/noa-app/engine/ai-lab.php',
              'noa-app/engine/workspaces.php': 'deploy/noa-app/engine/workspaces.php',
              'noa-app/engine/lab-home.php': 'deploy/noa-app/engine/lab-home.php',
          }
          release.NEW = set()
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'lab-menu-live-${{ github.run_id }}', path: 'ainoa-proof/deployment.json', retention-days: 7}
