name: Verify and publish AI LAB menu separation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-lab-menu.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          php -l deploy/noa-lab-chat.php
          php -l deploy/noa-lab-song.php
          php -l bridge/member-access.php
          node --check deploy/noa-ainoa.js
          node --check deploy/noa-browse-edit.js
          node --check deploy/noa-channel-batch.js
          php -l deploy/noa-channel-menu.php
          php -l deploy/noa-creator-ai.php
          php -l deploy/noa-creator.php
          node --check deploy/noa-listening.js
          php -l deploy/noa-sitemap.php
          php -l deploy/noa-workspace.php
          php -l deploy/noa-ai-lab.php
          python tests/member/lab_routes.py
          python -m pip install 'paramiko>=3,<5'
      - name: Publish and verify AI LAB entry
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES = {
              'noa-lab-chat.php': 'deploy/noa-lab-chat.php',
              'noa-lab-song.php': 'deploy/noa-lab-song.php',
              'noa-bridge/member-access.php': 'bridge/member-access.php',
              'noa-ainoa.js': 'deploy/noa-ainoa.js',
              'noa-browse-edit.js': 'deploy/noa-browse-edit.js',
              'noa-channel-batch.js': 'deploy/noa-channel-batch.js',
              'noa-channel-menu.php': 'deploy/noa-channel-menu.php',
              'noa-creator-ai.php': 'deploy/noa-creator-ai.php',
              'noa-creator.php': 'deploy/noa-creator.php',
              'noa-listening.js': 'deploy/noa-listening.js',
              'noa-sitemap.php': 'deploy/noa-sitemap.php',
              'noa-workspace.php': 'deploy/noa-workspace.php',
              'noa-ai-lab.php': 'deploy/noa-ai-lab.php',
          }
          release.NEW = {'noa-lab-chat.php','noa-lab-song.php'}
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
