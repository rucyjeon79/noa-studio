name: NOA company and legal pages
on:
  pull_request:
    paths: ['deploy/noa-about.php','deploy/noa-privacy.php','deploy/noa-terms.php','deploy/noa-editorial*','deploy/noa-app/editorial*','deploy/noa-assets/editorial/**','tests/editorial/**','scripts/noa_editorial_release.py','.github/workflows/noa-editorial.yml']
  push:
    branches: [main]
    paths: ['deploy/noa-about.php','deploy/noa-privacy.php','deploy/noa-terms.php','deploy/noa-editorial*','deploy/noa-app/editorial*','deploy/noa-assets/editorial/**','tests/editorial/**','scripts/noa_editorial_release.py','.github/workflows/noa-editorial.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'dom, mbstring'}
      - name: Validate routes, content and consent rendering
        run: |
          for file in deploy/noa-about.php deploy/noa-privacy.php deploy/noa-terms.php deploy/noa-editorial.extend.php deploy/noa-app/editorial*.php deploy/noa-app/home.php deploy/noa-sitemap.php; do php -l "$file"; done
          php tests/editorial/content_test.php
          php tests/sitemap/registry_test.php
          node --check deploy/noa-editorial.js
          python -m py_compile scripts/noa_editorial_release.py
  deploy:
    if: github.event_name == 'push'
    needs: verify
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/noa_editorial_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-editorial-live-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 14}
