name: NOA home source and public data verification
on:
  push:
    branches: [main]
    paths: ['bridge/home*.php', 'bridge/catalog*.php', 'bridge/taxonomy*.php', 'src/data/**', 'deploy/noa-home.js', 'tests/home/**', 'tests/popularity/source_fixture.php', 'scripts/noa_catalog_seed.py', 'tests/catalog/home_test.php', 'scripts/qa/noa-home-*', '.github/workflows/noa-home-data-check.yml']
  pull_request:
    paths: ['bridge/home*.php','deploy/noa-home.js','tests/home/**','tests/popularity/source_fixture.php','scripts/qa/noa-home-*','.github/workflows/noa-home-data-check.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-isolated-only, MYSQL_DATABASE: noa_restore_verification}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pnoa-isolated-only" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
          coverage: none
      - name: Read model regression checks
        run: |
          php tests/catalog/home_test.php
          for f in bridge/home*.php scripts/qa/noa-home-db.php tests/home/router.php tests/home/source-fixture.php deploy/noa-app/home.php deploy/noa2.php; do php -l "$f"; done
          node --check deploy/noa-home.js
          node --check scripts/qa/noa-home-render.mjs
      - name: Build source-only disposable MySQL fixture
        env:
          NOA_POPULARITY_SOURCE_FIXTURE: '1'
        run: |
          python3 scripts/noa_catalog_seed.py
          php tests/home/source-fixture.php
      - name: Verify deterministic candidate read model and original source guards
        run: php scripts/qa/noa-home-db.php
      - name: Observe public API and real top-item images and destinations separately
        run: python3 scripts/qa/noa-home-deployed.py
      - name: Render candidate on PC and mobile without deployment
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-home" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-home/node_modules/.bin/playwright" install --with-deps chrome
          cp scripts/qa/noa-home-render.mjs "$RUNNER_TEMP/noa-home/check.mjs"
          node "$RUNNER_TEMP/noa-home/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-home-public-data-verification
          path: quality-home/
          retention-days: 14

