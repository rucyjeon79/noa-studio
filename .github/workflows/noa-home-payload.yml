name: Home feed transfer and catalog read
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-home-payload.yml','scripts/noa_home_payload_check.py']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          php -l bridge/home.php
          php -l bridge/home-store.php
          php tests/catalog/home_test.php
          python scripts/noa_home_payload_check.py before
          python -m pip install 'paramiko>=3,<5'
      - env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import subprocess, sys
          import noa_ainoa_deploy as release
          release.FILES = {f'noa-bridge/{name}': f'bridge/{name}' for name in ['home-store.php','home.php']}
          release.NEW = set()
          try:
              release.main()
              subprocess.run([sys.executable, 'scripts/noa_home_payload_check.py', 'after'], check=True)
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
