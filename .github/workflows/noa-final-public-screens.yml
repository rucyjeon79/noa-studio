name: NOA Final Public Screens
on:
  push:
    branches: [codex/p0-final-public-screens-20261024]
    paths: ['scripts/qa/noa-final-public-screens.mjs','.github/workflows/noa-final-public-screens.yml']
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Final public read-only screens
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/noa-final-screens" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-final-public-screens.mjs "$RUNNER_TEMP/noa-final-screens/check.mjs"
          node "$RUNNER_TEMP/noa-final-screens/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-final-public-screens-${{ github.run_id }}', path: final-public-screens/, retention-days: 1}
