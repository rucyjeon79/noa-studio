name: NOA Play API 36 candidate build (no publication)
on:
  push:
    branches: [work/play-api36-payment-gate-20261114]
    paths:
      - '.github/workflows/noa-play-api36-candidate.yml'
      - 'android/**'
      - '!android/GOOGLE_PLAY_RELEASE_CHECKLIST.md'
      - 'public/icon-512.png'
      - 'scripts/qa/noa-sign-release.py'
      - 'scripts/noa_apk_signing_check.py'
      - 'scripts/noa_full_inventory.py'
      - 'tests/android/**'
      - 'tests/kcp/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-play-api36-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Ubuntu GitHub runners already supply the Android SDK command-line manager.
      # setup-android@v3 currently calls the removed "tools" package and fails before compiling.
      - name: Install Android 16 compile platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify isolated Android unit contracts
        run: node --test tests/android/native_bridge_test.mjs tests/android/live_web_contract_test.mjs
      - name: Check KCP test-only code contract
        run: |
          node tests/kcp/window.cjs
          php tests/kcp/core.php
      - name: Use a versionCode newer than the existing NOA production Android build
        run: |
          code="$(git show -s --format=%ct "$GITHUB_SHA")"
          test "$code" -gt 1794222381
          test "$code" -lt 2100000000
          echo "NOA_RELEASE_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Assert API 36 manifest configuration and Play version code range
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          gradle = Path('android/app/build.gradle').read_text()
          assert re.search(r'\bcompileSdk\s+36\b', gradle), 'compileSdk 36 required'
          assert re.search(r'\btargetSdk\s+36\b', gradle), 'targetSdk 36 required'
          assert re.search(r"applicationId\s+'kr\.ai\.noastudio'", gradle)
          version = int(os.environ['NOA_RELEASE_VERSION_CODE'])
          assert 1794222381 < version < 2100000000
          print('API 36 config and unique applicationId verified; not a Play publication receipt.')
          PY
      - name: Build release APK and AAB candidates and perform lint
        working-directory: android
        env:
          NOA_ANDROID_HOST_NODE: '0'
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease :app:assembleDebugAndroidTest :app:lintRelease
      - name: Assert bundle has expected app payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          aab = Path('android/app/build/outputs/bundle/release/app-release.aab')
          assert aab.is_file() and aab.stat().st_size > 100000
          with ZipFile(aab) as z:
              names = z.namelist()
              assert 'base/manifest/AndroidManifest.xml' in names
              assert any(x.startswith('base/dex/') and x.endswith('.dex') for x in names)
          print('Unsigned AAB candidate verified:',aab.stat().st_size,hashlib.sha256(aab.read_bytes()).hexdigest())
          PY
      # Native build is the only approved GitHub exception to the N80 Hub workflow.
      # Read the already-pinned release identity; never generate a key or deploy to NOA host.
      - name: Sign candidates with the existing NOA permanent certificate (no publication)
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: |
          test -n "$NOA_SSH_HOST" && test -n "$NOA_SSH_USER" && test -n "$NOA_SSH_PASSWORD"
          python3 -m pip install --user 'paramiko==3.5.1'
          python3 scripts/qa/noa-sign-release.py
      - name: Verify existing installed APK signing continuity and versionCode
        run: |
          mkdir -p artifact
          cp release-artifact/noa-studio-release.apk artifact/app-debug.apk
          cp release-artifact/verification.json artifact/verification.json
          python3 scripts/noa_apk_signing_check.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          manifest=json.loads(Path('release-artifact/verification.json').read_text())
          assert manifest['certificateSha256']=='f77427fe2f2e174aeac75e6734875b9106ee13072c49cfc8146b43075764271b'
          assert int(manifest['versionCode'])==int(os.environ['NOA_RELEASE_VERSION_CODE'])
          assert manifest['published'] is False
          for filename, receipt in manifest['files'].items():
              path=Path('release-artifact')/filename
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==receipt['sha256']
              assert path.stat().st_size==receipt['bytes']
          assert set(manifest['files'])=={'noa-studio-release.apk','noa-studio-release.aab'}
          print('Signed APK/AAB validation completed. No host update or Play upload attempted.')
          PY
      - name: Prepare Android 16 emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          gradle --stop
      - name: Verify signed APK on Android 16 emulator, without private user sessions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          cores: 2
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -HardwareDecoder
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p android/play-review-proof
            adb logcat -c
            adb install -r release-artifact/noa-studio-release.apk
            adb install -r release-artifact/noa-studio-test.apk
            adb shell am instrument -w -e class kr.ai.noastudio.MediaPolicyTest,kr.ai.noastudio.NativeSessionTest,kr.ai.noastudio.AppUpdateTest kr.ai.noastudio.test/androidx.test.runner.AndroidJUnitRunner | tee android/play-review-proof/instrumentation.txt
            grep -q 'OK (5 tests)' android/play-review-proof/instrumentation.txt
            adb shell am start -W -n kr.ai.noastudio/.MainActivity | tee android/play-review-proof/cold-start.txt
            sleep 15
            adb shell pidof kr.ai.noastudio
            adb exec-out screencap -p > android/play-review-proof/guest-launch.png
            adb logcat -d -s AndroidRuntime:E > android/play-review-proof/crashes.txt
            ! grep -Eq 'FATAL EXCEPTION|Process: kr.ai.noastudio' android/play-review-proof/crashes.txt
            echo "Android 16 signed APK installed and cold-launched; no user login or payment attempted."
      - name: Retain signed candidate for private review only
        uses: actions/upload-artifact@v4
        with:
          name: NOA-API36-SIGNED-REVIEW-ONLY
          path: |
            release-artifact/noa-studio-release.apk
            release-artifact/noa-studio-release.aab
            release-artifact/verification.json
            android/app/build/reports/lint-results-release.html
            android/play-review-proof/instrumentation.txt
            android/play-review-proof/cold-start.txt
            android/play-review-proof/guest-launch.png
            android/play-review-proof/crashes.txt
          retention-days: 7
          if-no-files-found: error
