name: NOA AInoa and Song Editor Production
on:
  push:
    branches: [main]
    paths: ['deploy/noa-ainoa-admin.js','deploy/noa-app/engine/ai-automation.php','scripts/qa/noa-ainoa-admin.mjs','tests/catalog/ainoa_automation_mysql_test.php','bridge/category-order-store.php','deploy/noa-category-order.php','deploy/noa-category-order-admin.php','tests/catalog/category_order_mysql_test.php','scripts/noa_category_order_migrate.*','deploy/noa-youtube.php','tests/youtube/coming_catalog_test.php','deploy/noa-creator.php','deploy/noa-creator.css','deploy/noa-editor.php','bridge/youtube-catalog.php','deploy/noa-browse-order.js','bridge/lab-core.php','tests/lab/core_test.php','bridge/lab-api.php','deploy/noa-ai-lab.php','deploy/noa-ai-lab.js','tests/catalog/ainoa_points_mysql_test.php','tests/catalog/collections_seed.php','scripts/qa/noa-collections.mjs','scripts/qa/noa-chat.mjs','deploy/noa-launch.js','deploy/noa-manifest.json','deploy/noa-sw.js','public/ainoa/**','tests/pwa/**','bridge/package-record.php','bridge/subscription-access.php','deploy/noa-access.extend.php','deploy/noa-design.extend.php','deploy/noa-browse.js','deploy/noa-browse-edit.js','tests/catalog/package_record_test.php','bridge/ainoa-*.php','deploy/noa-ainoa.*','scripts/noa_ainoa_deploy.py','scripts/qa/noa-design-gate.mjs','scripts/qa/noa-p0-generation.mjs','scripts/qa/noa-ainoa*','scripts/qa/noa-qa-font.py','tests/catalog/ainoa_test.php','.github/workflows/noa-ainoa.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: 'noa-ainoa-${{ github.sha }}', cancel-in-progress: false}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-test-only, MYSQL_DATABASE: noa_inline_edit_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pnoa-test-only" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NOA_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=noa_inline_edit_test;charset=utf8mb4
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: noa-test-only
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_mysql,pdo_sqlite,mysqli,mbstring,curl'}
      - name: Validate complete record, privacy projection and native SQL round trip
        shell: bash
        run: |
          for file in deploy/noa-work-status.php deploy/noa-app/engine/ai-automation.php bridge/ainoa-automation.php bridge/lab-worker.php deploy/noa-youtube.php deploy/noa-editor.php deploy/noa-creator.php bridge/ainoa-generation.php bridge/ainoa-core.php bridge/ainoa-points.php bridge/subscription-core.php bridge/youtube-catalog.php bridge/lab-api.php deploy/noa-ai-lab.php bridge/subscription-access.php deploy/noa-access.extend.php bridge/package-record.php deploy/noa-ainoa.php deploy/noa-design.extend.php scripts/noa_member_qa_control.php; do php -l "$file"; done
          php tests/catalog/package_record_test.php
          php tests/catalog/ainoa_test.php
          php tests/lab/core_test.php
          php tests/youtube/coming_catalog_test.php
          node --check deploy/noa-ai-lab.js
          node --check deploy/noa-browse-order.js
          node --check deploy/noa-launch.js
          node --check deploy/noa-sw.js
          node --test tests/pwa/launch_test.cjs
          node --check deploy/noa-ainoa.js
          node --check deploy/noa-ainoa-admin.js
          node --check deploy/noa-browse-edit.js
          node --check deploy/noa-browse.js
          node --test scripts/noa_player_regression.test.mjs scripts/qa/noa-browse.test.mjs scripts/qa/noa-four-level.test.mjs tests/playlists/drag_order_test.cjs tests/youtube/lazy_details_test.cjs
          python -m py_compile scripts/noa_ainoa_deploy.py scripts/noa_member_live_check.py
          python scripts/qa/inline-edit-fixture.py
          cp deploy/noa-ainoa.php "$RUNNER_TEMP/noa-inline-edit-fixture/noa-ainoa.php"
          php scripts/qa/inline-edit-seed.php
          php tests/catalog/collections_seed.php
          php tests/catalog/category_order_mysql_test.php | tee "$RUNNER_TEMP/category_order_mysql_test.php.log"
          grep -F "CATEGORY_SQL_MYSQL_OK" "$RUNNER_TEMP/category_order_mysql_test.php.log"
          php -l deploy/noa-category-order.php
          php -l deploy/noa-category-order-admin.php
          php -l scripts/noa_category_order_migrate.php
          php tests/catalog/ainoa_generation_mysql_test.php | tee "$RUNNER_TEMP/ainoa_generation_mysql_test.php.log"
          grep -F "AINOA_GENERATION_SQL" "$RUNNER_TEMP/ainoa_generation_mysql_test.php.log"
          php tests/catalog/ainoa_automation_mysql_test.php | tee "$RUNNER_TEMP/ainoa_automation_mysql_test.php.log"
          grep -F "N80_AI_SQL" "$RUNNER_TEMP/ainoa_automation_mysql_test.php.log"
          php tests/catalog/ainoa_points_mysql_test.php
          php -S 127.0.0.1:8101 -t "$RUNNER_TEMP/noa-inline-edit-fixture" > "$RUNNER_TEMP/ainoa-native.log" 2>&1 &
          node scripts/qa/noa-ainoa-native.mjs
      - name: Prepare mobile browser checks
        run: |
          python scripts/qa/noa-qa-font.py
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-ainoa" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-ainoa.mjs "$RUNNER_TEMP/noa-ainoa/check.mjs"
          cp scripts/qa/noa-collections.mjs "$RUNNER_TEMP/noa-ainoa/collections.mjs"
          cp scripts/qa/noa-chat.mjs "$RUNNER_TEMP/noa-ainoa/chat.mjs"
          cp scripts/qa/noa-p0-generation.mjs "$RUNNER_TEMP/noa-ainoa/generation.mjs"
          cp scripts/qa/noa-ainoa-admin.mjs "$RUNNER_TEMP/noa-ainoa/admin.mjs"
          cp scripts/qa/noa-category-final.mjs "$RUNNER_TEMP/noa-ainoa/category.mjs"
      - name: Verify editor, floating controls and guest search in both themes
        run: |
          node "$RUNNER_TEMP/noa-ainoa/check.mjs"
          node "$RUNNER_TEMP/noa-ainoa/collections.mjs"
          node "$RUNNER_TEMP/noa-ainoa/chat.mjs"
          node "$RUNNER_TEMP/noa-ainoa/generation.mjs"
          node "$RUNNER_TEMP/noa-ainoa/admin.mjs"
      - name: Verify SQL category order through the native administrator endpoint
        env: {NOA_CATEGORY_SCOPE: native}
        run: |
          python scripts/qa/category-storage-fixture.py
          php -S 127.0.0.1:8099 -t "$RUNNER_TEMP/noa-category-fixture" > "$RUNNER_TEMP/category-php.log" 2>&1 &
          node "$RUNNER_TEMP/noa-ainoa/category.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-ainoa-candidate-${{ github.run_id }}', path: ainoa-proof/, retention-days: 2}
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Prepare approved-design comparison
        run: |
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/noa-design" --no-save --ignore-scripts --package-lock=false playwright@1.56.1 pixelmatch@7.1.0 pngjs@7.0.0
          cp scripts/qa/noa-design-gate.mjs "$RUNNER_TEMP/noa-design/check.mjs"
      - name: Require mobile geometry, touch targets, two rows and screenshot comparison
        run: node "$RUNNER_TEMP/noa-design/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-design-gate-${{ github.run_id }}', path: design-proof/, retention-days: 14}
  deploy:
    needs: [candidate, design]
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare existing pinned NOA transport and browser
        run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/qa/noa-qa-font.py
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-ainoa" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-ainoa.mjs "$RUNNER_TEMP/noa-ainoa/check.mjs"
          cp scripts/qa/noa-collections.mjs "$RUNNER_TEMP/noa-ainoa/collections.mjs"
          cp scripts/qa/noa-chat.mjs "$RUNNER_TEMP/noa-ainoa/chat.mjs"
          cp scripts/qa/noa-p0-generation.mjs "$RUNNER_TEMP/noa-ainoa/generation.mjs"
          cp scripts/qa/noa-ainoa-admin.mjs "$RUNNER_TEMP/noa-ainoa/admin.mjs"
      - name: Activate only reviewed files with SHA preimage guards
        id: upload
        env: &noa_env
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_ainoa_deploy.py
      - name: Verify real guest search, level gate and floating controls on production
        id: live
        env: {NOA_AINOA_PHASE: live}
        run: |
          node "$RUNNER_TEMP/noa-ainoa/check.mjs"
          node "$RUNNER_TEMP/noa-ainoa/collections.mjs"
          node "$RUNNER_TEMP/noa-ainoa/chat.mjs"
          node "$RUNNER_TEMP/noa-ainoa/generation.mjs"
          node "$RUNNER_TEMP/noa-ainoa/admin.mjs"
      - name: Preserve exact legacy order in SQL and verify public readback
        env: *noa_env
        run: python scripts/noa_category_order_migrate.py
      - name: Verify signed N80 text worker on production
        env:
          <<: *noa_env
          NOA_N80_AI_PROOF: ainoa-proof/n80-ai-worker.json
        run: python scripts/noa_n80_ai_worker.py
      - name: Recheck operating SQL projection and queue after activation
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          NOA_P0_AUDIT_OUTPUT: ainoa-proof/postdeploy-audit
        run: |
          python scripts/noa_p0_inventory.py
          python scripts/noa_p0_release_evidence.py build
      - name: Restore only release-owned source bytes on failed acceptance
        if: failure() && (steps.upload.outcome == 'failure' || steps.live.outcome == 'failure')
        env: *noa_env
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_ainoa_deploy.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-ainoa-live-${{ github.run_id }}', path: ainoa-proof/, retention-days: 2}
