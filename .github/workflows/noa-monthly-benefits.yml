name: NOA monthly benefits and mastered cards
on:
  pull_request:
    paths: &paths ['bridge/monthly-rewards.php','tests/monthly/**','scripts/noa_monthly*','scripts/qa/noa-monthly.mjs','deploy/noa-app/monthly-banner.php','.github/workflows/noa-monthly-benefits.yml']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated-noa-ci, MYSQL_DATABASE: noa_subscription_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated-noa-ci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noa_subscription_test;charset=utf8mb4'
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: isolated-noa-ci
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli,pdo_mysql,pdo_sqlite,mbstring,fileinfo'}
      - name: Verify native credits, monthly slots, concurrency and existing membership contracts
        run: |
          for f in bridge/monthly-rewards.php bridge/membership-core.php bridge/engagement.php deploy/noa-membership.extend.php deploy/noa-membership.php deploy/noa-app/home.php deploy/noa-app/monthly-banner.php scripts/noa_monthly_policy.php tests/monthly/*.php; do php -l "$f"; done
          node --check deploy/noa-premium.js
          node --check deploy/noa-creator.js
          php tests/subscription/core_test.php
          php tests/subscription/mysql_test.php
          php tests/membership/mysql.php
          php tests/membership/extension_scope.php
          php tests/monthly/mysql.php
          python tests/monthly/race_test.py
          php tests/premium/mysql.php
          python tests/premium/race_test.py
          node tests/jukebox/transport_test.cjs
          node tests/jukebox/reservations_test.cjs
      - name: Verify compact text, completed masters and banner in both themes and browser engines
        run: |
          php tests/monthly/fixture.php
          python scripts/qa/noa-qa-font.py
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-monthly" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-monthly/node_modules/.bin/playwright" install --with-deps webkit
          for name in monthly premium rhythm voice; do cp "scripts/qa/noa-$name.mjs" "$RUNNER_TEMP/noa-monthly/$name.mjs"; node "$RUNNER_TEMP/noa-monthly/$name.mjs"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'noa-monthly-candidate-${{ github.run_id }}'
          path: |
            monthly-proof/
            premium-proof/
            rhythm-proof/
            voice-proof/
          retention-days: 7
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - id: upload
        run: python scripts/noa_monthly_release.py
      - name: Activate monthly slots without granting test points or changing subscriptions
        run: python scripts/noa_monthly_policy.py
      - if: failure() && steps.upload.outcome == 'failure'
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_monthly_release.py rollback; fi
      - name: Verify public banner and protected direct include
        run: |
          python - <<'PY'
          import urllib.request,urllib.error
          from pathlib import Path
          with urllib.request.urlopen('https://noastudio.ai.kr/?monthly-audit=20261028') as r:html=r.read().decode()
          assert html.index('data-home-section="hero"') < html.index('data-home-section="monthly-benefits"') < html.index('data-home-section="notices"')
          assert all(x in html for x in ['매월 쏟아지는 10배의 혜택.','1,000P','500P','300P','100P'])
          try:urllib.request.urlopen('https://noastudio.ai.kr/noa-app/monthly-banner.php');raise AssertionError('include_public')
          except urllib.error.HTTPError as e:assert e.code==403
          Path('ainoa-proof/monthly-public.json').write_text('{"bannerAfterHero":true,"directIncludeDenied":true}')
          print('MONTHLY_LIVE_BANNER_AND_DIRECT_INCLUDE_OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-monthly-live-${{ github.run_id }}', path: ainoa-proof/, retention-days: 7}
