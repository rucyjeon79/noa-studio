name: NOA community response diagnosis
on:
  push:
    branches: [main]
    paths: ['scripts/noa_community_diagnostic.py','.github/workflows/noa-community-diagnostic.yml']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_community_diagnostic.py
