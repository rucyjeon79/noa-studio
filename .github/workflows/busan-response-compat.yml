name: Busan hosting error response compatibility
on:
  push:
    branches: [main]
    paths: ['.github/workflows/busan-response-compat.yml']
permissions: {contents: read}
concurrency: {group: busan-readonly-sftp, cancel-in-progress: false}
jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m pip install paramiko==3.5.1
      - name: Update only owned client and validate hosting-provided 403
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          cd scripts
          python3 - <<'PY'
          import os,base64,hashlib,socket,hmac,secrets,urllib.request,urllib.error
          from pathlib import Path
          import paramiko
          from busan_readonly_check import configuration,fingerprint,PORT,ROOT
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='75abe82eccc4e1d733c39555e67388c5d8b54b7f4284f698a3d621d98526a9ca'
          Path('/tmp/busan-app.js').write_bytes(data)
          import subprocess
          subprocess.run(['node','--check','/tmp/busan-app.js'],check=True)
          host,user,password,pin=configuration(os.environ)
          with socket.create_connection((host,PORT),timeout=15) as sock:
              with paramiko.Transport(sock) as t:
                  t.banner_timeout=15;t.auth_timeout=15
                  t.get_security_options().key_types=('ssh-ed25519',)
                  t.start_client(timeout=20)
                  if not hmac.compare_digest(fingerprint(t.get_remote_server_key()),pin):raise RuntimeError('host_key_mismatch')
                  t.auth_password(user,password,fallback=False)
                  with paramiko.SFTPClient.from_transport(t) as s:
                      path=ROOT+'/busan-assistant/app.js'
                      if s.normalize(path)!=path:raise RuntimeError('unexpected_path')
                      with s.open(path,'rb') as f:old=f.read(16384)
                      if hashlib.sha256(old).hexdigest()!='aaaa79b024346850a530cfda3890f2e120ad298d16667a20f8a0cd43fc9799e2':raise RuntimeError('old_bytes_changed_abort')
                      temp='/hosting/rucyjeon79/busan-assistant-private/app-'+secrets.token_hex(12)+'.js'
                      with s.open(temp,'wx') as f:f.write(data)
                      s.chmod(temp,0o644)
                      with s.open(temp,'rb') as f:assert f.read(16384)==data
                      s.posix_rename(temp,path)
          with urllib.request.urlopen('https://skhnslu-busan.com/busan-assistant/app.js',timeout=20) as r:assert r.read(16384)==data
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**kw):return None
          op=urllib.request.build_opener(NoRedirect())
          for path in ['', 'admin.php','api.php']:
              try:r=op.open('https://skhnslu-busan.com/busan-assistant/'+path,timeout=20)
              except urllib.error.HTTPError as e:r=e
              if path=='api.php':assert r.code==403
              else:assert r.code==302 and '/bbs/login.php?' in r.headers.get('Location','')
              print('verified_guest_protection',path,r.code)
          print('owned_client_update_verified')
          
          PY
