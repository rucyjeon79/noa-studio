name: NOA Common UI Policy Correction
on:
  pull_request:
    paths:
      - 'deploy/noa-policy-20261024.css'
      - 'deploy/noa-ui.js'
      - 'deploy/noa-design.extend.php'
      - 'scripts/noa_policy_ui_deploy.py'
      - 'scripts/noa_policy_ui_drive_receipt.json'
      - 'scripts/qa/noa-policy.mjs'
      - 'tests/uiux/policy_assets.php'
      - '.github/workflows/noa-policy-ui.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/noa-policy-20261024.css'
      - 'deploy/noa-ui.js'
      - 'deploy/noa-design.extend.php'
      - 'scripts/noa_policy_ui_deploy.py'
      - 'scripts/noa_policy_ui_drive_receipt.json'
      - 'scripts/qa/noa-policy.mjs'
      - '.github/workflows/noa-policy-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Validate HTML-only asset registration and source ownership
        run: |
          php -l deploy/noa-design.extend.php
          php tests/uiux/policy_assets.php
          node --check deploy/noa-ui.js
          node --check scripts/qa/noa-policy.mjs
          python -m py_compile scripts/noa_policy_ui_deploy.py
      - name: Render mobile, landscape, desktop and both themes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/noa-policy" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-policy.mjs "$RUNNER_TEMP/noa-policy/check.mjs"
          NOA_SOURCE_ROOT="$GITHUB_WORKSPACE" NOA_POLICY_PHASE=candidate node "$RUNNER_TEMP/noa-policy/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-policy-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: policy-proof/candidate/
          retention-days: 1
  production:
    if: github.event_name != 'pull_request'
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Install runner dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install 'paramiko>=3,<5'
          npm install --prefix "$RUNNER_TEMP/noa-policy" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-policy.mjs "$RUNNER_TEMP/noa-policy/check.mjs"
      - name: Apply only Drive-protected shared display files
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_policy_ui_deploy.py
      - name: Verify production rendering and safe guest responses
        id: live
        env: {NOA_SOURCE_ROOT: '${{ github.workspace }}', NOA_POLICY_PHASE: live}
        run: node "$RUNNER_TEMP/noa-policy/check.mjs"
      - name: Restore unchanged release-owned files on visual failure
        if: failure() && steps.live.outcome == 'failure'
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_policy_ui_deploy.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-policy-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: policy-proof/
          retention-days: 1
