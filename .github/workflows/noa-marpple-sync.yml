name: NOA Marpple catalog sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-marpple-sync.yml','scripts/noa_marpple_sync.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4
      - run: python scripts/noa_marpple_sync.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: marpple-catalog, path: marpple-proof/, retention-days: 3}
