name: NOA STUDIO Android
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile installable APK and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Retain APK
        uses: actions/upload-artifact@v4
        with:
          name: NOA-STUDIO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell am start -W -n kr.ai.noastudio/.MainActivity
            python3 -c "import time,subprocess; [time.sleep(2) for _ in range(8)]"
            adb shell uiautomator dump /sdcard/noa-ui.xml
            adb pull /sdcard/noa-ui.xml android/noa-ui.xml
            adb shell screencap -p /sdcard/noa-android.png
            adb pull /sdcard/noa-android.png android/noa-android.png
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w kr.ai.noastudio.test/androidx.test.runner.AndroidJUnitRunner > android/noa-instrumentation.txt
            cat android/noa-instrumentation.txt
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-android-detail.png android/noa-android-detail.png
            adb logcat -d -s AndroidRuntime:E NoaApi:E > android/noa-runtime-errors.txt
            python3 -c "from pathlib import Path; s=Path('android/noa-ui.xml').read_text(); assert 'OK (1 test)' in Path('android/noa-instrumentation.txt').read_text(); assert 'NOA STUDIO' in s; assert __import__('re').search(r'[1-9][0-9]*개 문서',s), 'Production music catalog did not load'; assert 'FATAL EXCEPTION' not in Path('android/noa-runtime-errors.txt').read_text()"
      - name: Retain device verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOA-STUDIO-Android-verification
          path: |
            android/noa-ui.xml
            android/noa-android.png
            android/noa-android-detail.png
            android/noa-instrumentation.txt
            android/noa-runtime-errors.txt
            android/app/build/reports/lint-results-debug.html
          retention-days: 14

  publish:
    needs: apk
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NOA-STUDIO-Android-APK
          path: artifact
      - name: Publish tested APK with pinned SFTP
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ vars.NOA_SSH_HOST_FINGERPRINT || 'SHA256:0LqxbpOziJ4XgOMNEkfVrVGle3kpjJessI+jKqZ4JCU' }}
          NOA_SSH_ROOT: ${{ vars.NOA_FTP_ROOT }}
        run: |
          python3 -m pip install --user 'paramiko==3.5.1'
          python3 scripts/noa_apk_deploy.py
