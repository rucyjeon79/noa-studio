name: NOA STUDIO Android
# Keep native navigation in the approved Home / YouTube / World / Sound / MY order.
on:
  push:
    branches: [main, work/android-background-20261022, work/n80-apk-update-20261029]
    paths: ['.github/workflows/noa-android.yml', 'android/**', 'scripts/noa_android_*.py', 'scripts/noa_apk_*.py', 'tests/android/**', 'tests/n80/android_update_test.php', 'deploy/noa-app/engine/n80.php', 'deploy/noa-design.json', 'deploy/noa-ui-words.json', 'public/icon-512.png']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only with the existing production signing identity
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify native bridge and administrator preview fallback
        run: node --test tests/android/native_bridge_test.mjs
      - name: Verify APK publication failure safety
        run: python3 tests/android/apk_deploy_test.py
      - name: Verify n80 Android release contract
        run: php tests/n80/android_update_test.php
      - name: Check APK signing and deployment scripts
        run: python3 -m py_compile scripts/noa_android_sign_candidate.py scripts/noa_apk_signing_check.py scripts/noa_apk_deploy.py
      - name: Compile installable APK and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Inspect production signing continuity without changing release
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk artifact/app-debug.apk
          if python3 scripts/noa_apk_signing_check.py > android/noa-signer-proof.txt 2>&1; then
            echo "signer-compatible=true" >> android/noa-signer-proof.txt
          else
            echo "Production APK preserved; signing continuity must be resolved before replacement." >> android/noa-signer-proof.txt
          fi
          cat android/noa-signer-proof.txt
      - name: Retain APK
        uses: actions/upload-artifact@v4
        with:
          name: NOA-STUDIO-Android-APK
          overwrite: true
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Prepare isolated live music member
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
        run: |
          python3 -m pip install --user 'paramiko==3.5.1'
          python3 scripts/noa_android_member_qa.py prepare
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb push "$RUNNER_TEMP/noa-android-qa-cookie.txt" /data/local/tmp/noa-android-qa-cookie.txt
            adb shell chmod 600 /data/local/tmp/noa-android-qa-cookie.txt
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class kr.ai.noastudio.CatalogTest,kr.ai.noastudio.MediaPolicyTest,kr.ai.noastudio.AppUpdateTest,kr.ai.noastudio.NativeSessionTest,kr.ai.noastudio.PlaylistEditingTest,kr.ai.noastudio.NativePlaybackTest kr.ai.noastudio.test/androidx.test.runner.AndroidJUnitRunner > android/noa-instrumentation.txt
            cat android/noa-instrumentation.txt
            adb shell am force-stop kr.ai.noastudio
            adb shell am instrument -w -e class kr.ai.noastudio.PlaybackRestoreTest kr.ai.noastudio.test/androidx.test.runner.AndroidJUnitRunner > android/noa-restore-instrumentation.txt
            cat android/noa-restore-instrumentation.txt
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-restore-proof.json android/noa-restore-proof.json || true
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-android-playing-ivory.png android/noa-android-playing-ivory.png || true
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-android-landscape.png android/noa-android-landscape.png || true
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-android-my-ivory.png android/noa-android-my-ivory.png || true
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-android-my-playlists.png android/noa-android-my-playlists.png || true
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-android-playing.png android/noa-android-playing.png || true
            cat android/noa-instrumentation.txt
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-brand-proof.json android/noa-brand-proof.json || true
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-launcher-icon.png android/noa-launcher-icon.png || true
            cat android/noa-brand-proof.json
            python3 -c "import base64; print('NOA_ANDROID_ICON '+base64.b64encode(open('android/noa-launcher-icon.png','rb').read()).decode())"
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-ui.xml android/noa-ui.xml || true
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-android.png android/noa-android.png || true
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-android-detail.png android/noa-android-detail.png || true
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-android-ivory.png android/noa-android-ivory.png || true
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-android-japanese.png android/noa-android-japanese.png || true
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/noa-native-playback.json android/noa-native-playback.json || true
            cat android/noa-native-playback.json
            adb logcat -d -s AndroidRuntime:E NoaApi:E > android/noa-runtime-errors.txt
            python3 -c "from pathlib import Path; s=Path('android/noa-ui.xml').read_text(); assert 'OK (11 tests)' in Path('android/noa-instrumentation.txt').read_text(); assert 'OK (1 test)' in Path('android/noa-restore-instrumentation.txt').read_text(); assert __import__('re').search(r'[1-9][0-9]*곡',s), 'Production music catalog did not load'; assert 'FATAL EXCEPTION' not in Path('android/noa-runtime-errors.txt').read_text()"
      - name: Clean isolated live music member
        if: always()
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
        run: python3 scripts/noa_android_member_qa.py cleanup
      - name: Retain device verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOA-STUDIO-Android-verification
          overwrite: true
          path: |
            android/noa-signer-proof.txt
            android/noa-brand-proof.json
            android/noa-launcher-icon.png
            android/noa-ui.xml
            android/noa-android.png
            android/noa-android-detail.png
            android/noa-android-ivory.png
            android/noa-android-japanese.png
            android/noa-instrumentation.txt
            android/noa-runtime-errors.txt
            android/noa-native-playback.json
            android/noa-restore-proof.json
            android/noa-restore-instrumentation.txt
            android/noa-android-my-ivory.png
            android/noa-android-my-playlists.png
            android/noa-android-playing.png
            android/noa-android-landscape.png
            android/noa-android-playing-ivory.png
            android/app/build/reports/lint-results-debug.html
          retention-days: 14

  publish:
    # Native-scoped main pushes automatically publish after all device gates pass.
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: apk
    concurrency:
      group: noa-dothome-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NOA-STUDIO-Android-APK
          overwrite: true
          path: artifact
      - name: Sign tested APK with the original installation identity
        env:
          NOA_ANDROID_KEYSTORE_BASE64: ${{ secrets.NOA_ANDROID_KEYSTORE_BASE64 }}
          NOA_ANDROID_KEY_ALIAS: ${{ secrets.NOA_ANDROID_KEY_ALIAS }}
          NOA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NOA_ANDROID_KEYSTORE_PASSWORD }}
          NOA_ANDROID_KEY_PASSWORD: ${{ secrets.NOA_ANDROID_KEY_PASSWORD }}
        run: python3 scripts/noa_android_sign_candidate.py
      - name: Require the existing production APK signing identity
        run: python3 scripts/noa_apk_signing_check.py
      - name: Publish tested APK with pinned SFTP
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ vars.NOA_SSH_HOST_FINGERPRINT || 'SHA256:0LqxbpOziJ4XgOMNEkfVrVGle3kpjJessI+jKqZ4JCU' }}
          NOA_SSH_ROOT: ${{ vars.NOA_FTP_ROOT || '/hosting/noastudio/html' }}
        run: |
          python3 -m pip install --user 'paramiko==3.5.1'
          python3 scripts/noa_apk_deploy.py
      - name: Retain verified n80 Android publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: n80-android-release-${{ github.run_id }}
          path: artifact/n80-android-release.json
          if-no-files-found: error
          retention-days: 14
