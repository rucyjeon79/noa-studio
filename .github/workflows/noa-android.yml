name: NOA STUDIO Android
# Production PWA owns navigation and layout; Android provides background media only.
# User-requested Android releases are separate from the automatic Shorts wake policy.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested permanent release identity (legacy debug migration is explicit)
        type: boolean
        default: false
      capture_review_demo:
        description: Record foreground media demo from the pinned Play candidate (no publication)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: n80-android-host-bridge
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Install the Android 16 build platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify native bridge and administrator preview fallback
        run: node --test tests/android/native_bridge_test.mjs tests/android/live_web_contract_test.mjs
      - name: Verify APK publication failure safety
        run: python3 tests/android/apk_deploy_test.py
      - name: Verify Android host Node evidence
        run: python3 tests/android/host_node_test.py
      - name: Verify the APK bridge with Node on the existing NOA host
        if: github.ref == 'refs/heads/main'
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_ANDROID_HOST_NODE: '1'
        run: |
          python3 -m pip install --user 'paramiko==3.5.1'
          python3 scripts/n80_auto.py jukebox.android_bridge
      - name: Verify n80 Android release contract
        run: php tests/n80/android_update_test.php
      - name: Check APK signing and deployment scripts
        run: python3 -m py_compile scripts/noa_android_sign_candidate.py scripts/noa_apk_signing_check.py scripts/noa_apk_deploy.py
      - name: Set permanent release version
        run: echo "NOA_RELEASE_VERSION_CODE=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Compile installable APK and lint
        working-directory: android
        env:
          NOA_ANDROID_HOST_NODE: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: GITHUB_RUN_NUMBER="$NOA_RELEASE_VERSION_CODE" gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease :app:assembleDebugAndroidTest :app:lintRelease
      - name: Sign release and instrumentation with permanent identity
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: |
          python3 -m pip install --user 'paramiko==3.5.1'
          python3 scripts/qa/noa-sign-release.py
      - name: Verify the signed APK contains the host-tested bridge
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/noa_android_host_bridge.py --verify-release
      - name: Retain APK
        uses: actions/upload-artifact@v4
        with:
          name: NOA-STUDIO-Android-APK
          overwrite: true
          path: |
            release-artifact/noa-studio-release.apk
            release-artifact/noa-studio-release.aab
            release-artifact/verification.json
          retention-days: 14
      - name: Prepare independent Chrome comparison
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/noa-browser-qa" --no-audit --no-fund playwright@1.56.1
      - name: Prepare isolated live music member
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: |
          python3 -m pip install --user 'paramiko==3.5.1'
          python3 scripts/noa_android_member_qa.py prepare
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Release build memory before launching the emulator
        run: gradle --stop
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Use modern ANGLE software rendering; legacy GLES SwiftShader segfaulted on the live homepage.
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          cores: 2
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -HardwareDecoder
          pre-emulator-launch-script: python3 scripts/qa/noa-emulator-trace.py
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat -v threadtime '*:E' TestRunner:I > android/noa-device-log.txt &
            adb shell svc wifi enable
            adb push "$RUNNER_TEMP/noa-android-qa-cookie.txt" /data/local/tmp/noa-android-qa-cookie.txt
            adb shell chmod 600 /data/local/tmp/noa-android-qa-cookie.txt
            adb install release-artifact/noa-studio-release.apk
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb install release-artifact/noa-studio-test.apk
            adb shell am instrument -w -e class kr.ai.noastudio.PwaRenderingTest,kr.ai.noastudio.MediaPolicyTest,kr.ai.noastudio.AppUpdateTest,kr.ai.noastudio.NativeSessionTest,kr.ai.noastudio.WebParityTest kr.ai.noastudio.test/androidx.test.runner.AndroidJUnitRunner > android/noa-instrumentation.txt
            cat android/noa-instrumentation.txt
            adb shell am force-stop kr.ai.noastudio
            adb shell am instrument -w -e class kr.ai.noastudio.WebPlaybackRestoreTest kr.ai.noastudio.test/androidx.test.runner.AndroidJUnitRunner > android/noa-restore-instrumentation.txt
            cat android/noa-restore-instrumentation.txt
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/ android/device-proof/ || true
            if [ "${{ inputs.capture_review_demo }}" = "true" ]; then
              curl --fail --location --max-time 120 https://noastudio.ai.kr/noa-studio-android-build-1794853670.apk -o "$RUNNER_TEMP/noa-play-review.apk"
              echo 'be8ad4f82a285be3c7b29718a5331fbb5cafabce0036199f82d91d27b0a9bbfb  '"$RUNNER_TEMP/noa-play-review.apk" | sha256sum --check
              adb uninstall kr.ai.noastudio
              adb install "$RUNNER_TEMP/noa-play-review.apk"
              adb shell am instrument -w -e class kr.ai.noastudio.FgsDeclarationTest kr.ai.noastudio.test/androidx.test.runner.AndroidJUnitRunner > android/noa-fgs-instrumentation.txt
              cat android/noa-fgs-instrumentation.txt
            fi
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/ android/device-proof/ || true
            adb logcat -d -s AndroidRuntime:E NoaApi:E > android/noa-runtime-errors.txt
            python3 -c "from pathlib import Path; import json; assert 'OK (7 tests)' in Path('android/noa-instrumentation.txt').read_text(); assert 'OK (1 test)' in Path('android/noa-restore-instrumentation.txt').read_text(); p=next(Path('android/device-proof').rglob('noa-pwa-proof.json')); proof=json.loads(p.read_text()); assert proof['completed'] and proof['livePwaDocumentLoaded'] and proof['backgroundAndScreenOff']; assert 'FATAL EXCEPTION' not in Path('android/noa-runtime-errors.txt').read_text(); print(proof)"
      - name: Verify requested foreground service recording
        if: inputs.capture_review_demo
        run: |
          python3 -c "from pathlib import Path; import json; assert 'OK (1 test)' in Path('android/noa-fgs-instrumentation.txt').read_text(); p=next(Path('android/device-proof').rglob('noa-fgs-media-playback.json')); d=json.loads(p.read_text()); assert d['completed'] and d['versionCode']==1794853670 and d['visiblePlayTap'] and d['backgroundPlayback'] and d['mediaNotification']; assert p.with_suffix('.mp4').stat().st_size>100000; print(d)"
      - name: Compare actual APK screens with independent mobile Chrome
        env:
          NOA_BROWSER_MODULES: ${{ runner.temp }}/noa-browser-qa
        run: node tests/android/chrome_parity.mjs
      - name: Record emulator host diagnostics
        if: always()
        run: |
          free -m > android/noa-host-memory.txt
          sudo dmesg --ctime | tail -150 > android/noa-host-kernel.txt
      - name: Clean isolated live music member
        if: always()
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/noa-android-qa-state.json" ]; then
            for attempt in 1 2 3; do
              if python3 scripts/noa_android_member_qa.py cleanup; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Retain device verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOA-STUDIO-Android-verification
          overwrite: true
          path: |
            android/device-proof/
            android/chrome-proof/
            android/noa-instrumentation.txt
            android/noa-runtime-errors.txt
            android/noa-device-log.txt
            android/noa-host-memory.txt
            android/noa-host-kernel.txt
            android/noa-emulator-host.log
            android/noa-restore-instrumentation.txt
            android/noa-fgs-instrumentation.txt
            android/host-node-proof.json
            android/app/build/reports/lint-results-release.html
          retention-days: 14

  publish:
    # Publish only an explicitly requested release from the registered main workflow.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && !inputs.capture_review_demo
    needs: apk
    concurrency:
      group: noa-dothome-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NOA-STUDIO-Android-APK
          overwrite: true
          path: artifact
      - name: Prepare verified release artifact
        run: cp artifact/noa-studio-release.apk artifact/app-debug.apk
      - name: Require the existing production APK signing identity
        run: python3 scripts/noa_apk_signing_check.py
      - name: Publish tested APK with pinned SFTP
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ vars.NOA_SSH_HOST_FINGERPRINT || 'SHA256:0LqxbpOziJ4XgOMNEkfVrVGle3kpjJessI+jKqZ4JCU' }}
          NOA_SSH_ROOT: ${{ vars.NOA_FTP_ROOT || '/hosting/noastudio/html' }}
        run: |
          python3 -m pip install --user 'paramiko==3.5.1'
          python3 scripts/n80_auto.py jukebox.android_publish
      - name: Retain verified n80 Android publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: n80-android-release-${{ github.run_id }}
          path: artifact/n80-android-release.json
          if-no-files-found: error
          retention-days: 14

