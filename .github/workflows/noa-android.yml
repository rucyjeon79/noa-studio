name: NOA STUDIO Android
# Production PWA owns navigation and layout; Android provides background media only.
on:
  push:
    branches: [main, work/android-background-20261022, work/n80-release-final-20261029, work/android-live-failures-20261030, work/android-live-pwa-only-20261030]
    paths: ['.github/workflows/noa-android.yml', 'android/**', 'scripts/noa_android_*.py', 'scripts/noa_apk_*.py', 'tests/android/**', 'tests/n80/android_update_test.php', 'public/icon-512.png']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested permanent release identity (legacy debug migration is explicit)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify native bridge and administrator preview fallback
        run: node --test tests/android/native_bridge_test.mjs tests/android/live_web_contract_test.mjs
      - name: Verify APK publication failure safety
        run: python3 tests/android/apk_deploy_test.py
      - name: Verify n80 Android release contract
        run: php tests/n80/android_update_test.php
      - name: Check APK signing and deployment scripts
        run: python3 -m py_compile scripts/noa_android_sign_candidate.py scripts/noa_apk_signing_check.py scripts/noa_apk_deploy.py
      - name: Set permanent release version
        run: echo "NOA_RELEASE_VERSION_CODE=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Compile installable APK and lint
        working-directory: android
        run: GITHUB_RUN_NUMBER="$NOA_RELEASE_VERSION_CODE" gradle --no-daemon :app:assembleRelease :app:bundleRelease :app:assembleDebugAndroidTest :app:lintRelease
      - name: Sign release and instrumentation with permanent identity
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: |
          python3 -m pip install --user 'paramiko==3.5.1'
          python3 scripts/qa/noa-sign-release.py
      - name: Retain APK
        uses: actions/upload-artifact@v4
        with:
          name: NOA-STUDIO-Android-APK
          overwrite: true
          path: |
            release-artifact/noa-studio-release.apk
            release-artifact/noa-studio-release.aab
            release-artifact/verification.json
          retention-days: 14
      - name: Prepare isolated live music member
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: |
          python3 -m pip install --user 'paramiko==3.5.1'
          python3 scripts/noa_android_member_qa.py prepare
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell svc wifi enable
            adb push "$RUNNER_TEMP/noa-android-qa-cookie.txt" /data/local/tmp/noa-android-qa-cookie.txt
            adb shell chmod 600 /data/local/tmp/noa-android-qa-cookie.txt
            adb install release-artifact/noa-studio-release.apk
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb install release-artifact/noa-studio-test.apk
            adb shell am instrument -w -e class kr.ai.noastudio.MediaPolicyTest,kr.ai.noastudio.AppUpdateTest,kr.ai.noastudio.NativeSessionTest,kr.ai.noastudio.WebParityTest kr.ai.noastudio.test/androidx.test.runner.AndroidJUnitRunner > android/noa-instrumentation.txt
            cat android/noa-instrumentation.txt
            adb shell am force-stop kr.ai.noastudio
            adb shell am instrument -w -e class kr.ai.noastudio.WebPlaybackRestoreTest kr.ai.noastudio.test/androidx.test.runner.AndroidJUnitRunner > android/noa-restore-instrumentation.txt
            cat android/noa-restore-instrumentation.txt
            adb pull /sdcard/Android/data/kr.ai.noastudio/files/ android/device-proof/ || true
            adb logcat -d -s AndroidRuntime:E NoaApi:E > android/noa-runtime-errors.txt
            python3 -c "from pathlib import Path; import json; assert 'OK (6 tests)' in Path('android/noa-instrumentation.txt').read_text(); assert 'OK (1 test)' in Path('android/noa-restore-instrumentation.txt').read_text(); p=next(Path('android/device-proof').rglob('noa-pwa-proof.json')); proof=json.loads(p.read_text()); assert proof['completed'] and proof['livePwaLayoutAndOrderMatch'] and proof['backgroundAndScreenOff']; assert 'FATAL EXCEPTION' not in Path('android/noa-runtime-errors.txt').read_text(); print(proof)"
      - name: Clean isolated live music member
        if: always()
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/noa-android-qa-state.json" ]; then
            for attempt in 1 2 3; do
              if python3 scripts/noa_android_member_qa.py cleanup; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Retain device verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOA-STUDIO-Android-verification
          overwrite: true
          path: |
            android/device-proof/
            android/noa-instrumentation.txt
            android/noa-runtime-errors.txt
            android/noa-restore-instrumentation.txt
            android/app/build/reports/lint-results-release.html
          retention-days: 14

  publish:
    # Native-scoped main pushes automatically publish after all device gates pass.
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: apk
    concurrency:
      group: noa-dothome-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NOA-STUDIO-Android-APK
          overwrite: true
          path: artifact
      - name: Prepare verified release artifact
        run: cp artifact/noa-studio-release.apk artifact/app-debug.apk
      - name: Require the existing production APK signing identity
        run: python3 scripts/noa_apk_signing_check.py
      - name: Publish tested APK with pinned SFTP
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ vars.NOA_SSH_HOST_FINGERPRINT || 'SHA256:0LqxbpOziJ4XgOMNEkfVrVGle3kpjJessI+jKqZ4JCU' }}
          NOA_SSH_ROOT: ${{ vars.NOA_FTP_ROOT || '/hosting/noastudio/html' }}
        run: |
          python3 -m pip install --user 'paramiko==3.5.1'
          python3 scripts/noa_apk_deploy.py
      - name: Retain verified n80 Android publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: n80-android-release-${{ github.run_id }}
          path: artifact/n80-android-release.json
          if-no-files-found: error
          retention-days: 14

