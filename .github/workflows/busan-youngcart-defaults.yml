name: Busan Youngcart point-only defaults
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/busan-youngcart-defaults.yml'
      - 'scripts/busan_youngcart/init_defaults.*'
      - 'deploy/busan/youngcart/defaults.php'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: busan-youngcart-defaults, cancel-in-progress: false}
jobs:
  defaults:
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate exact point-only defaults
        run: |
          php -l deploy/busan/youngcart/defaults.php
          php -l scripts/busan_youngcart/init_defaults.php
          php -r 'require "deploy/busan/youngcart/defaults.php"; $d=busan_yc_default_values(); foreach (["de_bank_use","de_card_use","de_iche_use","de_hp_use","de_easy_pay_use","de_vbank_use","de_guest_cart_use"] as $k) {if ((string)$d[$k]!=="0") exit(1);} if ($d["de_pg_service"]!=="") exit(1); echo "POINTZONE_DEFAULTS_POLICY_OK\n";'
          python -m py_compile scripts/busan_youngcart/init_defaults.py
          python -m pip install -q paramiko==3.5.1
      - name: Initialize native defaults only; engine stays disabled
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: python scripts/busan_youngcart/init_defaults.py
