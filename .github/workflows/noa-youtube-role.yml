name: NOA YouTube Official MV Separation
on:
  pull_request:
    paths: ['bridge/youtube-store.php','deploy/noa-youtube.php','deploy/noa-music.php','deploy/noa-app/p0-media.css','tests/p0/youtube_official_separation.php','scripts/noa_youtube_role_deploy.py','scripts/noa_youtube_role_drive_receipt.json','.github/workflows/noa-youtube-role.yml']
  push:
    branches: [main]
    paths: ['bridge/youtube-store.php','deploy/noa-youtube.php','scripts/noa_youtube_role_deploy.py','.github/workflows/noa-youtube-role.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: mbstring}
      - name: Validate source, membership and existing read models
        run: |
          php -l deploy/noa-youtube.php
          php -l bridge/youtube-store.php
          php tests/p0/youtube_official_separation.php
          php tests/p0/world_act_membership.php
          php -l bridge/world-mv.php
          php -l deploy/noa-app/world-view.php
          php -l deploy/noa-app/jukebox/stream.php
          php -l deploy/noa-app/jukebox/stream-popularity.php
          php -l bridge/popularity-events.php
          php tests/popularity/stream_tracking_test.php
          python tests/popularity/stream_source_contract.py
          node --check deploy/noa-playcount.js
          node --test tests/popularity/player_tracker_test.cjs
          php tests/youtube/core_test.php
          php tests/catalog/world_mv_test.php
          php tests/p0/youtube-map-test.php
          python tests/uiux/recovery_contract_test.py
          python -m py_compile scripts/noa_youtube_role_deploy.py
  production:
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[approved-ui]')
    needs: candidate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Guarded read-model activation and real set comparison
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_youtube_role_deploy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-youtube-role-${{ github.run_id }}
          path: youtube-role-proof.json
          retention-days: 1
