name: NOA Playlist Safe Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-playlists.js'
      - 'scripts/noa_playlist_safe_deploy.py'
      - '.github/workflows/noa-playlist-safe-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and regression
        run: |
          node --check deploy/noa-playlists.js
          node --test scripts/qa/noa-playlist-refresh.test.mjs
          python -m py_compile scripts/noa_playlist_safe_deploy.py
      - name: Install SFTP client
        run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy exact reviewed file and verify public asset
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_playlist_safe_deploy.py
