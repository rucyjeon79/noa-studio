name: NOA rank transition inventory
on:
  push:
    branches: [main]
    paths: ['scripts/noa_rank_audit.py','.github/workflows/noa-rank-inventory.yml']
permissions: {contents: read}
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_rank_audit.py
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
