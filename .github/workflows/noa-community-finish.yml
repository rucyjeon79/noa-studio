name: NOA Home and Community Completion
on:
  push:
    branches: [main]
    paths: ['scripts/noa_community_*','.github/workflows/noa-community-finish.yml','scripts/qa/noa-community*','tests/community/**']
permissions: {contents: read}
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: |
          php -l scripts/noa_community_inventory.php
          python -m pip install 'paramiko>=3,<5'
          python scripts/noa_community_inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-community-${{ github.run_id }}', path: community-proof/, retention-days: 7}
