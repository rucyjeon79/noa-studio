name: NOA Private DB Folder Audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/noa_db_private_audit.py'
      - '.github/workflows/noa-db-private-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile scripts/noa_db_private_audit.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Inventory private DB metadata read only
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_db_private_audit.py
