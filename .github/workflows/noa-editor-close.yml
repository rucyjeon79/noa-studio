name: Verify and publish song editor closing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-editor-close.yml','tests/catalog/editor-close.cjs']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          node --check deploy/noa-browse-edit.js
          npm install --prefix "$RUNNER_TEMP/editor-close" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/editor-close/node_modules" node tests/catalog/editor-close.cjs
          python -m pip install 'paramiko>=3,<5'
      - name: Publish and verify editor closing
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES = {'noa-browse-edit.js':'deploy/noa-browse-edit.js'}
          release.NEW = set()
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
