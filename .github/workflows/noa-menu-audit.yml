name: NOA public menu surface audit
on:
  workflow_call:
    inputs:
      deployed: {type: boolean, default: false}
  workflow_dispatch:
  pull_request:
    paths: ['tests/header/drawer-layout.mjs', '.github/workflows/noa-menu-audit.yml']
  push:
    branches: [main]
    paths: ['tests/header/drawer-layout.mjs','tests/room-themes/menu-surfaces.mjs', '.github/workflows/noa-menu-audit.yml']
permissions: {contents: read}
jobs:
  check:
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[drawer-layout]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check public menu destinations and record access gates
        env:
          NOA_MENU_CANDIDATE: ${{ github.event_name == 'push' && !inputs.deployed }}
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-menu-surfaces" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/room-themes/menu-surfaces.mjs "$RUNNER_TEMP/noa-menu-surfaces/check.mjs"
          node "$RUNNER_TEMP/noa-menu-surfaces/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-menu-surfaces-${{ github.run_id }}', path: room-theme-proof/menu-surfaces/, retention-days: 7}
  drawer:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[drawer-layout]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          node --check deploy/noa-account.js
          node --check deploy/noa-ui.js
          node --test tests/starlight/navigation.test.mjs
          npm install --prefix "$RUNNER_TEMP/drawer" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/header/drawer-layout.mjs "$RUNNER_TEMP/drawer/check.mjs"
          node "$RUNNER_TEMP/drawer/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: drawer-candidate, path: room-theme-proof/drawer-candidate/, retention-days: 7}
  publish-drawer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: drawer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          python -m pip install 'paramiko>=3,<5'
          npm install --prefix "$RUNNER_TEMP/drawer" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/header/drawer-layout.mjs "$RUNNER_TEMP/drawer/check.mjs"
      - name: Publish and verify the three menu assets
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_MENU_DRAWER: 'true'
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          python scripts/noa_light_theme_release.py
          NOA_THEME_PHASE=live node "$RUNNER_TEMP/drawer/check.mjs" || { python scripts/noa_light_theme_release.py rollback; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: drawer-live, path: room-theme-proof/drawer-live/, retention-days: 7}
