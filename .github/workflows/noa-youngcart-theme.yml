name: NOA Youngcart missing theme dependencies
on:
  push:
    branches: [main]
    paths: ['scripts/noa_youngcart_theme.py','.github/workflows/noa-youngcart-theme.yml']
permissions: {contents: read}
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python -m py_compile scripts/noa_youngcart_theme.py
      - run: python scripts/noa_youngcart_theme.py
