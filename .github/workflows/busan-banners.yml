name: Busan branch premium banner design
on:
  push:
    branches: [main]
    paths: ['.github/workflows/busan-banners.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: busan-readonly-sftp, cancel-in-progress: false}
jobs:
  banners:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: busan-readonly
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: mbstring}
      - name: Validate banner rendering and preserve administrator content
        run: |
          python3 - <<'PY'
          import base64,zipfile,io
          data=base64.b64decode('')
          open('/tmp/busan-banners.zip','wb').write(data)
          zipfile.ZipFile(io.BytesIO(data)).extractall('/tmp/busan-banners')
          PY
          find /tmp/busan-banners -name '*.php' -print0 | xargs -0 -n1 php -l
          php /tmp/busan-banners/tests/banner-test.php
      - run: python3 -m pip install paramiko==3.5.1
      - name: Deploy independent banner assets and activate extension last
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          cd scripts
          python3 - <<'PY'
          import os,socket,hmac,stat,hashlib,zipfile,urllib.request
          import paramiko
          from busan_readonly_check import configuration,fingerprint,PORT,ROOT
          host,user,password,pin=configuration(os.environ)
          private='/hosting/rucyjeon79/busan-assistant-private'
          theme='theme/UXC_Flarumix/ui_module/ui_mainSlider/ui_mainSlider.php'
          z=zipfile.ZipFile('/tmp/busan-banners.zip')
          files={n:z.read(n) for n in z.namelist() if not n.startswith('tests/')}
          assert set(files)=={theme,'extend/busan-banner.extend.php','busan-assistant/banner-assets/busan-banners.css','busan-assistant/banner-assets/busan-solidarity-20261023.webp'}
          expected={'extend/busan-banner.extend.php': '55d77b7181c3704226d8b45016bf051661c4378c3b4a66aff15a6c4217b068d5', 'theme/UXC_Flarumix/ui_module/ui_mainSlider/ui_mainSlider.php': '0064aa4598b486f68c4b431077814d71a484ee81bb69d91e9a3c2f7a9abd7a0d', 'busan-assistant/banner-assets/busan-solidarity-20261023.webp': '3d3807ee7e00ea2730e40dc5ce2672fb0c590a87c970679d16c33da55b58a814', 'busan-assistant/banner-assets/busan-banners.css': '3b13fae58985d167596f9b26bbd6c2b5c9b6ce91e0ec2bdebfdaf5c7a83724a2'}
          with socket.create_connection((host,PORT),timeout=15) as sock:
           with paramiko.Transport(sock) as t:
            t.banner_timeout=15;t.auth_timeout=15;t.get_security_options().key_types=('ssh-ed25519',)
            t.start_client(timeout=20)
            assert hmac.compare_digest(fingerprint(t.get_remote_server_key()),pin),'host_key_mismatch'
            t.auth_password(user,password,fallback=False)
            with paramiko.SFTPClient.from_transport(t) as s:
             s.get_channel().settimeout(25)
             assert s.normalize(ROOT)==ROOT and s.normalize(private)==private
             for n,data in files.items():
              try:
               target=ROOT+'/'+n
               assert stat.S_ISREG(s.lstat(target).st_mode) and s.normalize(target)==target
               with s.open(target,'rb') as f:old=f.read(2000000)
               assert old==data or hashlib.sha256(old).hexdigest()==expected.get(n),'existing_file_conflict: '+n
              except FileNotFoundError:
               assert n!=theme,'missing_native_slider'
             directory=ROOT+'/busan-assistant/banner-assets'
             try:s.mkdir(directory,0o755)
             except OSError:assert stat.S_ISDIR(s.lstat(directory).st_mode) and s.normalize(directory)==directory
             for n in sorted(files,key=lambda n:(n.startswith('extend/'),n==theme,n)):
              data=files[n];target=ROOT+'/'+n
              if n==theme:
               with s.open(target,'rb') as f:old=f.read(2000000)
               backup=private+'/before-busan-banners-20261023-ui_mainSlider.php'
               try:
                with s.open(backup,'wx') as f:f.write(old)
                s.chmod(backup,0o600)
               except IOError:pass
              temp=directory+'/.upload-'+n.rsplit('/',1)[-1]
              with s.open(temp,'wb') as f:f.write(data)
              s.chmod(temp,0o644)
              try:s.posix_rename(temp,target)
              except FileNotFoundError:s.rename(temp,target)
              with s.open(target,'rb') as f:assert f.read(2000000)==data
              print('verified '+n)
          for path,needle in [('/',b'busan-banner--hero')]:
           with urllib.request.urlopen('https://skhnslu-busan.com'+path,timeout=30) as r:page=r.read(2000000)
           assert needle in page,'live_banner_missing: '+path
           assert b'busan-banners.css?v=20261023-2' in page,'banner_styles_missing'
          with urllib.request.urlopen('https://skhnslu-busan.com/busan-assistant/banner-assets/busan-solidarity-20261023.webp',timeout=30) as r:
           photo=r.read(500000);assert photo[:4]==b'RIFF' and photo[8:12]==b'WEBP'
          print('PASS live homepage hero, versioned styles and WebP asset; authenticated board view checked separately; no SQL changes')
          PY
