name: NOA P0 hero media diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-p0-hero.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          npm install --prefix "$RUNNER_TEMP/noa-hero" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-hero/node_modules/.bin/playwright" install --with-deps chromium
          cp scripts/qa/noa-p0-hero.mjs "$RUNNER_TEMP/noa-hero/check.mjs"
          node "$RUNNER_TEMP/noa-hero/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: noa-p0-hero, path: hero-proof/, retention-days: 14}
