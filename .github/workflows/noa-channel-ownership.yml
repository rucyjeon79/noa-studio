name: NOA channel ownership repair
on:
  pull_request:
    paths: ['bridge/channel-ownership.php','scripts/noa_channel*','.github/workflows/noa-channel-ownership.yml','tests/member/**','bridge/creator*.php','deploy/noa-creator*','deploy/noa-channel.php']
  push:
    branches: [main]
    paths: ['bridge/channel-ownership.php','scripts/noa_channel*','.github/workflows/noa-channel-ownership.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated-noa-ci, MYSQL_DATABASE: noa_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated-noa-ci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noa_test;charset=utf8mb4'
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: isolated-noa-ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_mysql,pdo_sqlite,mbstring,fileinfo'}
      - name: Verify ownership migration, replay, foreign-owner isolation and canonical writes
        run: |
          for f in bridge/channel-ownership.php bridge/creator*.php bridge/package-record.php bridge/index.php deploy/noa-channel.php deploy/noa-creator.php scripts/noa_channel_control.php; do php -l "$f"; done
          node --check deploy/noa-creator.js
          php tests/member/access_test.php
          php tests/member/mysql_test.php
          python tests/member/fixture.py
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/channel" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-member.mjs "$RUNNER_TEMP/channel/check.mjs"
          php -S 127.0.0.1:18080 -t /tmp/noa-member-site > "$RUNNER_TEMP/channel-fixture.log" 2>&1 &
      - name: Verify real owner list and creator saves in mobile and desktop
        run: node "$RUNNER_TEMP/channel/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-channel-candidate-${{ github.run_id }}', path: 'member-proof/candidate/', retention-days: 7}
  deploy:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[channel-view-release]')
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Install reviewed channel sources with protected preimages
        id: upload
        run: python scripts/noa_channel_release.py
      - name: Audit ownership, back up exact records, bind and verify replay
        run: python scripts/noa_channel_control.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-channel-live-${{ github.run_id }}', path: 'channel-proof/', retention-days: 7}
