name: NOA member experience refinement
on:
  pull_request:
    paths: ['deploy/noa-ui.js','deploy/noa-starlight.css','deploy/noa-ainoa.*','deploy/noa-voice.js','deploy/noa-listening.js','deploy/noa-music-vinyl.css','deploy/noa-member-surfaces.*','deploy/noa-design.extend.php','tests/member-premium/**','scripts/noa_member_surfaces_release.py','.github/workflows/noa-member-premium.yml']
  push:
    branches: [main]
    paths: ['deploy/noa-ui.js','deploy/noa-starlight.css','deploy/noa-ainoa.*','deploy/noa-voice.js','deploy/noa-listening.js','deploy/noa-music-vinyl.css','deploy/noa-member-surfaces.*','deploy/noa-design.extend.php','tests/member-premium/**','scripts/noa_member_surfaces_release.py','.github/workflows/noa-member-premium.yml']
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate presentation and native form contracts
        run: |
          php -l deploy/noa-design.extend.php
          php tests/member-premium/assets.php
          php tests/member-premium/render.php
          node --check deploy/noa-ui.js
          node --check deploy/noa-member-surfaces.js
          node --test tests/member-premium/icons.test.mjs tests/listening/model.mjs tests/voice/composer_test.cjs
          node --check deploy/noa-listening.js
          node --check deploy/noa-ainoa.js
          node --check deploy/noa-voice.js
          node --check tests/member-premium/surfaces.mjs
          node --check tests/member-premium/fixtures.mjs
          node --check tests/member-premium/tables.mjs
      - name: Prepare visual inspection
        run: |
          python scripts/qa/noa-qa-font.py
          timeout 90s npm install --prefix "$RUNNER_TEMP/noa-member" --no-save --ignore-scripts --package-lock=false --no-audit --no-fund --fetch-timeout=20000 --fetch-retries=1 playwright@1.56.1
          cp tests/member-premium/experience.mjs tests/member-premium/composer.mjs tests/member-premium/relationships.mjs tests/member-premium/drawer-points.mjs tests/member-premium/tables.mjs "$RUNNER_TEMP/noa-member/"
          cp tests/member-premium/fixtures.mjs "$RUNNER_TEMP/noa-member/fixtures.mjs"
          cp tests/member-premium/surfaces.mjs "$RUNNER_TEMP/noa-member/check.mjs"
      - name: Inspect member entry points without transactions
        run: NOA_MEMBER_PHASE=candidate node "$RUNNER_TEMP/noa-member/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'member-surfaces-candidate', path: 'member-surface-proof/', retention-days: 7}
  publish:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[member-ui]')
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Prepare verified publication
        run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/qa/noa-qa-font.py
          php tests/member-premium/assets.php
          php tests/member-premium/render.php
          timeout 90s npm install --prefix "$RUNNER_TEMP/noa-member" --no-save --ignore-scripts --package-lock=false --no-audit --no-fund --fetch-timeout=20000 --fetch-retries=1 playwright@1.56.1
          cp tests/member-premium/experience.mjs tests/member-premium/fixtures.mjs tests/member-premium/composer.mjs tests/member-premium/relationships.mjs tests/member-premium/drawer-points.mjs tests/member-premium/tables.mjs "$RUNNER_TEMP/noa-member/"
          cp tests/member-premium/surfaces.mjs "$RUNNER_TEMP/noa-member/check.mjs"
      - name: Publish presentation assets and inspect the operating pages
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          python scripts/noa_member_surfaces_release.py
          NOA_MEMBER_PHASE=live node "$RUNNER_TEMP/noa-member/check.mjs" || { python scripts/noa_member_surfaces_release.py rollback; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'member-surfaces-live', path: 'member-surface-proof/', retention-days: 7}
