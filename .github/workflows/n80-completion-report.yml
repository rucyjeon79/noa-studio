name: N80 current task production evidence report
on:
  workflow_run:
    workflows: ['NOA existing feature quality gates']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  report:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: noa-n80-evidence-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.workflow_run.head_sha }}'
          fetch-depth: 0
          persist-credentials: false
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Validate completed Actions, authenticated artifact and runtime readback; record only
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/n80_completion_pipeline.py report
      - uses: actions/upload-artifact@v4
        with:
          name: n80-task-evidence-receipt-${{ github.event.workflow_run.id }}
          path: '${{ runner.temp }}/noa-n80-report/receipt.json'
          if-no-files-found: error
          retention-days: 2
