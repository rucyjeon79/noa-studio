name: NOA upload commit diagnosis
on:
  push:
    branches: [main]
    paths: ['scripts/noa_upload_commit_diagnosis.py', '.github/workflows/noa-upload-commit-diagnosis.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_upload_commit_diagnosis.py
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: upload-commit-diagnosis, path: upload-diagnosis-proof/, retention-days: 2}
