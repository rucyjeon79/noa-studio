name: N80 creative drafts
on:
  push:
    branches: [main, work/creative-drafts]
    paths: ['bridge/creative*.php','deploy/noa-creative.*','deploy/noa-lab-creative.php','deploy/noa-app/engine/creative.php','tests/creative/**','scripts/noa_creative*','.github/workflows/noa-creative-drafts.yml']
  pull_request:
    paths: ['bridge/creative*.php','deploy/noa-creative.*','deploy/noa-lab-creative.php','deploy/noa-app/engine/creative.php','tests/creative/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[creative-audit]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-test-only, MYSQL_DATABASE: noa_inline_edit_test}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pnoa-test-only" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NOA_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noa_inline_edit_test;charset=utf8mb4'
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: noa-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_mysql,pdo_sqlite,mbstring,gd,curl,dom,fileinfo'}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Check source and SQL lifecycle
        run: |
          for p in bridge/creative*.php deploy/noa-app/engine/creative.php deploy/noa-lab-creative.php deploy/noa-gpt.php; do php -l "$p"; done
          node --check deploy/noa-creative.js
          node --check deploy/noa-ainoa.js
          php -l deploy/noa-app/engine/ai-lab.php
          node --check deploy/noa-browse-edit.js
          node --check deploy/noa-record-form.js
          python tests/creative/setup.py
          php scripts/qa/inline-edit-seed.php
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=1' -ac 2 -codec:a libmp3lame tests/creative/fixture.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=gray:s=64x64' -frames:v 1 tests/creative/fixture.webp
          php tests/creative/core.php
          php tests/engine/service_runtime_test.php
          python tests/gpt/flow.py
          php tests/lab-menu/menu.php
          php tests/sitemap/registry_test.php
          python tests/member/lab_routes.py
          python tests/creative/browser-setup.py
          npm install --prefix "$RUNNER_TEMP/creative-browser" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/creative/browser.mjs "$RUNNER_TEMP/creative-browser/check.mjs"
          cp tests/creative/viewport.mjs "$RUNNER_TEMP/creative-browser/viewport.mjs"
          cp tests/creative/revisions.mjs "$RUNNER_TEMP/creative-browser/revisions.mjs"
      - name: Verify mobile and desktop with actual PHP and MySQL
        run: |
          mkdir -p creative-proof
          php -S 127.0.0.1:8787 -t /tmp/noa-creative-test/html > creative-proof/http.log 2>&1 &
          node "$RUNNER_TEMP/creative-browser/check.mjs"
          NODE_PATH="$RUNNER_TEMP/creative-browser/node_modules" node tests/catalog/editor-close.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'creative-proof-${{ github.run_id }}', path: 'creative-proof/', retention-days: 7}
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - if: ${{ !contains(github.event.head_commit.message, '[creative-chat]') && !contains(github.event.head_commit.message, '[creative-retention]') && !contains(github.event.head_commit.message, '[creative-revision]') }}
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Activate one guarded source set
        id: activate
        env: &env
          NOA_CREATIVE_PRESENTATION_ONLY: ${{ contains(github.event.head_commit.message, '[creative-chat]') && '1' || '0' }}
          NOA_CREATIVE_RETENTION_ONLY: ${{ contains(github.event.head_commit.message, '[creative-retention]') && '1' || '0' }}
          NOA_CREATIVE_REVISION_ONLY: ${{ contains(github.event.head_commit.message, '[creative-revision]') && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          if [ "$NOA_CREATIVE_REVISION_ONLY" = "1" ]; then python scripts/noa_creative_revision_live.py audit; fi
          python scripts/noa_creative_release.py
          if [ "$NOA_CREATIVE_REVISION_ONLY" = "1" ]; then python scripts/noa_creative_revision_live.py verify; fi
          if [ "$NOA_CREATIVE_PRESENTATION_ONLY" != "1" ] && [ "$NOA_CREATIVE_RETENTION_ONLY" != "1" ] && [ "$NOA_CREATIVE_REVISION_ONLY" != "1" ]; then python scripts/noa_creative_live.py; fi
      - name: Restore owned source on failed activation or live verification
        if: failure() && steps.activate.outcome == 'failure'
        env: *env
        run: python scripts/noa_creative_release.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'creative-live-${{ github.run_id }}', path: 'ainoa-proof/', retention-days: 7}

  audit:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[creative-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Read only the reported title revision
        env: &audit_env
          NOA_CREATIVE_AUDIT_JOB: de3358a2b0e594e46f176d0cd3a1c069
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_creative_revision_live.py audit
      - name: Remove only the completed revision probe
        env:
          <<: *audit_env
          NOA_CREATIVE_PROBE_ID: bbe2a3852180e4ffab905ee1a7923710
          NOA_CREATIVE_PROBE_REQUEST: 63e8d694ef7f2811a545ad25c3f3bf56
        run: python scripts/noa_creative_revision_live.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'creative-revision-audit-${{ github.run_id }}', path: 'ainoa-proof/', retention-days: 7}
