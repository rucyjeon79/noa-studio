env:
  NOA_DRIVE_RCLONE_CONFIG_B64: ${{ secrets.NOA_DRIVE_RCLONE_CONFIG_B64 }}
name: NOA canonical root production release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-root-release.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: noa-dothome-production, cancel-in-progress: false}
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate PHP and authorized bootstrap
        run: |
          php -l deploy/index.php
          php -l deploy/noa-app/home.php
          php -l deploy/noa-home.extend.php
          python3 -m py_compile scripts/noa_root_deploy.py
          python3 -m pip install --user paramiko==3.5.1
      - name: Back up and atomically switch production root
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
        run: python3 scripts/noa_root_deploy.py
  verify:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {width: [320,390,1280]}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Inspect actual root, app and subordinate services
        env:
          NOA_QA_WIDTH: ${{ matrix.width }}
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-root-qa" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-root-qa/node_modules/.bin/playwright" install --with-deps chromium
          cat > "$RUNNER_TEMP/noa-root-qa/check.mjs" <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const width=Number(process.env.NOA_QA_WIDTH),b=await chromium.launch(),c=await b.newContext({viewport:{width,height:900}}),p=await c.newPage(),results=[],errors=[];
          p.on('pageerror',e=>errors.push(e.message));
          const origin='https://noastudio.ai.kr';
          await fs.mkdir('root-release-proof',{recursive:true});
          for(const path of ['/','/index.php','/noa2.php']){
            const r=await p.goto(origin+path,{waitUntil:'domcontentloaded'});
            await p.locator('body[data-noa-home-ready="true"]').waitFor({timeout:30000});
            assert.equal(r.status(),200);assert(!p.url().includes('/noa2.php'));
            assert(await p.locator('#noa-featured a').count()>0);
            const layout=await p.evaluate(()=>({width:innerWidth,scroll:document.documentElement.scrollWidth,css:[...document.querySelectorAll('link[rel=stylesheet]')].map(e=>e.getAttribute('href')),scripts:[...document.querySelectorAll('script[src]')].map(e=>e.getAttribute('src')),sections:[...document.querySelectorAll('[data-home-section]')].map(e=>e.dataset.homeSection)}));
            assert(layout.scroll<=width+2);assert(layout.css.some(s=>s.includes('root-f449652')));
            assert.equal(layout.sections.length,9);
            for(const u of [...layout.css,...layout.scripts]){const asset=await p.request.get(origin+u);assert.equal(asset.status(),200,u);}
            results.push({route:path,final:p.url(),status:r.status(),layout});
            if(path==='/')await p.screenshot({path:'root-release-proof/root-'+width+'.jpg',type:'jpeg',quality:75});
          }
          assert.equal((await p.request.get(origin+'/noa-app/home.php')).status(),403);
          await p.goto(origin+'/bbs/login.php',{waitUntil:'domcontentloaded'});
          await p.locator('#login_id').waitFor();assert(await p.locator('#login_pw').isVisible());results.push({feature:'GnuBoard login form',visible:true});
          const anon=await p.request.get(origin+'/noa-bridge/ui-preferences.php');const prefs=await anon.json();assert.equal(prefs.member,false);
          for(const path of ['/noa-ai-lab.php','/noa-library.php','/noa-bridge/source-audit.php']){assert.equal((await p.request.get(origin+path)).status(),403);results.push({route:path,anonymousStatus:403});}
          await p.goto(origin+'/bbs/board.php?bo_table=free',{waitUntil:'domcontentloaded'});assert((await p.locator('body').innerText()).includes('자유게시판'));
          const catalog=await(await p.request.get(origin+'/noa-bridge/catalog.php')).json();
          results.push({feature:'catalog',records:catalog.items.length,ACTs:catalog.items.filter(x=>x.kind==='playlist').length,originalAudioFiles:catalog.items.filter(x=>x.audioUrl).length,sunoLinks:catalog.items.filter(x=>x.sunoUrl).length});
          await p.goto(origin+'/noa-music.php?genre=kpop-original&act=1',{waitUntil:'domcontentloaded'});
          await p.locator('.song:visible .song-select').first().click();
          await p.locator('#detail-title').waitFor();assert((await p.locator('#lyrics').innerText()).length>10);
          const detail={title:await p.locator('#detail-title').innerText(),status:await p.locator('#player-status').innerText(),playerVisible:await p.locator('.player').isVisible(),audioSrc:await p.locator('audio').getAttribute('src')};
          results.push({feature:'song and player',...detail,actualAudioVerified:false});
          await p.goto(origin+'/noa-youtube.php',{waitUntil:'domcontentloaded'});await p.locator('.noa-browse-card').nth(3).waitFor();
          await p.goto(origin+'/noa-world.php',{waitUntil:'domcontentloaded'});await p.locator('.noa-world-act').first().waitFor();results.push({feature:'YouTube and world ACT navigation',visible:true});
          assert.deepEqual(errors,[]);
          await fs.writeFile('root-release-proof/result-'+width+'.json',JSON.stringify({width,results,errors},null,2));
          console.log('ROOT_BROWSER_PROOF '+JSON.stringify({width,results,errors}));
          await b.close();
          JS
          node "$RUNNER_TEMP/noa-root-qa/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-root-proof-${{ matrix.width }}
          path: root-release-proof/
          retention-days: 14
