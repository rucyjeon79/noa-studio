name: NOA notification GitHub worker (retired)
# N80 operating rule 2026-11-17:
# GitHub Actions can ONLY issue an approved, signed, scheduled one-shot wake.
# This legacy business workflow is retired. No queue claims, host processing,
# database work, media, AI, notifications or direct host SSH are permitted.
# The prior implementation is retained in Git commit history for recovery.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Retired by N80 wake-only policy; no business work executed."
