name: NOA personal push dispatch
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: noa-personal-push, cancel-in-progress: false}
jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install 'pywebpush==2.4.0' 'paramiko>=3,<5'
      - name: Deliver only queued, consented personal notifications
        run: python scripts/noa_push_dispatch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-personal-push-${{ github.run_id }}', path: notifications-proof/dispatch.json, retention-days: 3}
