name: Busan read-only structure and PHP candidate validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/busan-structure-audit.yml']
permissions: {contents: read}
concurrency: {group: busan-readonly-sftp, cancel-in-progress: false}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, curl
      - name: Validate prepared PHP candidate without hosting deployment
        run: |
          mkdir -p "$RUNNER_TEMP/busan-candidate"
          echo '' | base64 -d | tar -xz -C "$RUNNER_TEMP/busan-candidate"
          cd "$RUNNER_TEMP/busan-candidate"
          php --version
          find . -name '*.php' -exec php -l '{}' \;
          php tests/policy_test.php
          node --check busan-assistant/app.js
      - run: python3 -m pip install paramiko==3.5.1
      - name: Inspect only Busan bootstrap and directory metadata
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: python3 scripts/busan_structure_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: busan-structure-audit
          path: busan-check-result/structure.json
          retention-days: 3
