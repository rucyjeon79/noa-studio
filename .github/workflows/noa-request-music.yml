name: NOA Community song replies
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-request-music.yml','scripts/noa_request_music_release.py','tests/navigation/request-music.mjs','bridge/community-music.php','bridge/community.php','bridge/community-core.php','tests/community/music-flow.php']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: fixture-only}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pfixture-only" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NOA_MYSQL_DSN: 'mysql:host=127.0.0.1;dbname=noa_community;charset=utf8mb4'
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli, pdo_mysql, mbstring'}
      - name: Install disposable audio test encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify shared boards and request authorization in disposable database
        run: |
          for file in bridge/community*.php deploy/noa-app/ecosystem-view.php deploy/noa-channel.php deploy/noa-design.extend.php; do php -l "$file"; done
          php -l bridge/support.php
          node --check deploy/noa-support.js
          node --check deploy/noa-notifications.js
          node --check deploy/noa-community.js
          node --check deploy/noa-ecosystem.js
          php tests/community/music-flow.php
          python scripts/qa/noa-qa-font.py
      - name: Verify real creator attachment and requester audio playback
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-requests" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/navigation/request-music.mjs "$RUNNER_TEMP/noa-requests/check.mjs"
          node "$RUNNER_TEMP/noa-requests/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-request-music-${{ github.run_id }}', path: 'request-music-proof/', retention-days: 7}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy verified community files and check public hashes
        run: python scripts/noa_request_music_release.py
      - name: Verify existing saved reply and JSON error envelope on production
        run: python scripts/noa_community_diagnostic.py
