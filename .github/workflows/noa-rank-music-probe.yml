name: NOA ranking to music count verification
on:
  push:
    branches: [main]
    paths: ['scripts/noa_rank_music_probe.*','.github/workflows/noa-rank-music-probe.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'paramiko>=3,<5'
      - run: npm install --no-save --ignore-scripts --package-lock=false --prefix "$RUNNER_TEMP/rank-browser" playwright@1.56.1 && ln -s "$RUNNER_TEMP/rank-browser/node_modules" scripts/node_modules
      - run: python scripts/noa_rank_music_probe.py
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
