name: N80 owner stop latch regression guard
on:
  pull_request:
    paths:
      - 'scripts/noa_daily_shorts.py'
      - 'scripts/n80_host_pause_gate.py'
      - 'tests/n80/test_n80_shorts_paused.py'
      - 'tests/n80/test_n80_host_pause_gate.py'
      - '.github/workflows/n80-host-stop-guard-test.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/noa_daily_shorts.py'
      - 'scripts/n80_host_pause_gate.py'
      - 'tests/n80/test_n80_shorts_paused.py'
      - 'tests/n80/test_n80_host_pause_gate.py'
      - 'tests/safety/n80-host-stop-latch.mjs'
      - 'runtime/hub/launch.mjs'
      - 'scripts/n80_hub_bootstrap.py'
      - 'tests/safety/n80-host-stop-latch.mjs'
      - 'deploy/noa-app/engine/hub.php'
      - '.github/workflows/n80-host-stop-guard-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript, PHP and Python syntax
        run: |
          test ! -e runtime/hub/launch.mjs
          test ! -e runtime/hub/runner.mjs
          test ! -e runtime/hub/stop.mjs
          test ! -e runtime/hub/probe.mjs
          test ! -e scripts/n80_hub_bootstrap.py
          php -l deploy/noa-app/engine/hub.php
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing SSH library for Python gate imports
        run: python -m pip install 'paramiko>=3,<5'
      - name: Verify a paused N80 host cannot trigger off-host Shorts
        run: |
          python -m unittest discover -s tests/n80 -p 'test_n80_host_pause_gate.py' -v
          python -m unittest discover -s tests/n80 -p 'test_n80_shorts_paused.py' -v
      - name: Verify stop latch refuses spawn in isolated runner
        run: node tests/safety/n80-host-stop-latch.mjs
