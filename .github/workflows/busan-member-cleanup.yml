name: Busan audited pending ghost member cleanup
on:
  push:
    paths: ['.github/workflows/busan-member-cleanup.yml']
permissions:
  contents: read
concurrency:
  group: busan-readonly-sftp
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: busan-readonly
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install paramiko==3.5.1
      - env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          cd scripts
          python3 - <<'PY'
          import os,socket,hmac,json,urllib.request,secrets
          import paramiko
          from busan_readonly_check import configuration,fingerprint,PORT,ROOT
          host,user,password,pin=configuration(os.environ)
          with socket.create_connection((host,PORT),timeout=15) as sock:
           with paramiko.Transport(sock) as t:
            t.start_client(timeout=20)
            assert hmac.compare_digest(fingerprint(t.get_remote_server_key()),pin)
            t.auth_password(user,password,fallback=False)
            with paramiko.SFTPClient.from_transport(t) as s:
             private='/hosting/rucyjeon79/busan-assistant-private'
             with s.open(private+'/activity-account.json','rb') as f:identity=json.loads(f.read(8192))
             name='member-cleanup-'+secrets.token_hex(12)+'.php';target=ROOT+'/busan-assistant/'+name
             code="<?php\ndeclare(strict_types=1);\nheader('Content-Type: application/json; charset=utf-8');header('Cache-Control: no-store');\n$private='/hosting/rucyjeon79/busan-assistant-private';\n$identity=json_decode(file_get_contents($private.'/activity-account.json'),true);\nif(time()-filemtime(__FILE__)>600||!hash_equals((string)$identity['agent_token'],$_SERVER['HTTP_X_BUSAN_AGENT_TOKEN']??'')){http_response_code(403);exit;}\nrequire_once __DIR__.'/../common.php';\nfunction query_ok(string $q){$r=sql_query($q,false);if($r===false)throw new RuntimeException('database_operation_failed');return $r;}\nfunction rows_for(string $q):array{$out=[];$r=query_ok($q);while($v=sql_fetch_array($r))$out[]=$v;return $out;}\nfunction save_private(string $path,array $data):string{$raw=json_encode($data,JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR);$f=fopen($path,'x');if(!$f)throw new RuntimeException('backup_exists_or_unwritable');chmod($path,0600);if(fwrite($f,$raw)!==strlen($raw))throw new RuntimeException('backup_short_write');fflush($f);if(function_exists('fsync'))fsync($f);fclose($f);if(!hash_equals(hash('sha256',$raw),hash_file('sha256',$path)))throw new RuntimeException('backup_verify_failed');return hash('sha256',$raw);}\n$receipt=$private.'/member-cleanup-20261023-receipt.json';if(is_file($receipt)){echo file_get_contents($receipt);exit;}\n$plan=json_decode(file_get_contents($private.'/member-cleanup-audit-20261023.json'),true,512,JSON_THROW_ON_ERROR);\nif(count($plan['rows'])!==83||time()-$plan['created_at']>1800)throw new RuntimeException('audit_stale_or_count_changed');\n$memberTable=$g5['member_table'];$ids=[];\nforeach($plan['rows'] as $r){\n if((int)$r['mb_level']!==2||!preg_match('/^유저[0-9]+$/uD',(string)$r['mb_nick'])||!preg_match('/^[a-zA-Z0-9_-]{1,40}$/D',$r['mb_id'])||in_array($r['mb_id'],['busanjibuon',$config['cf_admin']??'',$identity['mb_id']??''],true))throw new RuntimeException('protected_or_unexpected_candidate');\n $ids[]=\"'\".sql_real_escape_string($r['mb_id']).\"'\";\n}\n$idlist=implode(',',$ids);$tables=[];\nforeach(['member_table','point_table','group_member_table','memo_table','scrap_table','auth_table'] as $key){\n $table=$g5[$key]??'';if(!preg_match('/^[a-zA-Z0-9_]+$/D',$table))throw new RuntimeException('invalid_table');\n $tables[$key]=$table;\n}\nforeach(['group_table'=>'gr_admin','board_table'=>'bo_admin'] as $key=>$col){$t=$g5[$key]??'';if(!preg_match('/^[a-zA-Z0-9_]+$/D',$t))throw new RuntimeException('invalid_table');if(rows_for(\"SELECT $col FROM `$t` WHERE $col IN ($idlist)\"))throw new RuntimeException('candidate_has_admin_role');}\nquery_ok('LOCK TABLES '.implode(',',array_map(static fn($t)=>\"`$t` WRITE\",array_values($tables))));\ntry{\n $current=rows_for(\"SELECT * FROM `$memberTable` WHERE mb_id IN ($idlist) ORDER BY mb_id\");\n $expected=$plan['rows'];usort($expected,static fn($a,$b)=>strcmp($a['mb_id'],$b['mb_id']));\n if($current!==$expected)throw new RuntimeException('candidate_changed_since_audit');\n $approvedBefore=hash('sha256',json_encode(rows_for(\"SELECT * FROM `$memberTable` WHERE mb_level>=3 ORDER BY mb_id\")));\n $backup=['created_at'=>time(),'candidate_count'=>83,'tables'=>[]];$where=[];\n foreach($tables as $key=>$table){$where[$table]=$key==='memo_table'?\"me_recv_mb_id IN ($idlist) OR me_send_mb_id IN ($idlist)\":\"mb_id IN ($idlist)\";$backup['tables'][$table]=rows_for(\"SELECT * FROM `$table` WHERE \".$where[$table]);}\n $backupPath=$private.'/member-cleanup-20261023-backup.json';$backupHash=save_private($backupPath,$backup);\n $removed=[];foreach($tables as $key=>$table){if($key==='member_table')continue;query_ok(\"DELETE FROM `$table` WHERE \".$where[$table]);$removed[$key]=count($backup['tables'][$table]);}\n query_ok(\"DELETE FROM `$memberTable` WHERE mb_id IN ($idlist) AND mb_level=2 AND mb_nick REGEXP '^유저[0-9]+$'\");\n if(rows_for(\"SELECT mb_id FROM `$memberTable` WHERE mb_id IN ($idlist)\"))throw new RuntimeException('candidate_remains');\n $approvedAfter=hash('sha256',json_encode(rows_for(\"SELECT * FROM `$memberTable` WHERE mb_level>=3 ORDER BY mb_id\")));\n if(!hash_equals($approvedBefore,$approvedAfter))throw new RuntimeException('approved_member_changed');\n $result=['deleted_members'=>83,'related_removed'=>$removed,'approved_members_unchanged'=>true,'remaining_level2'=>(int)(rows_for(\"SELECT COUNT(*) AS n FROM `$memberTable` WHERE mb_level=2\")[0]['n']),'backup_verified'=>true,'backup_sha256'=>$backupHash];\n save_private($receipt,$result);echo json_encode($result,JSON_UNESCAPED_UNICODE);\n}finally{query_ok('UNLOCK TABLES');}\n"
             try:
              with s.open(target,'wx') as f:f.write(code.encode())
              s.chmod(target,0o644)
              req=urllib.request.Request('https://skhnslu-busan.com/busan-assistant/'+name,headers={'X-Busan-Agent-Token':identity['agent_token']})
              with urllib.request.urlopen(req,timeout=35) as r:result=json.loads(r.read(8192))
              print(json.dumps(result,ensure_ascii=False))
             finally:s.remove(target)
          
          PY
