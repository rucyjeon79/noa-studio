name: NOA Premium download and in-card mastering
on:
  pull_request:
    paths: &paths ['bridge/music-download-core.php','deploy/noa-premium.js','deploy/noa-music-download.php','tests/premium/**','scripts/noa_premium*','scripts/qa/noa-premium.mjs','.github/workflows/noa-premium.yml']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated-noa-ci, MYSQL_DATABASE: noa_subscription_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated-noa-ci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noa_subscription_test;charset=utf8mb4'
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: isolated-noa-ci
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli,pdo_mysql,pdo_sqlite,mbstring,fileinfo'}
      - name: Verify actual point debit, owner credit, replay and rollback
        run: |
          for f in bridge/music-download-core.php deploy/noa-music-download.php deploy/noa-music.php deploy/noa-app/jukebox/download.php deploy/noa-app/jukebox/index.php deploy/noa-creator.php scripts/noa_premium_policy.php; do php -l "$f"; done
          for f in deploy/noa-premium.js deploy/noa-app/jukebox/upload.js deploy/noa-creator.js deploy/noa-ui.js; do node --check "$f"; done
          php tests/subscription/core_test.php
          php tests/subscription/mysql_test.php
          python tests/subscription/concurrent_test.py
          php tests/premium/mysql.php
          python tests/premium/race_test.py
          php tests/member/access_test.php
          node tests/jukebox/transport_test.cjs
          node tests/jukebox/reservations_test.cjs
          python tests/uiux/recovery_contract_test.py
      - name: Verify mobile and desktop real UI with isolated processing states
        run: |
          php tests/premium/fixture.php
          python scripts/qa/noa-qa-font.py
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-premium" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-premium/node_modules/.bin/playwright" install --with-deps webkit
          cp scripts/qa/noa-premium.mjs "$RUNNER_TEMP/noa-premium/check.mjs"
          cp scripts/qa/noa-rhythm.mjs "$RUNNER_TEMP/noa-premium/rhythm.mjs"
          cp scripts/qa/noa-voice.mjs "$RUNNER_TEMP/noa-premium/voice.mjs"
          node "$RUNNER_TEMP/noa-premium/check.mjs"
          node "$RUNNER_TEMP/noa-premium/rhythm.mjs"
          node "$RUNNER_TEMP/noa-premium/voice.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-premium-candidate-${{ github.run_id }}', path: 'premium-proof/', retention-days: 7}
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - id: upload
        run: python scripts/noa_premium_release.py
      - name: Activate only the approved creator point price and audit owner readiness
        run: python scripts/noa_premium_policy.py
      - if: failure() && steps.upload.outcome == 'failure'
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_premium_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-premium-live-${{ github.run_id }}', path: ainoa-proof/, retention-days: 7}
