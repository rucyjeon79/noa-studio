name: Busan reporter source watch
on:
  # Public-source collection only, 20 minutes before each KST 4-hour ChatGPT edition.
  # No Codex, model inference, publishing, or resident host processes here.
  schedule:
    - cron: '40 2,6,10,14,18,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/busan-news-sources.yml', 'scripts/busan_sources/collect.py']
permissions: {contents: write}
concurrency: {group: busan-news-source-watch, cancel-in-progress: false}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install -q beautifulsoup4==4.13.4
      - name: Check public feeds and notify the dedicated newsroom
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/busan_sources/collect.py
