name: Busan reporter source watch
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/busan_sources/**', '.github/workflows/busan-news-sources.yml']
permissions: {contents: write}
concurrency: {group: busan-news-source-watch, cancel-in-progress: false}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install -q beautifulsoup4==4.13.4
      - name: Check public feeds and notify the dedicated newsroom
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/busan_sources/collect.py
