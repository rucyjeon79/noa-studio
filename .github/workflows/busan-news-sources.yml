name: Busan reporter source watch
on:
  schedule:
    # UTC hours for 00:00, 04:00, 08:00, 12:00, 16:00 and 20:00 in Korea.
    - cron: '0 3,7,11,15,19,23 * * *'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: busan-news-source-watch, cancel-in-progress: false}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install -q beautifulsoup4==4.13.4
      - name: Check public feeds and notify the dedicated newsroom
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/busan_sources/collect.py
