name: NOA writing form layout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-writing-forms.yml','scripts/qa/noa-writing-forms.mjs']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check the shipped editor with isolated member data
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-form" --no-save playwright@1.56.1
          cp scripts/qa/noa-writing-forms.mjs "$RUNNER_TEMP/noa-form/check.mjs"
          node "$RUNNER_TEMP/noa-form/check.mjs"
      - run: |
          pip -q install 'paramiko>=3,<5'
          PYTHONPATH=scripts python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES={'noa-gnuboard.css':'deploy/noa-gnuboard.css','noa-ecosystem.css':'deploy/noa-ecosystem.css'}
          release.NEW=set()
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
