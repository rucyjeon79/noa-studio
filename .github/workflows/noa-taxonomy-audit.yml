name: NOA SQL taxonomy current read-only audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-taxonomy-audit.yml', 'scripts/noa_taxonomy_audit.py']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: noa-dothome-production, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check existing classification and home regressions
        run: |
          php tests/taxonomy/core_test.php
          php tests/catalog/home_test.php
          php tests/catalog/world_mv_test.php
          python3 -m pip install --user paramiko==3.5.1
      - name: Inspect actual SQL and public responses without business writes
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
        run: python3 scripts/noa_taxonomy_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-taxonomy-current-audit
          path: quality-taxonomy/current-audit.json
          retention-days: 14
