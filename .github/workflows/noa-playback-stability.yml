name: NOA playback stall recovery
on:
  pull_request:
    paths: ['scripts/noa_playback_stability_release.py','scripts/qa/noa-playback-stability.mjs','deploy/noa-app/playback-recovery.js','tests/jukebox/playback_recovery.test.cjs','.github/workflows/noa-playback-stability.yml']
  push:
    branches: [main]
    paths: ['scripts/noa_playback_stability_release.py','scripts/qa/noa-playback-stability.mjs','deploy/noa-app/playback-recovery.js','tests/jukebox/playback_recovery.test.cjs','.github/workflows/noa-playback-stability.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: |
          php -l deploy/noa-music.php
          node --check deploy/noa-app/p0-player.js
          node --check deploy/noa-app/playback-recovery.js
          node --test scripts/noa_player_regression.test.mjs tests/jukebox/playback_recovery.test.cjs
          npm install --prefix "$RUNNER_TEMP/reload-ui" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/reload-ui/node_modules/.bin/playwright" install --with-deps chromium
          cp scripts/qa/noa-playback-stability.mjs "$RUNNER_TEMP/reload-ui/check.mjs"
          node "$RUNNER_TEMP/reload-ui/check.mjs"

      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'playback-stability-${{ github.run_id }}', path: playback-proof/, retention-days: 7}
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_playback_stability_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'playback-stability-deploy-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 7}
