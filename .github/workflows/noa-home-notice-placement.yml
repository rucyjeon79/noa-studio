name: NOA home section placement # Hero followed by daily fortune
on:
  pull_request:
    paths: ['.github/workflows/noa-home-notice-placement.yml', 'scripts/qa/noa-home-banner-order.mjs']
  push:
    branches: [main]
    paths: ['.github/workflows/noa-home-notice-placement.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check the initial and interactive homepage
        run: |
          php -l deploy/noa-app/home.php
          node --check deploy/noa-ui.js
          python tests/sitemap/home_patch_test.py
          php -r 'define("_GNUBOARD_", true); function nmb_rules(){return true;} include "deploy/noa-app/home.php";' > "$RUNNER_TEMP/home.html"
          npm install --prefix "$RUNNER_TEMP/banners" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-home-banner-order.mjs "$RUNNER_TEMP/banners/check.mjs"
          NOA_BANNER_CANDIDATE="$RUNNER_TEMP/home.html" node "$RUNNER_TEMP/banners/check.mjs"
  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          php -l bridge/notices.php
          php -l deploy/noa-app/home.php
          pip -q install 'paramiko>=3,<5'
          PYTHONPATH=scripts python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES={'noa-app/home.php':'deploy/noa-app/home.php','noa-ui.js':'deploy/noa-ui.js'}
          release.NEW=set()
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
      - name: Verify published notice and ranking sections
        id: sections
        run: |
          curl -fsS "https://noastudio.ai.kr/?notice-check=$GITHUB_SHA" -o /tmp/noa-home-check.html
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          from urllib.parse import urlsplit, parse_qs
          import re
          html = Path('/tmp/noa-home-check.html').read_text()
          assert 'id="noa-notices-heading"' in html and 'id="noa-notice-2"' not in html
          section = html.split('data-home-section="recommendations"', 1)[1].split('</section>', 1)[0]
          assert 'id="noa-ranking-status"' in section and html.count('id="noa-ranking-status"') == 1
          sources = [urlsplit(unescape(src)) for src in re.findall(r'<script\b[^>]*\bsrc="([^"]+)"', html)]
          # The home transport preserves this module inside its versioned bundle.
          assert sum(src.path == '/noa-amt-fan.js' or (src.path == '/noa-home-assets.php' and 'noa-amt-fan.js' in parse_qs(src.query).get('files', [''])[0].split(',')) for src in sources) == 1
          PY
      - name: Verify daily fortune and banner positions on the operating homepage
        id: banners
        run: |
          npm install --prefix "$RUNNER_TEMP/banners" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-home-banner-order.mjs "$RUNNER_TEMP/banners/check.mjs"
          node "$RUNNER_TEMP/banners/check.mjs"
      - name: Restore the two homepage files if verification fails
        if: failure() && (steps.sections.outcome == 'failure' || steps.banners.outcome == 'failure')
        run: |
          PYTHONPATH=scripts python - <<'PYTHON'
          import sys
          import noa_ainoa_deploy as release
          release.FILES={'noa-app/home.php':'deploy/noa-app/home.php','noa-ui.js':'deploy/noa-ui.js'}
          sys.argv.append('rollback')
          release.main()
          PYTHON
