name: NOA Android reported media failure diagnosis
on:
  push:
    branches: [work/android-live-failures-20261030]
    paths: ['scripts/qa/noa-android-live-diagnosis.py','.github/workflows/noa-android-live-diagnosis.yml']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m pip install --user 'paramiko==3.5.1'
      - name: Check the reported KPOP songs with an isolated member
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: python3 scripts/qa/noa-android-live-diagnosis.py
