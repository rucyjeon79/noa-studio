name: NOA upload completion wake verification
on:
  workflow_dispatch:
  pull_request:
    paths: ['deploy/noa-app/jukebox/wake-core.php', 'deploy/noa-app/jukebox/queue-core.php', 'deploy/noa-app/jukebox/upload-core.php', 'scripts/noa_upload_wake_acceptance.py', 'tests/jukebox/wake_test.php', '.github/workflows/noa-upload-wake.yml', 'scripts/noa_upload_wake_release.py']
  push:
    branches: [main]
    paths: ['deploy/noa-app/jukebox/wake-core.php', 'deploy/noa-app/jukebox/queue-core.php', 'deploy/noa-app/jukebox/upload-core.php', 'scripts/noa_upload_wake_acceptance.py', 'tests/jukebox/wake_test.php', '.github/workflows/noa-upload-wake.yml', 'scripts/noa_upload_wake_release.py']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: jukebox-test-only, MYSQL_DATABASE: jukebox_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pjukebox-test-only" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'curl,pdo_mysql,mbstring'}
      - run: |
          php -l deploy/noa-app/jukebox/wake-core.php
          php -l deploy/noa-app/jukebox/queue-core.php
          php -l deploy/noa-app/jukebox/upload-core.php
          php tests/jukebox/wake_test.php
          python -m py_compile scripts/noa_upload_wake_acceptance.py
          python -m pip install 'Pillow>=11,<12'
          if ! command -v ffmpeg || ! command -v ffprobe; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python tests/jukebox/make_fixture.py
          mkdir -p deploy/noa-bridge
          cp bridge/package-record.php bridge/channel-ownership.php deploy/noa-bridge/
          php tests/jukebox/upload_mysql_test.php

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[creative-drafts]')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Install the upload hook and inspect private wake configuration
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          NOA_JUKEBOX_WAKE_TOKEN: ${{ secrets.NOA_JUKEBOX_WAKE_TOKEN }}
        run: python scripts/noa_upload_wake_release.py

      - name: Verify a private synthetic upload completes without any browser finish request
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_upload_wake_acceptance.py
