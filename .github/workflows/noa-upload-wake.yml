name: NOA upload completion wake verification
on:
  pull_request:
    paths: ['deploy/noa-app/jukebox/wake-core.php', 'deploy/noa-app/jukebox/queue-core.php', 'tests/jukebox/wake_test.php', '.github/workflows/noa-upload-wake.yml']
  push:
    branches: [main]
    paths: ['deploy/noa-app/jukebox/wake-core.php', 'deploy/noa-app/jukebox/queue-core.php', 'tests/jukebox/wake_test.php', '.github/workflows/noa-upload-wake.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'curl,pdo_mysql'}
      - run: |
          php -l deploy/noa-app/jukebox/wake-core.php
          php -l deploy/noa-app/jukebox/queue-core.php
          php tests/jukebox/wake_test.php
