name: NOA P0 Read-only Inventory and Additive Journal
on:
  push:
    branches: [main]
    paths: ['deploy/noa-sitemap.php','tests/sitemap/registry_test.php','deploy/noa-work-status.php','deploy/noa-app/engine/work-state.php','tests/engine/work_state_test.php','bridge/p0-audit.php','bridge/p0-inventory.php','scripts/noa_p0_audit_deploy.py','scripts/noa_p0_inventory.py','scripts/noa_p0_progress.py','tests/engine/p0_inventory_progress_test.py','docs/operations/requests/NOA_20261026_P0_ADDITIONS.md','.github/workflows/noa-p0-audit.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: noa-p0-audit, cancel-in-progress: false}
jobs:
  audit:
    # Installation-only changes run the registry gate in the focused release.
    if: ${{ !contains(github.event.head_commit.message, '[install-release]') }}
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Validate fixed read-only inventory
        run: |
          php tests/sitemap/registry_test.php
          php -l deploy/noa-work-status.php
          php -l deploy/noa-app/engine/work-state.php
          php tests/engine/work_state_test.php
          php -l bridge/p0-audit.php
          php -l bridge/p0-inventory.php
          python -m py_compile scripts/noa_p0_audit_deploy.py scripts/noa_p0_inventory.py scripts/noa_p0_progress.py
          python tests/engine/p0_inventory_progress_test.py
          python -m pip install 'paramiko>=3,<5'
      - name: Install only authenticated inventory sources
        id: deploy
        env: &production
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_p0_audit_deploy.py
      - name: Register exact added instructions and inspect operating data
        env: *production
        run: |
          python scripts/noa_p0_progress.py
          python scripts/noa_p0_inventory.py
      - name: Restore owned sources if activation failed
        if: failure() && steps.deploy.outcome == 'failure'
        env: *production
        run: |
          if [ -f "$RUNNER_TEMP/noa-p0-audit-before.json" ]; then python scripts/noa_p0_audit_deploy.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-p0-audit-${{ github.run_id }}', path: p0-audit-proof/, retention-days: 14}
