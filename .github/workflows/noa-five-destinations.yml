name: NOA five destination navigation
on:
  push:
    branches: [main]
    paths: ['scripts/noa_five_destinations_release.py', 'tests/starlight/sections.test.mjs', '.github/workflows/noa-five-destinations.yml']
permissions: {contents: read}
concurrency: {group: noa-production-sftp, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Verify navigation, theme and PHP view
        run: |
          node --check deploy/noa-ui.js
          node --check deploy/noa-ecosystem.js
          php -l deploy/noa-app/ecosystem-view.php
          node --test tests/starlight/*.test.mjs
          python -m py_compile scripts/noa_five_destinations_release.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy four navigation files and verify public hashes
        run: python scripts/noa_five_destinations_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-navigation-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 7}
