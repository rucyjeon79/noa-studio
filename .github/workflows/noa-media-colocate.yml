name: NOA colocated audio and card images
on:
  push:
    branches: [main]
    paths: ['scripts/noa_media_colocate.*','.github/workflows/noa-media-colocate.yml']
permissions: {contents: read}
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    concurrency: {group: noa-media-path-normalization, cancel-in-progress: false}
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: |
          php -l scripts/noa_media_colocate.php
          python -m py_compile scripts/noa_media_colocate.py
          python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_media_colocate.py
