name: NOA engine and catalog reads
on:
  pull_request:
    paths: &paths ['scripts/noa_engine_catalog_release.py','.github/workflows/noa-engine-catalog.yml']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: pdo_sqlite}
      - run: |
          php -l bridge/package-record.php
          php -l bridge/inline-edit.php
          php tests/workspace/duplicates_test.php
          php tests/workspace/classification_test.php
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_engine_catalog_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'page-speed-deploy-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 7}
