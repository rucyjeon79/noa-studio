name: N80 Shorts isolated safety gates

on:
  push:
    branches: [main]
    paths:
      - 'bridge/session-shorts*.php'
      - 'lab/daily_shorts.py'
      - 'tests/lab/daily_shorts_test.py'
      - 'tests/session-agent/schedule.php'
      - 'tests/session-agent/preparation.php'
      - 'tests/session-agent/preparation_test.py'
      - 'tests/n80/scheduled_wake_contract_test.php'
      - 'tests/n80/scheduled_wake_ticket_test.php'
      - 'tests/n80/signed_wake_hmac_test.php'
      - 'tests/n80/test_signed_wake_http_boundary.py'
      - 'deploy/noa-bridge/n80-scheduled-wake.php'
      - 'scripts/n80_signed_wake_signal.py'
      - 'tests/n80/test_n80_signed_wake_signal.py'
      - 'tests/n80/test_host_activation_fence.py'
      - '.github/workflows/noa-ai-worker.yml'
      - 'deploy/noa-app/engine/scheduled-wake.php'
      - 'deploy/noa-app/engine/wake-preflight.php'
      - 'deploy/noa-app/engine/hub.php'
      - 'deploy/noa-app/engine/hub-retirement-status.php'
      - 'deploy/noa-app/engine/system-status.php'
      - 'tests/n80/wake_preflight_test.php'
      - 'deploy/noa-hub.php'
      - 'tests/n80/test_wake_admin_dashboard.py'
      - 'deploy/noa-app/engine/host-load-policy.php'
      - '.github/workflows/n80-shorts-safety.yml'
  pull_request:
    paths:
      - 'bridge/session-shorts*.php'
      - 'lab/daily_shorts.py'
      - 'tests/lab/daily_shorts_test.py'
      - 'tests/session-agent/schedule.php'
      - 'tests/session-agent/preparation.php'
      - 'tests/session-agent/preparation_test.py'
      - 'tests/n80/scheduled_wake_contract_test.php'
      - 'tests/n80/scheduled_wake_ticket_test.php'
      - 'tests/n80/signed_wake_hmac_test.php'
      - 'tests/n80/test_signed_wake_http_boundary.py'
      - 'deploy/noa-bridge/n80-scheduled-wake.php'
      - 'scripts/n80_signed_wake_signal.py'
      - 'tests/n80/test_n80_signed_wake_signal.py'
      - 'tests/n80/test_host_activation_fence.py'
      - '.github/workflows/noa-ai-worker.yml'
      - 'deploy/noa-app/engine/scheduled-wake.php'
      - 'deploy/noa-app/engine/wake-preflight.php'
      - 'deploy/noa-app/engine/hub.php'
      - 'deploy/noa-app/engine/hub-retirement-status.php'
      - 'deploy/noa-app/engine/system-status.php'
      - 'tests/n80/wake_preflight_test.php'
      - 'deploy/noa-hub.php'
      - 'tests/n80/test_wake_admin_dashboard.py'
      - 'deploy/noa-app/engine/host-load-policy.php'
      - '.github/workflows/n80-shorts-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,pdo_sqlite
      - name: Validate Shorts PHP syntax
        run: |
          php -l bridge/session-shorts.php
          php -l bridge/session-shorts-prepare.php
          php -l tests/session-agent/schedule.php
          php -l tests/session-agent/preparation.php
          php -l deploy/noa-app/engine/scheduled-wake.php
          php -l deploy/noa-bridge/n80-scheduled-wake.php
          python3 -m py_compile tests/n80/test_signed_wake_http_boundary.py
          php -l deploy/noa-app/engine/wake-preflight.php
          php -l deploy/noa-app/engine/hub-retirement-status.php
          php -l deploy/noa-app/engine/system-status.php
          php -l deploy/noa-hub.php
          php -l tests/n80/wake_preflight_test.php
          php -l deploy/noa-app/engine/host-load-policy.php
          php -l tests/n80/scheduled_wake_contract_test.php
          php -l tests/n80/scheduled_wake_ticket_test.php
          php -l tests/n80/signed_wake_hmac_test.php
          python3 -m py_compile scripts/n80_signed_wake_signal.py tests/n80/test_n80_signed_wake_signal.py
      - name: Verify exact original, posted video, measured clips and schedule
        run: |
          python -m unittest discover -s tests/lab -p 'daily_shorts_test.py' -v
          python -m unittest discover -s tests/session-agent -p 'preparation_test.py' -v
          php tests/session-agent/schedule.php
          php tests/session-agent/preparation.php
          php tests/n80/scheduled_wake_contract_test.php
          php tests/n80/scheduled_wake_ticket_test.php
          php tests/n80/signed_wake_hmac_test.php
          php tests/n80/wake_preflight_test.php
          python3 -m unittest discover -s tests/n80 -p 'test_wake_admin_dashboard.py' -v
          python3 -m unittest discover -s tests/n80 -p 'test_n80_signed_wake_signal.py' -v
          python3 -m unittest discover -s tests/n80 -p 'test_signed_wake_http_boundary.py' -v
          python3 -m unittest discover -s tests/n80 -p 'test_host_activation_fence.py' -v
