name: NOA unified Youngcart catalog and receipts
on:
  push:
    branches: [main]
    paths: &paths ['bridge/youngcart-core.php','deploy/noa-youngcart*','scripts/noa_youngcart_unify.py','tests/youngcart_mysql.php','.github/workflows/noa-youngcart-unify.yml']
  pull_request:
    paths: *paths
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated-noa-ci, MYSQL_DATABASE: noa_subscription_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated-noa-ci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noa_subscription_test;charset=utf8mb4'
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: isolated-noa-ci
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli,pdo_mysql,mbstring,curl'}
      - run: |
          php -l bridge/youngcart-core.php
          php -l deploy/noa-youngcart.php
          php -l deploy/noa-youngcart.extend.php
          php tests/subscription/mysql_test.php
          php tests/youngcart_mysql.php
          node --check deploy/noa-youngcart.js
          node --check deploy/noa-youngcart-relay.js
          node --check deploy/noa-ecosystem.js
          python -m py_compile scripts/noa_youngcart_unify.py
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_youngcart_unify.py
      - name: Verify public catalog and native cart without buying
        run: |
          python - <<'PY'
          import json,urllib.request
          root='https://noastudio.ai.kr'
          with urllib.request.urlopen(root+'/noa-youngcart.php?status=1',timeout=30) as r:d=json.load(r)
          assert d['ok'] and d['member'] is False and d['csrf'] is None
          assert sum(x['kind']=='points' for x in d['ids'])==6
          assert sum(x['kind']=='vip' for x in d['ids'])==4
          with urllib.request.urlopen(root+'/shop/cart.php?device=pc',timeout=30) as r:html=r.read().decode()
          assert 'Warning:' not in html and '장바구니' in html
          print('NATIVE_STORE_TEN_DIGITAL_PRODUCTS_AND_GUEST_CART_VERIFIED')
          PY
