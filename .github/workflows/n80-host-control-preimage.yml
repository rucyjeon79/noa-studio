name: N80 protected scheduler control preimage (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n80-host-control-preimage.yml'
      - 'scripts/qa/n80-host-control-preimage.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n80-host-control-preimage
  cancel-in-progress: true
jobs:
  preimage:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare encrypted SFTP backup
        run: python -m pip install 'paramiko>=3,<5' 'cryptography>=42,<47'
      - name: Capture and encrypt control.json without changing host
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: python scripts/qa/n80-host-control-preimage.py
      - name: Preserve encrypted preimage for authorized Google Drive upload
        uses: actions/upload-artifact@v4
        with:
          name: n80-control-preimage-${{ github.run_id }}
          path: n80-stop-preimage/
          retention-days: 1
