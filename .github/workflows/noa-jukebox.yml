name: NOA JUKEBOX public cards and authorized audio
# View-only changes belong to the single integrated release; scheduled workers remain unchanged.
# Circuit-break transient upload errors, reconcile lost acknowledgements and observe worker health.
on:
  push:
    branches: [main, chatgpt/jukebox-20261021]
    paths: ['.github/workflows/noa-jukebox.yml', 'deploy/noa-app/jukebox/**', 'bridge/catalog.php', 'scripts/noa_jukebox*.py', 'scripts/noa_jukebox_baseline.json', 'tests/jukebox/**']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      verify_recovery:
        description: 'Run bounded private-QA production recovery tests'
        type: boolean
        required: false
        default: false
permissions: {contents: read}
jobs:
  storage_rescue:
    if: github.event_name != 'schedule' && !contains(github.event.head_commit.message, '[p0-media]') && !contains(github.event.head_commit.message, '[deploy-control]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m pip install --user paramiko==3.5.1
      - name: Reclaim checksum-identified corrupt synthetic QA inputs only
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
        run: python3 scripts/noa_jukebox_storage_rescue.py
  validate:
    if: github.event_name != 'schedule' && !contains(github.event.head_commit.message, '[p0-media]') && !contains(github.event.head_commit.message, '[deploy-control]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: jukebox-test-only, MYSQL_DATABASE: jukebox_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pjukebox-test-only" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate fixed PHP and media pipeline
        run: |
          for f in deploy/noa-app/jukebox/*.php bridge/catalog.php deploy/noa-music.php; do php -l "$f"; done
          php tests/jukebox/range_test.php
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user Pillow==11.3.0
          python3 -m unittest discover -s tests/jukebox -p 'test_*.py'
          python3 tests/jukebox/make_fixture.py
          php tests/jukebox/upload_mysql_test.php
          node --check deploy/noa-app/jukebox/upload.js
          node tests/jukebox/reservations_test.cjs
          node tests/jukebox/transport_test.cjs
          node --check deploy/noa-app/jukebox/upload-transport.js
          node --check tests/jukebox/live_recovery_test.cjs
  interface:
    needs: [validate, storage_rescue]
    if: github.event_name != 'schedule' && !contains(github.event.head_commit.message, '[p0-media]') && !contains(github.event.head_commit.message, '[deploy-control]') && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency: {group: noa-jukebox-interface-deployment, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install deployment dependencies
        run: python3 -m pip install --user paramiko==3.5.1 Pillow==11.3.0
      - name: Publish interface without interrupting audio processing
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_JUKEBOX_INTERFACE_ONLY: '1'
        run: python3 scripts/noa_jukebox_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-jukebox-interface-proof
          path: jukebox-proof/interface.json
          retention-days: 14
  watchdog:
    needs: [validate, interface]
    if: always() && ((needs.validate.result == 'success' && needs.interface.result == 'success') || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency: {group: noa-jukebox-watchdog, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install watchdog dependencies
        run: python3 -m pip install --user paramiko==3.5.1 Pillow==11.3.0
      - name: Observe worker execution and reconcile bounded SQL/file batches
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_JUKEBOX_WATCHDOG: '1'
          NOA_JUKEBOX_VERIFY_RECOVERY: ${{ inputs.verify_recovery || (github.ref == 'refs/heads/chatgpt/jukebox-20261021') }}
        run: python3 scripts/noa_jukebox_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-jukebox-watchdog-proof
          path: |
            jukebox-proof/watchdog.json
            jukebox-proof/recovery-tests.json
          retention-days: 14
  release:
    needs: [validate, interface]
    if: always() && ((needs.validate.result == 'success' && needs.interface.result == 'success') || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    concurrency: {group: noa-jukebox-upload-processing, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install worker dependencies
        run: python3 -m pip install --user paramiko==3.5.1 Pillow==11.3.0
      - name: Acquire cards from live DB and store verified files on Dothome
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
        run: python3 scripts/noa_jukebox_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-jukebox-summary
          path: jukebox-proof/summary.json
          retention-days: 14
