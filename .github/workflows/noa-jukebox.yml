name: NOA JUKEBOX public cards and authorized audio
# Runtime workers consume existing signed APIs. They never deploy interface files.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-jukebox.yml', 'scripts/noa_jukebox_release.py', 'scripts/noa_jukebox_upload_worker.py', 'scripts/noa_jukebox_publish.py', 'scripts/noa_jukebox_worker.py', 'scripts/noa_jukebox_recovery.py', 'tests/jukebox/**']
  pull_request:
    paths: ['.github/workflows/noa-jukebox.yml', 'scripts/noa_jukebox*.py', 'tests/jukebox/**']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate existing optimization, recovery and immutable publication
        run: |
          python3 -m pip install --user paramiko==3.5.1 Pillow==11.3.0
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python3 -m py_compile scripts/noa_jukebox_release.py scripts/noa_jukebox_upload_worker.py scripts/noa_jukebox_publish.py
          python3 -m unittest discover -s tests/jukebox -p 'test_*.py'
  watchdog:
    needs: validate
    if: always() && github.event_name != 'pull_request' && (github.event_name == 'schedule' || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency: {group: noa-jukebox-watchdog, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m pip install --user paramiko==3.5.1 Pillow==11.3.0
      - name: Observe and reconcile without terminating active workers
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          NOA_JUKEBOX_RUNTIME_ONLY: '1'
          NOA_JUKEBOX_WATCHDOG: '1'
        run: python3 scripts/noa_jukebox_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-jukebox-watchdog-${{ github.run_id }}
          path: jukebox-proof/watchdog.json
          retention-days: 14
  release:
    needs: validate
    if: always() && github.event_name != 'pull_request' && (github.event_name == 'schedule' || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    concurrency: {group: noa-jukebox-upload-processing, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m pip install --user paramiko==3.5.1 Pillow==11.3.0
      - name: Process FIFO uploads and publish verified completed media only
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          NOA_JUKEBOX_RUNTIME_ONLY: '1'
          NOA_JUKEBOX_KEEPALIVE_SECONDS: '120'
        run: python3 scripts/noa_jukebox_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-jukebox-summary-${{ github.run_id }}
          path: jukebox-proof/summary.json
          retention-days: 14
