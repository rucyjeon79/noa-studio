name: NOA creator enrollment and channel workspace
on:
  pull_request:
    paths: ['bridge/creator-enrollment*','deploy/noa-creator-apply*','scripts/noa_creator_*','.github/workflows/noa-creator-enrollment.yml']
permissions: {contents: read}
jobs:
  inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_creator_inventory.py
      - uses: actions/upload-artifact@v4
        with: {name: 'noa-creator-inventory-${{ github.run_id }}', path: 'creator-proof/inventory/', retention-days: 3}
