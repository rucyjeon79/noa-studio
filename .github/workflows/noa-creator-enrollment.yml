name: NOA creator enrollment and channel workspace
on:
  push:
    branches: [main]
    paths: ['bridge/creator-enrollment*','bridge/creator-ai*','deploy/noa-creator-apply*','deploy/noa-member-badges*','deploy/noa-channel-workspace.php','deploy/noa-channel-menu.php','scripts/noa_creator_*','.github/workflows/noa-creator-enrollment.yml']
  pull_request:
    paths: ['bridge/creator-enrollment*','deploy/noa-creator-apply*','scripts/noa_creator_*','.github/workflows/noa-creator-enrollment.yml']
permissions: {contents: read}
jobs:
  inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_creator_inventory.py
      - uses: actions/upload-artifact@v4
        with: {name: 'noa-creator-inventory-${{ github.run_id }}', path: 'creator-proof/inventory/', retention-days: 3}
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated-noa-ci, MYSQL_DATABASE: noa_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated-noa-ci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noa_test;charset=utf8mb4'
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: isolated-noa-ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_mysql,pdo_sqlite,mbstring,fileinfo,gd,openssl'}
      - name: Verify certification, approval, ownership and level boundaries
        run: |
          for f in bridge/creator*.php bridge/member*.php deploy/noa-creator*.php deploy/noa-member*.php deploy/noa-channel*.php deploy/noa-my.php deploy/noa-workspace.php deploy/noa-library.php; do php -l "$f"; done
          node --check deploy/noa-creator-apply.js
          node --check deploy/noa-creator-ai.js
          php tests/member/access_test.php
          php tests/member/mysql_test.php
          php tests/creator/mysql_test.php
          python tests/creator/fixture.py
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/creator" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-creator-enrollment.mjs "$RUNNER_TEMP/creator/check.mjs"
          php -S 127.0.0.1:18080 -t /tmp/noa-creator-site > "$RUNNER_TEMP/creator-php.log" 2>&1 &
      - name: Verify mobile and desktop creator forms, MY badges and approval
        run: node "$RUNNER_TEMP/creator/check.mjs"
      - name: Preserve isolated server diagnostics
        if: always()
        run: mkdir -p creator-proof/candidate; cp "$RUNNER_TEMP/creator-php.log" creator-proof/candidate/php.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-creator-candidate-${{ github.run_id }}', path: 'creator-proof/candidate/', retention-days: 7}

  deploy:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[channel-explorer-release]')
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Activate reviewed creator sources
        id: upload
        run: python scripts/noa_creator_release.py
      - name: Install private storage, application tables and the existing channel board
        run: python scripts/noa_creator_install.py
      - name: Verify public application, certification state and source assets
        run: python scripts/noa_creator_postflight.py
      - name: Restore owned sources if activation or acceptance fails
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_creator_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'noa-creator-live-${{ github.run_id }}'
          path: |
            creator-proof/
            ainoa-proof/deployment.json
          retention-days: 7
