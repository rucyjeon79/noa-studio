name: Busan rights note daily
on:
  # Scheduling moved to private worker's OIDC-authenticated rights-note workflow.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/busan-rights-daily.yml','scripts/busan_news/rights_daily.py','newsroom/rights-queue/**']
permissions: {contents: read}
concurrency: {group: busan-news-publisher, cancel-in-progress: false}
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          php -l scripts/busan_news/publish.php
          python -m pip install -q paramiko==3.5.1
          python scripts/busan_news/rights_daily.py --check
  publish:
    if: false # Retired SFTP publisher; preserve validation only.
    needs: validate
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install -q paramiko==3.5.1
      - name: Publish only today's reviewed rights note
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: python scripts/busan_news/rights_daily.py
