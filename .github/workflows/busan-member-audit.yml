name: Busan pending member read-only audit
on:
  push:
    paths: ['.github/workflows/busan-member-audit.yml']
permissions:
  contents: read
concurrency:
  group: busan-readonly-sftp
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: busan-readonly
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install paramiko==3.5.1
      - env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          cd scripts
          python3 - <<'PY'
          import os,socket,hmac,json,urllib.request,secrets,re
          import paramiko
          from busan_readonly_check import configuration,fingerprint,PORT,ROOT
          host,user,password,pin=configuration(os.environ)
          with socket.create_connection((host,PORT),timeout=15) as sock:
           with paramiko.Transport(sock) as t:
            t.start_client(timeout=20)
            assert hmac.compare_digest(fingerprint(t.get_remote_server_key()),pin)
            t.auth_password(user,password,fallback=False)
            with paramiko.SFTPClient.from_transport(t) as s:
             private='/hosting/rucyjeon79/busan-assistant-private'
             for relative in ['bbs/register_form_update.php','bbs/register_form.php','extend/busan-on.extend.php']:
              with s.open(ROOT+'/'+relative,'rb') as f:source=f.read(400000).decode('utf-8')
              print('SOURCE '+relative)
              if relative.endswith('register_form_update.php'):print(source[:23000])
              elif relative.endswith('register_form.php'):print(source[:8000])
              else:print(source[:12000])
             with s.open(private+'/activity-account.json','rb') as f:identity=json.loads(f.read(8192))
             name='member-audit-'+secrets.token_hex(12)+'.php';target=ROOT+'/busan-assistant/'+name
             code="<?php\nheader('Content-Type: application/json');header('Cache-Control: no-store');\n$p='/hosting/rucyjeon79/busan-assistant-private';$a=json_decode(file_get_contents($p.'/activity-account.json'),true);\nif(time()-filemtime(__FILE__)>600||!hash_equals($a['agent_token'],$_SERVER['HTTP_X_BUSAN_AGENT_TOKEN']??'')){http_response_code(403);exit;}\n$removed=0;foreach(['member-cleanup-audit-20261023.json','member-cleanup-20261023-backup.json'] as $name){$f=$p.'/'.$name;if(is_file($f)){if(!unlink($f))throw new RuntimeException('backup_removal_failed');$removed++;}if(file_exists($f))throw new RuntimeException('backup_remains');}\necho json_encode(['personal_backup_files_removed'=>$removed,'personal_backup_files_remaining'=>0]);\n"
             try:
              with s.open(target,'wx') as f:f.write(code.encode())
              s.chmod(target,0o644)
              req=urllib.request.Request('https://skhnslu-busan.com/busan-assistant/'+name,headers={'X-Busan-Agent-Token':identity['agent_token']})
              with urllib.request.urlopen(req,timeout=35) as r:result=json.loads(r.read(8192))
              print(json.dumps(result,ensure_ascii=False))
             finally:s.remove(target)
          
          PY
