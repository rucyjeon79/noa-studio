name: Busan banner template inspection
on:
  push:
    paths: ['.github/workflows/busan-member-audit.yml']
permissions:
  contents: read
concurrency:
  group: busan-openchat-edit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: busan-readonly
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: python3 -m pip install paramiko==3.5.1
      - env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          cd scripts
          python3 - <<'PY'
          import os,socket,hmac,json,urllib.request,secrets,re,stat,time,subprocess,hashlib
          import paramiko
          from busan_readonly_check import configuration,fingerprint,PORT,ROOT
          host,user,password,pin=configuration(os.environ)
          with socket.create_connection((host,PORT),timeout=15) as sock:
           with paramiko.Transport(sock) as t:
            t.start_client(timeout=20)
            assert hmac.compare_digest(fingerprint(t.get_remote_server_key()),pin)
            t.auth_password(user,password,fallback=False)
            with paramiko.SFTPClient.from_transport(t) as s:
             private='/hosting/rucyjeon79/busan-assistant-private'
             paths=['/bbs/board_head.php','/theme/UXC_Flarumix/ui_module/ui_mainSlider/ui_mainSlider.php']
             for path in paths:
              try:
               with s.open(ROOT+path,'rb') as f:code=f.read(180000).decode('utf-8','replace')
               print(json.dumps({'path':path,'sha256':hashlib.sha256(code.encode()).hexdigest(),'source':code},ensure_ascii=False))
              except OSError:print(json.dumps({'missing':path}))
             with s.open(ROOT+'/theme/UXC_Flarumix/head.php','rb') as f:lines=f.read(180000).decode('utf-8','replace').splitlines()
             print(json.dumps({'head_end':lines[280:]},ensure_ascii=False))
          PY
