name: Busan PWA and notification hooks inspection
on:
  push:
    paths: ['.github/workflows/busan-member-audit.yml']
permissions:
  contents: read
concurrency:
  group: busan-openchat-edit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: busan-readonly
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: python3 -m pip install paramiko==3.5.1
      - env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          cd scripts
          python3 - <<'PY'
          import os,socket,hmac,json,urllib.request,secrets,re,stat,time,subprocess,hashlib
          import paramiko
          from busan_readonly_check import configuration,fingerprint,PORT,ROOT
          host,user,password,pin=configuration(os.environ)
          with socket.create_connection((host,PORT),timeout=15) as sock:
           with paramiko.Transport(sock) as t:
            t.start_client(timeout=20)
            assert hmac.compare_digest(fingerprint(t.get_remote_server_key()),pin)
            t.auth_password(user,password,fallback=False)
            with paramiko.SFTPClient.from_transport(t) as s:
             private='/hosting/rucyjeon79/busan-assistant-private'
             for directory in [ROOT,ROOT+'/Custom',ROOT+'/theme/UXC_Flarumix']:
              for entry in s.listdir_attr(directory):
               if stat.S_ISREG(entry.st_mode) and re.search('manifest|service|sw[.]|pwa|head',entry.filename,re.I) and entry.st_size<150000:
                with s.open(directory+'/'+entry.filename,'rb') as f:code=f.read(150000).decode('utf-8','replace')
                print(json.dumps({'path':directory+'/'+entry.filename,'source':code},ensure_ascii=False))
             for path in [ROOT+'/bbs/comment_update.php',ROOT+'/bbs/write_update.php']:
              try:
               with s.open(path,'rb') as f:code=f.read(150000).decode('utf-8','replace')
               print(json.dumps({'path':path,'hooks':[line for line in code.splitlines() if 'run_event(' in line]},ensure_ascii=False))
              except OSError:pass
          PY
