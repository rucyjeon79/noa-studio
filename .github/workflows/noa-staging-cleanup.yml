name: NOA Verified Stale Staging Cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-staging-cleanup.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: noa-backup-migration-control, cancel-in-progress: false}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
      NOA_BACKUP_MIGRATION_MODE: cleanup
      NOA_BACKUP_RECEIPTS_PATH: scripts/noa_staging_cleanup_receipts.json
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Validate bounded temporary control
        run: |
          python -m py_compile scripts/noa_backup_migration_control.py
          php -l scripts/noa_backup_migration_control.php
      - name: Delete only Drive-readback and restore-verified backup copies
        run: python scripts/noa_backup_migration_control.py
      - uses: actions/upload-artifact@v4
        with:
          name: noa-staging-cleanup-proof
          path: backup-migration-proof/
          retention-days: 3
