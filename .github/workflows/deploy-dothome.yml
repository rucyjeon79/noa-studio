name: Deploy NOA PHP files to Dothome

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'deploy/noa2.php'
      - 'deploy/noa-library.php'
      - 'bridge/index.php'
      - 'bridge/library.php'
      - '.github/workflows/deploy-dothome.yml'

permissions:
  contents: read

concurrency:
  group: noa-production-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          set -eu
          php -l deploy/noa2.php
          php -l deploy/noa-library.php
          php -l bridge/index.php
          php -l bridge/library.php
      - name: Confirm required FTP secrets
        env:
          FTP_HOST: ${{ secrets.NOA_FTP_HOST }}
          FTP_USER: ${{ secrets.NOA_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
      - name: Upload only NOA-owned PHP files (never overwrite existing)
        env:
          FTP_HOST: ${{ secrets.NOA_FTP_HOST }}
          FTP_USER: ${{ secrets.NOA_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          FTP_ROOT: ${{ vars.NOA_FTP_ROOT }}
        run: |
          python3 scripts/deploy_noa_ftp.py
