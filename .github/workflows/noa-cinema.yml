name: NOA screening room
on:
  pull_request:
    paths: ['scripts/noa_cinema_release.py','tests/cinema/**','deploy/noa-cinema.*','.github/workflows/noa-cinema.yml']
  push:
    branches: [main]
    paths: ['scripts/noa_cinema_release.py','tests/cinema/**','deploy/noa-cinema.*','.github/workflows/noa-cinema.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify posters, inline selection, player state and episode navigation
        run: |
          node --check deploy/noa-cinema.js
          node --check deploy/noa-youtube.js
          node --check deploy/noa-browse.js
          php -l deploy/noa-cinema.extend.php
          php -l deploy/noa-music-vinyl.extend.php
          php -l bridge/music-readmodel.php
          php -l bridge/youtube-catalog.php
          php tests/youtube/coming_catalog_test.php
          node --test scripts/qa/noa-browse.test.mjs scripts/qa/noa-four-level.test.mjs
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/music-vinyl" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/music-vinyl/node_modules" node tests/cinema/skins.cjs
          cp tests/cinema/check.mjs "$RUNNER_TEMP/music-vinyl/check.mjs"
          node "$RUNNER_TEMP/music-vinyl/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'cinema-proof', path: 'cinema-proof/', retention-days: 7}
  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Publish and verify public asset hashes
        env:
          NOA_VIDEO_ORIGINAL: ${{ contains(github.event.head_commit.message, '[video-original]') }}
          NOA_SCREEN_SKIN: ${{ contains(github.event.head_commit.message, '[screen-skin]') }}
        run: python scripts/noa_cinema_release.py
