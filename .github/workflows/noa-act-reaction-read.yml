name: ACT music reaction read check
on:
  push:
    branches: [main]
    paths: ['scripts/act_reaction_read.py','scripts/qa/act-reaction-read.php','.github/workflows/noa-act-reaction-read.yml']
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'paramiko>=3,<5'
      - run: php -l scripts/qa/act-reaction-read.php && python scripts/act_reaction_read.py
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
