env:
  NOA_DRIVE_RCLONE_CONFIG_B64: ${{ secrets.NOA_DRIVE_RCLONE_CONFIG_B64 }}
name: NOA Upload Status Recovery Production
on:
  push:
    branches: [main]
    paths: ['deploy/noa-music.php','deploy/noa-app/p0-media.css','deploy/noa-app/jukebox/**','scripts/noa_upload_drive.py','scripts/noa_upload_status_deploy.py','tests/jukebox/**','scripts/qa/noa-upload-status.mjs','.github/workflows/noa-upload-status.yml']
  pull_request:
    paths: ['deploy/noa-music.php','deploy/noa-app/p0-media.css','deploy/noa-app/jukebox/**','scripts/noa_upload_drive.py','scripts/noa_upload_status_deploy.py','tests/jukebox/**','scripts/qa/noa-upload-status.mjs','.github/workflows/noa-upload-status.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: 'noa-upload-status-${{ github.sha }}', cancel-in-progress: false}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: jukebox-test-only, MYSQL_DATABASE: jukebox_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pjukebox-test-only" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_sqlite,pdo_mysql,mbstring'}
      - name: Check status recovery and existing upload controls
        run: |
          php -l deploy/noa-app/jukebox/drive-core.php
          php -l deploy/noa-app/jukebox/queue-core.php
          php -l deploy/noa-app/jukebox/recovery-core.php
          php -l deploy/noa-app/jukebox/upload-core.php
          php -l deploy/noa-app/jukebox/operations.php
          php tests/jukebox/drive_transport_test.php
          python -m pip install 'Pillow>=11,<12'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python tests/jukebox/make_fixture.py
          mkdir -p deploy/noa-bridge
          cp bridge/package-record.php deploy/noa-bridge/package-record.php
          php tests/jukebox/upload_mysql_test.php
          php -l deploy/noa-app/jukebox/upload.php
          php -l deploy/noa-app/jukebox/index.php
          php -l deploy/noa-music.php
          node --check deploy/noa-app/jukebox/upload.js
          node --check scripts/qa/noa-upload-status.mjs
          node tests/jukebox/transport_test.cjs
          node tests/jukebox/reservations_test.cjs
          node --test scripts/noa_player_regression.test.mjs
          python tests/jukebox/status_session_test.py
          python -m py_compile scripts/noa_upload_status_deploy.py
      - name: Prepare isolated browser checks
        run: |
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-upload-status" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-upload-status.mjs "$RUNNER_TEMP/noa-upload-status/check.mjs"
      - name: Reproduce disconnected polling and verify completion recovery
        run: node "$RUNNER_TEMP/noa-upload-status/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-upload-status-candidate-${{ github.run_id }}', path: upload-status-proof/, retention-days: 2}
  deploy:
    if: github.event_name != 'pull_request'
    needs: candidate
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare pinned transport and browser
        run: |
          python -m pip install 'paramiko>=3,<5'
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-upload-status" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-upload-status.mjs "$RUNNER_TEMP/noa-upload-status/check.mjs"
      - name: Activate only verified upload status sources
        id: upload
        env: &noa_env
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_upload_status_deploy.py
      - name: Verify the real uploaded file and deployed browser recovery
        id: live
        env: *noa_env
        run: |
          python scripts/noa_upload_status_deploy.py verify
          NOA_UPLOAD_PHASE=live node "$RUNNER_TEMP/noa-upload-status/check.mjs"
      - name: Restore only release-owned source on failed acceptance
        if: failure() && (steps.upload.outcome == 'failure' || steps.live.outcome == 'failure')
        env: *noa_env
        run: |
          if [ -f "$RUNNER_TEMP/noa-upload-status-before.json" ]; then python scripts/noa_upload_status_deploy.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-upload-status-live-${{ github.run_id }}', path: upload-status-proof/, retention-days: 2}
