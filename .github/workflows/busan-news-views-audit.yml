name: Read-only Busan newsroom view audit
on:
  push:
    branches: [ops/busan-news-views-20261110]
    paths: ['.github/workflows/busan-news-views-audit.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install -q paramiko==3.5.1
      - name: Inspect installed counters without changing site files or data
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          cd scripts
          python - <<'PY'
          import os, socket, hmac, stat, hashlib, re
          from pathlib import Path
          import paramiko
          from busan_readonly_check import configuration, fingerprint, PORT, ROOT
          host, user, password, pin = configuration(os.environ)
          def inspect(s, relative, expected=None):
              path=ROOT+'/'+relative
              try:
                  info=s.lstat(path)
              except FileNotFoundError:
                  print('MISSING', relative)
                  return
              if not stat.S_ISREG(info.st_mode) or s.normalize(path)!=path or info.st_size>1500000:
                  raise RuntimeError('Unexpected audit file')
              with s.open(path,'rb') as f:
                  data=f.read(1500001)
              print('FILE', relative, 'sha256', hashlib.sha256(data).hexdigest())
              if expected is not None:
                  print('MATCH_CHECKOUT', relative, data==Path(expected).read_bytes())
              lines=data.decode('utf-8',errors='replace').splitlines()
              hits=[i for i,l in enumerate(lines) if re.search(r'wr_hit|ss_view_|ss_hit_|view_count',l)]
              shown=set()
              for i in hits:
                  for j in range(max(0,i-5),min(len(lines),i+6)):
                      if j not in shown:
                          print(str(j+1)+':',lines[j][:700])
                          shown.add(j)
          with socket.create_connection((host,PORT),timeout=15) as sock, paramiko.Transport(sock) as t:
              t.get_security_options().key_types=('ssh-ed25519',)
              t.start_client(timeout=20)
              if not hmac.compare_digest(fingerprint(t.get_remote_server_key()),pin):
                  raise RuntimeError('Host key mismatch')
              t.auth_password(user,password,fallback=False)
              with paramiko.SFTPClient.from_transport(t) as s:
                  s.get_channel().settimeout(30)
                  if s.normalize(ROOT)!=ROOT:
                      raise RuntimeError('Wrong hosting root')
                  for relative in ['bbs/board.php','bbs/view.php','mobile/board.php']:
                      inspect(s,relative)
                  for relative,expected in [
                      ('busan-assistant/newsroom-account-import.php','busan_news/publish.php'),
                      ('busan-assistant/newsroom/recent.php','../deploy/busan/newsroom/recent.php'),
                      ('busan-assistant/newsroom/ticker.js','../deploy/busan/newsroom/ticker.js')]:
                      inspect(s,relative,expected)
                  for item in s.listdir_attr(ROOT+'/extend'):
                      if item.filename.endswith('.php') and stat.S_ISREG(item.st_mode):
                          inspect(s,'extend/'+item.filename)
                  print('AUDIT_COMPLETE no site writes and no article requests')
          PY
