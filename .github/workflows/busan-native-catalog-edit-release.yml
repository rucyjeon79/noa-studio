name: Busan native catalog edit release
on:
  push:
    branches: [busan/pointzone-order-lifecycle-20261125]
    paths:
      - '.github/workflows/busan-native-catalog-edit-release.yml'
      - 'scripts/busan_pointzone/release_native_catalog_edit.py'
concurrency:
  group: busan-pointzone-menu
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Release native catalog save routes
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          python -m py_compile scripts/busan_pointzone/release_native_catalog_edit.py
          python -m pip install -q paramiko==3.5.1
          python scripts/busan_pointzone/release_native_catalog_edit.py
