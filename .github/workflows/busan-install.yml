name: Busan authorized new-module installation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/busan-install.yml']
permissions: {contents: read}
concurrency: {group: busan-readonly-sftp, cancel-in-progress: false}
jobs:
  install:
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, curl
      - name: Prepare reviewed module
        run: |
          mkdir -p "$RUNNER_TEMP/busan-candidate"
          echo '' | base64 -d | tar -xz -C "$RUNNER_TEMP/busan-candidate"
          cd "$RUNNER_TEMP/busan-candidate"
          find . -name '*.php' -exec php -l '{}' \;
          php tests/policy_test.php
          node --check busan-assistant/app.js
          python3 tests/runtime_smoke.py
      - run: python3 -m pip install paramiko==3.5.1
      - name: Install only new Busan module and private search configuration
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
          BUSAN_PACKAGE_DIR: ${{ runner.temp }}/busan-candidate
        run: python3 scripts/busan_install.py
      - name: Verify live guest access protection and static assets
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.error,json
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          op=urllib.request.build_opener(NoRedirect())
          result=[]
          for path in ['','admin.php','api.php','style.css','app.js']:
              request=urllib.request.Request('https://skhnslu-busan.com/busan-assistant/'+path)
              try:r=op.open(request,timeout=20)
              except urllib.error.HTTPError as e:r=e
              body=r.read(131072).decode('utf-8',errors='replace')
              if path in ('','admin.php'):
                  assert r.code==302 and '/bbs/login.php?' in r.headers.get('Location',''),(path,r.code)
              elif path=='api.php':
                  assert r.code==403 and json.loads(body)['error']=='member_required'
              else:assert r.code==200 and len(body)>100
              result.append({'path':path,'http':r.code,'verified':True})
          print(json.dumps(result))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: busan-install-result
          path: busan-install-result/result.json
          if-no-files-found: ignore
          retention-days: 7
