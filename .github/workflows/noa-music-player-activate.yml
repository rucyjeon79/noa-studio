name: NOA Music Player Cache Activation
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-music.php'
      - 'scripts/noa_music_entry_safe_deploy.py'
      - '.github/workflows/noa-music-player-activate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate approved asset versions
        run: |
          python -m py_compile scripts/noa_music_entry_safe_deploy.py
          grep -q 'p0-media.css?v=20261023-approved-two-row' deploy/noa-music.php
          grep -q 'p0-player.js?v=20261023-approved-two-row' deploy/noa-music.php
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Activate entrypoint only after assets match production
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          python scripts/noa_player_css_safe_deploy.py
          python scripts/noa_player_js_safe_deploy.py
          python scripts/noa_music_entry_safe_deploy.py
