name: N80 ENGINE Readiness Safe Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-app/engine/readiness.php'
      - 'scripts/n80_engine_readiness_safe_deploy.py'
      - '.github/workflows/n80-engine-readiness-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate readiness reporting
        run: |
          php -l deploy/noa-app/engine/readiness.php
          php tests/engine/readiness_test.php
          python -m py_compile scripts/n80_engine_readiness_safe_deploy.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy additive readiness library
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/n80_engine_readiness_safe_deploy.py
