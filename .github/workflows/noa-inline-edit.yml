name: NOA Unified Record Production
on:
  push:
    branches: [main]
    paths: &paths
      - 'deploy/noa-browse.js'
      - 'deploy/noa-music.php'
      - 'deploy/noa-youtube.php'
      - 'deploy/noa-youtube.js'
      - 'deploy/noa-music-detail.php'
      - 'tests/catalog/inline_edit_projection_test.php'
      - 'tests/catalog/inline_edit_music_page_test.py'
      - 'bridge/package-*.php'
      - 'bridge/lab-api.php'
      - 'bridge/index.php'
      - 'bridge/catalog-store.php'
      - 'bridge/taxonomy-store.php'
      - 'bridge/lab-creator.php'
      - 'deploy/noa-app/jukebox/core.php'
      - 'deploy/noa-category-order.php'
      - 'deploy/noa-app/taxonomy/**'
      - 'tests/catalog/package*'
      - 'tests/uiux/readmodel_ownership.py'
      - 'tests/uiux/recovery_contract_test.py'
      - 'scripts/noa_package_release.py'
      - 'scripts/qa/package-*'
      - 'bridge/inline-edit.php'
      - 'deploy/noa-inline-edit.php'
      - 'deploy/noa-browse-edit.js'
      - 'scripts/noa_inline_edit_deploy.py'
      - 'scripts/qa/inline-edit-*'
      - 'scripts/qa/noa-inline-edit.mjs'
      - '.github/workflows/noa-inline-edit.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: noa-inline-metadata-editor, cancel-in-progress: false}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      runtime_changed: ${{ steps.runtime.outputs.changed }}
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-test-only, MYSQL_DATABASE: noa_inline_edit_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pnoa-test-only" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NOA_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=noa_inline_edit_test;charset=utf8mb4
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: noa-test-only
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Detect runtime changes before any repeat deployment
        id: runtime
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && git cat-file -e "$BEFORE_SHA^{commit}" && git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- deploy bridge public; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_mysql,pdo_sqlite'}
      - name: Validate metadata reader and existing playback, source and permission contracts
        run: |
          for file in bridge/package-*.php bridge/index.php bridge/lab-api.php bridge/catalog-store.php bridge/taxonomy-store.php bridge/lab-creator.php deploy/noa-category-order.php deploy/noa-app/jukebox/core.php deploy/noa-app/taxonomy/index.php; do php -l "$file"; done
          php tests/catalog/package_record_test.php
          node --check deploy/noa-app/taxonomy/ui.js
          php -l bridge/inline-edit.php
          php tests/catalog/inline_edit_projection_test.php
          python tests/catalog/inline_edit_music_page_test.py
          python tests/youtube/coming_fixture.py
          php -l deploy/noa-inline-edit.php
          php -l deploy/noa-music.php
          php -l deploy/noa-youtube.php
          php -l deploy/noa-music-detail.php
          node --check deploy/noa-browse-edit.js
          node --check deploy/noa-browse.js
          node --check deploy/noa-youtube.js
          node --check scripts/qa/noa-inline-edit.mjs
          python tests/uiux/recovery_contract_test.py
          python tests/youtube/detail_endpoint_test.py
          node --test scripts/noa_player_regression.test.mjs scripts/qa/noa-browse.test.mjs scripts/qa/noa-four-level.test.mjs tests/playlists/drag_order_test.cjs tests/youtube/lazy_details_test.cjs
      - name: Prepare isolated MySQL/session fixture and mobile browser
        run: |
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/noa-edit" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-inline-edit.mjs "$RUNNER_TEMP/noa-edit/check.mjs"
          python scripts/qa/inline-edit-fixture.py
          php scripts/qa/inline-edit-seed.php
          php -S 127.0.0.1:8101 -t "$RUNNER_TEMP/noa-inline-edit-fixture" > "$RUNNER_TEMP/inline-edit-php.log" 2>&1 &
      - name: Verify native audited save, shared identity, conflict, retry and inline mobile edits
        run: |
          node scripts/qa/package-native-test.mjs
          php tests/catalog/package_migration_test.php
          python scripts/noa_catalog_seed.py
          php tests/catalog/package_catalog_mysql_test.php
          # Candidate job 121126122808 in run 40179109778 passed these exact
          # UI/read-model bytes at 14f8bbca. Always rerun native MySQL tests above.
          # Reuse only that completed browser stage when every UI/API source is unchanged.
          if git diff --quiet 14f8bbca4f559ab6421371a92b06b56e88d73e45 HEAD -- deploy bridge ':(exclude)bridge/catalog-store.php' ':(exclude)bridge/package-migration.php'; then
            mkdir -p inline-edit-proof/candidate
            python -c "import json,os; from pathlib import Path; p={'browserCases':16,'reused':True,'baselineCommit':'14f8bbca4f559ab6421371a92b06b56e88d73e45','verifiedRun':40179109778,'verifiedCandidateJob':121126122808,'currentCommit':os.environ['GITHUB_SHA'],'uiAndApiBytesUnchanged':True,'nativeMysqlTestsRerun':True,'productionBrowserTestsStillRequired':True}; Path('inline-edit-proof/candidate/browser-stage-reuse.json').write_text(json.dumps(p,indent=2)); print('NOA_CANDIDATE_UI_STAGE_REUSED',json.dumps(p))"
          else
            NOA_PACKAGE_EDITOR=1 node "$RUNNER_TEMP/noa-edit/check.mjs"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-inline-edit-candidate-${{ github.run_id }}', path: inline-edit-proof/, retention-days: 2}
  deploy:
    if: github.event_name != 'pull_request' && needs.candidate.outputs.runtime_changed == 'true' && !contains(github.event.head_commit.message, '[ainoa-release]')
    needs: candidate
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare existing NOA transport and mobile browser
        run: |
          python scripts/qa/noa-qa-font.py
          python -m pip install 'paramiko>=3,<5'
          npm install --prefix "$RUNNER_TEMP/noa-edit" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-inline-edit.mjs "$RUNNER_TEMP/noa-edit/check.mjs"
      - name: Compare all operating sources and activate dependencies before page entry
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_inline_edit_deploy.py
      - name: Back up and consolidate complete records with source CAS and private file verification
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_package_release.py
      - name: Verify production sources and isolated administrator UI without operating data writes
        env: {NOA_EDIT_PHASE: live}
        run: node "$RUNNER_TEMP/noa-edit/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-inline-edit-live-${{ github.run_id }}', path: inline-edit-proof/, retention-days: 2}
