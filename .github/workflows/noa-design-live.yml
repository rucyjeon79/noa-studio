name: NOA live design polish
on:
  push:
    branches: [main]
    paths: ['scripts/noa_design_live_release.py', 'tests/engagement/counts.test.mjs', '.github/workflows/noa-design-live.yml']
permissions: {contents: read}
concurrency: {group: noa-production-sftp, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify count boundaries and existing request behavior
        run: |
          node --check deploy/noa-engagement.js
          node --test tests/engagement/counts.test.mjs tests/engagement/network_test.mjs
          python -m py_compile scripts/noa_design_live_release.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy two presentation files and verify public hashes
        run: python scripts/noa_design_live_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-design-live-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 7}
