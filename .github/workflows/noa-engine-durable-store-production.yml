name: NOA ENGINE Durable Store Safe Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-app/engine/durable-store.php'
      - 'scripts/noa_engine_durable_store_safe_deploy.py'
      - '.github/workflows/noa-engine-durable-store-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Verify durable event store
        run: |
          php -l deploy/noa-app/engine/durable-store.php
          php tests/engine/durable_store_test.php
          python -m py_compile scripts/noa_engine_durable_store_safe_deploy.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy additive durable store library only
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_engine_durable_store_safe_deploy.py
