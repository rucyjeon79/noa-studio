name: N80 Unified Facade Safe Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-app/engine/native-*.php'
      - 'deploy/noa-app/engine/runtime.js'
      - 'deploy/noa-app/engine/worker-wake.php'
      - 'bridge/muvy*.php'
      - 'bridge/lab-*.php'
      - 'deploy/noa-muvy.js'
      - 'deploy/noa-ai-lab.*'
      - 'deploy/noa-channel-batch.js'
      - 'deploy/noa-creator.php'
      - 'deploy/noa-ainoa-admin.js'
      - 'deploy/noa-design.extend.php'
      - 'deploy/noa-app/jukebox/wake-core.php'
      - 'lab/**'
      - 'scripts/n80_publish_final.py'
      - 'tests/engine/runtime.test.mjs'
      - 'tests/lab/muvy.test.mjs'
      - 'tests/engine/native_consumer_test.php'
      - 'scripts/qa/noa-design-gate.mjs'
      - 'scripts/qa/noa-shared-navigation.mjs'
      - 'scripts/qa/n80-runtime-live.mjs'
      - 'tests/p0/router.php'
      - 'scripts/noa_player_regression.test.mjs'
      - 'deploy/noa-app/engine/registry.php'
      - 'deploy/noa-app/engine/health.php'
      - 'deploy/noa-app/engine/adapter-contract.php'
      - 'deploy/noa-app/engine/dispatch-gate.php'
      - 'deploy/noa-app/engine/executor.php'
      - 'deploy/noa-app/engine/readiness.php'
      - 'deploy/noa-app/engine/service-runtime.php'
      - 'deploy/noa-app/engine/task-status.php'
      - 'deploy/noa-app/engine/app-lifecycle.php'
      - 'deploy/noa-app/engine/app-data.php'
      - 'deploy/noa-app/engine/app-observe.php'
      - 'deploy/noa-app/engine/consume-music.php'
      - 'bridge/worker-*.php'
      - 'bridge/lab-worker.php'
      - 'bridge/ainoa-automation.php'
      - 'scripts/n80_live_observer.py'
      - 'scripts/n80_app_integration.py'
      - 'scripts/n80_runtime_verify.py'
      - 'scripts/n80_runtime_finalize.py'
      - 'scripts/n80_completion_pipeline.py'
      - '.github/workflows/noa-quality-gates.yml'
      - 'scripts/n80_auto.py'
      - 'scripts/noa_n80_ai_worker.py'
      - 'config/n80-automation.json'
      - 'tests/lab/http_test.py'
      - 'tests/engine/music_consumer_test.php'
      - 'tests/engine/runtime_ownership_test.php'
      - 'tests/engine/service_runtime_test.php'
      - 'tests/engine/test_auto_dispatch.py'
      - 'tests/catalog/ainoa_automation_mysql_test.php'
      - 'AGENTS.project.md'
      - 'docs/n80-engine-transition.md'
      - 'tests/engine/single_runtime_policy_test.php'
      - 'deploy/noa-app/engine/integration-audit.php'
      - 'deploy/noa-app/engine/n80.php'
      - 'deploy/noa-app/engine/receipt-contract.php'
      - 'deploy/noa-app/jukebox/cli.php'
      - 'scripts/n80_single_session_deploy.py'
      - 'deploy/noa-app/engine/readonly-pipeline.php'
      - 'scripts/n80_readonly_pipeline_safe_deploy.py'
      - 'deploy/noa-app/engine/authenticated-probe.php'
      - 'scripts/n80_authenticated_probe_safe_deploy.py'
      - 'deploy/noa-app/engine/music-adapter.php'
      - 'scripts/n80_music_adapter_safe_deploy.py'
      - 'deploy/noa-app/engine/lease-state.php'
      - 'scripts/n80_lease_state_safe_deploy.py'
      - 'deploy/noa-app/engine/policy.php'
      - 'deploy/noa-app/engine/guardian.php'
      - 'scripts/n80_policy_safe_deploy.py'
      - 'scripts/n80_guardian_safe_deploy.py'
      - 'deploy/noa-app/engine/bridge.php'
      - 'scripts/n80_bridge_safe_deploy.py'
      - 'scripts/n80_engine_facade_safe_deploy.py'
      - '.github/workflows/n80-engine-facade-production.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  deploy:
    concurrency:
      group: noa-production-sftp
      cancel-in-progress: false
    # Integrated data repairs own installation and forbid legacy host staging.
    if: (github.event_name != 'push' || (!contains(github.event.head_commit.message, '[n80-data]') && !contains(github.event.head_commit.message, '[category-final]') && !contains(github.event.head_commit.message, '[n80-home-orbit]') && !contains(github.event.head_commit.message, '[creative-drafts]'))) && !contains(github.event.head_commit.message, '[n80-jukebox]')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-test-only, MYSQL_DATABASE: noa_inline_edit_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pnoa-test-only" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=noa_inline_edit_test;charset=utf8mb4
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: noa-test-only
      GH_TOKEN: ${{ github.token }}
      N80_DEPLOY_JUKEBOX_CLI: '1'
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,pdo_mysql,mbstring,curl,tokenizer,fileinfo
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Validate N80 dispatch, ownership, replay and SQL task lifecycle
        run: |
          set -eu
          for file in deploy/noa-app/engine/*.php bridge/worker-*.php bridge/lab-*.php bridge/muvy*.php bridge/ainoa-automation.php; do php -l "$file"; done
          for test in tests/engine/*_test.php; do php "$test"; done
          php tests/sitemap/registry_test.php
          node --test scripts/noa_player_regression.test.mjs tests/engine/runtime.test.mjs tests/lab/muvy.test.mjs
          php tests/muvy/fixture.php
          python tests/lab/http_test.py
          python -m unittest discover -s tests/engine -p test_auto_dispatch.py -v
          python -m unittest discover -s tests/engine -p test_final_publication.py -v
          python -m py_compile scripts/n80_single_session_deploy.py scripts/n80_runtime_verify.py scripts/noa_n80_ai_worker.py scripts/n80_auto.py
          php scripts/qa/inline-edit-seed.php
          php tests/catalog/ainoa_generation_mysql_test.php
          php tests/catalog/ainoa_automation_mysql_test.php
      - name: Verify the asynchronous MUVY flow in desktop and mobile browsers
        run: |
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/n80-browser" --no-save --ignore-scripts --package-lock=false playwright@1.56.1 pixelmatch@7.1.0 pngjs@7.0.0
          cp scripts/qa/noa-muvy.mjs "$RUNNER_TEMP/n80-browser/muvy.mjs"
          cp scripts/qa/noa-shared-navigation.mjs "$RUNNER_TEMP/n80-browser/navigation.mjs"
          cp scripts/qa/noa-design-gate.mjs "$RUNNER_TEMP/n80-browser/design.mjs"
          node "$RUNNER_TEMP/n80-browser/muvy.mjs"
          node "$RUNNER_TEMP/n80-browser/navigation.mjs"
          node "$RUNNER_TEMP/n80-browser/design.mjs"
      - name: Verify and install N80 modules in one SSH session
        run: python scripts/n80_single_session_deploy.py
      - name: Read back N80 status without creating an AI task and update existing journal
        run: python scripts/n80_runtime_verify.py
      - name: Restore owned sources after failed acceptance
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/n80_single_session_deploy.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'n80-single-runtime-${{ github.run_id }}', path: 'ainoa-proof/', retention-days: 7}
