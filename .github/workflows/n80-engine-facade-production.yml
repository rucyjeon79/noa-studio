name: N80 legacy GitHub host deployment retired
# Direct owner-authenticated N80 Hub release owns production; GitHub may only issue future approved scheduled wakes, never SFTP deploy or run host commands.
# Historical implementation remains in git history and Google Drive backups.
# This workflow is intentionally inert; do not re-enable host deployment here.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "Legacy host deployment disabled after Dothome resource suspension"
