name: NOA audio onset and player level
on:
  pull_request:
    paths: &paths ['scripts/noa_audio_onset_release.py','scripts/noa_audio_onset_audit.php','.github/workflows/noa-audio-onset.yml']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: |
          for path in bridge/music-readmodel.php bridge/youtube-catalog.php bridge/channel-view.php deploy/noa-music.php; do php -l "$path"; done
          php -l scripts/noa_audio_onset_audit.php
          php -l deploy/noa-app/jukebox/stream.php
          php tests/popularity/stream_tracking_test.php
          node --check deploy/noa-app/p0-player.js
          node --test tests/jukebox/playback_recovery.test.cjs scripts/noa_player_regression.test.mjs scripts/qa/noa-browse.test.mjs
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_audio_onset_release.py
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - run: python scripts/noa_audio_onset_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'audio-onset-deploy-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 7}
