name: NOA UI Safe Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-ui.css'
      - 'scripts/noa_ui_safe_deploy.py'
      - '.github/workflows/noa-ui-safe-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-retired-noa-ui-safe-production
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    # Replaced by the unified Drive-protected approved UI release.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate CSS and deploy script
        run: |
          python -m py_compile scripts/noa_ui_safe_deploy.py
          test -s deploy/noa-ui.css
          grep -q 'unified premium interaction polish' deploy/noa-ui.css
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Verify remote baseline and deploy CSS
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_ui_safe_deploy.py
