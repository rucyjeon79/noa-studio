name: NOA P0 UI Performance Evidence
on:
  push:
    branches: [codex/p0-ux-performance-evidence-20261024]
    paths: ['scripts/qa/noa-p0-evidence.mjs', 'scripts/noa_p0_readonly.py', 'tests/uiux/proposals/20261024/**', '.github/workflows/noa-p0-evidence.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Runner-only dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install 'paramiko>=3,<5'
          npm install --prefix "$RUNNER_TEMP/noa-p0" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-p0-evidence.mjs "$RUNNER_TEMP/noa-p0/evidence.mjs"
      - name: Reuse completed read-only source and timing baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40058413392 --name noa-p0-evidence-40058413392-1 --dir "$RUNNER_TEMP/p0-baseline"
          mkdir -p p0-evidence
          cp "$RUNNER_TEMP/p0-baseline/protected-baseline.json" p0-evidence/protected-baseline.json
      - name: Browser timings, content separation and unshipped visual proposals
        env:
          NOA_SOURCE_ROOT: ${{ github.workspace }}
          NOA_P0_REUSE_METRICS: ${{ runner.temp }}/p0-baseline/evidence.json
        run: node "$RUNNER_TEMP/noa-p0/evidence.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-p0-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: p0-evidence/
          retention-days: 1
