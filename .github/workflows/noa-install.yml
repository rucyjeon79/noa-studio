name: NOA Home Entry and Apple Installation
on:
  pull_request:
    paths: ['deploy/noa-install.*','deploy/noa-brand.js','deploy/noa-manifest.json','public/icon-maskable-*.png','public/icon-touch-180.png','scripts/noa_install_*','scripts/qa/noa-install.mjs','tests/pwa/**','.github/workflows/noa-install.yml']
  push:
    branches: [main]
    paths: ['deploy/noa-install.*','deploy/noa-brand.js','deploy/noa-manifest.json','public/icon-maskable-*.png','public/icon-touch-180.png','scripts/noa_install_*','scripts/qa/noa-install.mjs','tests/pwa/**','.github/workflows/noa-install.yml']
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Validate launch and public installation contract
        run: |
          for file in deploy/noa-install.php deploy/noa-download.php deploy/noa-access.extend.php deploy/noa-design.extend.php deploy/noa-my.php deploy/noa-sitemap.php bridge/member-access.php tests/pwa/fixture.php; do php -l "$file"; done
          for file in deploy/noa-launch.js deploy/noa-brand.js deploy/noa-ui.js deploy/noa-account.js deploy/noa-install.js scripts/qa/noa-install.mjs; do node --check "$file"; done
          node --test tests/pwa/launch_test.cjs
          php tests/member/access_test.php
          php tests/sitemap/registry_test.php
          python -m py_compile scripts/noa_install_release.py
          php tests/pwa/fixture.php
          python scripts/qa/noa-qa-font.py
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-install" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          # Preserve Ubuntu signing keys and cover runners using mirror+file sources.
          for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/*mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i -e 's|http://|https://|g' -e 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
            fi
          done
          timeout 300 "$RUNNER_TEMP/noa-install/node_modules/.bin/playwright" install --with-deps webkit
          cp scripts/qa/noa-install.mjs "$RUNNER_TEMP/noa-install/check.mjs"
      - name: Test browser entrances, three member roles, WebKit and Chrome installation UI
        run: node "$RUNNER_TEMP/noa-install/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-install-candidate-${{ github.run_id }}', path: install-proof/, retention-days: 7}
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[nav-release]') }}
    needs: candidate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Prepare pinned transport and actual browser verification
        run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/qa/noa-qa-font.py
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-install" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-install.mjs "$RUNNER_TEMP/noa-install/check.mjs"
      - name: Deploy only reviewed launch and installation files
        id: upload
        run: python scripts/noa_install_release.py
      - name: Verify actual home entrances and Apple installation links
        env: {NOA_INSTALL_PHASE: live}
        run: node "$RUNNER_TEMP/noa-install/check.mjs"
      - name: Restore owned source if upload fails
        if: failure() && steps.upload.outcome == 'failure'
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_install_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-install-live-${{ github.run_id }}', path: install-proof/, retention-days: 7}
