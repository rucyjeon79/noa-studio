name: NOA member badge stylesheet
on:
  push:
    branches: [main]
    paths: ['deploy/noa-member-badges.css', '.github/workflows/noa-badge-style.yml']
permissions: {contents: read}
concurrency: {group: noa-production-sftp, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Publish and verify the member badge stylesheet
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES = {'noa-member-badges.css': 'deploy/noa-member-badges.css'}
          release.NEW = set()
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
