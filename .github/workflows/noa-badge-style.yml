name: NOA member badges and operating rules
on:
  push:
    branches: [main]
    paths: ['deploy/noa-member-badges.css', 'deploy/noa-membership.php', '.github/workflows/noa-badge-style.yml']
permissions: {contents: read}
concurrency: {group: noa-production-sftp, cancel-in-progress: false}
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[aide-limit]')"
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Publish member presentation files
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          PYTHONPATH: scripts
        run: |
          for file in deploy/noa-{membership,channel-menu,sitemap,creator-ai,creator-apply,access.extend}.php; do php -l "$file"; done
          node --check deploy/noa-channel-controls.js
          node --check deploy/noa-creator-ai.js
          python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES = {'noa-member-badges.css': 'deploy/noa-member-badges.css', 'noa-membership.php': 'deploy/noa-membership.php'}
          release.FILES.update({"noa-channel-menu.php":"deploy/noa-channel-menu.php","noa-channel-controls.js":"deploy/noa-channel-controls.js","noa-sitemap.php":"deploy/noa-sitemap.php","noa-creator-ai.php":"deploy/noa-creator-ai.php","noa-creator-ai.js":"deploy/noa-creator-ai.js","noa-creator-apply.php":"deploy/noa-creator-apply.php","extend/noa.access.php":"deploy/noa-access.extend.php"})
          release.NEW = set()
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
