name: N80 Whole App Data Integration
on:
  workflow_run:
    workflows: [N80 Unified Facade Safe Production]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '19 * * * *'
permissions:
  contents: read
jobs:
  integrate:
    concurrency:
      group: n80-app-data-audit
      cancel-in-progress: false
    if: vars.N80_OBSERVER_ENABLED != 'false' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
      - name: Validate data contracts and existing engine before installation
        run: |
          set -eu
          for file in deploy/noa-app/engine/*.php; do php -l "$file"; done
          for test in tests/engine/*_test.php; do php "$test"; done
          python -m py_compile scripts/n80_app_integration.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/engine -p 'test_app_integration.py' -v
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Verify deployed sources and whole-app data relations
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/n80_auto.py engine.audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n80-app-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/n80-app-integration.json
          retention-days: 1
          if-no-files-found: ignore
