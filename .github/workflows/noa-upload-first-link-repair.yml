name: NOA first Suno link upload recovery
on:
  push:
    branches: [main]
    paths: ['scripts/noa_upload_first_link_repair.py', '.github/workflows/noa-upload-first-link-repair.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: jukebox-test-only, MYSQL_DATABASE: jukebox_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pjukebox-test-only" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_sqlite,pdo_mysql,mbstring'}
      - name: Verify late first-link publication and existing-source conflict rejection
        run: |
          php -l deploy/noa-app/jukebox/operations.php
          python -m pip install 'Pillow>=11,<12'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python tests/jukebox/make_fixture.py
          mkdir -p deploy/noa-bridge
          cp bridge/package-record.php deploy/noa-bridge/package-record.php
          cp bridge/channel-ownership.php deploy/noa-bridge/channel-ownership.php
          php tests/jukebox/upload_mysql_test.php
          python -m py_compile scripts/noa_upload_first_link_repair.py
  recover:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install 'paramiko>=3,<5' 'Pillow>=11,<12'
          if ! command -v ffmpeg; then sudo apt-get update -qq; sudo apt-get install -y -qq ffmpeg; fi
      - name: Publish only the known source fix and recover exact retained source
        run: python scripts/noa_upload_first_link_repair.py
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: upload-first-link-recovery, path: upload-repair-proof/*.json, retention-days: 7}
