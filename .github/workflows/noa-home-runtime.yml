name: NOA home runtime performance
on:
  pull_request:
    paths: &paths ['deploy/noa-home-assets.php','deploy/noa-app/home-assets.php','deploy/noa-home-performance.extend.php','tests/home-runtime/**','scripts/noa_home_runtime_release.py','scripts/qa/noa-home-runtime.mjs','.github/workflows/noa-home-runtime.yml']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          php -l deploy/noa-app/home-assets.php
          php -l deploy/noa-home-assets.php
          php -l deploy/noa-home-performance.extend.php
          php tests/sitemap/registry_test.php
          php tests/home-runtime/assets.php
          php tests/home-runtime/hook.php
          python scripts/qa/noa-qa-font.py
          timeout 90s npm install --prefix "$RUNNER_TEMP/noa-runtime" --no-save --ignore-scripts --package-lock=false --no-audit --no-fund playwright@1.56.1
          cp scripts/qa/noa-home-runtime.mjs "$RUNNER_TEMP/noa-runtime/check.mjs"
          NOA_RUNTIME_PHASE=candidate node "$RUNNER_TEMP/noa-runtime/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'home-runtime-proof', path: 'home-runtime-proof/', retention-days: 7}
  publish:
    if: github.event_name == 'push'
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/qa/noa-qa-font.py
          timeout 90s npm install --prefix "$RUNNER_TEMP/noa-runtime" --no-save --ignore-scripts --package-lock=false --no-audit --no-fund playwright@1.56.1
          cp scripts/qa/noa-home-runtime.mjs "$RUNNER_TEMP/noa-runtime/check.mjs"
      - run: python scripts/noa_home_runtime_release.py
      - id: live
        run: NOA_RUNTIME_PHASE=live node "$RUNNER_TEMP/noa-runtime/check.mjs"
      - if: failure() && steps.live.outcome == 'failure'
        run: python scripts/noa_home_runtime_release.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-runtime-production
          path: |
            ainoa-proof/deployment.json
            home-runtime-proof/
          retention-days: 7
