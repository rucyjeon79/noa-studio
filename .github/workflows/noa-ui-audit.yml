name: NOA UI and point support audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-ui-audit.yml','scripts/noa_ui_audit_release.py','tests/navigation/ui-audit.mjs']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Verify navigation, community, purchase and point support
        run: |
          php -l deploy/noa-app/ecosystem-view.php
          php -l deploy/noa-points.php
          node --check deploy/noa-ui.js
          node --check deploy/noa-support.js
          node --check deploy/noa-ecosystem.js
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/noa-shop" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/ecosystem/shop-layout.mjs "$RUNNER_TEMP/noa-shop/check.mjs"
          node "$RUNNER_TEMP/noa-shop/check.mjs"
          cp tests/ecosystem/flows.mjs "$RUNNER_TEMP/noa-shop/flows.mjs"
          node "$RUNNER_TEMP/noa-shop/flows.mjs"
          cp tests/navigation/ui-audit.mjs "$RUNNER_TEMP/noa-shop/audit.mjs"
          node "$RUNNER_TEMP/noa-shop/audit.mjs"
          cp tests/navigation/community-polish.mjs "$RUNNER_TEMP/noa-shop/community.mjs"
          node "$RUNNER_TEMP/noa-shop/community.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'noa-ui-audit-${{ github.run_id }}'
          path: |
            ui-audit-proof/
            shop-proof/
            community-polish-proof/
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy verified UI assets and check public hashes
        run: python scripts/noa_ui_audit_release.py
