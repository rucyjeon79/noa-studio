name: NOA Source Audio and Thumbnail URLs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-source-url-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact source URLs without media extraction
        run: |
          python3 - <<'PY'
          import collections,concurrent.futures,json,threading,urllib.request,urllib.error
          from pathlib import Path
          files=list(Path('deploy/noastudio/noa/data/live/곡').rglob('*.json'))
          for field in ['sunoUrl','thumbUrl']:
              urls=sorted({json.loads(p.read_text())['pkg'].get(field,'') for p in files}-{''})
              stop=threading.Event()
              def check(url):
                  if stop.is_set():return 'not_checked_provider_restriction'
                  try:
                      request=urllib.request.Request(url,method='HEAD',headers={'User-Agent':'NOA-STUDIO-Source-Verification'})
                      with urllib.request.urlopen(request,timeout=12) as response:return 'http_'+str(response.status)
                  except urllib.error.HTTPError as e:
                      if e.code in [403,429]:stop.set()
                      return 'http_'+str(e.code)
                  except Exception as e:return type(e).__name__
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
                  result=list(pool.map(check,urls))
              print(field,'unique_source_urls',len(urls),'availability',json.dumps(collections.Counter(result)))
          print('No URLs were rewritten, no audio was extracted, and no existing source data changed.')
          PY
