name: NOA missing Suno covers and premium gold sheen
on:
  pull_request:
    paths: ['scripts/noa_cover*','scripts/qa/noa-cover-shine.mjs','.github/workflows/noa-cover-fill.yml']
  push:
    branches: [main]
    paths: ['scripts/noa_cover*','scripts/qa/noa-cover-shine.mjs','.github/workflows/noa-cover-fill.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli,pdo_mysql,mbstring,fileinfo,gd'}
      - run: |
          php -l scripts/noa_cover_fill.php
          python -m pip install pillow paramiko
          python -m py_compile scripts/noa_cover_fill.py scripts/noa_cover_style_release.py
          python -m unittest discover -s tests/jukebox -p test_publish.py
          python -m unittest discover -s tests/jukebox -p test_worker.py
          php tests/premium/fixture.php
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/cover-ui" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/cover-ui/node_modules/.bin/playwright" install --with-deps webkit
          cp scripts/qa/noa-cover-shine.mjs "$RUNNER_TEMP/cover-ui/check.mjs"
          node "$RUNNER_TEMP/cover-ui/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-cover-shine-${{ github.run_id }}', path: premium-proof/, retention-days: 7}
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install pillow 'paramiko>=3,<5'
      - name: Deploy premium type treatment with protected source backup
        run: python scripts/noa_cover_style_release.py
      - name: Acquire missing original covers and verify published bytes
        run: python scripts/noa_cover_fill.py
      - name: Inspect current channel covers without modifying data
        run: python scripts/noa_channel_view_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-cover-fill-live-${{ github.run_id }}
          path: |
            cover-proof/
            ainoa-proof/deployment.json
            channel-view-proof/live/ownership-covers.json
          retention-days: 7
