name: NOA popularity source and replay checks
on:
  push:
    branches: [main]
    paths: ['bridge/popularity*.php', 'bridge/rankings.php', 'bridge/catalog*.php', 'bridge/taxonomy*.php', 'bridge/youtube-store.php', 'scripts/noa_catalog_seed.py', 'src/data/**', 'data/live/**', 'data/backup-save-lock/live/**', 'deploy/noastudio/noa/data/live/**', 'tests/popularity/**', '.github/workflows/noa-popularity-check.yml']
  pull_request:
    paths: ['bridge/popularity*.php','tests/popularity/**','.github/workflows/noa-popularity-check.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-isolated-only, MYSQL_DATABASE: noa_restore_verification}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pnoa-isolated-only" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
          coverage: none
      - name: Pure metric and existing source checks
        run: |
          php tests/popularity/core_test.php
          php tests/catalog/home_test.php
          php tests/catalog/home_uiux_test.php
          php tests/catalog/world_mv_test.php
      - name: Generate disposable fixture from repository music sources
        env:
          NOA_POPULARITY_SOURCE_FIXTURE: '1'
        run: |
          python3 scripts/noa_catalog_seed.py
          php tests/popularity/source_fixture.php
      - name: Verify first migration and replay with existing rankings and valid plays
        run: |
          php tests/popularity/mysql_test.php
          php tests/popularity/mysql_test.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-popularity-replay-check
          path: |
            quality-popularity/isolated.json
            quality-popularity/fixture-provenance.json
          retention-days: 14

