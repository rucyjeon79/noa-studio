name: NOA instant Suno editor artwork
on:
  pull_request:
    paths: &paths ['bridge/suno-cover.php','tests/suno-cover/**','scripts/noa_suno_editor_*.py','.github/workflows/noa-suno-editor.yml']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-test-only, MYSQL_DATABASE: noa_cover_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pnoa-test-only" --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'curl,dom,gd,pdo_mysql,fileinfo'}
      - env:
          NOA_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=noa_cover_test;charset=utf8mb4
        run: |
          for file in bridge/suno-cover.php bridge/creator.php deploy/noa-inline-edit.php; do php -l "$file"; done
          php tests/suno-cover/capture.php
          node --check deploy/noa-creator.js
          node --check deploy/noa-browse-edit.js
          npm install --prefix "$RUNNER_TEMP/suno-ui" --no-save --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/suno-ui/node_modules/.bin/playwright" install chromium
          NODE_PATH="$RUNNER_TEMP/suno-ui/node_modules" node tests/suno-cover/layout.cjs
  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_suno_editor_release.py
      - id: live
        run: python scripts/noa_suno_editor_probe.py
      - if: failure() && steps.live.outcome == 'failure'
        run: python scripts/noa_suno_editor_release.py rollback
