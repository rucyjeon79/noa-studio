name: NOA JUKEBOX Upload CSS Safe Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-app/jukebox/upload.css'
      - 'scripts/noa_jukebox_upload_css_safe_deploy.py'
      - '.github/workflows/noa-jukebox-upload-css-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate deployment script and stylesheet
        run: |
          python -m py_compile scripts/noa_jukebox_upload_css_safe_deploy.py
          test -s deploy/noa-app/jukebox/upload.css
          grep -q 'Semantic JUKEBOX controls' deploy/noa-app/jukebox/upload.css
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Safely deploy and verify public CSS
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_jukebox_upload_css_safe_deploy.py
