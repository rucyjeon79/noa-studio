name: Busan SFTP read-only verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/busan-readonly-check.yml']
permissions:
  contents: read
concurrency:
  group: busan-readonly-sftp
  cancel-in-progress: false
jobs:
  busan-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: busan-readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference transport dependency
        run: python -m pip install paramiko==3.5.1
      - name: Verify isolation and host-key rejection
        run: python -m unittest discover -s scripts/busan_tests -p test_busan_readonly_check.py -v
      - name: Observe Busan SSH public host key without authentication
        run: |
          python - <<'PYCODE'
          import base64, hashlib, json, socket
          from pathlib import Path
          import paramiko
          report = {'host': '112.175.184.79', 'port': 2022, 'authenticated': False, 'trusted': False}
          sock = transport = None
          try:
              sock = socket.create_connection(('112.175.184.79', 2022), timeout=15)
              transport = paramiko.Transport(sock)
              transport.banner_timeout = 15
              transport.get_security_options().key_types = ('ssh-ed25519',)
              transport.start_client(timeout=20)
              key = transport.get_remote_server_key()
              report.update(connected=True, algorithm=key.get_name(), observed_fingerprint='SHA256:' + base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('='))
          except Exception as exc:
              report.update(connected=False, error=type(exc).__name__)
          finally:
              for item in (transport, sock):
                  if item is not None:
                      item.close()
          Path('busan-check-result').mkdir(exist_ok=True)
          Path('busan-check-result/hostkey-observation.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report))
          PYCODE
      - name: Check Busan server only
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: python scripts/busan_readonly_check.py
      - name: Inspect approved Busan newsroom directories (read-only)
        if: always()
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          python - <<'PY'
          import hmac, json, os, socket, stat, paramiko
          from scripts.busan_readonly_check import configuration, fingerprint, PORT, ROOT
          host, user, password, trusted = configuration(os.environ)
          sock = transport = sftp = None
          report = {"mode":"read_only","server_files_changed":0,"checks":[]}
          try:
              sock=socket.create_connection((host,PORT),timeout=15)
              transport=paramiko.Transport(sock)
              transport.banner_timeout=15
              transport.auth_timeout=15
              transport.get_security_options().key_types=('ssh-ed25519',)
              transport.start_client(timeout=20)
              if not hmac.compare_digest(fingerprint(transport.get_remote_server_key()),trusted):
                  raise RuntimeError("host_key_mismatch")
              transport.auth_password(user,password,fallback=False)
              if not transport.is_authenticated():
                  raise RuntimeError("authentication_failed")
              sftp=paramiko.SFTPClient.from_transport(transport)
              if sftp.normalize(ROOT)!=ROOT:
                  raise RuntimeError("root_mismatch")
              home=sftp.normalize(".")
              report["sftpHome"]=home
              try:
                  home_info=sftp.lstat(home)
                  report["sftpHomeExists"]=stat.S_ISDIR(home_info.st_mode)
                  if report["sftpHomeExists"]:
                      entries=sftp.listdir_attr(home)
                      report["sftpHomeEntriesCount"]=len(entries)
                      safe_names={"html","www","wwwroot","public_html","htdocs","web","site","rucyjeon79","hosting","busan","busan-assistant"}
                      report["candidateDirectories"]=sorted([
                          entry.filename for entry in entries
                          if entry.filename in safe_names and stat.S_ISDIR(entry.st_mode)
                      ])
              except OSError:
                  report["sftpHomeStatus"]="not_readable"
              for label, path in (
                  ("root", ROOT),
                  ("module_parent", ROOT+"/busan-assistant"),
                  ("newsroom", ROOT+"/busan-assistant/newsroom"),
                  ("extend", ROOT+"/extend"),
                  ("private", "/hosting/rucyjeon79/busan-assistant-private"),
                  ("home", home),
                  ("home_html",home.rstrip("/")+"/html"),
                  ("home_www",home.rstrip("/")+"/www"),
                  ("home_public_html",home.rstrip("/")+"/public_html"),
                  ("hosting", "/hosting"),
              ):
                  try:
                      item=sftp.lstat(path)
                      row={"label":label,"exists":True,"directory":stat.S_ISDIR(item.st_mode),
                           "permissionBits":oct(stat.S_IMODE(item.st_mode)),
                           "normalized":sftp.normalize(path)==path}
                  except FileNotFoundError:
                      row={"label":label,"exists":False}
                  except OSError:
                      row={"label":label,"exists":"unknown","error":"stat_unavailable"}
                  report["checks"].append(row)
          except Exception as error:
              report["error"]=type(error).__name__ if str(error)!="host_key_mismatch" else "host_key_mismatch"
          finally:
              for item in (sftp,transport,sock):
                  if item is not None:
                      try: item.close()
                      except Exception: pass
          print("Busan SFTP path audit:",json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: busan-readonly-check-result
          path: busan-check-result/*.json
          if-no-files-found: ignore
          retention-days: 3
