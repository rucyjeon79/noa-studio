name: NOA Approved Three Tier Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-browse.js'
      - 'deploy/noa-ui.css'
      - 'deploy/noa-music.php'
      - 'deploy/noa-youtube.php'
      - 'scripts/noa_browse_music_page_deploy.py'
      - 'scripts/noa_browse_youtube_page_deploy.py'
      - '.github/workflows/noa-approved-three-tier.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and approved hierarchy gates
        run: |
          node --check deploy/noa-browse.js
          php -l deploy/noa-music.php
          php -l deploy/noa-youtube.php
          python -m py_compile scripts/noa_ui_safe_deploy.py scripts/noa_browse_safe_deploy.py scripts/noa_browse_music_page_deploy.py scripts/noa_browse_youtube_page_deploy.py
          grep -q 'noa-inline-act' deploy/noa-ui.css
          grep -q 'noa-browse.js?v=20261024-approved-three-tier' deploy/noa-music.php
          grep -q 'noa-browse.js?v=20261024-approved-three-tier' deploy/noa-youtube.php
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy CSS and JS then activate PHP pages
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          python scripts/noa_ui_safe_deploy.py
          python scripts/noa_browse_safe_deploy.py
          python scripts/noa_browse_music_page_deploy.py
          python scripts/noa_browse_youtube_page_deploy.py
