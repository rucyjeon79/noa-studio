name: NOA post likes comments and popularity
on:
  pull_request:
    paths: ['bridge/engagement*.php','deploy/noa-engagement.*','bridge/popularity-core.php','bridge/popularity-store.php','scripts/noa_engagement*','scripts/qa/noa-engagement.mjs','tests/engagement/**','.github/workflows/noa-engagement.yml']
  push:
    branches: [main]
    paths: ['bridge/engagement*.php','deploy/noa-engagement.*','bridge/popularity-core.php','bridge/popularity-store.php','scripts/noa_engagement*','scripts/qa/noa-engagement.mjs','tests/engagement/**','.github/workflows/noa-engagement.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: fixture-only}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pfixture-only" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli, pdo_mysql, mbstring'}
      - name: Validate identities, authorization, score sets and durable mutations
        run: |
          for file in bridge/engagement*.php deploy/noa-engagement.extend.php scripts/noa_engagement_control.php; do php -l "$file"; done
          node --check deploy/noa-engagement.js
          php tests/engagement/popularity.php
          php tests/engagement/fixture.php
          sudo install -d -m 0777 /workspace/screenshots
          python scripts/qa/noa-qa-font.py
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-engagement" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-engagement.mjs "$RUNNER_TEMP/noa-engagement/check.mjs"
      - name: Check actual API persistence and mobile/desktop UI in isolated site
        run: node "$RUNNER_TEMP/noa-engagement/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-engagement-candidate-${{ github.run_id }}', path: engagement-proof/, retention-days: 7}
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      NOA_CONVERSATION_RELEASE: ${{ contains(github.event.head_commit.message, '[conversation-release]') && '--conversation' || '' }}
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Install reviewed source with protected preimages
        id: upload
        run: python scripts/noa_engagement_release.py $NOA_CONVERSATION_RELEASE
      - name: Create only additive engagement tables and check replay
        run: python scripts/noa_engagement_control.py
      - name: Verify production assets and guest write denial
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json
          from pathlib import Path
          root='https://noastudio.ai.kr'
          with urllib.request.urlopen(root+'/',timeout=30) as r:html=r.read().decode()
          assert '/noa-engagement.js?v=' in html and '/noa-engagement.css?v=' in html
          with urllib.request.urlopen(root+'/noa-notifications.php',timeout=30) as r:inbox=r.read().decode()
          assert '/noa-engagement.js?v=' in inbox and '/noa-notifications.js?v=' in inbox
          try:
            urllib.request.urlopen(urllib.request.Request(root+'/noa-bridge/engagement.php',data=b'{}',headers={'Content-Type':'application/json','Origin':root}),timeout=30)
            raise AssertionError('guest write accepted')
          except urllib.error.HTTPError as e:
            # The production host replaces PHP 401 JSON with its own HTML error page.
            # Denial is the HTTP contract; JSON details remain covered in isolated API tests.
            assert e.code==401, ('guest write denial', e.code)
            if 'application/json' in e.headers.get('Content-Type',''):
              assert json.load(e)['error']=='login_required'
          Path('engagement-proof/live.json').write_text(json.dumps({'homeAssets':True,'guestWriteDenied':True,'productionSyntheticWrites':0}))
          PY
      - name: Restore owned files on failure
        if: failure() && steps.upload.outcome != 'skipped'
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_engagement_release.py $NOA_CONVERSATION_RELEASE rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-engagement-live-${{ github.run_id }}', path: engagement-proof/, retention-days: 7}
