name: NOA single-child category navigation
on:
  pull_request:
    paths: &paths ['scripts/noa_category_autoselect_release.py','scripts/qa/noa-category-autoselect.mjs','.github/workflows/noa-category-autoselect.yml']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: |
          node --check deploy/noa-browse.js
          node --test scripts/qa/noa-browse.test.mjs
          npm install --prefix "$RUNNER_TEMP/reload-ui" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/reload-ui/node_modules/.bin/playwright" install --with-deps chromium
          cp scripts/qa/noa-category-autoselect.mjs "$RUNNER_TEMP/reload-ui/check.mjs"
          node "$RUNNER_TEMP/reload-ui/check.mjs"

      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'category-autoselect-${{ github.run_id }}', path: playback-proof/, retention-days: 7}
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_category_autoselect_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'category-autoselect-deploy-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 7}
