name: NOA signed MUSIC verification repair
on:
  push:
    branches: [main]
    paths: ['bridge/music-proof-auth.php','scripts/noa_music_proof_deploy.py','.github/workflows/noa-music-proof.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_sqlite,curl,mbstring'}
      - name: Verify service signature scope and existing user permissions
        run: |
          php -l bridge/music-proof-auth.php
          php -l bridge/member-access.php
          php -l deploy/noa-app/engine/music-availability.php
          php tests/member/access_test.php
          for test in tests/engine/*_test.php; do php "$test"; done
          python -m unittest discover -s tests/engine -p 'test_live_music_consumer.py'
          python -m py_compile scripts/noa_music_proof_deploy.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Install only reviewed verification sources
        env: &proof_env
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_music_proof_deploy.py
      - name: Verify authenticated availability and preserve guest denial
        id: live
        env: *proof_env
        run: |
          python scripts/n80_music_diagnostic.py
          python - <<'PY'
          import json,urllib.request,urllib.error
          p=json.load(open('music-diagnostic-proof/diagnostic.json'));assert p['diagnostic']['available'] is True,p['diagnostic']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          client=urllib.request.build_opener(NoRedirect())
          for path,status in [('/noa-music.php',302),('/noa-bridge/membership.php',200),('/adm/member_list.php',302)]:
              req=urllib.request.Request('https://noastudio.ai.kr'+path,headers={'X-N80-Availability-Check':'1','X-N80-Media-Signature':'0'*64})
              try:r=client.open(req,timeout=30)
              except urllib.error.HTTPError as e:r=e
              assert r.status==status,(path,r.status)
          PY
      - name: Verify real MUSIC acknowledgement and duplicate execution protection
        env: *proof_env
        run: python scripts/n80_live_observer.py
      - name: Restore owned sources if authenticated or guest verification failed
        if: failure() && steps.live.outcome == 'failure'
        env: *proof_env
        run: python scripts/noa_music_proof_deploy.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-music-proof-${{ github.run_id }}
          path: |
            music-proof/
            music-diagnostic-proof/
            ${{ runner.temp }}/n80-live-observer-result.json
          retention-days: 14
