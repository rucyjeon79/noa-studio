name: NOA signed MUSIC verification repair
on:
  push:
    branches: [main]
    paths: ['tests/engine/music_consumer_test.php','tests/engine/music_proof_auth_test.php','bridge/music-proof-auth.php','scripts/noa_music_proof_deploy.py','.github/workflows/noa-music-proof.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  clear-obsolete-setup:
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: write}
    timeout-minutes: 3
    steps:
      - name: Stop only superseded runs stuck before any deployment operation
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PYCODE'
          import json,os,urllib.request,datetime
          root='https://api.github.com/repos/rucyjeon79/noa-studio'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def api(path,method='GET'):
              req=urllib.request.Request(root+path,headers=headers,method=method,data=b'' if method=='POST' else None)
              with urllib.request.urlopen(req,timeout=25) as r:
                  raw=r.read();return json.loads(raw) if raw else None
          head=api('/git/ref/heads/main')['object']['sha']
          pins=[(40293385963,'6e526e134bea57052029f3e813a17576c2278849','.github/workflows/noa-quality-gates.yml','Prepare isolated fixtures and verified processing tools'),(40295126747,'308cde6143ed17ea1814fb3512b0b46f840734f0','.github/workflows/noa-subscription.yml','Prepare pinned NOA SFTP and operating browser checks')]
          for ident,sha,path,stage in pins:
              run=api('/actions/runs/'+str(ident))
              if run['status']!='in_progress' or run['head_sha']!=sha or head==sha or run['path']!=path:continue
              jobs=api('/actions/runs/'+str(ident)+'/jobs')['jobs']
              running=[j for j in jobs if j['status']=='in_progress']
              if len(running)!=1:continue
              steps=running[0]['steps'];active=[s for s in steps if s['status']=='in_progress']
              if len(active)!=1 or active[0]['name']!=stage:continue
              elapsed=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(active[0]['started_at'].replace('Z','+00:00'))).total_seconds()
              if elapsed<600 or any(s['number']>active[0]['number'] and s.get('conclusion')=='success' for s in steps):continue
              api('/actions/runs/'+str(ident)+'/cancel','POST');print('CANCELLED_OBSOLETE_DEPENDENCY_SETUP',ident)
          PYCODE
  repair:
    needs: clear-obsolete-setup
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_sqlite,curl,mbstring'}
      - name: Verify service signature scope and existing user permissions
        run: |
          php -l bridge/music-proof-auth.php
          php -l bridge/member-access.php
          php -l deploy/noa-app/engine/music-availability.php
          php tests/member/access_test.php
          for test in tests/engine/*_test.php; do php "$test"; done
          python -m unittest discover -s tests/engine -p 'test_live_music_consumer.py'
          python -m py_compile scripts/noa_music_proof_deploy.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Install only reviewed verification sources
        id: upload
        env: &proof_env
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_music_proof_deploy.py
      - name: Verify authenticated availability and preserve guest denial
        id: live
        env: *proof_env
        run: |
          python scripts/n80_music_diagnostic.py
          python - <<'PY'
          import json,urllib.request,urllib.error
          p=json.load(open('music-diagnostic-proof/diagnostic.json'));assert p['diagnostic']['available'] is True,p['diagnostic']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          client=urllib.request.build_opener(NoRedirect())
          for path,status in [('/noa-music.php',302),('/noa-bridge/membership.php',200),('/adm/member_list.php',302)]:
              req=urllib.request.Request('https://noastudio.ai.kr'+path,headers={'X-N80-Availability-Check':'1','X-N80-Media-Signature':'0'*64})
              try:r=client.open(req,timeout=30)
              except urllib.error.HTTPError as e:r=e
              assert r.status==status,(path,r.status)
          PY
      - name: Verify real MUSIC acknowledgement and duplicate execution protection
        env: *proof_env
        run: python scripts/n80_live_observer.py
      - name: Restore owned sources if authenticated or guest verification failed
        if: failure() && (steps.upload.outcome == 'failure' || steps.live.outcome == 'failure')
        env: *proof_env
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_music_proof_deploy.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-music-proof-${{ github.run_id }}
          path: |
            music-proof/
            music-diagnostic-proof/
            ${{ runner.temp }}/n80-live-observer-result.json
          retention-days: 14
