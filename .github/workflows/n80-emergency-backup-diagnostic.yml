name: N80 emergency backup diagnostics (read-only)
on:
  push:
    branches: [n80/emergency-backup-diagnostic-20261128]
    paths: ['.github/workflows/n80-emergency-backup-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n80-emergency-backup-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/n80/emergency-backup-diagnostic-20261128'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: Install pinned SFTP dependency
        run: python -m pip install paramiko==3.5.1
      - name: Inspect N80 backup state without mutations
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, stat
          import paramiko
          ROOT='/hosting/noastudio/noa-hub'
          WEB='/hosting/noastudio/html'
          PIN='SHA256:0LqxbpOziJ4XgOMNEkfVrVGle3kpjJessI+jKqZ4JCU'
          phase='connect'
          t=None
          try:
              t=paramiko.Transport((os.environ['NOA_SSH_HOST'],2022))
              t.get_security_options().key_types=('ssh-ed25519',)
              t.start_client(timeout=18)
              actual='SHA256:'+base64.b64encode(hashlib.sha256(t.get_remote_server_key().asbytes()).digest()).decode().rstrip('=')
              if actual!=PIN: raise RuntimeError('host_pin_mismatch')
              phase='authenticate'
              t.auth_password(os.environ['NOA_SSH_USER'],os.environ['NOA_SSH_PASSWORD'])
              s=paramiko.SFTPClient.from_transport(t)
              s.get_channel().settimeout(25)
              # Inspect only the authenticated account home and known NOA paths.
              # Never traverse other accounts, print home paths, or expose directory contents.
              phase='verify_roots'
              import posixpath
              home=s.normalize('.')
              print('N80_HOME_CHECK='+json.dumps({
                  'accountHomeExpected':home=='/hosting/noastudio',
                  'webHomeExpected':home=='/hosting/noastudio/html',
                  'chrootHome':home=='/',
                  'accountNameMatches':posixpath.basename(home)=='noastudio'}))
              try:
                  entries=set(s.listdir('.'))
                  print('N80_HOME_LAYOUT='+json.dumps({'knownEntries':sorted(entries & {'html','noa-hub','noa-app','noa-bridge','noa-deploy-backups','noa-ai-lab','common.php'}),'entryCount':len(entries)}))
              except (OSError,PermissionError):
                  print('N80_HOME_LAYOUT='+json.dumps({'listAvailable':False}))
              bases=[('/hosting/noastudio/noa-hub','/hosting/noastudio/html'),('/noa-hub','/html'),
                     (posixpath.join(home,'noa-hub'),posixpath.join(home,'html'))]
              if home=='/' or home.endswith('/html'):
                  bases.append((posixpath.join(posixpath.dirname(home),'noa-hub'),home))
              selected=False
              for index,(root,web) in enumerate(dict.fromkeys(bases)):
                  checks={}
                  for key,p in [('web',web),('hub',root),('engine',posixpath.join(web,'noa-app/engine/storage-drive.php'))]:
                      try: checks[key]=bool(s.stat(p))
                      except OSError: checks[key]=False
                  print('N80_ROOT_RESULT='+json.dumps({'candidate':index,**checks}))
                  if not all(checks.values()): continue
                  try:
                      path=posixpath.join(web,'noa-app/engine/storage-drive.php')
                      info=s.lstat(path)
                      if not stat.S_ISREG(info.st_mode) or info.st_size>65536: continue
                      with s.open(path,'rb') as handle: data=handle.read(65537)
                      if hashlib.sha256(data).hexdigest()!='1173bef33012a7c213e2f50d23700030b92f1cf002cfed815c37dfc6617c366a':
                          print('N80_SOURCE_MATCH='+json.dumps({'candidate':index,'match':False}));continue
                      if not stat.S_ISREG(s.lstat(root+'/source.json').st_mode): continue
                      ROOT,WEB=root.rstrip('/'),web.rstrip('/'); selected=True;break
                  except OSError: continue
              if not selected: raise RuntimeError('exact_live_source_not_accessible')
              def read_state(name,limit):
                  p=ROOT+'/'+name
                  try: info=s.lstat(p)
                  except FileNotFoundError: return {},0
                  if not stat.S_ISREG(info.st_mode) or not 0<=info.st_size<=limit:
                      raise RuntimeError('unsafe_state_file')
                  with s.open(p,'rb') as h: raw=h.read(limit+1)
                  if len(raw)!=info.st_size: raise RuntimeError('state_changed')
                  return json.loads(raw),len(raw)
              phase='verify_live_engine'
              engine=WEB+'/noa-app/engine/storage-drive.php'
              if s.lstat(engine).st_size>65536: raise RuntimeError('engine_size_invalid')
              with s.open(engine,'rb') as h: digest=hashlib.sha256(h.read(65537)).hexdigest()
              if digest!='1173bef33012a7c213e2f50d23700030b92f1cf002cfed815c37dfc6617c366a': raise RuntimeError('live_engine_digest_changed')
              phase='read_release_metadata'
              source,source_size=read_state('source.json',16777216)
              history,history_size=read_state('releases.json',16777216)
              journal,journal_size=read_state('journal.json',16777216)
              last,_=read_state('release-error.json',65536)
              if not isinstance(source,dict) or not isinstance(history,list): raise RuntimeError('unexpected_state_schema')
              allowed={'hub_backup_preimage_unavailable','hub_backup_release_unavailable','hub_release_unavailable','hub_source_revision_changed','hub_deploy_recovery_required'}
              code=(last or {}).get('code') if isinstance(last,dict) else None
              # Only safe aggregate facts; never print raw state, credentials, provider IDs, paths or content.
              result={'revision':int(source.get('revision',0)), 'sourceMetadataBytes':source_size,
                      'historyBytes':history_size,'historyCount':len(history),'journalBytes':journal_size,
                      'recoveryRequired':bool(journal),'lastError':code if code in allowed else 'other_or_none',
                      'preimageIncludesHistoryBytes':history_size,
                      'hostWrites':0,'providerWrites':0,'workerStarts':0}
              print('N80_BACKUP_DIAGNOSTIC='+json.dumps(result,separators=(',',':')))
          except Exception as exc:
              print('N80_BACKUP_DIAGNOSTIC_FAILED='+json.dumps({'phase':phase,'errorClass':type(exc).__name__,'hostWrites':0}))
              raise SystemExit(1)
          finally:
              if t is not None: t.close()
          PY
