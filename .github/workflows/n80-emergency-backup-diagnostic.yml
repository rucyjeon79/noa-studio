name: N80 one-time large Backup resumable repair
on:
  push:
    branches: [n80/emergency-backup-diagnostic-20261128]
    paths: ['.github/workflows/n80-emergency-backup-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/n80/emergency-backup-diagnostic-20261128'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: Install pinned SFTP client
        run: python -m pip install paramiko==3.5.1
      - name: Repair verified large upload transport failure under N80 lock
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, secrets, stat, subprocess, tempfile
          from pathlib import Path
          import paramiko, urllib.request, urllib.error, time
          ROOT='/hosting/noastudio/noa-hub'
          WEB='/hosting/noastudio/html'
          REMOTE=WEB+'/noa-app/engine/storage-drive.php'
          OLD='2941b902ecbac417a446fd8335f111890beceeafa8857175e2fffd09c2965b0b'
          NEW='2941b902ecbac417a446fd8335f111890beceeafa8857175e2fffd09c2965b0b'
          PIN='SHA256:0LqxbpOziJ4XgOMNEkfVrVGle3kpjJessI+jKqZ4JCU'
          def digest(b): return hashlib.sha256(b).hexdigest()
          def read_regular(s,path,limit):
              info=s.lstat(path)
              if not stat.S_ISREG(info.st_mode) or info.st_size>limit: raise RuntimeError('unsafe_file')
              with s.open(path,'rb') as f: raw=f.read(limit+1)
              if len(raw)!=info.st_size: raise RuntimeError('file_changed')
              return raw
          def stage(s,path,data):
              with s.open(path,'wx') as f: f.write(data); f.flush()
              s.chmod(path,0o600)
              if read_regular(s,path,len(data))!=data: raise RuntimeError('stage_mismatch')
          module=r"""/** Resumable upload for large backups. Never create a second object on an ambiguous completion. */
          function n80_storage_resumable(array $meta,string $bytes,string $token,?callable $http=null):string {
           $http=$http??'n80_storage_http';$total=strlen($bytes);
           $r=$http('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id',$token,'POST',json_encode($meta,JSON_THROW_ON_ERROR),['Content-Type: application/json; charset=UTF-8','X-Upload-Content-Type: application/octet-stream','X-Upload-Content-Length: '.$total,'Expect:']);
           if($r['code']<200||$r['code']>=300)throw new RuntimeException('storage_drive_http_'.$r['code']);
           $url=$r['headers']['location']??'';$p=parse_url($url);
           if(!is_string($url)||($p['scheme']??'')!=='https'||($p['host']??'')!=='www.googleapis.com'||($p['path']??'')!=='/upload/drive/v3/files'||isset($p['user'])||isset($p['pass'])||isset($p['port'])||isset($p['fragment']))throw new RuntimeException('storage_drive_session_url');
           parse_str($p['query']??'',$q);if(empty($q['upload_id'])||!is_string($q['upload_id']))throw new RuntimeException('storage_drive_session_url');
           $offset=0;$limit=(int)ceil($total/262144)*3+3;$stalled=0;
           for($i=0;$i<$limit;$i++){
            $chunk=substr($bytes,$offset,262144);$end=$offset+strlen($chunk)-1;
            try{
             $r=$http($url,$token,'PUT',$chunk,['Content-Type: application/octet-stream','Content-Length: '.strlen($chunk),'Content-Range: bytes '.$offset.'-'.$end.'/'.$total,'Expect:']);
             if(in_array($r['code'],[408,429,500,502,503,504],true))throw new RuntimeException('storage_drive_http_'.$r['code']);
            }catch(RuntimeException $e){
             if(!in_array($e->getMessage(),['storage_drive_transport','storage_drive_http_408','storage_drive_http_429','storage_drive_http_500','storage_drive_http_502','storage_drive_http_503','storage_drive_http_504'],true))throw $e;
             $r=$http($url,$token,'PUT','',['Content-Length: 0','Content-Range: bytes */'.$total,'Expect:']);
            }
            if(in_array($r['code'],[200,201],true)){
             $id=$r['json']['id']??null;
             if($end!==$total-1||!is_string($id)||!preg_match('/^[A-Za-z0-9_-]{10,200}$/D',$id))throw new RuntimeException('storage_drive_upload_failed');
             return $id;
            }
            if($r['code']!==308)throw new RuntimeException('storage_drive_http_'.$r['code']);
            $range=$r['headers']['range']??'';$next=0;
            if($range!==''){if(!preg_match('/^bytes=0-([0-9]+)$/D',$range,$m))throw new RuntimeException('storage_drive_range');$next=(int)$m[1]+1;}
            if($next<$offset||$next>$end+1||$next>=$total||($next%262144)!==0)throw new RuntimeException('storage_drive_range');
            if($next===$offset){if(++$stalled>=2)throw new RuntimeException('storage_drive_transport');}else $stalled=0;
            $offset=$next;
           }
           throw new RuntimeException('storage_drive_transport');
          }
          """
          def patch(raw):
              src=raw.decode('utf-8')
              anchor="function n80_storage_put_bytes(string $name,string $bytes,string $key):array {"
              if src.count(anchor)!=1: raise RuntimeError('patch_anchor_mismatch')
              src=src.replace(anchor,module+anchor,1)
              old="   $r=n80_storage_http('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',$token,'POST',$body,['Content-Type: multipart/related; boundary='.$b]);"
              if src.count(old)!=1: raise RuntimeError('patch_upload_anchor_mismatch')
              src=src.replace(old,"   if(strlen($bytes)>262144){$id=n80_storage_resumable($meta,$bytes,$token);}\n   else {\n"+old,1)
              tail="   if(!is_string($id)||!preg_match('/^[A-Za-z0-9_-]{10,200}$/D',$id))throw new RuntimeException('storage_drive_upload_failed');\n  }catch(RuntimeException $e){"
              if src.count(tail)!=1: raise RuntimeError('patch_tail_anchor_mismatch')
              src=src.replace(tail,tail.replace("\n  }catch","\n   }\n  }catch"),1)
              return src.encode('utf-8')
          repair=r"""<?php
          declare(strict_types=1);
          $root='/hosting/noastudio/noa-hub';
          $target='/hosting/noastudio/html/noa-app/engine/storage-drive.php';
          $before='@BEFORE@';$after='@AFTER@';
          $out=['ok'=>false,'mode'=>'one_time_resumable_repair','sourceWrites'=>0];$stage='bootstrap';
          try{
           require_once '/hosting/noastudio/html/common.php';if(session_status()===PHP_SESSION_ACTIVE)session_write_close();
           require_once '/hosting/noastudio/html/noa-app/engine/hub.php';
           require_once $target;
           $stage='lock';
           $out=n80_hub_locked($root,static function()use($root,$target,$before,$after,&$stage):array{
            $src=n80_hub_read($root,'source.json');$ctrl=n80_hub_read($root,'control.json');
            if(($src['revision']??null)!==1208||n80_hub_read($root,'journal.json')!==[]||($ctrl['stop']??false)!==true||($ctrl['paused']??false)!==true)throw new RuntimeException('maintenance_fence');
            $original=__DIR__.'/original.php';$candidate=__DIR__.'/candidate.php';
            if(is_link($target)||is_link($original)||is_link($candidate)||hash_file('sha256',$target)!==$before||hash_file('sha256',$original)!==$before||hash_file('sha256',$candidate)!==$after)throw new RuntimeException('preimage_changed');
            $stage='private_preimage';$raw=file_get_contents($original);
            $backup=n80_storage_put_bytes('N80-emergency-resumable-preimage-'.$before.'.php',$raw,hash('sha256','emergency-resumable:'.$before));
            $read=n80_storage_http('https://www.googleapis.com/drive/v3/files/'.$backup['fileId'].'?alt=media',n80_storage_access());
            if($read['code']!==200||!hash_equals($raw,$read['body']))throw new RuntimeException('backup_probe_readback_mismatch');
            $stage='activate';if(!chmod($candidate,0644)||!rename($candidate,$target))throw new RuntimeException('atomic_rename_failed');
            try{
             clearstatcache(true,$target);if(hash_file('sha256',$target)!==$after)throw new RuntimeException('live_hash_mismatch');
             $receipt=['ok'=>true,'mode'=>'one_time_resumable_repair','sourceRevision'=>1208,'sourceWrites'=>1,'beforeSha256'=>$before,'afterSha256'=>$after,'backupFileId'=>$backup['fileId'],'backupReadbackVerified'=>true,'checkedAt'=>time(),'normalReleaseHistoryChanged'=>false];
             n80_hub_write($root,'emergency-resumable-repair-1208.json',$receipt);
             if(n80_hub_read($root,'emergency-resumable-repair-1208.json')!==$receipt)throw new RuntimeException('receipt_readback_failed');
             if(function_exists('opcache_invalidate'))@opcache_invalidate($target,true);
             return $receipt;
            }catch(Throwable $e){
             clearstatcache(true,$target);if(hash_file('sha256',$target)===$after&&chmod($original,0644))rename($original,$target);
             if(function_exists('opcache_invalidate'))@opcache_invalidate($target,true);throw $e;
            }
           },2000);
          }catch(Throwable $e){
           $reason=$e instanceof NoaOAuthFailure?$e->reason:$e->getMessage();
           $out['stage']=$stage;$out['error']=is_string($reason)&&preg_match('/^[a-z][a-z0-9_]{1,100}$/D',$reason)?$reason:'unclassified_error';
          }
          echo 'N80_RESUMABLE_REPAIR='.json_encode($out,JSON_THROW_ON_ERROR)."\n";
          """
          t=s=None; folder=None; endpoint=None; phase='connect'
          try:
              t=paramiko.Transport((os.environ['NOA_SSH_HOST'],2022))
              t.get_security_options().key_types=('ssh-ed25519',)
              t.start_client(timeout=18)
              fp='SHA256:'+base64.b64encode(hashlib.sha256(t.get_remote_server_key().asbytes()).digest()).decode().rstrip('=')
              if fp!=PIN: raise RuntimeError('host_key_mismatch')
              t.auth_password(os.environ['NOA_SSH_USER'],os.environ['NOA_SSH_PASSWORD'])
              s=paramiko.SFTPClient.from_transport(t)
              s.get_channel().settimeout(25)
              phase='preflight'
              if s.normalize(WEB)!=WEB or s.normalize(ROOT)!=ROOT: raise RuntimeError('root_mismatch')
              src=json.loads(read_regular(s,ROOT+'/source.json',65536))
              journal=json.loads(read_regular(s,ROOT+'/journal.json',16777216))
              if src.get('revision')!=1208 or journal: raise RuntimeError('source_or_journal_changed')
              old=read_regular(s,REMOTE,65536)
              if digest(old)!=OLD or len(old)!=6235: raise RuntimeError('live_preimage_mismatch')
              new=patch(old);new_sha=digest(new)
              repair=repair.replace('@BEFORE@',OLD).replace('@AFTER@',new_sha)
              with tempfile.TemporaryDirectory() as tmp:
                  local=Path(tmp)/'candidate.php';local.write_bytes(new)
                  subprocess.run(['php','-l',str(local)],check=True,capture_output=True)
                  local.write_text(repair,encoding='utf-8')
                  subprocess.run(['php','-l',str(local)],check=True,capture_output=True)
              phase='private_stage'
              folder=ROOT+'/.n80-storage-resumable-'+secrets.token_hex(12)
              s.mkdir(folder,0o700)
              stage(s,folder+'/original.php',old)
              stage(s,folder+'/candidate.php',new)
              stage(s,folder+'/repair.php',repair.encode())
              phase='locked_resumable_repair'
              # SFTP-only hosting: execute the fixed locked repair through web PHP.
              # A per-run 256-bit credential, POST-only, expiry and self-removal
              # are required. No arbitrary operation, path or public repair API.
              credential=secrets.token_hex(32)
              endpoint_name='n80-once-'+secrets.token_hex(24)+'.php'
              endpoint=WEB+'/'+endpoint_name
              expires=int(time.time())+150
              wrapper=r"""<?php
          declare(strict_types=1);
          header('Cache-Control: no-store');
          header('Content-Type: text/plain; charset=UTF-8');
          header('X-Content-Type-Options: nosniff');
          $auth=$_SERVER['HTTP_X_N80_ONCE']??'';
          if(($_SERVER['REQUEST_METHOD']??'')!=='POST'||time()>@EXPIRES@||!is_string($auth)||strlen($auth)!==64||!hash_equals('@DIGEST@',hash('sha256',$auth))){http_response_code(404);exit;}
          if(!unlink(__FILE__)){http_response_code(503);exit;}
          ob_start();register_shutdown_function(static function(){ $e=error_get_last(); if($e&&in_array($e['type'],[E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR],true)){while(ob_get_level())ob_end_clean();http_response_code(200);echo 'N80_PROVIDER_FATAL='.json_encode(['type'=>$e['type'],'file'=>basename($e['file']),'line'=>$e['line']]);}});
          require '@REPAIR@';
          """
              wrapper=wrapper.replace('@EXPIRES@',str(expires)).replace('@DIGEST@',digest(credential.encode())).replace('@REPAIR@',folder+'/repair.php').encode()
              with tempfile.TemporaryDirectory() as tmp:
                  local=Path(tmp)/'endpoint.php';local.write_bytes(wrapper)
                  subprocess.run(['php','-l',str(local)],check=True,capture_output=True)
              stage(s,endpoint,wrapper)
              s.chmod(endpoint,0o644)
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*args,**kwargs): return None
              request=urllib.request.Request('https://noastudio.ai.kr/'+endpoint_name,data=b'',headers={'X-N80-Once':credential},method='POST')
              out=b''
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request,timeout=125) as response:
                      out=response.read(8192)
              except urllib.error.HTTPError as e:
                  print('N80_DIAG_HTTP='+str(e.code));out=e.read(8192)
              except (urllib.error.URLError,TimeoutError,OSError) as e:
                  print('N80_DIAG_TRANSPORT='+type(e).__name__)
              lines=out.decode('utf-8','replace').splitlines()
              proof=next((json.loads(x.split('=',1)[1]) for x in lines if x.startswith('N80_RESUMABLE_REPAIR=')),None)
              if proof is not None and proof.get('ok') is not True:
                  print('N80_RESUMABLE_REPAIR='+json.dumps(proof));raise RuntimeError('repair_rejected')
              saved=json.loads(read_regular(s,ROOT+'/emergency-resumable-repair-1208.json',65536))
              if saved.get('ok') is not True or saved.get('beforeSha256')!=OLD or saved.get('afterSha256')!=new_sha or digest(read_regular(s,REMOTE,65536))!=new_sha: raise RuntimeError('repair_readback_mismatch')
              if proof is not None and saved!=proof: raise RuntimeError('receipt_mismatch')
              print('N80_RESUMABLE_REPAIR='+json.dumps(saved))
          except Exception as e:
              print('N80_EMERGENCY_RECOVERY_FAILED='+json.dumps({'phase':phase,'errorClass':type(e).__name__}))
              raise SystemExit(1)
          finally:
              if s is not None:
                  if endpoint:
                      try:s.remove(endpoint)
                      except OSError:pass
                  if folder:
                      for name in ('repair.php','candidate.php','original.php'):
                          try:s.remove(folder+'/'+name)
                          except OSError:pass
                      try:s.rmdir(folder)
                      except OSError:pass
                  s.close()
              if t is not None:t.close()
          PY
