name: Publish verified community points guide
on:
  push:
    branches: [main]
    paths: ['docs/notices/NOA_POINTS_FIELDGUIDE.json','.github/workflows/noa-points-guide.yml']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_notice_publish.py --points
      - name: Read back the published body publicly
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          p=json.loads(Path('docs/notices/NOA_POINTS_FIELDGUIDE.json').read_text())
          url='https://noastudio.ai.kr/noa-bridge/ecosystem.php?action=detail&id='+p['id']
          with urllib.request.urlopen(url,timeout=30) as r: actual=json.load(r)['post']
          assert actual['body']==p['body'] and actual['visibility']=='public'
          print('VERIFIED_PUBLIC_SIGNUP_AND_MONTHLY_GUIDE')
          PY
