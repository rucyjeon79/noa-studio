name: Busan ON floating guide and supplementary comments
on:
  push:
    branches: [main]
    paths: ['.github/workflows/busan-widget.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions: {contents: read}
concurrency: {group: busan-readonly-sftp, cancel-in-progress: false}
jobs:
  busan-on:
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: mbstring}
      - name: Validate isolated candidate and role rules
        run: |
          python3 - <<'PY'
          import base64,zipfile,io
          data=base64.b64decode('')
          open('/tmp/busan-widget.zip','wb').write(data)
          zipfile.ZipFile(io.BytesIO(data)).extractall('/tmp/busan-widget')
          PY
          find /tmp/busan-widget -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check /tmp/busan-widget/busan-assistant/widget.js
          npm install --prefix /tmp/busan-widget jsdom@26.1.0 --no-audit --no-fund
          node /tmp/busan-widget/tests/widget-ui-test.cjs
          php /tmp/busan-widget/tests/persona_test.php
          php /tmp/busan-widget/tests/ai-runtime-test.php
          python3 /tmp/busan-widget/tests/widget_smoke.py
      - run: python3 -m pip install paramiko==3.5.1
      - name: Deploy approved widget or process new-post queue
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          cd scripts
          python3 - <<'PY'
          import os,socket,hmac,json,stat,time,urllib.request,urllib.error,base64,zipfile,io,hashlib
          from pathlib import Path
          import paramiko
          from busan_readonly_check import configuration,fingerprint,PORT,ROOT
          host,user,password,pin=configuration(os.environ)
          private='/hosting/rucyjeon79/busan-assistant-private'
          mode=os.environ.get('GITHUB_EVENT_NAME','push')
          with socket.create_connection((host,PORT),timeout=15) as sock:
           with paramiko.Transport(sock) as t:
            t.banner_timeout=15;t.auth_timeout=15;t.get_security_options().key_types=('ssh-ed25519',)
            t.start_client(timeout=20)
            if not hmac.compare_digest(fingerprint(t.get_remote_server_key()),pin):raise RuntimeError('host_key_mismatch')
            t.auth_password(user,password,fallback=False)
            with paramiko.SFTPClient.from_transport(t) as s:
             s.get_channel().settimeout(25)
             assert s.normalize(ROOT)==ROOT and s.normalize(private)==private
             with s.open(private+'/activity-account.json','rb') as f:identity=json.loads(f.read(8192))
             if mode=='push' or mode=='workflow_dispatch':
              ai_path=private+'/ai-chat.json'
              try:
               with s.open(ai_path,'rb') as f:ai_status=json.loads(f.read(8192))
               print(json.dumps({'ai_config_present':True,'ai_enabled':ai_status.get('enabled') is True,'ai_key_present':bool(ai_status.get('api_key')),'ai_model_present':bool(ai_status.get('model')),'ai_model_expected':ai_status.get('model')=='gpt-6-sol'},ensure_ascii=False))
              except FileNotFoundError:print('AI_CONFIG_NOT_SAVED')

              z=zipfile.ZipFile('/tmp/busan-widget.zip')
              files={n:z.read(n) for n in z.namelist() if n.startswith(('busan-assistant/','extend/')) and not n.endswith('/')}
              expected={'busan-assistant/persona.php','busan-assistant/widget-api.php','busan-assistant/widget.js','busan-assistant/widget.css','busan-assistant/comment-worker.php','busan-assistant/ai-runtime.php','busan-assistant/ai-settings.php','extend/busan-on.extend.php'}
              assert set(files)==expected
              # Preflight every destination before activating any extension.
              for n,data in files.items():
               target=ROOT+'/'+n
               try:
                assert stat.S_ISREG(s.lstat(target).st_mode) and s.normalize(target)==target
                with s.open(target,'rb') as f:old=f.read(200000)
                assert old==data or hashlib.sha256(old).hexdigest()=={'busan-assistant/persona.php': '77eaf75b855f17a882aa8707b25df6bc8657f05f37d1dc91dc8cc72e72437586', 'busan-assistant/widget-api.php': '66299360cc4f646f0b880d56d6c3bf305505cb7f59ba022f1895917b3e5e03c2', 'busan-assistant/widget.js': '1d3248ede94f986e3c84185fff0ec7bf7870bff22dcf20ecd9dbce9b2f646d38', 'busan-assistant/widget.css': 'c4630d162aaa37dc692058971efad7ec5f1cb703c6f6846b316ff6a62ee54dca', 'busan-assistant/comment-worker.php': '8ed91b5321b3f02575c426e61bbd6c6df60caaba8e446f1f941bfc7a45534920', 'extend/busan-on.extend.php': 'd556f5c0bfba04a86775877c94e4106236724dbdfb23c50bf2d5c4bb4748fe76', 'busan-assistant/ai-runtime.php': '07b49b56da3e0578b8ccacc14361c8206f373afc67432a180572d034405f1f6a', 'busan-assistant/ai-settings.php': '13c4ce8671ef9d6fa6e92acc87f5ec4075f5d7c9ec3fafd47e83bcec7b878f44'}.get(n), 'existing_unowned_file_conflict'
               except FileNotFoundError:pass
              queue=private+'/comment-queue'
              try:s.mkdir(queue,0o700)
              except OSError:assert stat.S_ISDIR(s.lstat(queue).st_mode) and s.normalize(queue)==queue
              settings=private+'/comments-settings.json'
              try:
               with s.open(settings,'rb') as f:json.loads(f.read(4096))
              except FileNotFoundError:
               with s.open(settings,'wx') as f:f.write(json.dumps({'enabled':True,'activated_at':int(time.time()),'policy':'procedural-supplements-only-v1'}).encode())
               s.chmod(settings,0o600)
              for n in sorted(files,key=lambda n:(n.startswith('extend/'),0 if n.endswith('/ai-runtime.php') else 1)):
               target=ROOT+'/'+n;data=files[n]
               try:
                with s.open(target,'rb') as f:
                 if f.read(200000)==data:continue
               except FileNotFoundError:pass
               temp=private+'/upload-'+n.rsplit('/',1)[1]
               with s.open(temp,'w') as f:f.write(data)
               s.chmod(temp,0o644)
               try:
                with s.open(target,'rb') as f:backup=f.read(200000)
                backup_path=private+'/before-mobile-voice-'+n.rsplit('/',1)[1]
                try:
                 with s.open(backup_path,'wx') as f:f.write(backup)
                 s.chmod(backup_path,0o600)
                except IOError:pass
                s.posix_rename(temp,target)
               except FileNotFoundError:s.rename(temp,target)
               with s.open(target,'rb') as f:assert f.read(200000)==data
              print('verified six widget and event-hook files; private queue enabled')
          # Never log credentials, post bodies, or member records.
          for _ in range(5):
           req=urllib.request.Request('https://skhnslu-busan.com/busan-assistant/comment-worker.php',data=b'',headers={'X-Busan-Agent-Token':identity['agent_token']})
           with urllib.request.urlopen(req,timeout=35) as r:result=json.loads(r.read(8192))
           print(json.dumps(result,ensure_ascii=False))
           if not result.get('processed'):break
          if mode in ('push','workflow_dispatch'):
           with urllib.request.urlopen('https://skhnslu-busan.com/',timeout=25) as r:page=r.read(2000000).decode('utf-8')
           assert '/busan-assistant/widget.js?v=20261023-17' in page,'hook_missing'
           with urllib.request.urlopen('https://skhnslu-busan.com/busan-assistant/widget-api.php',timeout=20) as r:context=json.loads(r.read(8192))
           assert context['name']=='부산지부ON' and context['member'] is False
           try:
            urllib.request.urlopen(urllib.request.Request('https://skhnslu-busan.com/busan-assistant/comment-worker.php',data=b''),timeout=15)
            raise RuntimeError('worker_missing_auth')
           except urllib.error.HTTPError as e:assert e.code==403
           req=urllib.request.Request('https://skhnslu-busan.com/busan-assistant/comment-worker.php',data=b'',headers={'X-Busan-Agent-Token':identity['agent_token'],'X-Busan-Diagnostic':'ai-health-v1'})
           with urllib.request.urlopen(req,timeout=20) as r:health=json.loads(r.read(4096))
           print(json.dumps(health,ensure_ascii=False))
           print('PASS live native tail hook, guest widget session, protected comment worker')
          PY

