name: NOA referral signup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-referral.yml','scripts/noa_referral_release.py','scripts/noa_referral_inventory.py']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_referral_inventory.py
