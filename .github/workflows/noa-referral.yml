name: NOA referral signup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-referral.yml','scripts/noa_referral_release.py','scripts/noa_referral_inventory.py','bridge/referral*.php','deploy/noa-referral.*','tests/referral/**']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated-noa-ci, MYSQL_DATABASE: noa_subscription_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated-noa-ci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noa_subscription_test;charset=utf8mb4'
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: isolated-noa-ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli,pdo_mysql,pdo_sqlite,mbstring'}
      - name: Verify atomic credits and duplicate signup protection
        run: |
          php -l bridge/referral-core.php
          php -l bridge/referral.php
          php -l deploy/noa-referral.extend.php
          php -l bridge/creator-enrollment-core.php
          php tests/referral/mysql.php
          python tests/referral/race.py
          php tests/referral/native.php
          php tests/referral/native.php check
          node --check deploy/noa-referral.js
          php -l deploy/noa-app/home.php
          php -l bridge/notices.php
          php tests/membership/notices.php
      - name: Verify shared invitation UI on mobile and desktop
        run: |
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/noa-referral" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/referral/ui.mjs "$RUNNER_TEMP/noa-referral/check.mjs"
          node "$RUNNER_TEMP/noa-referral/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-referral-fixture-${{ github.run_id }}', path: 'referral-proof/', retention-days: 7}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy verified UI assets and check public hashes
        run: python scripts/noa_referral_release.py
      - name: Update the pinned guide in place and verify the shared preview
        if: contains(github.event.head_commit.message, '[guide-release]')
        run: |
          if [[ "${{ contains(github.event.head_commit.message, '[illustrated-release]') }}" == 'true' ]]; then
            php -l scripts/noa_points_publish.php
            python scripts/noa_notice_publish.py --points
          fi
          python scripts/noa_notice_publish.py
          python scripts/qa/noa_share_preview.py
      - name: Inspect all live destinations without transactions
        run: |
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/noa-live-ui" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/referral/ui.mjs "$RUNNER_TEMP/noa-live-ui/check.mjs"
          LIVE_ONLY=1 node "$RUNNER_TEMP/noa-live-ui/check.mjs"
          if [ -f points-proof/receipt.json ]; then
            cp scripts/qa/noa-illustrated-guide.mjs "$RUNNER_TEMP/noa-live-ui/illustrated.mjs"
            node "$RUNNER_TEMP/noa-live-ui/illustrated.mjs"
          fi
          if [ -f notice-proof/receipt.json ]; then
            cp scripts/qa/noa-notice-published.mjs "$RUNNER_TEMP/noa-live-ui/guide.mjs"
            node "$RUNNER_TEMP/noa-live-ui/guide.mjs"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-referral-live-${{ github.run_id }}', path: 'referral-proof/', retention-days: 7}
