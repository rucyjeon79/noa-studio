name: NOA Community navigation
# Isolated release after the shared presentation checks have been queued.
on:
  push:
    branches: [main]
    paths: ['scripts/noa_community_navigation_release.py', 'tests/navigation/community-navigation.mjs', '.github/workflows/noa-community-navigation.yml']
permissions: {contents: read}
concurrency: {group: noa-production-sftp, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Verify navigation, theme and PHP view
        run: |
          node --check deploy/noa-ainoa.js
          node --check deploy/noa-ecosystem.js
          php -l deploy/noa-app/ecosystem-view.php
          php tests/community/navigation.php
          php -l bridge/community-core.php
          php -l deploy/noa-design.extend.php
          php -l deploy/noa-sitemap.php
          node --check deploy/noa-community.js
          node --check deploy/noa-ecosystem.js
          python -m py_compile scripts/noa_community_navigation_release.py
      - name: Verify community destinations and private request mounting
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-home" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/navigation/community-navigation.mjs "$RUNNER_TEMP/noa-home/check.mjs"
          node "$RUNNER_TEMP/noa-home/check.mjs"
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy community navigation and verify public hashes
        run: python scripts/noa_community_navigation_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-navigation-${{ github.run_id }}', path: 'community-navigation-proof/', retention-days: 7}
