name: NOA existing feature quality gates
on:
  pull_request:
    paths: ['deploy/**','bridge/**','lab/**','tests/**','android/**','scripts/qa/**','scripts/n80_*','scripts/noa_category_release.py','scripts/noa_finish_drive_receipt.json','.github/workflows/noa-category-order-final.yml','.github/workflows/noa-quality-gates.yml','.github/workflows/n80-completion-report.yml']
  push:
    branches: [main]
    paths: ['deploy/**','bridge/**','lab/**','tests/**','android/**','scripts/qa/**','scripts/n80_*','scripts/noa_category_release.py','scripts/noa_finish_drive_receipt.json','.github/workflows/noa-category-order-final.yml','.github/workflows/noa-quality-gates.yml','.github/workflows/n80-completion-report.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  engines:
    runs-on: ubuntu-latest
    outputs:
      release_scope: ${{ steps.release-scope.outputs.release_scope }}
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-test-only, MYSQL_DATABASE: noa_catalog_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pnoa-test-only" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Match changes against the existing integrated release push filter
        id: release-scope
        run: python scripts/n80_completion_pipeline.py scope
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mbstring, pdo_mysql, pdo_sqlite'}
      - name: Prepare isolated fixtures and verified processing tools
        run: |
          python3 scripts/noa_build_seed.py
          python3 scripts/noa_catalog_seed.py
          python3 -m pip install --user numpy==2.2.6 scipy==1.15.3 'paramiko>=3,<5'
          python scripts/qa/noa-qa-font.py
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if ! timeout 120 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y -qq ffmpeg; then
              timeout 90 sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
              timeout 120 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y -qq ffmpeg
            fi
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Verify existing engines, access checks and SQL invariants
        env:
          NOA_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=noa_catalog_test;charset=utf8mb4
        run: |
          for f in bridge/*.php deploy/noa*.php deploy/theme/noa_studio/*.php deploy/theme/noa_studio/mobile/*.php; do php -l "$f"; done
          php -d memory_limit=256M tests/catalog/merge_test.php
          php -d memory_limit=256M tests/catalog/mysql_test.php
          php tests/catalog/home_test.php
          php tests/youtube/core_test.php
          php tests/youtube/mysql_test.php
          php tests/catalog/recovery_test.php
          php tests/catalog/recovery_mysql_test.php
          php tests/lab/core_test.php
          php tests/lab/oauth_test.php
          php tests/n80/completion_receipt_test.php
          for test in tests/engine/*_test.php; do php "$test"; done
          php tests/p0/world_act_membership.php
          php tests/popularity/stream_tracking_test.php
          node --test tests/popularity/player_tracker_test.cjs
          python tests/popularity/stream_source_contract.py
          python -m unittest discover -s tests/popularity -p test_playcount_activate.py -v
          python -m unittest discover -s tests/engine -p 'test_live_music_consumer.py' -v
          php -l deploy/noa-app/engine/completion-report.php
          php -l deploy/noa-app/engine/completion-receipt.php
          php tests/catalog/music_readmodel_test.php
          php tests/sitemap/registry_test.php
          node --test tests/home/metadata_test.cjs tests/playlists/drag_order_test.cjs tests/youtube/lazy_details_test.cjs
          php tests/sitemap/popularity_route_test.php
          python tests/youtube/detail_endpoint_test.py
          python -m py_compile scripts/n80_workstate_sync.py
          python3 tests/sitemap/home_patch_test.py
          python3 -m unittest discover -s tests/n80 -p 'test_completion*.py'
          php -l bridge/user-playlists.php
          NOA_PLAYLIST_TEST_MYSQL=1 NOA_PLAYLIST_TEST_PASSWORD=noa-test-only python3 tests/playlists/native_mysql_test.py
          python3 tests/lab/http_test.py
          node --test tests/lab/*.test.mjs scripts/noa_player_regression.test.mjs scripts/qa/*.test.mjs
          python3 -m unittest discover -s tests/lab -p '*_test.py'
          for f in deploy/noa*.js lab/*.mjs; do node --check "$f"; done
      - name: Verify actual MP3 playback and exactly one valid MySQL play on loopback
        env:
          NOA_PLAYCOUNT_TEST_MYSQL: '1'
          NOA_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/noa-playcount/package.json
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-playcount" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          php tests/popularity/policy_mysql_test.php
          python tests/popularity/real_stream_mysql_test.py
      - name: Verify live public and protected routes without modifying data
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(NoRedirect())
          cases={'/':200,'/noa-music.php':302,'/noa-youtube.php':302,'/noa-catalog.php':302,'/noa-my.php':302,'/noa-login.php':200,'/bbs/login.php':302,'/bbs/login.php?legacy=1':200,'/bbs/register.php':302,'/bbs/search.php':302,'/noa-library.php':302,'/noa-editor.php':302,'/noa-catalog-admin.php':302,'/noa-youtube-admin.php':302,'/noa-bridge/lab-api.php':403,'/noa-bridge/source-audit.php':403,'/noa-bridge/user-playlists.php':401}
          for path,expected in cases.items():
              try:r=opener.open('https://noastudio.ai.kr'+path,timeout=25)
              except urllib.error.HTTPError as e:r=e
              assert r.status==expected,(path,r.status)
              if path in ['/bbs/login.php','/bbs/register.php']: assert '/noa-login.php' in r.headers.get('Location',''),(path,'wrong_social_destination')
              print('LIVE_ACCESS',path,r.status)
          PY
  finish-live:
    if: github.ref == 'refs/heads/main' && needs.engines.outputs.release_scope == 'true' && !contains(github.event.head_commit.message, '[ainoa-release]')
    needs: engines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Wait for existing category release at this exact SHA
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/n80_completion_pipeline.py wait --commit "$GITHUB_SHA"
      - name: Verify actual deployed behavior without changing production data
        env: {NOA_FINISH_QA_OUTPUT: '${{ runner.temp }}/noa-finish-proof/verified.json'}
        run: |
          mkdir -p "$RUNNER_TEMP/noa-finish-proof"
          npm install --prefix "$RUNNER_TEMP/noa-finish-live" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          NOA_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/noa-finish-live/package.json" node scripts/qa/noa-finish-live.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: noa-finish-live-${{ github.run_id }}
          path: '${{ runner.temp }}/noa-finish-proof/verified.json'
          if-no-files-found: error
          retention-days: 2
