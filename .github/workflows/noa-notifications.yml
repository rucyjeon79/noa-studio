name: NOA AInoa personal activity notifications
on:
  pull_request:
    paths: ['bridge/notification*.php','deploy/noa-notifications.*','deploy/noa-sw.js','scripts/noa_notification*','scripts/noa_push_dispatch.py','scripts/qa/noa-notifications.mjs','tests/notifications/**','.github/workflows/noa-notifications.yml','.github/workflows/noa-push-dispatch.yml']
  push:
    branches: [main]
    paths: ['bridge/notification*.php','deploy/noa-notifications.*','deploy/noa-sw.js','scripts/noa_notification*','scripts/noa_push_dispatch.py','scripts/qa/noa-notifications.mjs','tests/notifications/**','.github/workflows/noa-notifications.yml','.github/workflows/noa-push-dispatch.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: fixture-only}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pfixture-only" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli, pdo_mysql, mbstring, openssl, curl'}
      - run: python -m pip install 'pywebpush==2.4.0' 'paramiko>=3,<5'
      - name: Verify durable ownership, consent, queue and encryption
        run: |
          for file in bridge/notification*.php deploy/noa-notifications*.php scripts/noa_notifications_control.php; do php -l "$file"; done
          node --check deploy/noa-notifications.js
          node tests/notifications/sw_test.cjs
          python tests/notifications/push_test.py
          php tests/notifications/fixture.php
          sudo install -d -m 0777 /workspace/screenshots
          python scripts/qa/noa-qa-font.py
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-notifications" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-notifications.mjs "$RUNNER_TEMP/noa-notifications/check.mjs"
      - name: Test authenticated APIs, worker signature, mobile and desktop UI
        run: node "$RUNNER_TEMP/noa-notifications/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-notifications-candidate-${{ github.run_id }}', path: notifications-proof/, retention-days: 7}
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'pywebpush==2.4.0' 'paramiko>=3,<5'
      - name: Preserve stable push identity outside the web root
        run: python scripts/noa_push_dispatch.py init
      - name: Install reviewed source with protected preimages
        id: upload
        run: python scripts/noa_notifications_release.py
      - name: Install only additive notification tables and baseline cursors
        run: python scripts/noa_notifications_control.py
      - name: Verify production controls and dispatch only genuine opted-in activity
        run: |
          python scripts/noa_push_dispatch.py health
          python scripts/noa_push_dispatch.py
          python - <<'PY'
          import urllib.request,urllib.error,json
          from pathlib import Path
          root='https://noastudio.ai.kr'
          with urllib.request.urlopen(root+'/noa-notifications.php',timeout=30) as r:html=r.read().decode()
          assert '/noa-notifications.js?v=' in html and '내 활동 알림' in html
          for path,code in [('/noa-bridge/notifications.php',401),('/noa-bridge/notification-worker.php',404)]:
            try:
              urllib.request.urlopen(urllib.request.Request(root+path,data=b'{}',headers={'Content-Type':'application/json','Origin':root}),timeout=30)
              raise AssertionError('unauthorized access accepted')
            except urllib.error.HTTPError as e:assert e.code==code,(path,e.code)
          Path('notifications-proof/live.json').write_text(json.dumps({'pageAndAssets':True,'guestApiDenied':True,'unsignedWorkerDenied':True,'productionSyntheticWrites':0,'physicalPhoneDeliveryVerified':False}))
          PY
      - name: Restore owned public files on failure
        if: failure() && steps.upload.outcome != 'skipped'
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_notifications_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-notifications-live-${{ github.run_id }}', path: notifications-proof/, retention-days: 7}
