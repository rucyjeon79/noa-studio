name: NOA legacy notification worker (retired; N80-owned)
# Owner directive 2026-11-17: NOA business operations are N80-owned.
# GitHub Actions can only send an approved, signed scheduled wake to N80.
# Legacy production SSH, queue claims, database, notification, media and
# background jobs are NOT executed here; their history is retained in Git.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Retired GitHub business runner; use N80 user-action or approved scheduled wake."
