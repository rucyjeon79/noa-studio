name: NOA plain language production release
on:
  push:
    branches: [main]
    paths: ['scripts/noa_plain_language_manifest.json', 'scripts/noa_plain_language_release.py', '.github/workflows/noa-plain-language.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Check edited sources and existing upload behavior
        run: |
          python -m pip install 'paramiko>=3,<5'
          python -m py_compile scripts/noa_plain_language_release.py
          python - <<'PY'
          import json,subprocess
          for f in json.load(open('scripts/noa_plain_language_manifest.json'))['files']:
              p=f['source']
              subprocess.run(['php','-l',p] if p.endswith('.php') else ['node','--check',p],check=True)
          PY
          node --test tests/jukebox/transport_test.cjs tests/jukebox/reservations_test.cjs
      - name: Apply reviewed wording to current live files and verify public scripts
        run: python scripts/noa_plain_language_release.py
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: noa-plain-language-proof, path: plain-language-proof/, retention-days: 7}
