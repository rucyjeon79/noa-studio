name: NOA permanent Android release identity
on:
  push:
    branches: [work/n80-apk-update-20261029]
    paths: ['.github/workflows/noa-android-release-key.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: noa-android-release-identity
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m pip install --user 'paramiko==3.5.1'
      - name: Create once and verify private release identity
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: python3 scripts/qa/noa-release-key.py
      - uses: actions/upload-artifact@v4
        with:
          name: NOA-Android-encrypted-signing-recovery
          path: signing-proof/
          if-no-files-found: error
          retention-days: 90
