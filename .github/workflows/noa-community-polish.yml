name: NOA Community readability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-community-polish.yml','scripts/noa_community_polish_release.py','tests/navigation/community-polish.mjs']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli, pdo_mysql, mbstring'}
      - name: Verify syntax and install Korean QA fonts
        run: |
          php -l bridge/community-core.php
          php -l deploy/noa-app/ecosystem-view.php
          node --check deploy/noa-community.js
          node --check deploy/noa-ecosystem.js
          python scripts/qa/noa-qa-font.py
      - name: Verify feed hierarchy, ordering and empty states
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-requests" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/navigation/community-polish.mjs "$RUNNER_TEMP/noa-requests/check.mjs"
          node "$RUNNER_TEMP/noa-requests/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-community-polish-${{ github.run_id }}', path: 'community-polish-proof/', retention-days: 7}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy verified community files and check public hashes
        run: python scripts/noa_community_polish_release.py
      - name: Verify deployed mobile home
        run: |
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/noa-live-feed" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/navigation/community-polish.mjs "$RUNNER_TEMP/noa-live-feed/check.mjs"
          LIVE_ONLY=1 node "$RUNNER_TEMP/noa-live-feed/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-community-live-${{ github.run_id }}', path: 'community-polish-proof/', retention-days: 7}
