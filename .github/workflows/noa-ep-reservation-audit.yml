name: NOA EP reservation read-only audit
on:
  push:
    branches: [main]
    paths: ['scripts/noa_ep_reservation_audit.py','.github/workflows/noa-ep-reservation-audit.yml']
  pull_request:
    paths: ['scripts/noa_ep_reservation_audit.py','.github/workflows/noa-ep-reservation-audit.yml']
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile scripts/noa_ep_reservation_audit.py
  audit:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/noa_ep_reservation_audit.py
