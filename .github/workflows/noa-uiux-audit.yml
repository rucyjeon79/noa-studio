name: NOA read-only UI production inventory
on:
  pull_request:
    branches: [main]
    paths: ['scripts/noa_uiux_audit.py', '.github/workflows/noa-uiux-audit.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install --user paramiko==3.5.1
      - name: Read and hash only UI sources without server mutation
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
        run: python3 scripts/noa_uiux_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: noa-uiux-readonly-inventory, path: uiux-proof/audit/, retention-days: 7}
