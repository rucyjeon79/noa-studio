name: Recover completed Android PWA QA fixtures
on:
  push:
    branches: [work/android-qa-recovery-20261029-pwa]
    paths: ['.github/workflows/noa-android-qa-recovery.yml']
permissions: {contents: read}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m pip install --user 'paramiko==3.5.1'
      - name: Recover only exact runner-owned Android QA helpers
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: python3 scripts/qa/noa-android-cleanup.py
