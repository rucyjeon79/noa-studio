name: NOA Starlight design and music stories
on:
  pull_request:
    paths: ['bridge/world-story.php','deploy/noa-sitemap.php','deploy/noa-app/home.php','deploy/noa-starlight.css','deploy/noa-design*','deploy/noa-ui.*','deploy/noa-world*','deploy/noa-app/world-view.php','bridge/world-story.php','bridge/ui-preferences.php','tests/starlight/**','scripts/qa/noa-shared-navigation.mjs','scripts/qa/noa-spacing.mjs','scripts/noa_starlight_release.py','.github/workflows/noa-starlight.yml']
  push:
    branches: [main]
    paths: ['bridge/world-story.php','deploy/noa-sitemap.php','deploy/noa-app/home.php','deploy/noa-starlight.css','deploy/noa-ui.js','tests/starlight/**','scripts/qa/noa-shared-navigation.mjs','scripts/qa/noa-spacing.mjs','scripts/noa_starlight_release.py','.github/workflows/noa-starlight.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'dom, mbstring'}
      - name: Validate stories, source priority, account theme fallback and player contracts
        run: |
          for file in bridge/home.php bridge/community.php bridge/engagement.php bridge/ui-preferences.php bridge/world-story.php deploy/noa-design.extend.php deploy/noa-my.php deploy/noa-app/world-view.php deploy/noa-app/home.php deploy/noa-settings.php deploy/noa-theme-admin.php; do php -l "$file"; done
          for act in 0 1 2 3 4; do STARLIGHT_RENDER_DIR=starlight-proof php tests/starlight/world_test.php "$act"; done
          php tests/catalog/world_test.php
          php tests/catalog/world_mv_test.php
          php tests/p0/world_act_membership.php
          php tests/catalog/home_test.php
          php tests/catalog/home_uiux_test.php
          php tests/editorial/content_test.php
          php tests/starlight/visitors_test.php
          php tests/starlight/legacy_documents_test.php
          php tests/sitemap/registry_test.php
          php tests/membership/extension_scope.php
          node --check deploy/noa-account.js
          node --check deploy/noa-ui.js
          node --check deploy/noa-world.js
          node --test tests/starlight/navigation.test.mjs tests/starlight/theme.test.mjs scripts/qa/noa-card-balance.test.mjs scripts/qa/noa-browse.test.mjs scripts/qa/noa-hero.test.mjs scripts/noa_player_regression.test.mjs
          python -m py_compile scripts/noa_starlight_release.py
      - name: Check shared navigation at mobile and desktop widths
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-nav" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-shared-navigation.mjs "$RUNNER_TEMP/noa-nav/check.mjs"
          node "$RUNNER_TEMP/noa-nav/check.mjs"
          cp scripts/qa/noa-spacing.mjs "$RUNNER_TEMP/noa-nav/spacing.mjs"
          node "$RUNNER_TEMP/noa-nav/spacing.mjs"
      - uses: actions/upload-artifact@v4
        with: {name: 'noa-starlight-render-${{ github.run_id }}', path: starlight-proof/, retention-days: 2}
  deploy:
    if: github.event_name == 'push'
    needs: verify
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/noa_starlight_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-starlight-live-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 14}
