name: NOA premium day and night theme release
on:
  push:
    branches: [main]
    paths: ['scripts/noa_light_theme_release.py', '.github/workflows/noa-light-theme.yml', 'tests/room-themes/live.mjs', 'tests/header/drawer-live.mjs']
  workflow_dispatch:
    inputs:
      theme_clock:
        description: Verify and publish only the automatic theme schedule
        type: boolean
        default: false
permissions: {contents: read}
env:
  NOA_THEME_CLOCK: ${{ contains(github.event.head_commit.message, '[theme-clock]') || inputs.theme_clock == true }}
jobs:
  preflight:
    env:
      NOA_MENU_DRAWER: ${{ contains(github.event.head_commit.message, '[menu-drawer]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Validate the five files in a clock-only release
        if: env.NOA_THEME_CLOCK == 'true'
        run: |
          node --test tests/starlight/theme.test.mjs
          node --check deploy/noa-ui.js
          php -l deploy/noa-design.extend.php
          php -l deploy/noa-theme-admin.php
          node -e "for(const p of ['noa-design','noa-interface-labels']) JSON.parse(require('fs').readFileSync('deploy/'+p+'.json','utf8'))"
          python tests/room-themes/release_freshness_test.py
      - name: Validate saved preferences, default theme and contrast
        if: env.NOA_THEME_CLOCK != 'true'
        run: |
          node --test tests/starlight/theme.test.mjs tests/starlight/sections.test.mjs scripts/qa/noa-precision.test.mjs scripts/qa/noa-card-balance.test.mjs
          node --check deploy/noa-ui.js
          node --check deploy/noa-account.js
          node --test tests/starlight/navigation.test.mjs
          node --check deploy/noa-home.js
          node --check deploy/noa-desktop.js
          node --check deploy/noa-voice.js
          node --check deploy/noa-amt-fan.js
          node --test tests/voice/composer_test.cjs
          node --check tests/room-themes/member.mjs
          node --check tests/room-themes/forms.mjs
          node --check tests/room-themes/menu-surfaces.mjs
          php -l bridge/weather.php
          php -l deploy/noa-youngcart.php
          php -l deploy/noa-youngcart.extend.php
          php tests/header/weather_test.php
          php -l bridge/ui-preferences.php
          php -l deploy/noa-theme-admin.php
          php -l deploy/noa-design.extend.php
          php -l deploy/noa-vip.php
          php -l deploy/noa-app/home.php
          php tests/catalog/home_test.php
          php tests/catalog/home_uiux_test.php
          php tests/sitemap/registry_test.php
          python tests/sitemap/home_patch_test.py
          python -m py_compile scripts/noa_light_theme_release.py
          python tests/room-themes/release_freshness_test.py
          php tests/room-themes/surface-policy.php
      - name: Prepare visual verification
        run: |
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/noa-light" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/header/header.mjs "$RUNNER_TEMP/noa-light/header.mjs"
          if [ "$NOA_THEME_CLOCK" != true ]; then node "$RUNNER_TEMP/noa-light/header.mjs"; fi
          if [ "$NOA_MENU_DRAWER" = true ]; then cp tests/header/drawer-live.mjs "$RUNNER_TEMP/noa-light/check.mjs"; else cp tests/room-themes/live.mjs "$RUNNER_TEMP/noa-light/check.mjs"; fi
          cp tests/room-themes/member.mjs "$RUNNER_TEMP/noa-light/member.mjs"
          cp tests/room-themes/surface-controls.mjs "$RUNNER_TEMP/noa-light/surface-controls.mjs"
          cp tests/room-themes/forms.mjs "$RUNNER_TEMP/noa-light/forms.mjs"
          cp tests/room-themes/player.mjs "$RUNNER_TEMP/noa-light/player.mjs"
          cp tests/room-themes/overlays.mjs "$RUNNER_TEMP/noa-light/overlays.mjs"
      - name: Exercise the new drawer on operating pages before running member fixtures
        if: env.NOA_MENU_DRAWER == 'true'
        env: {NOA_THEME_PHASE: candidate}
        run: node "$RUNNER_TEMP/noa-light/check.mjs"
      - name: Verify first-visit popups, readable greetings and modal feedback before activation
        if: env.NOA_THEME_CLOCK != 'true'
        env: {NOA_THEME_PHASE: candidate, NOA_SOURCE_ROOT: '${{ github.workspace }}'}
        run: node "$RUNNER_TEMP/noa-light/overlays.mjs"
      - name: Verify member pages, writing forms and uninterrupted playback in isolation
        if: env.NOA_THEME_CLOCK != 'true' && !contains(github.event.head_commit.message, '[design-review]')
        run: |
          php tests/room-themes/fixture.php
          node "$RUNNER_TEMP/noa-light/member.mjs"
          node "$RUNNER_TEMP/noa-light/forms.mjs"
          node "$RUNNER_TEMP/noa-light/surface-controls.mjs"
          node "$RUNNER_TEMP/noa-light/player.mjs"
      - name: Verify candidate themes before activation
        if: env.NOA_MENU_DRAWER != 'true'
        env: {NOA_THEME_PHASE: candidate, NOA_SOURCE_ROOT: '${{ github.workspace }}', NOA_VISUAL_REVIEW: '${{ contains(github.event.head_commit.message, ''[design-review]'') }}'}
        run: |
          node "$RUNNER_TEMP/noa-light/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-theme-candidate-${{ github.run_id }}
          path: room-theme-proof/
          retention-days: 7

  publish:
    needs: preflight
    if: ${{ !contains(github.event.head_commit.message, '[design-review]') && !contains(github.event.head_commit.message, '[home-banner-order]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_MENU_DRAWER: ${{ contains(github.event.head_commit.message, '[menu-drawer]') }}
      NOA_PANORAMA: ${{ contains(github.event.head_commit.message, '[panorama]') }}
      NOA_SURFACE_POLISH: ${{ contains(github.event.head_commit.message, '[surface-polish]') }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Prepare production verification
        run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/noa-light" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          if [ "$NOA_MENU_DRAWER" = true ]; then cp tests/header/drawer-live.mjs "$RUNNER_TEMP/noa-light/check.mjs"; else cp tests/room-themes/live.mjs "$RUNNER_TEMP/noa-light/check.mjs"; fi
          cp tests/room-themes/overlays.mjs "$RUNNER_TEMP/noa-light/overlays.mjs"
      - name: Activate theme assets and preferences with public hash verification
        id: activate
        if: ${{ !contains(github.event.head_commit.message, '[design-review]') }}
        run: python scripts/noa_light_theme_release.py
      - name: Verify live themes and saved selection
        id: live
        if: steps.activate.outcome == 'success'
        env: {NOA_THEME_PHASE: live, NOA_SOURCE_ROOT: '${{ github.workspace }}'}
        run: |
          if [ "$NOA_THEME_CLOCK" != true ]; then node "$RUNNER_TEMP/noa-light/overlays.mjs"; fi
          node "$RUNNER_TEMP/noa-light/check.mjs"
      - name: Summarize verified page navigation
        if: steps.live.outcome == 'success'
        run: |
          python - <<'PYTHON'
          import json, os, statistics
          from pathlib import Path
          rows = json.loads(Path('room-theme-proof/live/results.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              print('| 페이지 | 탐색 시작부터 본문 로드까지 중앙값 |', '|---|---:|', sep='\n', file=report)
              for route in dict.fromkeys(row['route'] for row in rows):
                  times = [row['navigationMs'] for row in rows if row['route'] == route]
                  print(f'| {route} | {statistics.median(times):.0f} ms |', file=report)
          PYTHON
      - name: Restore release-owned assets when live acceptance fails
        if: failure() && steps.live.outcome == 'failure'
        run: python scripts/noa_light_theme_release.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-light-theme-${{ github.run_id }}
          path: |
            room-theme-proof/
            ainoa-proof/deployment.json
          retention-days: 7

  menu-surfaces:
    needs: publish
    if: success() && !contains(github.event.head_commit.message, '[design-review]')
    uses: ./.github/workflows/noa-menu-audit.yml
    with: {deployed: true}
