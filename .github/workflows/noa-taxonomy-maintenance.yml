env:
  NOA_DRIVE_RCLONE_CONFIG_B64: ${{ secrets.NOA_DRIVE_RCLONE_CONFIG_B64 }}
name: NOA SQL category read model activation
# Distinguish confirmed ACT metadata from individual song matching in the live music view.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-taxonomy-maintenance.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-isolated-only, MYSQL_DATABASE: noa_restore_verification}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pnoa-isolated-only" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          php -l bridge/home-core.php
          php -l bridge/taxonomy-store.php
          php tests/catalog/home_test.php
          php tests/taxonomy/core_test.php
          python3 -m pip install --user paramiko==3.5.1
      - name: Check the SQL category authority against real source data
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
        run: |
          python3 scripts/noa_verify_private_backup.py
          php tests/taxonomy/mysql_test.php
  activate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency: {group: noa-dothome-production, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install --user paramiko==3.5.1
      - name: Update only verified application files; do not run SQL migration
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_TAXONOMY_PHASE: maintenance
        run: python3 scripts/noa_taxonomy_release.py
      - name: Verify the actual public integration
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-taxonomy" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-taxonomy/node_modules/.bin/playwright" install --with-deps chrome
          cp scripts/qa/noa-taxonomy-live.mjs "$RUNNER_TEMP/noa-taxonomy/live.mjs"
          node "$RUNNER_TEMP/noa-taxonomy/live.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-taxonomy-read-model-production
          path: |
            quality-taxonomy/maintenance.json
            quality-taxonomy/live-report.json
            quality-taxonomy/music-*.jpg
          retention-days: 14
