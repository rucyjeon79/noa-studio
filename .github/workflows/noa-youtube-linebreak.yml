name: Verify and publish YouTube line breaks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-youtube-linebreak.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          node --check deploy/noa-youtube.js
          node --check deploy/noa-browse.js
          node --test tests/youtube/lazy_details_test.cjs
          python -m pip install 'paramiko>=3,<5'
      - name: Publish and verify AI LAB entry
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES = {
              'noa-youtube.js':'deploy/noa-youtube.js',
              'noa-browse.js':'deploy/noa-browse.js',
              'noa-youtube.css':'deploy/noa-youtube.css',
          }
          release.NEW = set()
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
