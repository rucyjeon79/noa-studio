name: NOA N80 menu tree
on:
  pull_request:
    paths: ['tests/sitemap/**','deploy/noa-app/engine/workspaces.php','deploy/noa-app/engine/ai-lab.php','deploy/noa-sitemap.php','deploy/noa-ui.js','deploy/noa-starlight.css','scripts/noa_menu_tree_release.py','.github/workflows/noa-menu-tree.yml']
  push:
    branches: [main]
    paths: ['tests/sitemap/**','scripts/noa_menu_tree_release.py','.github/workflows/noa-menu-tree.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Verify registry, permissions and actual sitemap rendering
        run: |
          php -l deploy/noa-sitemap.php
          node --check deploy/noa-ui.js
          php tests/sitemap/registry_test.php
          php tests/member/access_test.php
          node --test tests/starlight/navigation.test.mjs
          python tests/sitemap/menu_tree_fixture.py
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/menu-tree" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/sitemap/menu_tree.mjs "$RUNNER_TEMP/menu-tree/check.mjs"
      - name: Verify role trees, search, disclosure, layout and request isolation
        run: node "$RUNNER_TEMP/menu-tree/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-menu-tree-${{ github.run_id }}', path: 'menu-tree-proof/', retention-days: 7}
  deploy:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[menu-tree]')
    needs: verify
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Activate verified N80 tree and read back public assets
        run: python scripts/noa_menu_tree_release.py
      - name: Verify live anonymous member directory
        run: |
          python - <<'PY'
          import urllib.request
          with urllib.request.urlopen('https://noastudio.ai.kr/noa-sitemap.php?view=mine') as response:
              html=response.read().decode()
              assert response.status==200 and 'data-noa-member-directory' in html
              assert 'data-noa-workspace=' not in html, 'private workspaces leaked to guest'
              assert 'Fatal error' not in html
          print('MENU_TREE_LIVE_GUEST_OK')
          PY
      - name: Restore only owned sources on failed acceptance
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_menu_tree_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-menu-tree-live-${{ github.run_id }}', path: 'ainoa-proof/deployment.json', retention-days: 7}
