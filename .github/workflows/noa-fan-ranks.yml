name: NOA fan ranks and praise ledger
on:
  push:
    branches: [main, noa-fan-ranks]
    paths: ['.github/workflows/noa-fan-ranks.yml','scripts/noa_rank_release.py','tests/membership/fan.php','bridge/fan-membership.php']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated-noa-ci, MYSQL_DATABASE: noa_subscription_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated-noa-ci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=noa_subscription_test;charset=utf8mb4
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: isolated-noa-ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli,pdo_mysql,mbstring'}
      - run: |
          php tests/member/access_test.php
          php tests/subscription/core_test.php
          php tests/subscription/mysql_test.php
          php tests/membership/mysql.php
          php tests/membership/fan.php
  publish:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[rank-qa]')
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Publish appointment limit after isolated database tests
        if: contains(github.event.head_commit.message, '[aide-limit]')
        env: {PYTHONPATH: scripts}
        run: |
          php -l deploy/noa-membership.php
          node --check deploy/noa-membership.js
          python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES = {'noa-bridge/fan-membership.php': 'bridge/fan-membership.php', 'noa-membership.php': 'deploy/noa-membership.php', 'noa-membership.js': 'deploy/noa-membership.js'}
          release.NEW = set()
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
      - if: "!contains(github.event.head_commit.message, '[aide-limit]')"
        run: |
          python scripts/noa_rank_audit.py | tee /tmp/rank-inventory
          python - <<'PY'
          import json
          line=next(i for i in open('/tmp/rank-inventory') if i.startswith('MEMBERSHIP_AUDIT_VERIFIED '))
          audit=json.loads(line.split(' ',1)[1])['rankAudit']
          assert not audit['creatorGrants'] and not any(audit['counts'].get(str(n),0) for n in (5,6,7,8)), 'existing members require migration'
          PY
          python scripts/noa_rank_release.py
          curl -fsS 'https://noastudio.ai.kr/noa-membership.js' | grep -Fq 'fan-praise'
          curl -fsS 'https://noastudio.ai.kr/noa-bridge/membership.php?action=summary' | jq -e '.ok and .member == false'
