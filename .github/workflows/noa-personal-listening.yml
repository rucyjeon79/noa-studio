name: N80 personal listening
on:
  workflow_dispatch: {}
  push:
    branches: [main, codex/n80-personal-listening]
    paths: ['deploy/noa-app/p0-player.js','tests/room-themes/player.mjs','deploy/noa-listening*','deploy/noa-app/engine/personal-*','bridge/listening.php','scripts/noa_personal*','scripts/qa/noa-personal-listening.mjs','tests/listening/**','.github/workflows/noa-personal-listening.yml']
  pull_request:
    paths: ['deploy/noa-app/p0-player.js','tests/room-themes/player.mjs','deploy/noa-listening*','deploy/noa-app/engine/personal-*','bridge/listening.php','scripts/noa_personal*','scripts/qa/noa-personal-listening.mjs','tests/listening/**']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated, MYSQL_DATABASE: listening_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NOA_MYSQL_DSN: mysql:host=127.0.0.1;dbname=listening_test;charset=utf8mb4
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: isolated
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mbstring,pdo_mysql'}
      - run: |
          python scripts/noa_personal_dependencies.py
          php -l deploy/noa-app/engine/personal-calendar-vendor.php
          php -l deploy/noa-app/engine/personal-listening.php
          php -l bridge/listening.php
          php -l deploy/noa-music.php
          php -l deploy/noa-app/home.php
          php tests/listening/core.php
          php tests/listening/setup.php
          php tests/listening/fortune-dispatch.php
          node --check deploy/noa-listening.js
          node --check deploy/noa-browse.js
          node --test scripts/qa/noa-browse.test.mjs
          node --test tests/listening/model.mjs
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/listening" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-personal-listening.mjs "$RUNNER_TEMP/listening/check.mjs"
          node "$RUNNER_TEMP/listening/check.mjs"
          cp tests/room-themes/player.mjs "$RUNNER_TEMP/listening/player.mjs"
          node "$RUNNER_TEMP/listening/player.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: listening-candidate, path: listening-proof/candidate/, retention-days: 7}
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (!contains(github.event.head_commit.message, '[unified-shell-release]') || contains(github.event.head_commit.message, '[listening-copy]'))
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      NOA_LISTENING_COPY: ${{ contains(github.event.head_commit.message, '[listening-copy]') }}
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/noa_personal_dependencies.py
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/listening" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-personal-listening.mjs "$RUNNER_TEMP/listening/check.mjs"
      - name: Activate scoped personal music integration
        id: activate
        run: python scripts/noa_personal_listening_release.py
      - name: Verify live homepage and guest access
        id: live
        run: NOA_LISTENING_LIVE=1 node "$RUNNER_TEMP/listening/check.mjs"
      - name: Restore owned sources if live activation fails
        if: failure() && (steps.activate.outcome == 'failure' || steps.live.outcome == 'failure')
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_personal_listening_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listening-live
          path: |
            ainoa-proof/deployment.json
            listening-proof/live/
          retention-days: 7
