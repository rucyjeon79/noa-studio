name: NOA Initial Catalog Flash Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-music.php'
      - 'deploy/noa-youtube.php'
      - '.github/workflows/noa-initial-catalog-flash.yml'
      - 'scripts/noa_browse_music_page_deploy.py'
      - 'scripts/noa_browse_youtube_page_deploy.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PHP and initial hidden state
        run: |
          php -l deploy/noa-music.php
          php -l deploy/noa-youtube.php
          grep -q 'id="songs" hidden' deploy/noa-music.php
          grep -q 'id="yt-videos" hidden' deploy/noa-youtube.php
          python -m py_compile scripts/noa_browse_music_page_deploy.py scripts/noa_browse_youtube_page_deploy.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy and verify production entry pages
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          python scripts/noa_browse_music_page_deploy.py
          python scripts/noa_browse_youtube_page_deploy.py
      - name: Verify first response hides full lists
        run: |
          python - <<'PY'
          import urllib.request
          for page,marker in [('noa-music.php','id="songs" hidden'),('noa-youtube.php','id="yt-videos" hidden')]:
           with urllib.request.urlopen('https://noastudio.ai.kr/'+page,timeout=25) as response:
            html=response.read().decode('utf-8','replace')
           if marker not in html:raise RuntimeError('initial_list_not_hidden:'+page)
           print('INITIAL_LIST_HIDDEN_VERIFIED',page)
          PY
