name: NOA N80 home activity orbit
on:
  pull_request:
    paths: ['tests/n80-home-orbit/**','scripts/noa_n80_home_orbit_release.py','.github/workflows/noa-n80-home-orbit.yml']
  push:
    branches: [main]
    paths: ['tests/n80-home-orbit/**','scripts/noa_n80_home_orbit_release.py','.github/workflows/noa-n80-home-orbit.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_sqlite'}
      - name: Check existing execution contracts and shared navigation
        run: |
          php -l deploy/noa-design.extend.php
          for file in deploy/noa-ui.js deploy/noa-browse-edit.js deploy/noa-channel-batch.js deploy/noa-muvy.js deploy/noa-ai-lab.js deploy/noa-creator-ai.js deploy/noa-app/jukebox/upload.js; do node --check "$file"; done
          python tests/gpt/flow.py
          node --test tests/starlight/navigation.test.mjs tests/explorer/batch_test.cjs
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/n80-orbit" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/n80-home-orbit/browser.mjs "$RUNNER_TEMP/n80-orbit/check.mjs"
          cp scripts/qa/noa-shared-navigation.mjs "$RUNNER_TEMP/n80-orbit/navigation.mjs"
      - name: Verify actual motion, concurrent jobs, stale receipts, accessibility and home navigation
        run: |
          node "$RUNNER_TEMP/n80-orbit/check.mjs"
          python tests/n80-home-orbit/navigation-baseline.py "$RUNNER_TEMP/n80-orbit/navigation.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'n80-home-orbit-${{ github.run_id }}', path: 'n80-orbit-proof/', retention-days: 7}
  deploy:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[n80-home-orbit]')
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Activate owned presentation sources with preimage and readback checks
        id: activate
        run: python scripts/noa_n80_home_orbit_release.py
      - name: Verify public cache revisions and activity code without starting work
        id: live
        run: |
          python - <<'PY'
          import urllib.request,hashlib
          from pathlib import Path
          for name in ['noa-ui.js','noa-starlight.css','noa-browse-edit.js','noa-channel-batch.js','noa-muvy.js','noa-app/jukebox/upload.js']:
              with urllib.request.urlopen('https://noastudio.ai.kr/'+name+'?n80-orbit=${{ github.sha }}',timeout=30) as r:
                  assert r.read()==Path('deploy',name).read_bytes(), name
          with urllib.request.urlopen('https://noastudio.ai.kr/?n80-orbit=${{ github.sha }}',timeout=30) as r:
              html=r.read().decode()
              assert 'noa-ui.js?v='+hashlib.sha256(Path('deploy/noa-ui.js').read_bytes()).hexdigest() in html
              assert 'Fatal error' not in html
          print('N80_HOME_ORBIT_LIVE_ASSETS_OK')
          PY
      - name: Restore only owned sources if activation fails
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_n80_home_orbit_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'n80-home-orbit-live-${{ github.run_id }}', path: 'ainoa-proof/deployment.json', retention-days: 7}
