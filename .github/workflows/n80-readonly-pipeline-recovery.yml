name: N80 Readonly Pipeline Recovery Deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n80-readonly-pipeline-recovery.yml'
      - 'deploy/noa-app/engine/readonly-pipeline.php'
      - 'scripts/n80_readonly_pipeline_safe_deploy.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
      - name: Validate before touching production
        run: |
          php -l deploy/noa-app/engine/readonly-pipeline.php
          php tests/engine/readonly_pipeline_test.php
          python -m py_compile scripts/n80_readonly_pipeline_safe_deploy.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Retry only transient SSH transport failures
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "N80_PIPELINE_DEPLOY_ATTEMPT=$attempt"
            set +e
            timeout 95s python -u scripts/n80_readonly_pipeline_safe_deploy.py > deploy.log 2>&1
            result=$?
            set -e
            if [ "$result" -eq 0 ]; then
              grep -E 'REMOTE_VERIFIED|DEPLOYED_READ_ONLY' deploy.log || true
              exit 0
            fi
            if [ "$result" -eq 124 ] || grep -Eq 'Connection timed out|Unable to connect|No route to host' deploy.log; then
              echo "Transient transport failure; retry permitted"
              if [ "$attempt" -lt 3 ]; then sleep 8; continue; fi
            fi
            echo "Non-transient deployment failure or retries exhausted"
            sed -E 's/(password|token|secret)=[^ ]+/\1=[REDACTED]/Ig' deploy.log | tail -n 12
            exit 1
          done
