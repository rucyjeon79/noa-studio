name: NOA responsive presentation audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-responsive-presentation.yml', 'deploy/noa-ecosystem.css', 'deploy/noa-ui.css']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          pip -q install 'paramiko>=3,<5'
          PYTHONPATH=scripts python - <<'PY'
          import sys
          import noa_ainoa_deploy as release
          release.FILES={'noa-ui.css':'deploy/noa-ui.css','noa-ecosystem.css':'deploy/noa-ecosystem.css'}
          release.NEW=set()
          try:
              release.main()
          except Exception:
              if release.BACKUP.exists():
                  sys.argv.append('rollback')
                  release.main()
              raise
          PY
      - name: Verify production layout at phone, tablet and desktop widths
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-layout" --no-save playwright@1.56.1
          cd "$RUNNER_TEMP/noa-layout"
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({channel:'chrome',args:['--no-sandbox']});
          try {
            for (const width of [320,390,760,1280]) {
              const page=await browser.newPage({viewport:{width,height:850},serviceWorkers:'block',reducedMotion:'reduce'});
              await page.addInitScript(()=>sessionStorage.setItem('noa-amt2-fan-2026','1'));
              for (const path of ['/','/noa-lounge.php?category=notice&view=list','/noa-shop.php','/noa-vip.php','/noa-points.php','/noa-login.php']) {
                await page.goto('https://noastudio.ai.kr'+path,{waitUntil:'domcontentloaded'});
                if(path==='/') await page.locator('[data-home-section=recommendations] #noa-ranking-status').waitFor();
                if(path.includes('noa-shop')) await page.locator('#ec-content .ec-card').first().waitFor();
                if(path.includes('noa-lounge')){
                  const rows=page.locator('#ec-content .ec-posts > .ec-card:has(.ec-body-preview)');
                  await rows.nth(1).waitFor();
                  const offsets=await rows.evaluateAll(cards=>cards.map(c=>c.querySelector('h2').getBoundingClientRect().top-c.getBoundingClientRect().top));
                  assert(Math.max(...offsets)-Math.min(...offsets)<2,JSON.stringify({width,offsets}));
                  const heights=await page.locator('#ec-tools :is(input,select,button):visible').evaluateAll(es=>es.map(e=>e.getBoundingClientRect().height));
                  assert(heights.length&&Math.max(...heights)-Math.min(...heights)<2,JSON.stringify({width,heights}));
                }
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
                assert(overflow<=1,JSON.stringify({width,path,overflow}));
                console.log(width,path,'OK');
              }
              await page.close();
            }
          } finally { await browser.close(); }
          JS
