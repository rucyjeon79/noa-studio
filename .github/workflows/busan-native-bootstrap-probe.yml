name: Busan native bootstrap probe
on:
  push:
    branches: [busan/pointzone-order-lifecycle-20261125]
    paths:
      - '.github/workflows/busan-native-bootstrap-probe.yml'
      - 'scripts/busan_pointzone/native_bootstrap_probe.py'
      - 'scripts/busan_pointzone/native_bootstrap_probe.php'
concurrency:
  group: busan-pointzone-menu
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Locate native bootstrap failure
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          python -m pip install -q paramiko==3.5.1
          python scripts/busan_pointzone/native_bootstrap_probe.py
