name: NOA private GPT song action
on:
  pull_request:
    paths: ['bridge/n80-ai-output.php','deploy/noa-app/engine/generation-state.php','deploy/noa-app/engine/auto-dispatch.php','deploy/noa-app/engine/song-generation.php','deploy/noa-publish-set.php','deploy/noa-browse-edit.js','deploy/noa-gpt*','tests/gpt/**','.github/workflows/noa-gpt-action.yml']
  push:
    branches: [main, work/chatgpt-song-action]
    paths: ['bridge/n80-ai-output.php','deploy/noa-app/engine/generation-state.php','deploy/noa-app/engine/auto-dispatch.php','deploy/noa-app/engine/song-generation.php','deploy/noa-publish-set.php','deploy/noa-browse-edit.js','deploy/noa-gpt*','scripts/noa_gpt_release.py','tests/gpt/**','.github/workflows/noa-gpt-action.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[n80-agent]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_sqlite,mbstring'}
      - run: |
          php -l deploy/noa-plugin-records.php
          php -l bridge/generation-rules.php
          php -l bridge/ainoa-generation.php
          php -l deploy/noa-publish-set.php
          php -l deploy/noa-gpt.php
          php -l deploy/noa-gpt-setup.php
          node --check deploy/noa-browse-edit.js
          php -r 'define("_GNUBOARD_",true);require "bridge/youtube-store.php";foreach([["songId"=>"a","status"=>"matched"],["songId"=>null,"status"=>"conflict"]] as $m){$r=ny_resolve_video_links($m,["b"=>true],null);if($r["status"]!=="conflict"||$r["songId"]!==null)exit(1);}if(ny_resolve_video_links([],["a"=>true,"b"=>true],["entity_id"=>"b"])["songId"]!=="b")exit(1);'
          python tests/gpt/flow.py
  deploy:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[channel-batch]') && !contains(github.event.head_commit.message, '[creative-drafts]') && !contains(github.event.head_commit.message, '[n80-browser]') && !contains(github.event.head_commit.message, '[n80-hub]')
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: |
          python scripts/noa_gpt_release.py
          python scripts/noa_collection_diagnostic.py song-identity
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
