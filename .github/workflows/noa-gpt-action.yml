name: NOA private GPT song action
on:
  pull_request:
    paths: ['deploy/noa-browse-edit.js','deploy/noa-gpt*','tests/gpt/**','.github/workflows/noa-gpt-action.yml']
  push:
    branches: [main, work/chatgpt-song-action]
    paths: ['deploy/noa-browse-edit.js','deploy/noa-gpt*','scripts/noa_gpt_release.py','tests/gpt/**','.github/workflows/noa-gpt-action.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_sqlite,mbstring'}
      - run: |
          php -l deploy/noa-plugin-records.php
          php -l deploy/noa-gpt.php
          php -l deploy/noa-gpt-setup.php
          node --check deploy/noa-browse-edit.js
          python tests/gpt/flow.py
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_gpt_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
