name: NOA private database backup isolated restore verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-database-backup-proof.yml','scripts/noa_verify_private_backup.py']
permissions: {contents: read}
jobs:
  verify-private-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-isolated-only, MYSQL_DATABASE: noa_restore_verification}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pnoa-isolated-only" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m pip install --user paramiko==3.5.1
      - name: Verify private production dump only in disposable MySQL
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
        run: python3 scripts/noa_verify_private_backup.py
