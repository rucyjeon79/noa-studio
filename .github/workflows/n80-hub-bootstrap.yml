name: N80 Hub one-time host migration
on:
  push:
    branches: [work/n80-hub-bootstrap]
    paths: ['scripts/n80_hub_bootstrap.py', 'deploy/noa-hub*.php', 'deploy/noa-app/engine/hub*.php', 'bridge/hub*.php', 'runtime/hub/**', 'tests/hub/**', 'config/n80-hub*.json', '.github/workflows/n80-hub-bootstrap.yml']
permissions: {contents: read}
concurrency:
  group: n80-hub-bootstrap
  cancel-in-progress: false
jobs:
  host:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Validate native host control before any installation
        run: |
          php tests/hub/core_test.php
          php tests/engine/registry_test.php
          php tests/engine/runtime_ownership_test.php
          php tests/subscription/core_test.php
          php -l bridge/lab-worker.php
          node --test tests/hub/runner.test.mjs
          for file in deploy/noa-app/engine/hub*.php deploy/noa-hub*.php bridge/hub*.php; do php -l "$file"; done
          python -m py_compile scripts/n80_hub_bootstrap.py scripts/n80_auto.py
      - name: Verify administrator UI on mobile and desktop
        run: |
          npm install --prefix "$RUNNER_TEMP/hub-ui" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/hub/ui.mjs "$RUNNER_TEMP/hub-ui/check.mjs"
          node "$RUNNER_TEMP/hub-ui/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: n80-hub-ui, path: hub-proof/, retention-days: 3}
      - run: python -m pip install paramiko==3.5.1
      - name: Install and verify the N80-owned source and execution module
        env:
          N80_HUB_INSTALL: '1'
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: python scripts/n80_hub_bootstrap.py
