name: N80 Hub one-time host migration
on:
  push:
    branches: [work/n80-hub-bootstrap]
    paths: ['scripts/n80_hub_bootstrap.py', '.github/workflows/n80-hub-bootstrap.yml']
permissions: {contents: read}
concurrency:
  group: n80-hub-bootstrap
  cancel-in-progress: false
jobs:
  host:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install paramiko==3.5.1
      - name: Inspect existing host capabilities without changing runtime
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: python scripts/n80_hub_bootstrap.py
