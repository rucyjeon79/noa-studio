name: N80 legacy shared-host bootstrap retired
# Permanent 2026-11-16 Dothome safety cutover. No branch push may install or start detached Node runners, even after control flag changes.
# Historical implementation remains in git history and Google Drive backups.
# This workflow is intentionally inert; do not re-enable host deployment here.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "Legacy host deployment disabled after Dothome resource suspension"
