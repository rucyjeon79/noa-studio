name: NOA ENGINE Lease Inbox Safe Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-app/engine/lease-inbox.php'
      - 'tests/engine/lease_fencing_test.php'
      - 'scripts/noa_engine_lease_inbox_safe_deploy.py'
      - '.github/workflows/noa-engine-lease-inbox-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Verify leased inbox state machine
        run: |
          php -l deploy/noa-app/engine/lease-inbox.php
          php tests/engine/lease_inbox_test.php
          php tests/engine/lease_fencing_test.php
          python -m py_compile scripts/noa_engine_lease_inbox_safe_deploy.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy additive lease inbox library
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_engine_lease_inbox_safe_deploy.py
