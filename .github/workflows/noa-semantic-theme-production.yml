name: NOA Semantic Theme Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-design.json'
      - 'scripts/noa_design_json_safe_deploy.py'
      - '.github/workflows/noa-semantic-theme-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    # Replaced by noa-approved-ui-release: Drive recovery, no host temporary files.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate theme JSON and deployment script
        run: |
          python -m py_compile scripts/noa_design_json_safe_deploy.py
          python -m json.tool deploy/noa-design.json >/dev/null
          python - <<'PY'
          import json
          data=json.load(open('deploy/noa-design.json'))
          for theme in data['themes']:
              assert all(k in theme['tokens'] for k in ('success','inactive','danger','info','warning','creative','control'))
          PY
      - name: Install SFTP client
        run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy verified theme configuration
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_design_json_safe_deploy.py
