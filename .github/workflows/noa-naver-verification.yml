name: NOA Naver Verification Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-app/home.php'
      - 'scripts/noa_naver_home_deploy.py'
      - '.github/workflows/noa-naver-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify deployment target
        run: echo "Deploying Naver ownership verification to NOA STUDIO production"
      - name: Validate
        run: |
          php -l deploy/noa-app/home.php
          python -m py_compile scripts/noa_naver_home_deploy.py
          grep -q 'naver-site-verification' deploy/noa-app/home.php
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy and verify on DotHome
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_naver_home_deploy.py
