name: NOA Encrypted Point Ledger Preimage
on:
  push:
    branches: [main]
    paths: ['scripts/noa_subscription_backup.py','scripts/noa_subscription_backup_public.pem','.github/workflows/noa-subscription-backup.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Export encrypted preimage without changing database engines or records
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_subscription_backup.py
      - uses: actions/upload-artifact@v4
        with: {name: 'noa-encrypted-point-preimage-${{ github.run_id }}', path: 'subscription-backup/', retention-days: 1}
