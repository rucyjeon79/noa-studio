name: NOA Preview and Logout Repair
on:
  push:
    branches: [main]
    paths: ['scripts/noa_preview_audit.*','scripts/noa_preview_release.py','scripts/qa/noa-preview-regression.mjs','.github/workflows/noa-preview-fix.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: |
          php -l scripts/noa_preview_audit.php
          python -m pip install 'paramiko>=3,<5'
      - name: Inspect actual public song and video mappings without writes
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_preview_audit.py
      - name: Reproduce published player selection with actual public catalog rows
        run: |
          python scripts/qa/noa-qa-font.py
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-preview" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-preview-regression.mjs "$RUNNER_TEMP/noa-preview/check.mjs"
          node "$RUNNER_TEMP/noa-preview/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-preview-${{ github.run_id }}', path: 'preview-proof/', retention-days: 7}
