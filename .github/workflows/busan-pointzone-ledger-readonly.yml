name: Busan shared ledger read-only preflight
on:
  push:
    branches: [busan/pointzone-order-lifecycle-20261125]
    paths:
      - '.github/workflows/busan-pointzone-ledger-readonly.yml'
      - 'scripts/busan_youngcart/live_ledger_readonly.py'
      - 'scripts/busan_youngcart/live_ledger_metadata_readonly.php'
      - 'scripts/busan_youngcart/point_writer_inventory_readonly.php'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: busan-readonly-sftp, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate diagnostic sources
        run: |
          php -l scripts/busan_youngcart/live_ledger_metadata_readonly.php
          php -l scripts/busan_youngcart/point_writer_inventory_readonly.php
          python -m py_compile scripts/busan_youngcart/live_ledger_readonly.py
          python -m pip install -q paramiko==3.5.1
      - name: Read metadata and point writer candidates (no remote writes)
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: python scripts/busan_youngcart/live_ledger_readonly.py
      - name: Retain diagnostic metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: busan-ledger-audit-result
          path: busan-ledger-audit-result/*.json
          if-no-files-found: ignore
          retention-days: 7
