name: NOA Legacy Route Cleanup Production
on:
  push:
    branches: [main]
    paths:
      - 'scripts/noa_navigation_safe_deploy.py'
      - '.github/workflows/noa-legacy-route-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify navigation and player scripts
        run: |
          node --check deploy/noa-ui.js
          node --check deploy/noa-app/p0-player.js
          python -m py_compile scripts/noa_navigation_safe_deploy.py scripts/noa_player_js_safe_deploy.py
          ! grep -q 'noa2.php' deploy/noa-ui.js
          ! grep -q 'noa2.php' deploy/noa-app/p0-player.js
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy guarded navigation and player scripts
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          python scripts/noa_navigation_safe_deploy.py
          python scripts/noa_player_js_safe_deploy.py
