name: NOA home production verification
# Source-flow changes are tested after release by noa-quality-release.yml.
# This independent check must not race the corresponding production deployment.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-home-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify live original hero and existing consumer flows
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-quality" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-quality/node_modules/.bin/playwright" install --with-deps chrome
          cp scripts/qa/noa-production-flows.mjs "$RUNNER_TEMP/noa-quality/flows.mjs"
          node "$RUNNER_TEMP/noa-quality/flows.mjs"
