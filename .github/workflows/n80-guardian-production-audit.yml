name: N80 Guardian Production Drift Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n80-guardian-production-audit.yml'
      - 'scripts/n80_guardian_remote_audit.py'
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'
permissions:
  contents: read
concurrency:
  group: n80-guardian-readonly
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/n80_guardian_remote_audit.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Compare deployed engine files to main without modifying server
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/n80_guardian_remote_audit.py
