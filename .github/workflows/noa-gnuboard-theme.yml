name: NOA GnuBoard Theme Production
on:
  push:
    branches: [main]
    paths: &paths
      - 'deploy/noa-gnuboard.css'
      - 'deploy/noa-design.extend.php'
      - 'scripts/noa_gnuboard_theme_deploy.py'
      - 'scripts/qa/noa-gnuboard-theme.mjs'
      - '.github/workflows/noa-gnuboard-theme.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: noa-gnuboard-theme, cancel-in-progress: false}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Validate presentation sources
        run: |
          php -l deploy/noa-design.extend.php
          python -m py_compile scripts/noa_gnuboard_theme_deploy.py
          node --check scripts/qa/noa-gnuboard-theme.mjs
      - name: Prepare existing browser tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/noa-g5" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-gnuboard-theme.mjs "$RUNNER_TEMP/noa-g5/check.mjs"
      - name: Check native mobile and desktop skins in both themes without writes
        run: node "$RUNNER_TEMP/noa-g5/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-gnuboard-candidate-${{ github.run_id }}', path: gnuboard-proof/, retention-days: 2}
  deploy:
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[ainoa-release]')
    needs: candidate
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare established NOA transport and browser tools
        run: |
          python -m pip install 'paramiko>=3,<5'
          npm install --prefix "$RUNNER_TEMP/noa-g5" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-gnuboard-theme.mjs "$RUNNER_TEMP/noa-g5/check.mjs"
      - name: Compare known sources, atomically replace only CSS and extension, verify operating hashes
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_gnuboard_theme_deploy.py
      - name: Verify actual production skins in dark and ivory
        env: {NOA_G5_PHASE: live}
        run: node "$RUNNER_TEMP/noa-g5/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-gnuboard-live-${{ github.run_id }}', path: gnuboard-proof/, retention-days: 2}
