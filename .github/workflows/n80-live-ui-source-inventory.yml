name: N80 live UI geometry inventory (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n80-readonly-ui-source-inventory
  cancel-in-progress: true
jobs:
  inventory:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned SSH reader
        run: python3 -m pip install 'paramiko>=3,<5'
      - name: Read and sanitize current production UI geometry
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: python3 scripts/qa/n80-live-ui-source-inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n80-live-ui-inventory-${{ github.run_id }}
          path: n80-live-ui-inventory/report.json
          retention-days: 1
