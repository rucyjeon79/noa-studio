name: NOA music vinyl playback
on:
  push:
    branches: [main]
    paths: ['scripts/noa_music_vinyl_release.py','tests/music-vinyl/**','deploy/noa-music-vinyl.*','.github/workflows/noa-music-vinyl.yml']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Verify record sleeves and motion using browser audio
        run: |
          node --check deploy/noa-music-vinyl.js
          php -l deploy/noa-music-vinyl.extend.php
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/music-vinyl" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/music-vinyl/check.mjs "$RUNNER_TEMP/music-vinyl/check.mjs"
          node "$RUNNER_TEMP/music-vinyl/check.mjs"
      - name: Publish and verify public asset hashes
        run: python scripts/noa_music_vinyl_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'music-vinyl-proof', path: 'music-vinyl-proof/', retention-days: 7}
