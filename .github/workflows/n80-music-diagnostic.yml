name: N80 MUSIC read-only diagnosis
on:
  push:
    branches: [main]
    paths: ['scripts/n80_music_diagnostic.py','.github/workflows/n80-music-diagnostic.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Inspect exact current sources and request authenticated read-only diagnosis
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/n80_music_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'n80-music-diagnostic-${{ github.run_id }}', path: music-diagnostic-proof/, retention-days: 2}
