name: Busan premium content pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/busan-content-pages.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: busan-readonly-sftp, cancel-in-progress: false}
jobs:
  content-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: busan-readonly
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mbstring,dom'}
      - name: Validate native content integration and legal text preservation
        run: |
          python3 - <<'PY'
          import base64,zipfile,io,hashlib
          data=base64.b64decode(open('deploy/busan/content-sections-20261103.zip.b64').read())
          assert hashlib.sha256(data).hexdigest()=='10c2ac8b2ed2792d402ec9c076c6ea7816f7da9bdd62dd72dc94fcc49ee08792'
          open('/tmp/busan-content-pages.zip','wb').write(data)
          zipfile.ZipFile(io.BytesIO(data)).extractall('/tmp/busan-content-pages')
          PY
          find /tmp/busan-content-pages -name '*.php' -print0 | xargs -0 -n1 php -l
          php /tmp/busan-content-pages/tests/content-test.php
      - run: python3 -m pip install paramiko==3.5.1
      - name: Deploy four themed pages with native fallback and canonical legacy links
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          cd scripts
          python3 - <<'PY'
          import os,socket,hmac,stat,hashlib,zipfile,urllib.request,urllib.error
          import paramiko
          from busan_readonly_check import configuration,fingerprint,PORT,ROOT
          host,user,password,pin=configuration(os.environ)
          private='/hosting/rucyjeon79/busan-assistant-private'
          z=zipfile.ZipFile('/tmp/busan-content-pages.zip')
          files={n:z.read(n) for n in z.namelist() if not n.startswith('tests/')}
          assert set(files)=={'busan-assistant/content-pages/render.php','busan-assistant/content-pages/content-pages.css','extend/busan-content.extend.php','skin/content/basic/content.skin.php','mobile/skin/content/basic/content.skin.php','theme/UXC_Flarumix/skin/content/basic/content.skin.php','busan-assistant/content-pages/assets/busan-union-light-20261103.webp','busan-assistant/content-pages/assets/busan-union-dark-20261103.webp','busan-assistant/content-pages/assets/busan-field-20261103.webp','busan-assistant/content-pages/assets/busan-dignity-20261103.webp','busan-assistant/content-pages/assets/busan-unity-20261103.webp','busan-assistant/content-pages/assets/busan-meeting-20261103.webp'}
          expected={"busan-assistant/content-pages/content-pages.css":"82f89ea191c6dd9e6ae73b8f0144520243d31562ff5d7e2aa425a21f131a0463","busan-assistant/content-pages/render.php":"3fd459ae3f9913bef23f4635083d3c241538fc21488d7b76acfced52a45dab58","extend/busan-content.extend.php":"92165b9d67c8e79788e2b6fd7e51add2cfd07235fb2fbab6c126d7ac74db7dc6","mobile/skin/content/basic/content.skin.php":"fb0b5ec548e92545e58abe73a16218ca7d7ae3daaec936fcd652e5acb5c415f6","skin/content/basic/content.skin.php":"3687763a1eb3b4fb400b4321e6d9b10a8074c397a615284f4d1a8fd6c7b8ad0e","theme/UXC_Flarumix/skin/content/basic/content.skin.php":"ad1df5a7ec305900b139c4c869dffe0fe8eb423c4b4327959585042d30782d79","busan-assistant/content-pages/assets/busan-union-dark-20261103.webp":"5ed446d1b150ca60d438de77785ece108c904ece43db0bdeabdc43d2e33ea18d","busan-assistant/content-pages/assets/busan-union-light-20261103.webp":"8cd174abb195af34ee1b3479aea74d4658a6813d1c7847c0d05689cd9bb4f093"}
          with socket.create_connection((host,PORT),timeout=15) as sock:
           with paramiko.Transport(sock) as t:
            t.banner_timeout=15;t.auth_timeout=15;t.get_security_options().key_types=('ssh-ed25519',)
            t.start_client(timeout=20)
            assert hmac.compare_digest(fingerprint(t.get_remote_server_key()),pin),'host_key_mismatch'
            t.auth_password(user,password,fallback=False)
            with paramiko.SFTPClient.from_transport(t) as s:
             s.get_channel().settimeout(25)
             assert s.normalize(ROOT)==ROOT and s.normalize(private)==private
             previous={}
             for n,data in files.items():
              target=ROOT+'/'+n
              try:
               assert stat.S_ISREG(s.lstat(target).st_mode) and s.normalize(target)==target
               with s.open(target,'rb') as f:old=f.read(300000)
               assert old==data or hashlib.sha256(old).hexdigest()==expected.get(n),'existing_file_conflict: '+n
               previous[n]=old
              except FileNotFoundError:
               assert n not in expected,'native_skin_missing: '+n
             directory=ROOT+'/busan-assistant/content-pages'
             try:s.mkdir(directory,0o755)
             except OSError:assert stat.S_ISDIR(s.lstat(directory).st_mode) and s.normalize(directory)==directory
             assets=directory+'/assets'
             try:s.mkdir(assets,0o755)
             except OSError:assert stat.S_ISDIR(s.lstat(assets).st_mode) and s.normalize(assets)==assets
             for n in sorted(files,key=lambda n:(n.startswith('extend/'),n)):
              data=files[n];target=ROOT+'/'+n
              old=previous.get(n)
              if old is not None and n in expected:
               backup=private+'/before-content-pages-20261103-'+n.replace('/','_')
               try:
                with s.open(backup,'wx') as f:f.write(old)
                s.chmod(backup,0o600)
               except IOError:pass
              temp=directory+'/.upload-'+n.rsplit('/',1)[-1]
              with s.open(temp,'wb') as f:f.write(data)
              s.chmod(temp,0o644)
              try:s.posix_rename(temp,target)
              except FileNotFoundError:s.rename(temp,target)
              with s.open(target,'rb') as f:assert f.read(300000)==data
              print('verified '+n)
          for content_id in ['company','privacy','provision','slogan']:
           address='https://skhnslu-busan.com/bbs/content.php?co_id='+content_id
           with urllib.request.urlopen(address,timeout=35) as r:
            page=r.read(2000000)
            assert r.status==200 and b'busan-content-page' in page,'page_render_missing: '+content_id
           assert b'content-pages.css?v=20261103-6' in page,'content_css_missing: '+content_id
           assert b'aria-current="page"' in page,'content_theme_missing: '+content_id
           import re
           article=page.split(b'<article class="busan-content-page',1)[1].split(b'</article>',1)[0]
           assert b'/data/editor/' not in article,'old_poster_restored'
           if content_id in ['company','slogan']:
            assert article.count(b'data-busan-section-image=')==9,'body_image_pairs_missing'
            assert article.count(b'class="bp-union-photo"')==1 and b'data-busan-dark-src=' in article,'union_visual_missing'
            for key in ['field','dignity','unity','meeting']:
             with urllib.request.urlopen('https://skhnslu-busan.com/busan-assistant/content-pages/assets/busan-'+key+'-20261103.webp',timeout=30) as r:
              assert r.status==200 and r.read(12).startswith(b'RIFF'),'section_asset_missing'
            print('PASS nine body image and explanation pairs '+content_id)
            for theme in ['light','dark']:
             with urllib.request.urlopen('https://skhnslu-busan.com/busan-assistant/content-pages/assets/busan-union-'+theme+'-20261103.webp',timeout=30) as r:
              assert r.status==200 and r.headers.get('Content-Type','').startswith('image/'),'union_asset_missing'
              assert r.read(12).startswith(b'RIFF'),'invalid_webp'
            print('PASS new union imagery and day/night sources '+content_id)
           else:
            assert not re.search(rb'<(?:img|image|svg|picture|figure)\b',article,re.I),'legal_text_not_readable'
           if content_id in ['privacy','provision']:
            assert b'bp-clause-' in page and '2026년 2월 1일'.encode() in page,'native_legal_text_missing: '+content_id
           with urllib.request.urlopen('https://rucyjeon79.dothome.co.kr/bbs/content.php?co_id='+content_id,timeout=35) as r:
            assert r.url==address and b'busan-content-page' in r.read(2000000),'legacy_canonical_redirect_failed: '+content_id
           print('PASS live '+content_id+' theme, native body and old-domain redirect')
          print('PASS four content pages; no member, board, legal-document or settings SQL writes')
          PY
