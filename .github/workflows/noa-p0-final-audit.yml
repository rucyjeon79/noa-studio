name: NOA Final Readonly Usage and SQL Audit
on:
  push:
    branches: [codex/p0-final-readonly-audit-20261024]
    paths: ['scripts/noa_p0_final_audit.py','.github/workflows/noa-p0-final-audit.yml']
permissions: {contents: read}
jobs:
  observe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: 8941ce1636017a58333eebd8b8087094dc2df107, persist-credentials: false}
      - name: Load reviewed observer only
        env: {AUDIT_COMMIT: '${{ github.sha }}'}
        run: |
          git fetch origin "$AUDIT_COMMIT" --depth=1
          git show "$AUDIT_COMMIT:scripts/noa_p0_final_audit.py" > scripts/noa_p0_final_audit.py
          python -m pip install 'paramiko>=3,<5'
      - name: Read only final source, SQL file absence, usage and N80 integrity
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_p0_final_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-final-audit-${{ github.run_id }}', path: noa-final-audit.json, retention-days: 1}
