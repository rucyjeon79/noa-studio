name: NOA independent popup notices
on:
  pull_request:
    paths: ['scripts/noa_notice_overlay_release.py','.github/workflows/noa-notice-overlay.yml']
  push:
    branches: [main]
    paths: ['scripts/noa_notice_overlay_release.py','.github/workflows/noa-notice-overlay.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify notice content and rendering in both themes
        run: |
          node --check deploy/noa-voice.js
          node --test tests/voice/composer_test.cjs
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/notices" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/room-themes/overlays.mjs "$RUNNER_TEMP/notices/overlays.mjs"
          node "$RUNNER_TEMP/notices/overlays.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: notice-overlay-candidate, path: room-theme-proof/candidate-overlays/, retention-days: 7}
  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Prepare production verification
        run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/notices" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/room-themes/overlays.mjs "$RUNNER_TEMP/notices/overlays.mjs"
      - name: Activate only the notice renderer and styles
        run: python scripts/noa_notice_overlay_release.py
      - name: Verify actual operating notices
        id: live
        env: {NOA_THEME_PHASE: live}
        run: node "$RUNNER_TEMP/notices/overlays.mjs"
      - if: failure() && steps.live.outcome == 'failure'
        run: python scripts/noa_notice_overlay_release.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notice-overlay-production
          path: |
            ainoa-proof/deployment.json
            room-theme-proof/live-overlays/
          retention-days: 7
