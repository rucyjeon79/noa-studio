name: NOA Database Drive Only Backup Policy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-db-drive-only-policy.yml', 'scripts/noa_db_drive_policy_deploy.py']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: noa-backup-migration-control, cancel-in-progress: false}
jobs:
  policy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Validate backup policy and fail-closed behavior
        run: |
          php -l deploy/noa-app/database/core.php
          php tests/database/drive_policy.php
          python -m py_compile scripts/noa_db_drive_policy_deploy.py
      - name: Apply only policy guard with already verified offsite preimage
        run: python scripts/noa_db_drive_policy_deploy.py
