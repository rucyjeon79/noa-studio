name: NOA Approved Browse Guarded Release
on:
  pull_request:
    paths: ['scripts/noa_approved_browse_deploy.py','scripts/noa_browse_drive_receipt.json','scripts/qa/noa-approved-browse.mjs','.github/workflows/noa-approved-browse-release.yml']
  push:
    branches: [main]
    paths: ['scripts/noa_approved_browse_deploy.py','scripts/noa_browse_drive_receipt.json','scripts/qa/noa-approved-browse.mjs','.github/workflows/noa-approved-browse-release.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Validate unchanged owner source and HTML-only cache revision
        run: |
          node --check deploy/noa-browse.js
          node --test scripts/qa/noa-browse.test.mjs
          php -l deploy/noa-design.extend.php
          php -l deploy/noa-music.php
          php -l deploy/noa-youtube.php
          python tests/uiux/recovery_contract_test.py
          php tests/uiux/policy_assets.php
          python -m py_compile scripts/noa_approved_browse_deploy.py
      - name: Browser candidate using actual public records
        env: {NOA_SOURCE_ROOT: '${{ github.workspace }}', NOA_BROWSE_PHASE: candidate}
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-browse-approved" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-approved-browse.mjs "$RUNNER_TEMP/noa-browse-approved/check.mjs"
          node "$RUNNER_TEMP/noa-browse-approved/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-browse-approved-candidate-${{ github.run_id }}', path: browse-approved-proof/candidate/, retention-days: 1}
  production:
    if: github.event_name != 'pull_request'
    needs: candidate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Install before runtime writes
        run: |
          python -m pip install 'paramiko>=3,<5'
          npm install --prefix "$RUNNER_TEMP/noa-browse-approved" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-approved-browse.mjs "$RUNNER_TEMP/noa-browse-approved/check.mjs"
      - name: Deploy owner-approved JS and cache loader only, no host staging
        id: activate
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_approved_browse_deploy.py
      - name: Verify actual category to ACT to item navigation
        id: live
        env: {NOA_SOURCE_ROOT: '${{ github.workspace }}', NOA_BROWSE_PHASE: live}
        run: node "$RUNNER_TEMP/noa-browse-approved/check.mjs"
      - name: Restore owned bytes if live acceptance fails
        if: failure() && steps.live.outcome == 'failure'
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_approved_browse_deploy.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-browse-approved-live-${{ github.run_id }}
          path: |
            approved-browse-deploy-proof.json
            browse-approved-proof/live/
          retention-days: 1
