name: NOA community channel and events
on:
  push:
    branches: [main]
    paths: ['scripts/noa_lounge_channel_release.py','deploy/noa-lounge-channel*','bridge/lounge-channel.php','.github/workflows/noa-lounge-channel.yml']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: |
          node --check deploy/noa-lounge-channel.js
          php -l bridge/lounge-channel.php
          php -l deploy/noa-lounge-channel.extend.php
          python scripts/noa_lounge_channel_release.py
      - name: Verify public community sources
        run: |
          curl -fsS 'https://noastudio.ai.kr/noa-lounge.php?category=event' | grep -o 'noa-lounge-channel.js'
          for kind in diary music; do
            curl -fsS "https://noastudio.ai.kr/noa-bridge/lounge-channel.php?kind=$kind" | jq -e '{ok, count:(.items|length)}'
          done
      - name: Check mobile lounge content on the live site
        run: |
          npm install --prefix "$RUNNER_TEMP/lounge-proof" --no-save playwright@1.56.1
          cd "$RUNNER_TEMP/lounge-proof"
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({channel:'chrome',args:['--no-sandbox']});
          try{
            const page=await browser.newPage({serviceWorkers:'block',viewport:{width:390,height:844}});
            const open=q=>page.goto('https://noastudio.ai.kr/noa-lounge.php?'+q);
            await page.addInitScript(()=>sessionStorage.setItem('noa-amt2-fan-2026','1'));
            await page.goto('https://noastudio.ai.kr/');
            await page.locator('[data-noa-community-home] .noa-feed-invite').getByText('별 하나가 모이면 별무리가 된다.',{exact:true}).waitFor();
            assert((await page.locator('.noa-feed-invite a').getAttribute('href')).includes('compose=chat'));
            const labels=['공지','별무리 이벤트','당신의 이야기, 우리의 음악','별무리 이야기','오늘의 노래','노아의 일기'];
            for(const width of [320,390,1280]){
              await page.setViewportSize({width,height:844});await open('category=chat');
              const links=page.locator('#ec-lounge-nav .ec-lounge-nav-grid a');await links.first().waitFor();
              assert.deepEqual(await links.allTextContents(),labels);
              for(const a of await links.all()){const b=await a.boundingBox();assert(b.x>=0&&b.x+b.width<=width+1&&b.height>=44);}
              const before=await links.first().boundingBox(),next=await links.nth(width<=600?2:3).boundingBox();assert(next.y>before.y);
            }
            await page.setViewportSize({width:390,height:844});
            for(const label of labels){
              await page.locator('#ec-lounge-nav').getByRole('link',{name:label,exact:true}).click();
              await page.locator('#ec-lounge-nav a[aria-current="page"]').filter({hasText:label}).waitFor();
            }
            await page.getByRole('heading',{name:'별 하나가 모이면 별무리가 된다.'}).waitFor();
            for(const kind of ['notice','event','diary','music','story','chat']){
              await open('category='+kind);await page.locator('#ec-lounge-nav').waitFor();
              await page.waitForFunction(()=>!document.querySelector('#ec-content')?.textContent.includes('불러오는 중입니다.'));
              assert.equal(await page.locator('.ec-write-invite').count(),kind==='chat'?1:0);
              if(kind==='notice')await page.getByRole('link',{name:'공지사항 게시판 전체 보기'}).waitFor();
            }
            await open('category=music');await open('category=diary');
            await page.goBack();await page.locator('#ec-lounge-nav a[aria-current="page"]').filter({hasText:'오늘의 노래'}).waitFor();
            await open('category=story');
            const offer=page.locator('.ec-story-offer');await offer.waitFor();
            assert.equal(await offer.count(),1);
            assert(await offer.evaluate(n=>n.nextElementSibling?.id==='noa-song-requests' && n.getBoundingClientRect().top>=document.querySelector('#ec-lounge-nav').getBoundingClientRect().bottom-1));
            assert.equal(await offer.locator('button,a').count(),0);
            await open('category=chat');
            assert.equal(await page.locator('.ec-story-offer').count(),0);
            await page.getByRole('heading',{name:'새롭게 단장한 노아 스튜디오, 감성으로 물들다'}).waitFor();
            await open('category=event');
            const images=page.locator('.noa-event-photo');
            await images.first().waitFor();
            assert.equal(await images.count(),3);
            await images.evaluateAll(nodes=>Promise.all(nodes.map(n=>n.decode())));
            await page.getByText('이벤트 자세히 보기',{exact:true}).first().click();
            await page.getByText('내 초대 링크 공유',{exact:true}).waitFor();
            await open('category=diary');await page.locator('#noa-channel-shelf summary').first().click();
            const para=page.locator('details[open] .noa-diary-paragraph');
            assert(await para.count()>1);
            await open('category=music');
            await page.locator('#noa-channel-shelf article, #noa-channel-shelf div > p').first().waitFor();
            const button=page.locator('.noa-video-cover').first();
            if(await button.count()){await button.locator('img').evaluate(i=>i.decode());assert(await button.locator('img').evaluate(i=>i.naturalWidth>0));await button.click();await page.locator('#noa-channel-shelf iframe[src*="/embed/"]').waitFor();}
            const origin='https://noastudio.ai.kr';
            await page.route('**/noa-music.php?layout-check',r=>r.fulfill({contentType:'text/html',body:'<meta name="viewport" content="width=device-width"><nav class="noa-mobile-nav"><a href="/noa-youtube.php?layout-check">YouTube</a></nav><audio id="sound-player" src="/silent" preload="none"></audio><div class="noa-two-line"><span id="dock-title"></span></div><dialog id="dock-queue"></dialog><script defer src="/noa-app/p0-player.js"></script>'}));
            await page.route('**/noa-youtube.php?layout-check',r=>r.fulfill({contentType:'text/html',body:'<html data-noa-area="youtube"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/noa-starlight.css"><link rel="stylesheet" href="/noa-cinema.css"><body class="noa-page noa-screen-room"><nav class="noa-mobile-nav">Inner nav</nav><button class="cinema-poster"><img class="cinema-still" src="/noa-assets/editorial-starlight-studio.webp"><span class="cinema-overlay"><strong>상영작 제목</strong></span></button>'}));
            await page.goto(origin+'/noa-music.php?layout-check');await page.getByText('YouTube',{exact:true}).click();
            const child=page.frameLocator('#noa-shell-view');
            await child.locator('html[data-noa-shell-child]').waitFor();
            assert(await child.locator('.noa-mobile-nav').isHidden());
            assert(await page.locator('.noa-mobile-nav').isVisible());
            const still=await child.locator('.cinema-still').boundingBox(),caption=await child.locator('.cinema-overlay').boundingBox();
            assert(caption.y>=still.y+still.height-1);
          }finally{await browser.close();}
          JS
