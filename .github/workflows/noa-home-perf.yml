name: NOA home response performance
on:
  pull_request:
    paths: &paths ['scripts/noa_home_perf_release.py','.github/workflows/noa-home-perf.yml']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: |
          php -l deploy/noa-app/home.php
          php -l deploy/noa-design.extend.php
          node --test tests/pwa/launch_test.cjs scripts/qa/noa-hero.test.mjs
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_home_perf_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'home-perf-deploy-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 7}
