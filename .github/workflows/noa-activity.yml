name: NOA activity context and transparent profile
on:
  pull_request:
    paths: ['scripts/noa_activity*','.github/workflows/noa-activity.yml']
  push:
    branches: [main]
    paths: ['scripts/noa_activity*','.github/workflows/noa-activity.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: fixture-only}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pfixture-only" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli, pdo_mysql, mbstring, openssl, curl, gd'}
      - run: python -m pip install 'pywebpush==2.4.0' 'paramiko>=3,<5'
      - name: Verify durable ownership, consent, queue and encryption
        run: |
          for file in bridge/notification*.php deploy/noa-notifications*.php scripts/noa_notifications_control.php; do php -l "$file"; done
          node --check deploy/noa-notifications.js
          node --test tests/voice/composer_test.cjs
          php -l bridge/ainoa-core.php
          php -l bridge/ainoa-automation.php
          php -l deploy/noa-ainoa.php
          php -l deploy/noa-my.php
          php tests/catalog/ainoa_test.php
          node tests/notifications/sw_test.cjs
          python tests/notifications/push_test.py
          php tests/notifications/fixture.php
          php -l scripts/noa_activity_profile.php
          php -l bridge/engagement-targets.php
          php -l deploy/noa-database.extend.php
          php -l deploy/noa-taxonomy.extend.php
          python -m py_compile scripts/noa_activity_release.py scripts/noa_activity_profile.py
          node --check deploy/noa-engagement.js
          sudo install -d -m 0777 /workspace/screenshots
          python scripts/qa/noa-qa-font.py
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-notifications" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-notifications.mjs "$RUNNER_TEMP/noa-notifications/check.mjs"
      - name: Test authenticated APIs, worker signature, mobile and desktop UI
        run: node "$RUNNER_TEMP/noa-notifications/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-notifications-candidate-${{ github.run_id }}', path: notifications-proof/, retention-days: 7}
  deploy:
    if: github.event_name == 'push'
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5' pillow
      - name: Prepare production browser inspection
        run: |
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/activity" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-channel-view-live.mjs "$RUNNER_TEMP/activity/channel.mjs"
          cp scripts/qa/noa-admin-link.mjs "$RUNNER_TEMP/activity/menu.mjs"
      - name: Activate scoped sources with preimage guards
        run: python scripts/noa_activity_release.py
      - name: Apply transparent logo to existing administrator channel with CAS
        id: profile
        run: python scripts/noa_activity_profile.py
      - name: Verify production image, menus and public channel
        run: |
          NOA_ADMIN_LINK_PHASE=live node "$RUNNER_TEMP/activity/menu.mjs"
          python scripts/noa_channel_view_audit.py
          node "$RUNNER_TEMP/activity/channel.mjs"
      - name: Restore owned changes on failed acceptance
        if: failure()
        run: |
          if [ -f activity-proof/profile-apply.json ]; then python scripts/noa_activity_profile.py rollback; fi
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_activity_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-activity-live-${{ github.run_id }}
          path: |
            activity-proof/
            channel-view-proof/live/
            ainoa-proof/deployment.json
            ainoa-proof/admin-link-live.json
          retention-days: 7
