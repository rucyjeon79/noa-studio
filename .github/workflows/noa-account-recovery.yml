name: NOA MY account recovery and collection diagnostic
on:
  pull_request:
    paths: ['deploy/noa-account.js','scripts/noa_account_recovery_release.py','scripts/noa_collection_diagnostic*','scripts/qa/noa-account-recovery.mjs','.github/workflows/noa-account-recovery.yml']
  push:
    branches: [main]
    paths: ['scripts/noa_account_recovery_release.py','scripts/noa_collection_diagnostic*','scripts/qa/noa-account-recovery.mjs','.github/workflows/noa-account-recovery.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: "8.2"}
      - run: |
          php -l scripts/noa_collection_diagnostic.php
          node --check deploy/noa-account.js
          python -m py_compile scripts/noa_collection_diagnostic.py scripts/noa_account_recovery_release.py
          npm install --prefix "$RUNNER_TEMP/account-qa" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/account-qa/node_modules/.bin/playwright" install --with-deps chromium
          cp scripts/qa/noa-account-recovery.mjs "$RUNNER_TEMP/account-qa/check.mjs"
          NOA_SOURCE_ROOT="$GITHUB_WORKSPACE" node "$RUNNER_TEMP/account-qa/check.mjs"
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_account_recovery_release.py
      - run: python scripts/noa_collection_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'account-recovery-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 14}
