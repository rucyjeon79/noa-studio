name: NOA ENGINE Adapter Contract Safe Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-app/engine/adapter-contract.php'
      - 'scripts/noa_engine_adapter_contract_safe_deploy.py'
      - '.github/workflows/noa-engine-adapter-contract-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-production-sftp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Verify adapter manifest
        run: |
          php -l deploy/noa-app/engine/adapter-contract.php
          php tests/engine/adapter_contract_test.php
          python -m py_compile scripts/noa_engine_adapter_contract_safe_deploy.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy additive adapter manifest
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_engine_adapter_contract_safe_deploy.py
