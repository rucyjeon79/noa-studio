name: NOA KCP test window
on:
  pull_request:
    paths: ['bridge/kcp-test*','deploy/noa-kcp-test*','tests/kcp/**','scripts/noa_kcp_test_release.py','.github/workflows/noa-kcp-test.yml']
  push:
    branches: [main]
    paths: ['bridge/kcp-test*','deploy/noa-kcp-test*','tests/kcp/**','scripts/noa_kcp_test_release.py','.github/workflows/noa-kcp-test.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated-noa-ci, MYSQL_DATABASE: noa_subscription_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated-noa-ci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noa_subscription_test;charset=utf8mb4'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'curl,mysqli,pdo_mysql,mbstring'}
      - run: |
          php -l bridge/kcp-test-core.php
          php -l deploy/noa-kcp-test.php
          php -l deploy/noa-payment-settings.php
          php tests/kcp/core.php
          php tests/subscription/mysql_test.php
          php tests/kcp/mysql.php
          node --check deploy/noa-kcp-test.js
          python tests/kcp/http_test.py
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - id: upload
        run: python scripts/noa_kcp_test_release.py
      - name: Verify private administrator routes
        run: |
          python - <<'PY'
          import urllib.request,urllib.error
          for path in ['/noa-kcp-test.php','/noa-bridge/kcp-test-core.php']:
            try:
              urllib.request.urlopen('https://noastudio.ai.kr'+path,timeout=20)
              raise AssertionError('admin route exposed')
            except urllib.error.HTTPError as e:
              assert e.code==403
          print('KCP_ADMIN_ONLY_TEST_WINDOW_DEPLOYED')
          PY
      - if: failure() && steps.upload.outcome != 'skipped'
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_kcp_test_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-kcp-test-${{ github.run_id }}', path: ainoa-proof/, retention-days: 7}
