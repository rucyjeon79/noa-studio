name: NOA ENGINE Event Contract Safe Production
on:
  push:
    branches: [main]
    paths:
      - 'deploy/noa-app/engine/event-contract.php'
      - 'scripts/noa_engine_event_contract_safe_deploy.py'
      - '.github/workflows/noa-engine-event-contract-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    # Integrated releases own these same files and already have verified Drive preimages.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[category-final]')
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Verify event contract
        run: |
          php -l deploy/noa-app/engine/event-contract.php
          php tests/engine/event_contract_test.php
          python -m py_compile scripts/noa_engine_event_contract_safe_deploy.py
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Install additive event contract
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_engine_event_contract_safe_deploy.py
