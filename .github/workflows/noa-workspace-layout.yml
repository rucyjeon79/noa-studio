name: NOA admin workspace layout
on:
  pull_request:
    paths: &paths ['deploy/noa-account.css','deploy/noa-app/taxonomy/style.css','deploy/noa-app/taxonomy/index.php','deploy/noa-app/popularity/index.php','deploy/noa-app/database/style.css','deploy/noa-app/database/index.php','tests/header/workspace-*','.github/workflows/noa-workspace-layout.yml']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Render workspace views with isolated records
        run: |
          for module in taxonomy popularity database jukebox; do php -l "deploy/noa-app/$module/index.php"; done
          php tests/header/workspace-render.php "$RUNNER_TEMP/workspace-views"
      - name: Measure layouts in two themes and six viewport widths
        run: |
          npm install --prefix "$RUNNER_TEMP/workspace-browser" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/workspace-browser/node_modules" node tests/header/workspace-layout.cjs "$RUNNER_TEMP/workspace-views"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: workspace-layout-screens, path: workspace-layout-proof/, retention-days: 7}
  publish:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[workspace-layout]')
    needs: layout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Publish verified presentation changes
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_design_live_release.py workspace-layout
      - uses: actions/upload-artifact@v4
        with: {name: workspace-layout-release, path: ainoa-proof/deployment.json, retention-days: 7}
