name: NOA cover metadata save
on:
  pull_request:
    paths: ['scripts/noa_cover_save_release.py','scripts/qa/noa-cover-save.mjs','.github/workflows/noa-cover-save.yml']
  push:
    branches: [main]
    paths: ['scripts/noa_cover_save_release.py','scripts/qa/noa-cover-save.mjs','.github/workflows/noa-cover-save.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-test-only, MYSQL_DATABASE: noa_inline_edit_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pnoa-test-only" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NOA_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=noa_inline_edit_test;charset=utf8mb4
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: noa-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_mysql,mbstring'}
      - run: |
          php tests/catalog/package_record_test.php
          php tests/catalog/inline_edit_projection_test.php
          python scripts/qa/inline-edit-fixture.py
          python scripts/qa/noa-cover-fixture.py
          php scripts/qa/inline-edit-seed.php
          php tests/catalog/cover_save_test.php
          php -S 127.0.0.1:8101 -t "$RUNNER_TEMP/noa-inline-edit-fixture" > "$RUNNER_TEMP/cover-php.log" 2>&1 &
          node --check deploy/noa-browse.js
          node --test scripts/qa/noa-browse.test.mjs
          php -l deploy/noa-music.php
          npm install --prefix "$RUNNER_TEMP/buttons" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-cover-save.mjs "$RUNNER_TEMP/buttons/check.mjs"
          node "$RUNNER_TEMP/buttons/check.mjs"
  deploy:
    if: github.event_name == 'push'
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/noa_cover_save_release.py
          npm install --prefix "$RUNNER_TEMP/buttons" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-collection-queue.mjs "$RUNNER_TEMP/buttons/check.mjs"
          node "$RUNNER_TEMP/buttons/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'cover-save-live-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 7}
