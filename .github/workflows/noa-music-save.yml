name: NOA device download location
on:
  pull_request:
    paths: &paths ['deploy/noa-music-save.js','scripts/noa_music_save_release.py','tests/download/**','.github/workflows/noa-music-save.yml']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: |
          php -l deploy/noa-music-download.php
          node --test tests/download/music_save.test.cjs
  deploy:
    if: github.event_name == 'push'
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/noa_music_save_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'music-save-live-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 7}
