name: NOA ENGINE Unified Contract Gates
on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/noa-app/engine/**'
      - 'tests/engine/**'
      - 'scripts/n80_guardian_remote_audit.py'
      - '.github/workflows/noa-engine-contract-gates.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/noa-app/engine/**'
      - 'tests/engine/**'
      - 'scripts/n80_guardian_remote_audit.py'
      - '.github/workflows/noa-engine-contract-gates.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
      - name: Validate all engine libraries
        run: find deploy/noa-app/engine -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run all engine contract tests
        run: |
          set -eu
          for test in tests/engine/*_test.php; do php "$test"; done
      - name: Record in-process latency baseline
        run: |
          php -r 'require "deploy/noa-app/engine/performance.php"; $e=["id"=>"perf","type"=>"audio.ready","source"=>"jukebox","subjectId"=>"track","occurredAt"=>"2026-10-23T00:00:00Z","schemaVersion"=>1,"correlationId"=>"perf"]; echo json_encode(n80_benchmark_event($e,1000),JSON_PRETTY_PRINT),"\\n";'
      - name: Enforce Guardian policy and authority contracts
        run: |
          php tests/engine/guardian_test.php
          php -r 'require "deploy/noa-app/engine/guardian.php"; $a=n80_guardian_audit("deploy"); if(!$a["policyCompliant"] || $a["engineOperationalReady"] || $a["decisionAuthority"]!=="user")exit(1); echo "N80_GUARDIAN_POLICY_ENFORCED\\n";'
      - name: Verify bridge stays single and non-executing
        run: |
          php tests/engine/bridge_test.php
          php -r 'require "deploy/noa-app/engine/bridge.php"; $e=["id"=>"audit","type"=>"audio.ready","source"=>"jukebox","subjectId"=>"audit","occurredAt"=>"2026-10-23T00:00:00Z","schemaVersion"=>1,"correlationId"=>"audit"]; $p=n80_bridge_plan($e); if(!$p["ok"] || count($p["links"])!==2)exit(1); foreach($p["links"] as $l){if($l["executionEnabled"])exit(2);} echo "N80_BRIDGE_NON_EXECUTING_OK\\n";'
      - name: Assert execution remains disabled
        run: |
          php -r 'require "deploy/noa-app/engine/adapter-contract.php"; foreach(noa_engine_adapter_manifest() as $a){if($a["enabled"])exit(1);} echo "ENGINE_ADAPTERS_DISABLED\n";'
          php -r 'require "deploy/noa-app/engine/dispatch-gate.php"; $e=["id"=>"test","type"=>"audio.ready","source"=>"jukebox","subjectId"=>"test","occurredAt"=>"2026-10-23T00:00:00Z","schemaVersion"=>1,"correlationId"=>"test"]; if(noa_engine_dispatch_gate($e,["enabled"=>true,"durableStoreReady"=>true,"authenticatedActor"=>true])["ok"])exit(1); echo "ENGINE_DISPATCH_FAIL_CLOSED\n";'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify remote audit fails on missing, changed or unsafe runtime files
        run: python -m unittest discover -s tests/engine -p 'test_remote_audit.py' -v
