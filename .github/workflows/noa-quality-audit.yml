name: NOA production quality audit
# Read-only baseline: compare production and inspect seven real viewport widths.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-quality-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          python3 scripts/noa_build_seed.py
          python3 scripts/noa_catalog_seed.py
          python3 -m pip install --user paramiko==3.5.1
      - name: Compare production without writes
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ vars.NOA_SSH_HOST_FINGERPRINT || 'SHA256:0LqxbpOziJ4XgOMNEkfVrVGle3kpjJessI+jKqZ4JCU' }}
        run: python3 scripts/noa_quality_inventory.py
  responsive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {width: [320, 360, 390, 430, 768, 1280, 1920]}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Inspect real public production screens
        env:
          NOA_QA_WIDTH: ${{ matrix.width }}
          NOA_QA_PHASE: before
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-quality" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-quality/node_modules/.bin/playwright" install --with-deps chromium
          cp scripts/qa/noa-responsive.mjs "$RUNNER_TEMP/noa-quality/check.mjs"
          node "$RUNNER_TEMP/noa-quality/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-quality-${{ matrix.width }}
          path: quality-results/
          retention-days: 14
