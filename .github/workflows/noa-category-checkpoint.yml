name: NOA Category Readonly Checkpoint
on:
  push:
    branches: ['codex/remaining-ui-workstate-20261024']
    paths: ['scripts/noa_category_checkpoint.py', '.github/workflows/noa-category-checkpoint.yml']
permissions: {contents: read}
jobs:
  checkpoint:
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Readonly source hashes and recoverable preimages
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_category_checkpoint.py
      - uses: actions/upload-artifact@v4
        with:
          name: noa-remaining-checkpoint
          path: category-checkpoint/
          retention-days: 2
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --prefix "$RUNNER_TEMP/noa-baseline" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
      - name: Measure existing public YouTube before lazy details
        env:
          NOA_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/noa-baseline/package.json
        run: node scripts/qa/noa-youtube-performance-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-youtube-performance-before
          path: youtube-performance-before/
          retention-days: 2
