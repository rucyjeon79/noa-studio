name: NOA Saved Category Public Order Proof
on:
  push:
    branches: ['codex/category-final-20261024']
    paths: ['scripts/noa_category_checkpoint.py', '.github/workflows/noa-category-checkpoint.yml']
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Readonly source hashes and recoverable preimages
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_category_checkpoint.py
      - name: Verify actual public DOM matches the saved administrator order
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-order-proof" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-saved-category-order.mjs "$RUNNER_TEMP/noa-order-proof/check.mjs"
          node "$RUNNER_TEMP/noa-order-proof/check.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: noa-category-checkpoint
          path: category-checkpoint/
          retention-days: 1
