name: Busan native member catalog release
on:
  push:
    branches: [busan/pointzone-order-lifecycle-20261125]
    paths:
      - '.github/workflows/busan-native-member-catalog-release.yml'
      - 'scripts/busan_pointzone/release_native_member_catalog.py'
concurrency:
  group: busan-pointzone-menu
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Connect native member catalog routes
        env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          python -m py_compile scripts/busan_pointzone/release_native_member_catalog.py
          php -l scripts/busan_pointzone/native_catalog_settings.php
          python -m pip install -q paramiko==3.5.1
          python scripts/busan_pointzone/release_native_member_catalog.py
