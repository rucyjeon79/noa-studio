name: N80 AI LAB specialized worker
on:
  push:
    branches: [main, work/n80-subscription-connect]
    paths: ['deploy/noa-app/engine/codex.php', 'bridge/hub-worker.php', 'scripts/n80_codex_subscription_probe.py', 'tests/hub/codex_mysql_test.php', 'tests/engine/test_codex_subscription_probe.py', 'config/n80-codex-probe-request.json', 'scripts/n80_codex_subscription_connect.py', 'tests/engine/test_codex_subscription_connect.py', 'config/n80-codex-connect-request.json', 'runtime/browser/**', 'scripts/n80_browser_relay.py', 'tests/engine/test_browser_relay.py', '.github/workflows/noa-ai-worker.yml', 'runtime/media/**', 'scripts/n80_media_runtime.py', 'scripts/noa_shorts_assembly.py', 'tests/engine/test_media_runtime.py', 'tests/engine/media_runtime.test.mjs', 'tests/session-agent/auto_assembly_test.py', 'scripts/n80_media_handoff.py', 'tests/engine/test_media_handoff.py', 'lab/**', 'integrations/chatgpt-assistant/**', 'scripts/noa_host_media_runtime.py', 'scripts/noa_host_browser_runtime.py', 'tests/engine/test_host_media_runtime.py', 'runtime/node/**', 'lab/client.mjs', 'lab/muvy.mjs', 'scripts/n80_node_runtime.py', 'scripts/noa_lab_worker.py', 'tests/engine/test_node_runtime.py', 'tests/engine/node_runtime.test.mjs']
  pull_request:
    paths: ['runtime/browser/**', 'scripts/n80_browser_relay.py', 'tests/engine/test_browser_relay.py', '.github/workflows/noa-ai-worker.yml', 'runtime/media/**', 'scripts/n80_media_runtime.py', 'scripts/noa_shorts_assembly.py', 'tests/engine/test_media_runtime.py', 'tests/engine/media_runtime.test.mjs', 'tests/session-agent/auto_assembly_test.py', 'scripts/n80_media_handoff.py', 'tests/engine/test_media_handoff.py', 'lab/**', 'integrations/chatgpt-assistant/**', 'scripts/noa_host_media_runtime.py', 'scripts/noa_host_browser_runtime.py', 'tests/engine/test_host_media_runtime.py', 'runtime/node/**', 'lab/client.mjs', 'lab/muvy.mjs', 'scripts/n80_node_runtime.py', 'scripts/noa_lab_worker.py', 'tests/engine/test_node_runtime.py', 'tests/engine/node_runtime.test.mjs']
  workflow_run:
    workflows: [N80 Unified Facade Safe Production, Verify and publish AI LAB entry]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      subscription_probe:
        description: 'Execute only the host-authorized single subscription trial'
        type: boolean
        default: false
      subscription_connect:
        description: 'Connect a single N80-owned ChatGPT subscription request; no model generation'
        type: boolean
        default: false
      host_runtime:
        description: 'Run the bounded media runtime startup attempt on the existing NOA host'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  # Read-only PR checks must not replace pending host installations.
  # Production installations share one lane, separate from scheduled ticks.
  group: ${{ ((github.ref == 'refs/heads/work/n80-subscription-connect' || inputs.subscription_connect == true) && 'noa-subscription-connection') || github.event_name == 'pull_request' && format('noa-host-candidate-{0}', github.event.pull_request.number) || ((github.event_name == 'push' || inputs.host_runtime == true) && 'noa-host-media-runtime' || 'noa-ai-lab-worker') }}
  cancel-in-progress: false
jobs:
  host_candidate:
    if: github.ref != 'refs/heads/work/n80-subscription-connect' && !contains(github.event.head_commit.message, '[n80-subscription]') && (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.host_runtime == true)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.2'}
      - run: |
          python -m unittest discover -s tests/engine -p 'test_host_media_runtime.py' -v
          python -m pip install cryptography==46.0.3
          python -m unittest discover -s tests/engine -p 'test_browser_relay.py' -v
          node --check runtime/browser/relay.mjs
          python -m unittest discover -s tests/engine -p 'test_auto_dispatch.py' -v
          python -m unittest discover -s tests/engine -p 'test_node_runtime.py' -v
          python -m unittest discover -s tests/engine -p 'test_media_handoff.py' -v
          python -m unittest discover -s tests/engine -p 'test_media_runtime.py' -v
          python -m unittest discover -s tests/session-agent -p 'auto_assembly_test.py' -v
          node --test tests/engine/node_runtime.test.mjs tests/lab/muvy.test.mjs tests/engine/media_runtime.test.mjs
  host_handoff:
    if: (github.ref == 'refs/heads/main' && github.repository == 'rucyjeon79/noa-studio' && github.event_name == 'push') && !contains(github.event.head_commit.message, '[n80-specialists]')
    needs: host_candidate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    concurrency:
      group: n80-media-source-handoff
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install paramiko==3.5.1
      - name: Hand the existing media implementation to host N80
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: python scripts/n80_auto.py ai.media_handoff
      - uses: actions/upload-artifact@v4
        with:
          name: n80-media-source-handoff
          path: host-media-proof/media-handoff.json
          if-no-files-found: error
          retention-days: 7
  host_runtime:
    if: (github.ref == 'refs/heads/main' && github.repository == 'rucyjeon79/noa-studio' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[n80-node]') && !contains(github.event.head_commit.message, '[n80-handoff]') && !contains(github.event.head_commit.message, '[n80-media]') && !contains(github.event.head_commit.message, '[n80-browser-remote]')) || (github.event_name == 'workflow_dispatch' && inputs.host_runtime == true))) && !contains(github.event.head_commit.message, '[n80-specialists]')
    needs: host_candidate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: python -m pip install paramiko==3.5.1
      - name: Prepare the official browser and its system libraries
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/n80-host-browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/n80-host-browser" --ignore-scripts --no-save --package-lock=false playwright@1.62.0
          "$RUNNER_TEMP/n80-host-browser/node_modules/.bin/playwright" install --with-deps --only-shell chromium
          sudo apt-get install -y patchelf
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from noa_host_browser_runtime import browser_package
          binary, files = browser_package(os.environ['PLAYWRIGHT_BROWSERS_PATH'])
          print('N80_BROWSER_PACKAGE_READY', len(files), sum(p.stat().st_size for p in files.values()))
          PY
      - name: Start a bounded browser process on the existing hosting account
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          NOA_HOST_MEDIA_RUNTIME: '1'
          NOA_HOST_BROWSER_CACHE: ${{ runner.temp }}/n80-host-browsers
        run: python scripts/n80_auto.py ai.host_runtime
      - name: Retain the actual host execution result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n80-host-media-runtime
          path: host-media-proof/runtime.json
          retention-days: 7
          if-no-files-found: error
  browser_probe:
    if: github.ref == 'refs/heads/main' && github.repository == 'rucyjeon79/noa-studio' && github.event_name == 'push' && contains(github.event.head_commit.message, '[n80-browser-remote]')
    needs: host_candidate
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: python -m pip install paramiko==3.5.1 cryptography==46.0.3
      - name: Verify the sandboxed subordinate browser and return evidence to N80
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/n80_auto.py ai.browser_probe
  host_media:
    if: github.ref == 'refs/heads/main' && github.repository == 'rucyjeon79/noa-studio' && github.event_name == 'push' && contains(github.event.head_commit.message, '[n80-media]')
    needs: host_candidate
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare system media packages for the existing host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk patchelf
          python -m pip install paramiko==3.5.1
      - name: Install and render a private capability check on host N80
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          N80_MEDIA_INSTALL: '1'
        run: python scripts/n80_auto.py ai.media_install
      - uses: actions/upload-artifact@v4
        with:
          name: n80-host-ffmpeg-runtime
          path: host-media-proof/media-runtime.json
          retention-days: 7
          if-no-files-found: error
  host_node:
    if: github.ref == 'refs/heads/main' && github.repository == 'rucyjeon79/noa-studio' && github.event_name == 'push' && contains(github.event.head_commit.message, '[n80-node]')
    needs: host_candidate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.2'}
      - run: python -m pip install paramiko==3.5.1
      - name: Activate and verify the N80 host Node module
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          N80_NODE_INSTALL: '1'
        run: |
          python scripts/n80_auto.py engine.node_install
          python scripts/n80_auto.py engine.node_verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n80-node-runtime
          path: host-media-proof/node.json
          retention-days: 7
          if-no-files-found: error
  process:
    if: github.ref == 'refs/heads/main' && github.repository == 'rucyjeon79/noa-studio' && github.event_name != 'push' && github.event_name != 'pull_request' && inputs.host_runtime != true && inputs.subscription_connect != true && inputs.subscription_probe != true && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Prepare the N80 browser transport
        run: python -m pip install paramiko==3.5.1 cryptography==46.0.3
      - name: Serve one administrator-requested browser connection through N80
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/n80_auto.py ai.browser_session
      - name: Install local media processor
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Validate publication guard and install transfer client
        run: |
          python -m unittest discover -s tests/engine -p 'test_ai_publication_guard.py' -v
          python -m pip install numpy==2.2.6 scipy==1.15.3
          npm ci --prefix .github/actions/n80-daily-shorts --ignore-scripts
      - name: Persist and check the N80 daily Shorts schedule
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_DRIVE_RCLONE_CONFIG_B64: ${{ secrets.NOA_DRIVE_RCLONE_CONFIG_B64 }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        uses: ./.github/actions/n80-daily-shorts
      - name: Process N80 SQL text drafts without publishing media
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python3 scripts/n80_auto.py ai.text
      - name: Process queued MUVY and media through N80 with final-only publication
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python3 scripts/n80_auto.py ai.media_guard


  subscription_connect:
    if: github.repository == 'rucyjeon79/noa-studio' && ((github.ref == 'refs/heads/work/n80-subscription-connect' && github.event_name == 'push' && contains(github.event.head_commit.message, '[n80-connect]')) || (github.event_name == 'workflow_dispatch' && inputs.subscription_connect == true))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    concurrency: {group: n80-subscription-account, cancel-in-progress: false}
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install paramiko==3.5.1 cryptography==46.0.3
      - name: Validate connection fencing and encrypted transport
        run: python -m unittest discover -s tests/engine -p 'test_codex_subscription_connect.py' -v
      - name: Start this N80 connection request without a model call
        id: connect
        run: python scripts/n80_codex_subscription_connect.py start
      - name: Return the encrypted login challenge to the requesting operator
        if: steps.connect.outputs.needs_auth == 'true'
        uses: actions/upload-artifact@v4
        with: {name: n80-codex-device-challenge, path: codex-proof/device-challenge.json, retention-days: 1, if-no-files-found: error}
      - name: Await this one login and hand encrypted credentials back to N80
        if: steps.connect.outputs.needs_auth == 'true'
        run: python scripts/n80_codex_subscription_connect.py wait
      - name: Close the bounded login and remove temporary credentials
        if: always()
        run: python scripts/n80_codex_subscription_connect.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: n80-codex-connection-result, path: codex-proof/connection-result.json, retention-days: 7, if-no-files-found: warn}

  subscription_candidate:
    if: github.ref == 'refs/heads/work/n80-subscription-connect' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: hub-test-only, MYSQL_DATABASE: noa_hub_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -phub-test-only" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_mysql,mbstring'}
      - run: python -m pip install cryptography==46.0.3
      - name: Verify same-queue claim, replay and stored result
        run: |
          php -l deploy/noa-app/engine/codex.php
          php -l bridge/hub-worker.php
          php tests/hub/codex_mysql_test.php
          python -m unittest discover -s tests/engine -p 'test_codex_subscription*.py' -v
  subscription_probe:
    if: github.repository == 'rucyjeon79/noa-studio' && github.ref == 'refs/heads/work/n80-subscription-connect' && github.event_name == 'push' && contains(github.event.head_commit.message, '[n80-probe]')
    needs: subscription_candidate
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    concurrency: {group: n80-subscription-account, cancel-in-progress: false}
    env:
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install paramiko==3.5.1 cryptography==46.0.3
      - name: Execute the single N80-authorized task and verify host SQL readback
        run: python scripts/n80_codex_subscription_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: n80-subscription-probe, path: codex-proof/subscription-probe.json, retention-days: 7, if-no-files-found: error}
