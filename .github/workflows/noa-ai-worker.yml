name: N80 AI LAB specialized worker
on:
  workflow_run:
    workflows: [N80 Unified Facade Safe Production, Verify and publish AI LAB entry]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-ai-lab-worker
  cancel-in-progress: false
jobs:
  process:
    if: github.ref == 'refs/heads/main' && github.repository == 'rucyjeon79/noa-studio' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install local media processor
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Validate publication guard and install transfer client
        run: |
          python -m unittest discover -s tests/engine -p 'test_ai_publication_guard.py' -v
          python -m pip install paramiko==3.5.1 numpy==2.2.6 scipy==1.15.3
      - name: Persist and check the N80 daily Shorts schedule
        continue-on-error: true
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python3 scripts/n80_auto.py ai.daily_shorts
      - name: Process N80 SQL text drafts without publishing media
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python3 scripts/n80_auto.py ai.text
      - name: Process queued MUVY and media through N80 with final-only publication
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python3 scripts/n80_auto.py ai.media_guard
