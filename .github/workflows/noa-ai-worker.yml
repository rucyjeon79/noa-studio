name: N80 signed scheduled wake (activation pending)
# GitHub is a clock ONLY: no media, AI, DB, queue, SSH or publishing work.
# Activation requires verified N80 bounded executor and hosting approval,
# private 0600 N80 HMAC key, signed canary, approved cron and CI gates.
# Deliberately NO schedule trigger until those conditions are proven.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n80-scheduled-wake-only
  cancel-in-progress: true
jobs:
  wake:
    if: ${{ false }} # Physical N80 runner retired; no wake before approvals
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send exactly one bounded N80 signed clock signal
        env:
          N80_WAKE_ACTIVATED: ${{ vars.N80_WAKE_ACTIVATED }}
          N80_HOSTING_APPROVAL_VERIFIED: ${{ vars.N80_HOSTING_APPROVAL_VERIFIED }}
          N80_SCHEDULED_WAKE_KEY: ${{ secrets.N80_SCHEDULED_WAKE_KEY }}
        run: python3 scripts/n80_signed_wake_signal.py
