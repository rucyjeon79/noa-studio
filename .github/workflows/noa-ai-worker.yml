name: N80 AI LAB specialized worker
on:
  push:
    branches: [main]
    paths: ['scripts/noa_host_media_runtime.py', 'tests/engine/test_host_media_runtime.py']
  pull_request:
    paths: ['scripts/noa_host_media_runtime.py', 'tests/engine/test_host_media_runtime.py']
  workflow_run:
    workflows: [N80 Unified Facade Safe Production, Verify and publish AI LAB entry]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      host_runtime:
        description: 'Run the bounded media runtime startup attempt on the existing NOA host'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  # A scheduled workflow_run must not replace a pending host installation.
  group: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.host_runtime == true) && 'noa-host-media-runtime' || 'noa-ai-lab-worker' }}
  cancel-in-progress: false
jobs:
  host_candidate:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.host_runtime == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          python -m unittest discover -s tests/engine -p 'test_host_media_runtime.py' -v
          python -m unittest discover -s tests/engine -p 'test_auto_dispatch.py' -v
  host_runtime:
    if: github.ref == 'refs/heads/main' && github.repository == 'rucyjeon79/noa-studio' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.host_runtime == true))
    needs: host_candidate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: python -m pip install paramiko==3.5.1
      - name: Start a bounded browser process on the existing hosting account
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          NOA_HOST_MEDIA_RUNTIME: '1'
        run: python scripts/n80_auto.py ai.host_runtime
      - name: Retain the actual host execution result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n80-host-media-runtime
          path: host-media-proof/runtime.json
          retention-days: 7
          if-no-files-found: error
  process:
    if: github.ref == 'refs/heads/main' && github.repository == 'rucyjeon79/noa-studio' && github.event_name != 'push' && github.event_name != 'pull_request' && inputs.host_runtime != true && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install local media processor
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Validate publication guard and install transfer client
        run: |
          python -m unittest discover -s tests/engine -p 'test_ai_publication_guard.py' -v
          python -m pip install paramiko==3.5.1 numpy==2.2.6 scipy==1.15.3 cryptography==46.0.3
          npm ci --prefix .github/actions/n80-daily-shorts --ignore-scripts
      - name: Persist and check the N80 daily Shorts schedule
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NOA_DRIVE_RCLONE_CONFIG_B64: ${{ secrets.NOA_DRIVE_RCLONE_CONFIG_B64 }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        uses: ./.github/actions/n80-daily-shorts
      - name: Process N80 SQL text drafts without publishing media
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python3 scripts/n80_auto.py ai.text
      - name: Process queued MUVY and media through N80 with final-only publication
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python3 scripts/n80_auto.py ai.media_guard
