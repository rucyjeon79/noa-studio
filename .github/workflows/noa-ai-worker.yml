name: NOA AI LAB worker readiness and publication guard
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-ai-worker.yml', 'scripts/noa_lab_worker.py']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noa-ai-lab-worker
  cancel-in-progress: false
jobs:
  process:
    if: github.ref == 'refs/heads/main' && github.repository == 'rucyjeon79/noa-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publication guard and install transfer client
        run: |
          python -m unittest discover -s tests/engine -p 'test_ai_publication_guard.py' -v
          python -m pip install paramiko==3.5.1
      - name: Verify idle state and preserve work until runner-only publication
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python3 scripts/noa_lab_worker.py
