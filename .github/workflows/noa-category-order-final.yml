name: NOA Integrated Production Finish
on:
  pull_request:
    paths: ['deploy/noa-browse.js','deploy/noa-ui.css','deploy/noa-design.extend.php','scripts/qa/noa-four-level.mjs','bridge/world-mv.php','bridge/playcount-policy.php','bridge/popularity-events.php','deploy/noa-youtube.php','deploy/noa-youtube.js','deploy/noa-home.js','deploy/noa-app/engine/work-state*.php','deploy/noa-app/engine/app-observe.php','deploy/noa-app/world-view.php','deploy/noa-app/jukebox/stream.php','deploy/noa-app/jukebox/stream-popularity.php','deploy/noa-playcount.js','deploy/noa-app/engine/music-*.php','deploy/noa-app/engine/consume-music.php','deploy/noa-app/engine/lease-state.php','scripts/noa_playcount*','tests/popularity/**','tests/p0/world_act*','deploy/noa-music.php','deploy/noa-music-detail.php','deploy/noa-sitemap.php','deploy/noa-playlists.js','deploy/noa-app/p0-player.js','deploy/noa-app/home.php','deploy/noa-app/engine/completion*','deploy/noa-app/engine/event-contract.php','deploy/noa-app/engine/registry.php','bridge/music-readmodel.php','bridge/user-playlists.php','scripts/noa_category_release.py','scripts/noa_finish_drive_receipt.json','scripts/qa/noa-finish*','tests/deployment/test_finish_release.py','.github/workflows/noa-category-order-final.yml']
  push:
    branches: [main]
    paths: ['deploy/noa-browse.js','deploy/noa-ui.css','deploy/noa-design.extend.php','scripts/qa/noa-four-level.mjs','bridge/world-mv.php','bridge/playcount-policy.php','bridge/popularity-events.php','deploy/noa-youtube.php','deploy/noa-youtube.js','deploy/noa-home.js','deploy/noa-app/engine/work-state*.php','deploy/noa-app/engine/app-observe.php','deploy/noa-app/world-view.php','deploy/noa-app/jukebox/stream.php','deploy/noa-app/jukebox/stream-popularity.php','deploy/noa-playcount.js','deploy/noa-app/engine/music-*.php','deploy/noa-app/engine/consume-music.php','deploy/noa-app/engine/lease-state.php','scripts/noa_playcount*','deploy/noa-music.php','deploy/noa-music-detail.php','deploy/noa-sitemap.php','deploy/noa-playlists.js','deploy/noa-app/p0-player.js','deploy/noa-app/home.php','deploy/noa-app/engine/completion*','deploy/noa-app/engine/event-contract.php','deploy/noa-app/engine/registry.php','bridge/music-readmodel.php','bridge/user-playlists.php','scripts/noa_category_release.py','scripts/noa_finish_drive_receipt.json','scripts/qa/noa-finish*','scripts/qa/noa-sitemap-live.mjs','.github/workflows/noa-category-order-final.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  candidate:
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: noa-test-only, MYSQL_DATABASE: noa_catalog_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pnoa-test-only" --health-interval=5s --health-timeout=5s --health-retries=20
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'curl,pdo_sqlite,sqlite3,fileinfo,pdo_mysql'}
      - name: Prepare isolated validation dependencies
        run: |
          python -m pip install 'paramiko>=3,<5'
          npm install --prefix "$RUNNER_TEMP/noa-category" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-category-final.mjs "$RUNNER_TEMP/noa-category/check.mjs"
      - name: Ensure actual audio verification tools
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Validate reviewed runtime files, recovery and source contracts
        run: |
          php -l deploy/noa-music.php
          php -l deploy/noa-music-detail.php
          php -l deploy/noa-sitemap.php
          php -l deploy/noa-app/home.php
          php -l bridge/music-readmodel.php
          php -l bridge/user-playlists.php
          php -l deploy/noa-app/engine/event-contract.php
          php -l deploy/noa-app/engine/registry.php
          php -l deploy/noa-app/engine/completion-receipt.php
          php -l deploy/noa-app/engine/completion-report.php
          node --check deploy/noa-app/p0-player.js
          node --check deploy/noa-playlists.js
          node --test scripts/qa/noa-browse.test.mjs
          php tests/catalog/music_readmodel_test.php
          php tests/sitemap/registry_test.php
          php tests/n80/completion_receipt_test.php
          for test in tests/engine/*_test.php; do php "$test"; done
          php tests/p0/world_act_membership.php
          php tests/engine/music_http_client_test.php
          php tests/popularity/stream_tracking_test.php
          node --test tests/popularity/player_tracker_test.cjs
          python tests/popularity/stream_source_contract.py
          python -m unittest discover -s tests/popularity -p test_playcount_activate.py -v
          python -m unittest discover -s tests/engine -p 'test_live_music_consumer.py' -v
          node --test tests/home/metadata_test.cjs tests/playlists/drag_order_test.cjs tests/youtube/lazy_details_test.cjs
          php tests/sitemap/popularity_route_test.php
          python tests/youtube/detail_endpoint_test.py
          python -m py_compile scripts/n80_workstate_sync.py
          python tests/deployment/test_finish_release.py
          python -m py_compile scripts/noa_category_release.py
      - name: Prove the fixed public HTTP client works with URL fopen disabled
        env:
          N80_MUSIC_HTTP_LIVE_TEST: '1'
        run: php -d allow_url_fopen=0 tests/engine/music_http_client_test.php
      - name: Read exact previous policy metadata for isolated restore
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12556464389'
          run-id: '40085464057'
          github-token: ${{ github.token }}
          repository: rucyjeon79/noa-studio
          path: ${{ runner.temp }}/noa-policy-artifact
          merge-multiple: true
      - name: Verify real audio and restore the exact Drive-backed policy in isolated MySQL
        env:
          NOA_PLAYCOUNT_TEST_MYSQL: '1'
          NOA_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/noa-category/package.json
          NOA_POLICY_ARTIFACT: ${{ runner.temp }}/noa-policy-artifact
          NOA_POLICY_BACKUP_FILE: ${{ runner.temp }}/noa-policy-before.json
        run: |
          python scripts/noa_playcount_backup_fixture.py
          php tests/popularity/policy_mysql_test.php
          python tests/popularity/real_stream_mysql_test.py
      - name: Retain category and isolated native authorization regression checks
        env: {NOA_CATEGORY_PHASE: candidate}
        run: |
          python scripts/qa/category-storage-fixture.py
          php -S 127.0.0.1:8099 -t "$RUNNER_TEMP/noa-category-fixture" > "$RUNNER_TEMP/category-php.log" 2>&1 &
          node "$RUNNER_TEMP/noa-category/check.mjs"
      - name: Verify all four category levels with actual public records
        env:
          NOA_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/noa-category/package.json
          NOA_FOUR_PHASE: candidate
        run: node scripts/qa/noa-four-level.mjs
      - name: Verify integrated candidate behavior without a public test site
        env:
          NOA_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/noa-category/package.json
        run: node scripts/qa/noa-finish-candidate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-finish-candidate-${{ github.run_id }}
          path: |
            category-proof/candidate/
            qa/candidate/
          retention-days: 2
  production:
    if: github.event_name != 'pull_request'
    needs: candidate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'curl,pdo_sqlite,sqlite3,fileinfo,pdo_mysql'}
      - name: Download exact Drive-verified operating preimages, including HOME
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12577035338'
          run-id: '40136261690'
          github-token: ${{ github.token }}
          repository: rucyjeon79/noa-studio
          path: ${{ runner.temp }}/noa-finish-preimages
          merge-multiple: true
      - name: Prepare before runtime changes
        run: |
          python -m pip install 'paramiko>=3,<5'
          npm install --prefix "$RUNNER_TEMP/noa-category" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-category-final.mjs "$RUNNER_TEMP/noa-category/check.mjs"
          python scripts/qa/category-storage-fixture.py
          php -S 127.0.0.1:8099 -t "$RUNNER_TEMP/noa-category-fixture" > "$RUNNER_TEMP/category-php.log" 2>&1 &
      - name: Activate reviewed ACT, stream and N80 consumer files from exact operating baselines
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          NOA_FINISH_PREIMAGE_ARCHIVE: ${{ runner.temp }}/noa-finish-preimages/preimages.tar.gz
        run: python scripts/noa_category_release.py
      - name: Verify actual production categories and playback
        id: live_category
        env: {NOA_CATEGORY_PHASE: live}
        run: node "$RUNNER_TEMP/noa-category/check.mjs"
      - name: Verify actual four-level discovery on both pages
        id: live_four
        env:
          NOA_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/noa-category/package.json
          NOA_FOUR_PHASE: live
        run: node scripts/qa/noa-four-level.mjs
      - name: Verify integrated production behavior and performance
        id: live
        env:
          NOA_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/noa-category/package.json
          NOA_REPOSITORY: ${{ github.workspace }}
          NOA_FINISH_QA_OUTPUT: qa/finish-live/verified.json
        run: node scripts/qa/noa-finish-live.mjs --production
      - name: Verify actual YouTube detail preservation and measure the same mobile and desktop conditions
        env:
          NOA_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/noa-category/package.json
        run: node scripts/qa/noa-youtube-lazy-live.mjs
      - name: Register the existing twelve-area work journal without completing the parent
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/n80_workstate_sync.py
      - name: Diagnose actual MUSIC availability without policy, claim or ACK
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          N80_MUSIC_CONSUMER_DIAGNOSE_ONLY: '1'
        run: |
          python scripts/n80_live_observer.py
          python - <<'PY_DIAG'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'n80-live-observer-result.json').read_text())
          assert result['musicAvailabilityConsumer']['diagnostics'][0]['available'] is True, 'actual_music_availability_diagnostic_failed'
          PY_DIAG
      - name: Enable only the deployed MUSIC availability verifier
        id: n80_enable
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/n80_enable_music_consumer.py
      - name: Verify actual MUSIC durable acknowledgement and unchanged replay
        id: n80_music
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          N80_MUSIC_CONSUMER_LIMIT: '1'
        run: python scripts/n80_live_observer.py
      - name: Disable only this run's new policy if the exact consumer fails
        if: failure() && steps.n80_music.outcome == 'failure'
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/n80_enable_music_consumer.py rollback
      - name: Activate only the Drive-backed play-accounting flag after all candidate and live checks
        id: playcount_enable
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_playcount_activate.py
      - name: Revert only this run's policy change if activation cannot be verified
        if: failure() && steps.playcount_enable.outcome == 'failure'
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_playcount_activate.py rollback
      - name: Restore only release-owned bytes if live acceptance fails
        if: failure() && (steps.live_category.outcome == 'failure' || steps.live_four.outcome == 'failure' || steps.live.outcome == 'failure')
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
          NOA_FINISH_PREIMAGE_ARCHIVE: ${{ runner.temp }}/noa-finish-preimages/preimages.tar.gz
        run: python scripts/noa_category_release.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-finish-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/n80-live-observer-result.json
            ${{ runner.temp }}/n80-workstate-result.json
            ${{ runner.temp }}/n80-music-activation.json
            ${{ runner.temp }}/noa-playcount-activation.json
            category-deploy-proof.json
            category-proof/live/
            qa/finish-live/
          retention-days: 2
