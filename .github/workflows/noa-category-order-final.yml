name: NOA Category Ordering Final Production
on:
  pull_request:
    paths: ['deploy/noa-category-order*','deploy/noa-browse.js','deploy/noa-ui.css','deploy/noa-library.php','deploy/noa-music.php','deploy/noa-youtube.php','deploy/noa-design.extend.php','scripts/noa_category_*','scripts/qa/noa-category-final.mjs','scripts/qa/category-storage-fixture.py','.github/workflows/noa-category-order-final.yml']
  push:
    branches: [main]
    paths: ['deploy/noa-category-order*','deploy/noa-browse.js','deploy/noa-ui.css','deploy/noa-library.php','deploy/noa-music.php','deploy/noa-youtube.php','deploy/noa-design.extend.php','scripts/noa_category_release.py','scripts/noa_category_drive_receipt.json','.github/workflows/noa-category-order-final.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Validate all category components
        run: |
          node --check deploy/noa-browse.js
          php -l deploy/noa-category-order.php
          php -l deploy/noa-category-order-admin.php
          php -l deploy/noa-library.php
          php -l deploy/noa-music.php
          php -l deploy/noa-youtube.php
          php -l deploy/noa-design.extend.php
          node --test scripts/qa/noa-browse.test.mjs
          python -m py_compile scripts/noa_category_release.py
      - name: Candidate UI and isolated authenticated storage tests
        env: {NOA_CATEGORY_PHASE: candidate}
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-category" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-category-final.mjs "$RUNNER_TEMP/noa-category/check.mjs"
          python scripts/qa/category-storage-fixture.py
          php -S 127.0.0.1:8099 -t "$RUNNER_TEMP/noa-category-fixture" > "$RUNNER_TEMP/category-php.log" 2>&1 &
          node "$RUNNER_TEMP/noa-category/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-category-candidate-${{ github.run_id }}', path: category-proof/candidate/, retention-days: 2}
  production:
    if: github.event_name != 'pull_request'
    needs: candidate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Prepare before runtime changes
        run: |
          python -m pip install 'paramiko>=3,<5'
          npm install --prefix "$RUNNER_TEMP/noa-category" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-category-final.mjs "$RUNNER_TEMP/noa-category/check.mjs"
          python scripts/qa/category-storage-fixture.py
          php -S 127.0.0.1:8099 -t "$RUNNER_TEMP/noa-category-fixture" > "$RUNNER_TEMP/category-php.log" 2>&1 &
      - name: Activate only Drive-verified sources atomically
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_category_release.py
      - name: Verify actual production category navigation and playback
        id: live
        env: {NOA_CATEGORY_PHASE: live}
        run: node "$RUNNER_TEMP/noa-category/check.mjs"
      - name: Restore release-owned bytes if live acceptance fails
        if: failure() && steps.live.outcome == 'failure'
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_category_release.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-category-live-${{ github.run_id }}
          path: |
            category-deploy-proof.json
            category-proof/live/
          retention-days: 2
