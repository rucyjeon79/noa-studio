name: N80 host release capability (read-only probe)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n80-ssh-release-capability.yml'
      - 'scripts/qa/n80-ssh-release-capability.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n80-shell-release-capability
  cancel-in-progress: true
jobs:
  probe:
    if: ${{ false }} # Retired GitHub host SSH / background automation; N80 owns request-based work
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned SSH client
        run: python -m pip install 'paramiko>=3,<5'
      - name: Probe remote command and PHP CLI without host file writes
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: python scripts/qa/n80-ssh-release-capability.py
