env:
  NOA_DRIVE_RCLONE_CONFIG_B64: ${{ secrets.NOA_DRIVE_RCLONE_CONFIG_B64 }}
name: NOA hourly integrated popularity snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-popularity-hourly.yml']
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: noa-popularity-hourly, cancel-in-progress: false}
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m pip install --user paramiko==3.5.1
      - name: Calculate current UTC hour once and verify durable MySQL result
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_POPULARITY_PHASE: hourly
        run: python3 scripts/noa_popularity_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noa-popularity-hourly
          path: quality-popularity/hourly.json
          retention-days: 7
