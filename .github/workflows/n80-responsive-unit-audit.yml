name: N80 responsive unit audit (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n80-responsive-unit-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install read-only CSS analysis dependencies
        run: python3 -m pip install 'paramiko>=3,<5' 'tinycss2>=1.3,<2'
      - name: Inspect current host CSS dimensional units (no writes)
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
        run: python3 scripts/qa/n80-responsive-unit-audit.py
      - name: Upload bounded geometry audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n80-responsive-unit-evidence-${{ github.run_id }}
          path: n80-responsive-unit-audit/unit-audit.json
          retention-days: 3
