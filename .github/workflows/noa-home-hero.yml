name: NOA Home Hero Orientation Production
on:
  push:
    branches: [main]
    paths: &paths
      - 'deploy/noa-app/home.php'
      - 'deploy/noa-hero.js'
      - 'scripts/qa/noa-hero.test.mjs'
      - 'scripts/qa/noa-home-hero-layout.mjs'
      - 'scripts/noa_home_label_deploy.py'
      - '.github/workflows/noa-home-hero.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: noa-home-hero-orientation, cancel-in-progress: false}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Validate scoped home markup and existing media lifecycle
        run: |
          php -l deploy/noa-app/home.php
          node --check deploy/noa-hero.js
          python -m py_compile scripts/noa_home_label_deploy.py
          node --check scripts/qa/noa-home-hero-layout.mjs
          node --test scripts/qa/noa-hero.test.mjs
      - name: Prepare established browser verification
        run: |
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/noa-hero" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-home-hero-layout.mjs "$RUNNER_TEMP/noa-hero/check.mjs"
      - name: Check fixed layouts, genre content, one playback and blocked autoplay
        run: node "$RUNNER_TEMP/noa-hero/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-hero-candidate-${{ github.run_id }}', path: hero-layout-proof/, retention-days: 2}
  deploy:
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[ainoa-release]')
    needs: candidate
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare existing NOA SFTP and browser tools
        run: |
          python scripts/qa/noa-qa-font.py
          python -m pip install 'paramiko>=3,<5'
          npm install --prefix "$RUNNER_TEMP/noa-hero" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-home-hero-layout.mjs "$RUNNER_TEMP/noa-hero/check.mjs"
      - name: Compare both operating SHAs and deploy hero runtime before HOME
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_home_label_deploy.py
      - name: Verify actual operating portrait and landscape geometry
        env: {NOA_HERO_PHASE: live}
        run: node "$RUNNER_TEMP/noa-hero/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-hero-live-${{ github.run_id }}', path: hero-layout-proof/, retention-days: 2}
