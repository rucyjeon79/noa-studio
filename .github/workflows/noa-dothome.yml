name: NOA Dothome Deployment

on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-dothome.yml']
  workflow_dispatch:
    inputs:
      confirm_live:
        description: 'SSH_CHECK = port probe; SSH_AUTH_CHECK = authenticated read-only inspection'
        required: true
        type: choice
        options:
          - SSH_CHECK
          - SSH_AUTH_CHECK
        default: SSH_CHECK

permissions:
  contents: read

concurrency:
  group: noa-dothome-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check SSH TCP reachability (no login or upload)
        if: inputs.confirm_live == 'SSH_CHECK'
        env:
          SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
        run: |
          python3 - <<'PY'
          import os, socket
          host = os.environ['SSH_HOST']
          if not host:
              raise SystemExit('NOA_FTP_HOST is missing')
          try:
              with socket.create_connection((host, 2022), timeout=12) as conn:
                  conn.settimeout(8)
                  banner = conn.recv(256).decode('ascii', errors='replace').strip()
                  print('TCP 2022 connected; SSH banner:', banner[:100])
                  if not banner.startswith('SSH-'):
                      raise SystemExit('Port 2022 did not return an SSH banner')
          except OSError as exc:
              raise SystemExit('SSH port 2022 unavailable: ' + str(exc))
          PY
      - name: Inspect presented SSH host key (not yet trusted)
        if: inputs.confirm_live == 'SSH_CHECK'
        env:
          SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
        run: |
          set -eu
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          ssh-keyscan -T 12 -p 2022 "$SSH_HOST" 2>/dev/null > "$keyfile"
          test -s "$keyfile" || { echo 'No SSH host key received'; exit 1; }
          echo 'OBSERVED host key fingerprints (must verify independently before trusting):'
          ssh-keygen -lf "$keyfile" -E sha256
      - name: Checkout NOA SSH checker
        if: github.event_name == 'push' || inputs.confirm_live == 'SSH_AUTH_CHECK'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate over SSH and inspect directory (read only)
        if: github.event_name == 'push' || inputs.confirm_live == 'SSH_AUTH_CHECK'
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ vars.NOA_SSH_HOST_FINGERPRINT || 'SHA256:0LqxbpOziJ4XgOMNEkfVrVGle3kpjJessI+jKqZ4JCU' }}
          NOA_SSH_ROOT: ${{ vars.NOA_FTP_ROOT }}
        run: |
          set -eu
          python3 -m pip install --user 'paramiko==3.5.1'
          python3 -m py_compile scripts/noa_ssh_check.py
          python3 scripts/noa_ssh_check.py

      - name: Validate and deploy missing NOA PHP files
        if: github.event_name == 'push'
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ vars.NOA_SSH_HOST_FINGERPRINT || 'SHA256:0LqxbpOziJ4XgOMNEkfVrVGle3kpjJessI+jKqZ4JCU' }}
          NOA_SSH_ROOT: ${{ vars.NOA_FTP_ROOT }}
        run: |
          set -eu
          python3 scripts/noa_build_seed.py
          php -l bridge/seed.php
          php -l deploy/noa-music.php
          php -l deploy/noa-home.extend.php
          php -l deploy/noa2.php
          php -l deploy/noa-library.php
          php -l bridge/storage.php
          php -l bridge/setup.php
          php -l bridge/index.php
          php -l bridge/library.php
          python3 scripts/noa_sftp_deploy.py

      - name: Verify production URLs without authentication
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          cases = [('/',200),('/noa2.php',200),('/noa-music.php',200),('/noa-bridge/noa-face.jpg',200),('/noa-bridge/seed.php',403),('/noa-library.php',403),('/noa-bridge/index.php?health=1',403),('/noa-bridge/library.php',403),('/noa-bridge/setup.php',403),('/bbs/login.php',200),('/?device=mobile',200)]
          for path, expected in cases:
              req = urllib.request.Request('https://noastudio.ai.kr'+path, headers={'User-Agent':'NOA-Production-Verification'})
              try:
                  response = urllib.request.urlopen(req,timeout=25)
              except urllib.error.HTTPError as response_error:
                  response = response_error
              body = response.read().decode('utf-8',errors='replace')
              status = response.status
              print(path, status, 'final:', response.geturl())
              if status != expected:
                  raise SystemExit('Unexpected HTTP status')
              if path == '/noa-music.php':
                  count = body.count('class="song"')
                  print('Public music document count:', count)
                  if count != 63 or '관리자 보기' in body:
                      raise SystemExit('Public music visibility mismatch')
              if path in ('/','/noa2.php','/?device=mobile') and 'Music beyond' not in body:
                  raise SystemExit('NOA homepage content missing')
          PY
