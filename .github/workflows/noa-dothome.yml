name: NOA Dothome Deployment
# Share original and extended UI translations with Android; verify responsive navigation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-dothome.yml']
  workflow_dispatch:
    inputs:
      confirm_live:
        description: 'SSH_CHECK = port probe; SSH_AUTH_CHECK = authenticated read-only inspection'
        required: true
        type: choice
        options:
          - SSH_CHECK
          - SSH_AUTH_CHECK
        default: SSH_CHECK

permissions:
  contents: read

concurrency:
  group: noa-dothome-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check SSH TCP reachability (no login or upload)
        if: inputs.confirm_live == 'SSH_CHECK'
        env:
          SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
        run: |
          python3 - <<'PY'
          import os, socket
          host = os.environ['SSH_HOST']
          if not host:
              raise SystemExit('NOA_FTP_HOST is missing')
          try:
              with socket.create_connection((host, 2022), timeout=12) as conn:
                  conn.settimeout(8)
                  banner = conn.recv(256).decode('ascii', errors='replace').strip()
                  print('TCP 2022 connected; SSH banner:', banner[:100])
                  if not banner.startswith('SSH-'):
                      raise SystemExit('Port 2022 did not return an SSH banner')
          except OSError as exc:
              raise SystemExit('SSH port 2022 unavailable: ' + str(exc))
          PY
      - name: Inspect presented SSH host key (not yet trusted)
        if: inputs.confirm_live == 'SSH_CHECK'
        env:
          SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
        run: |
          set -eu
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          ssh-keyscan -T 12 -p 2022 "$SSH_HOST" 2>/dev/null > "$keyfile"
          test -s "$keyfile" || { echo 'No SSH host key received'; exit 1; }
          echo 'OBSERVED host key fingerprints (must verify independently before trusting):'
          ssh-keygen -lf "$keyfile" -E sha256
      - name: Checkout NOA SSH checker
        if: github.event_name == 'push' || inputs.confirm_live == 'SSH_AUTH_CHECK'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate over SSH and inspect directory (read only)
        if: github.event_name == 'push' || inputs.confirm_live == 'SSH_AUTH_CHECK'
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ vars.NOA_SSH_HOST_FINGERPRINT || 'SHA256:0LqxbpOziJ4XgOMNEkfVrVGle3kpjJessI+jKqZ4JCU' }}
          NOA_SSH_ROOT: ${{ vars.NOA_FTP_ROOT }}
        run: |
          set -eu
          python3 -m pip install --user 'paramiko==3.5.1' 'cairosvg==2.7.1'
          python3 -m py_compile scripts/noa_ssh_check.py
          python3 scripts/noa_ssh_check.py

      - name: Validate and deploy missing NOA PHP files
        if: github.event_name == 'push'
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_FTP_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_FTP_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_FTP_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ vars.NOA_SSH_HOST_FINGERPRINT || 'SHA256:0LqxbpOziJ4XgOMNEkfVrVGle3kpjJessI+jKqZ4JCU' }}
          NOA_SSH_ROOT: ${{ vars.NOA_FTP_ROOT }}
        run: |
          set -eu
          python3 scripts/noa_build_seed.py
          python3 scripts/noa_build_archive.py
          python3 scripts/noa_check_media.py
          php -l bridge/media-status.php
          python3 -c "import cairosvg; [cairosvg.svg2png(url='deploy/noa-icon.svg',write_to='deploy/noa-icon-'+str(n)+'.png',output_width=n,output_height=n) for n in (192,512)]"
          php -l bridge/source-audit.php
          php -l bridge/catalog.php
          php -l bridge/check-media.php
          php -l bridge/user-playlists.php
          php -l bridge/source-url-report.php
          node --check deploy/noa-playlists.js
          php -l deploy/noa-editor.php
          php -l deploy/noa-download.php
          php -l bridge/source-archive.php
          php -l bridge/source-import.php
          php -l bridge/source-cli.php
          php -l bridge/seed.php
          php -l deploy/noa-music.php
          php -l deploy/noa-home.extend.php
          php -l deploy/noa2.php
          php -l deploy/noa-library.php
          php -l bridge/storage.php
          php -l bridge/setup.php
          php -l bridge/index.php
          php -l bridge/library.php
          find deploy/theme/noa_studio -name "*.php" -print0 | xargs -0 -n1 php -l
          php -l deploy/noa-design.extend.php
          php -l deploy/noa-settings.php
          php -l deploy/noa-theme-admin.php
          php -l bridge/ui-preferences.php
          node --check deploy/noa-ui.js
          node --check deploy/noa-home.js
          python3 scripts/noa_sftp_deploy.py

      - name: Verify production URLs without authentication
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          cases = [('/noa-ui-words.json',200),('/noa-legacy-i18n.json',200),('/noa-ui.css',200),('/noa-ui.js',200),('/noa-design.json',200),('/noa-settings.php',200),('/noa-bridge/ui-preferences.php',200),('/noa-theme-admin.php',403),('/',200),('/noa2.php',200),('/noa-music.php',200),('/noa-bridge/noa-face.jpg',200),('/noa-bridge/seed.php',403),('/noa-bridge/source-archive.php',403),('/noa-bridge/source-import.php',403),('/noa-bridge/source-cli.php',403),('/noa-bridge/source-audit.php',403),('/noa-bridge/media-status.php',403),('/noa-bridge/catalog.php',200),('/noa-bridge/characters/noa-face.jpg',200),('/noa-bridge/characters/noel-face.jpg',200),('/noa-manifest.json',200),('/noa-sw.js',200),('/noa-icon-192.png',200),('/noa-icon-512.png',200),('/noa-bridge/source-url-report.php',403),('/noa-playlists.js',200),('/noa-bridge/user-playlists.php',401),('/noa-editor.php',403),('/noa-bridge/check-media.php?video=o5NaioWtXuM',403),('/noa-library.php',403),('/noa-bridge/index.php?health=1',403),('/noa-bridge/library.php',403),('/noa-bridge/setup.php',403),('/bbs/login.php',200),('/?device=mobile',200)]
          for path, expected in cases:
              req = urllib.request.Request('https://noastudio.ai.kr'+path, headers={'User-Agent':'NOA-Production-Verification'})
              try:
                  response = urllib.request.urlopen(req,timeout=25)
              except urllib.error.HTTPError as response_error:
                  response = response_error
              body = response.read().decode('utf-8',errors='replace')
              status = response.status
              print(path, status, 'final:', response.geturl())
              if status != expected:
                  raise SystemExit('Unexpected HTTP status')
              if path in ('/','/noa2.php','/noa-music.php') and 'noa-studio.grok.me' in body:
                  raise SystemExit('Legacy app link remains')
              if path == '/noa-bridge/catalog.php':
                  import json
                  data=json.loads(body)
                  if not 63 <= len(data.get('items',[])) <= 414 or data.get('access')!='public':
                      raise SystemExit('Shared catalog visibility mismatch')
              if path == '/noa-music.php':
                  count = body.count('class="song"')
                  print('Public music document count:', count)
                  if not 63 <= count <= 414 or '관리자 보기' in body:
                      raise SystemExit('Public music visibility mismatch')
              if path in ('/','/noa2.php','/?device=mobile') and '2.0' in body:
                  raise SystemExit('Unwanted version branding on production page')
              if path in ('/','/noa2.php','/?device=mobile') and 'Music beyond' not in body:
                  raise SystemExit('NOA homepage content missing')
          PY

      - name: Verify tested Android download bytes
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib
          base='https://noastudio.ai.kr'
          with urllib.request.urlopen(base+'/noa-android-release.json',timeout=25) as response:
              release=json.load(response)
          with urllib.request.urlopen(base+'/noa-download.php',timeout=45) as response:
              data=response.read()
              assert response.headers.get('Content-Type')=='application/vnd.android.package-archive'
              assert hashlib.sha256(data).hexdigest()==release['sha256']
              print('Android download verified:',len(data),'bytes; SHA-256 matches published tested APK')
          PY

      - name: Verify production desktop and mobile design interactions
        if: github.event_name == 'push'
        run: |
          npm install --prefix "$RUNNER_TEMP/noa-ui-check" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-ui-check/node_modules/.bin/playwright" install --with-deps chromium
          cp scripts/noa_design_verify.mjs "$RUNNER_TEMP/noa-ui-check/verify.mjs"
          node "$RUNNER_TEMP/noa-ui-check/verify.mjs"
      - name: Preserve production design proof
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@v4
        with:
          name: noa-production-design-verification
          path: screenshots/noa-design-*
          if-no-files-found: warn
