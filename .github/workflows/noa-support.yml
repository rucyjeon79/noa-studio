name: NOA creator support and settlement
on:
  push:
    branches: [main, noa-support-finish]
    paths: ['bridge/support*.php','deploy/noa-support.*','scripts/noa_support_release.py','tests/support/**','.github/workflows/noa-support.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated-noa-ci, MYSQL_DATABASE: noa_subscription_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated-noa-ci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noa_subscription_test;charset=utf8mb4'
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: isolated-noa-ci
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli,pdo_mysql,mbstring'}
      - name: Validate syntax and real isolated point transactions
        run: |
          for f in bridge/support*.php deploy/noa-support.php deploy/noa-engagement.extend.php tests/support/*.php; do php -l "$f"; done
          node --check deploy/noa-support.js
          php tests/sitemap/registry_test.php
          php tests/subscription/mysql_test.php
          php tests/support/mysql.php
          python tests/support/race.py
          python -m py_compile scripts/noa_support_release.py
  deploy:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[ecosystem-release]')
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - run: python scripts/noa_support_release.py
      - name: Verify guest denial without transactions
        run: |
          python - <<'PY'
          import urllib.request,urllib.error
          root='https://noastudio.ai.kr'
          try:
              urllib.request.urlopen(root+'/noa-bridge/support.php?action=dashboard',timeout=30)
              raise RuntimeError('guest_access_not_denied')
          except urllib.error.HTTPError as e:
              assert e.code==401,e.code
          with urllib.request.urlopen(root+'/',timeout=30) as r:
              html=r.read().decode()
              assert '/noa-support.js?v=' in html and '/noa-support.css?v=' in html
          print('SUPPORT_ASSETS_AND_GUEST_DENIAL_VERIFIED_NO_TRANSACTIONS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-support-live-${{ github.run_id }}', path: ainoa-proof/deployment.json, retention-days: 7}
