name: NOA membership rewards and account bar
on:
  push:
    branches: [main]
    paths: ['bridge/subscription-core.php','tests/subscription/**','bridge/membership*.php','bridge/social-policy.php','deploy/noa-sitemap.php','scripts/noa_membership_evidence.py','deploy/noa-social.extend.php','deploy/noa-login.php','deploy/noa-membership*','deploy/noa-account.*','tests/membership/**','scripts/noa_membership*.py','scripts/noa_membership*.php','scripts/qa/noa-membership.mjs','.github/workflows/noa-membership-policy.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Read actual native point storage and event hooks
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_membership_control.py audit --verify-if-active
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-membership-audit-${{ github.run_id }}', path: membership-proof/, retention-days: 14}
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated-noa-ci, MYSQL_DATABASE: noa_subscription_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated-noa-ci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=noa_subscription_test;charset=utf8mb4
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: isolated-noa-ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli,pdo_mysql,mbstring'}
      - name: Validate native rewards and payments without external billing
        shell: bash
        run: |
          php -l bridge/membership-core.php
          php -l bridge/membership.php
          php -l deploy/noa-membership.extend.php
          php -l deploy/noa-membership.php
          php -l scripts/noa_membership_control.php
          php -l scripts/noa_membership_storage.php
          php -l bridge/social-policy.php
          php -l deploy/noa-social.extend.php
          php -l deploy/noa-login.php
          php -l scripts/noa_membership_verify.php
          php tests/membership/social.php
          php tests/sitemap/registry_test.php
          node --check deploy/noa-account.js
          node --check deploy/noa-membership.js
          php tests/subscription/core_test.php
          php tests/subscription/mysql_test.php | tee "$RUNNER_TEMP/subscription.log"
          grep -F SUBSCRIPTION_MYSQL_TRANSACTION "$RUNNER_TEMP/subscription.log"
          php tests/membership/mysql.php | tee "$RUNNER_TEMP/membership.log"
          grep -F MEMBERSHIP_LOGIN_PENDING_130 "$RUNNER_TEMP/membership.log"
          php tests/membership/storage.php | tee "$RUNNER_TEMP/storage.log"
          grep -F MEMBERSHIP_SAME_HOST_BACKUP_RESTORE_ENGINE_CONVERSION_OK "$RUNNER_TEMP/storage.log"
      - name: Verify mobile account, purchase controls and social signup states
        run: |
          php tests/membership/render.php
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/noa-membership" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-membership.mjs "$RUNNER_TEMP/noa-membership/check.mjs"
          node "$RUNNER_TEMP/noa-membership/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-membership-candidate-${{ github.run_id }}', path: membership-proof/, retention-days: 14}
  deploy:
    needs: [native, preflight]
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare existing transport and browser
        run: |
          python -m pip install 'paramiko>=3,<5'
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/noa-membership" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp scripts/qa/noa-membership.mjs "$RUNNER_TEMP/noa-membership/check.mjs"
      - name: Install reviewed membership and social source with preimage checks
        id: upload
        env: &membership_env
          GH_TOKEN: ${{ github.token }}
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: python scripts/noa_membership_deploy.py
      - name: Verify live guest, direct signup rejection and existing administrator login
        id: live
        env: {NOA_MEMBERSHIP_PHASE: live}
        run: node "$RUNNER_TEMP/noa-membership/check.mjs"
      - name: Back up and verify native tables on the same host before activating approved policy
        env: *membership_env
        run: python scripts/noa_membership_control.py activate
      - name: Verify real native point operations using only a disposable private account
        env: *membership_env
        run: python scripts/noa_membership_control.py verify
      - name: Reconcile expired VIP passes and levels
        env: *membership_env
        run: python scripts/noa_membership_control.py maintain
      - name: Build verified membership receipt
        run: python scripts/noa_membership_evidence.py build
      - name: Restore source only if pre-activation public verification failed
        if: failure() && (steps.upload.outcome == 'failure' || steps.live.outcome == 'failure')
        env: *membership_env
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_membership_deploy.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-membership-live-${{ github.run_id }}', path: membership-proof/, retention-days: 14}
