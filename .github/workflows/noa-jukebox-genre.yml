name: NOA jukebox genre subtitle
on:
  pull_request:
    paths: ['scripts/noa_jukebox_genre_manifest.json','.github/workflows/noa-jukebox-genre.yml']
  push:
    branches: [main]
    paths: ['scripts/noa_jukebox_genre_manifest.json','.github/workflows/noa-jukebox-genre.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Check current metadata and playback behavior
        run: |
          php -l deploy/noa-music.php
          node --check deploy/noa-app/p0-player.js
          node --test scripts/qa/noa-browse.test.mjs tests/jukebox/playback_recovery.test.cjs
          npm install --prefix "$RUNNER_TEMP/genre" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/room-themes/player.mjs "$RUNNER_TEMP/genre/player.mjs"
          node "$RUNNER_TEMP/genre/player.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: jukebox-genre-browser, path: room-theme-proof/player/, retention-days: 7}
  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - name: Apply only subtitle replacements to current production
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          python -m pip install 'paramiko>=3,<5'
          cp scripts/noa_jukebox_genre_manifest.json scripts/noa_plain_language_manifest.json
          python scripts/noa_plain_language_release.py
          python - <<'PY'
          import json
          proof=json.load(open('plain-language-proof/deployment.json'))
          assert not proof['notInstalled']
          assert all(not f['notPresentInLiveVersion'] for f in proof['files'])
          assert proof['ok']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: jukebox-genre-production, path: plain-language-proof/deployment.json, retention-days: 7}
