name: NOA Toss point checkout
on:
  pull_request:
    paths: &paths ['bridge/toss*.php','deploy/noa-points*','deploy/noa-assets/points/**','deploy/noa-payment-settings.php','tests/payments/**','scripts/noa_payments_release.py','scripts/qa/noa-payments.mjs','.github/workflows/noa-payments.yml']
  push:
    branches: [main]
    paths: *paths
permissions: {contents: read}
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[vip-release]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: isolated-noa-ci, MYSQL_DATABASE: noa_subscription_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pisolated-noa-ci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOA_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noa_subscription_test;charset=utf8mb4'
      NOA_MYSQL_USER: root
      NOA_MYSQL_PASSWORD: isolated-noa-ci
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mysqli,pdo_mysql,pdo_sqlite,mbstring,curl'}
      - name: Verify server approval, atomic native ledger, duplicate callbacks and cancellation
        run: |
          for f in bridge/toss*.php deploy/noa-points.php deploy/noa-payment-settings.php deploy/noa-membership.php tests/payments/*.php; do php -l "$f"; done
          node --check deploy/noa-points.js
          php tests/member/access_test.php
          php tests/subscription/core_test.php
          php tests/subscription/mysql_test.php
          php tests/payments/mysql.php
          python tests/payments/race_test.py
          php tests/payments/http_fixture.php
          python tests/payments/http_test.py
          php tests/vip-store/mysql.php
          python tests/vip-store/race.py
          php tests/kcp/core.php
          php tests/kcp/mysql.php
      - name: Verify checkout and seven audio cards on mobile and desktop
        run: |
          php tests/payments/fixture.php
          python scripts/qa/noa-qa-font.py
          npm --fetch-timeout=60000 --fetch-retries=1 install --prefix "$RUNNER_TEMP/noa-payments" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/noa-payments/node_modules/.bin/playwright" install --with-deps webkit
          cp scripts/qa/noa-payments.mjs "$RUNNER_TEMP/noa-payments/check.mjs"
          node "$RUNNER_TEMP/noa-payments/check.mjs"
          cp tests/payments/settings-browser.mjs "$RUNNER_TEMP/noa-payments/settings-browser.mjs"
          node "$RUNNER_TEMP/noa-payments/settings-browser.mjs"
          php tests/vip-store/fixture.php
          cp tests/vip-store/browser.mjs "$RUNNER_TEMP/noa-payments/vip.mjs"
          node "$RUNNER_TEMP/noa-payments/vip.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'noa-payments-candidate-${{ github.run_id }}'
          path: |
            payments-proof/
            vip-proof/
          retention-days: 7
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - id: upload
        run: python scripts/noa_payments_release.py
      - name: Verify public packs, guest privacy and protected setup without charging
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json
          root='https://noastudio.ai.kr'
          with urllib.request.urlopen(root+'/noa-bridge/toss.php') as r:
            d=json.load(r);assert d['ok'] and not d['member'] and d['csrf'] is None and d['balance'] is None and d['orders']==[]
            assert 'no-store' in r.headers['Cache-Control']
            assert [p['totalPoints'] for p in d['products']]==[1000,3000,5000,11000,33000,55000]
            assert 'secretKey' not in str(d) and 'webhookSecret' not in str(d)
          for p in [1000,3000,5000,10000,30000,50000]:
            with urllib.request.urlopen(root+'/noa-assets/points-p'+str(p)+'.webp') as r:assert r.status==200 and r.read(4)==b'RIFF'
          for path in ['/noa-payment-settings.php','/noa-bridge/toss-config.php','/noa-bridge/toss-core.php']:
            try:urllib.request.urlopen(root+path);raise AssertionError('private route exposed')
            except urllib.error.HTTPError as e:assert e.code==403
          with urllib.request.urlopen(root+'/noa-points.php') as r:assert r.status==200 and 'points-products' in r.read().decode()
          print('TOSS_PUBLIC_PACKS_PRIVATE_SETUP_NO_CHARGE_OK',json.dumps({'ready':d['payment']['ready'],'mode':d['payment']['mode']}))
          PY
      - if: failure() && steps.upload.outcome != 'skipped'
        run: |
          if [ -f "$RUNNER_TEMP/noa-ainoa-before.json" ]; then python scripts/noa_payments_release.py rollback; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-payments-live-${{ github.run_id }}', path: ainoa-proof/, retention-days: 7}

