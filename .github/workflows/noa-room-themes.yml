name: NOA premium rooms and theme selection
on:
  push:
    branches: [main]
    paths: ['scripts/noa_room_theme_release.py','tests/room-themes/**','.github/workflows/noa-room-themes.yml']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    env:
      GH_TOKEN: ${{ github.token }}
      NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
      NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
      NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
      NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Deploy verified UI assets and check public hashes
        run: node --check deploy/noa-ui.js && php -l bridge/ui-preferences.php && python scripts/noa_room_theme_release.py
      - name: Inspect all live destinations without transactions
        run: |
          python scripts/qa/noa-qa-font.py
          npm install --prefix "$RUNNER_TEMP/noa-live-ui" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          cp tests/room-themes/live.mjs "$RUNNER_TEMP/noa-live-ui/check.mjs"
          node "$RUNNER_TEMP/noa-live-ui/check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'noa-room-themes-${{ github.run_id }}', path: 'room-theme-proof/', retention-days: 7}
