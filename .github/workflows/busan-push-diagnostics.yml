name: Busan push owner-device confirmation
on:
  push:
    paths: ['.github/workflows/busan-push-diagnostics.yml']
permissions: {contents: read}
concurrency: {group: busan-readonly-sftp, cancel-in-progress: false}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m pip install paramiko==3.5.1 pywebpush==2.4.0
      - env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          cd scripts
          python3 - <<'PY'
          import os,socket,hmac,json,tempfile,zipfile,base64,io,re,sys,hashlib,urllib.request
          from pathlib import Path
          import paramiko
          from busan_readonly_check import configuration,fingerprint,PORT,ROOT
          workflow=Path('../.github/workflows/busan-widget.yml').read_text()
          bundle=zipfile.ZipFile(io.BytesIO(base64.b64decode(re.search(r"base64.b64decode\('([^']+)'\)",workflow)[1])))
          with tempfile.TemporaryDirectory() as temporary:
           path=Path(temporary);(path/'busan_push_dispatch.py').write_bytes(bundle.read('scripts/busan_push_dispatch.py'));sys.path.insert(0,str(path))
           from busan_push_dispatch import validate_signer,deliver
           host,user,password,pin=configuration(os.environ)
           private='/hosting/rucyjeon79/busan-assistant-private'
           with socket.create_connection((host,PORT),timeout=15) as sock:
            with paramiko.Transport(sock) as t:
             t.start_client(timeout=20);assert hmac.compare_digest(fingerprint(t.get_remote_server_key()),pin)
             t.auth_password(user,password,fallback=False)
             with paramiko.SFTPClient.from_transport(t) as s:
              s.get_channel().settimeout(25)
              with s.open(private+'/push-vapid.json','rb') as f:keys=json.loads(f.read(8192))
              keyfile=path/'vapid.pem';keyfile.write_text(keys['private_pem']);keyfile.chmod(0o600);validate_signer(keyfile)
              receipt=private+'/push-repair-check-20261027.json'
              try:
               with s.open(receipt,'rb') as f:sent=json.loads(f.read(16384)).get('sent',[])
              except FileNotFoundError:sent=[]
              own=[]
              for name in s.listdir(private+'/push-subscriptions'):
               if not re.fullmatch('[a-f0-9]{64}[.]json',name):continue
               with s.open(private+'/push-subscriptions/'+name,'rb') as f:record=json.loads(f.read(16384))
               if record.get('member')==user:own.append((name[:-5],record))
              with s.open(private+'/activity-account.json','rb') as f:identity=json.loads(f.read(8192))
              accepted=0;failed=0;expired=0;skipped=0;codes={};expired_results=[]
              for device,record in own:
               if device in sent:skipped+=1;continue
               job={'id':device,'generation':record['generation'],'subscription':record['subscription'],'payload':{'title':'부산지부ON · 알림 연결 확인','body':'알림 발송 오류를 수정했습니다. 이 알림이 보이면 휴대폰 수신이 정상입니다.','url':'/','tag':'busan-push-repair-20261027'}}
               result=deliver(job,keyfile)
               code=str(result.get('http') or result.get('error','unknown'));codes[code]=codes.get(code,0)+1
               if result.get('ok'):sent.append(device);accepted+=1
               elif result.get('expired'):expired+=1;expired_results.append(result)
               else:failed+=1
              if expired_results:
               req=urllib.request.Request('https://skhnslu-busan.com/busan-assistant/notification-api.php',data=json.dumps({'action':'ack','results':expired_results}).encode(),headers={'Content-Type':'application/json','X-Busan-Agent-Token':identity['agent_token']})
               with urllib.request.urlopen(req,timeout=30) as response:assert json.load(response).get('acknowledged') is True
              data=json.dumps({'sent':sent}).encode();temp=receipt+'.upload'
              with s.open(temp,'wb') as f:f.write(data)
              s.chmod(temp,0o600);s.posix_rename(temp,receipt)
              print(json.dumps({'owner_devices':len(own),'confirmation_accepted':accepted,'confirmation_failed':failed,'expired_registrations_removed':expired,'already_confirmed':skipped,'http_or_error_counts':codes,'other_members_not_targeted':True}))
              if failed:raise SystemExit('owner_confirmation_not_accepted')
          PY
