name: Busan push delivery diagnosis
on:
  push:
    paths: ['.github/workflows/busan-push-diagnostics.yml']
permissions: {contents: read}
concurrency: {group: busan-readonly-sftp, cancel-in-progress: false}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: busan-readonly
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m pip install paramiko==3.5.1 pywebpush==2.4.0
      - env:
          BUSAN_SSH_HOST: ${{ secrets.BUSAN_SSH_HOST }}
          BUSAN_SSH_USER: ${{ secrets.BUSAN_SSH_USER }}
          BUSAN_SSH_PASSWORD: ${{ secrets.BUSAN_SSH_PASSWORD }}
          BUSAN_SSH_HOST_FINGERPRINT: ${{ secrets.BUSAN_SSH_HOST_FINGERPRINT }}
        run: |
          cd scripts
          python3 - <<'PY'
          import os,socket,hmac,json,urllib.request,datetime,inspect,tempfile
          from pathlib import Path
          import requests
          from pywebpush import webpush
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          import paramiko
          from busan_readonly_check import configuration,fingerprint,PORT,ROOT
          host,user,password,pin=configuration(os.environ)
          private='/hosting/rucyjeon79/busan-assistant-private'
          with socket.create_connection((host,PORT),timeout=15) as sock:
           with paramiko.Transport(sock) as t:
            t.start_client(timeout=20)
            assert hmac.compare_digest(fingerprint(t.get_remote_server_key()),pin)
            t.auth_password(user,password,fallback=False)
            with paramiko.SFTPClient.from_transport(t) as s:
             with s.open(private+'/activity-account.json','rb') as f:identity=json.loads(f.read(8192))
             records=[]
             for name in s.listdir(private+'/push-subscriptions'):
              if name.endswith('.json'):
               with s.open(private+'/push-subscriptions/'+name,'rb') as f:record=json.loads(f.read(16384))
               records.append(record)
             own=[r for r in records if r.get('member')==user]
             with s.open(private+'/push-vapid.json','rb') as f:keys=json.loads(f.read(8192))
             print(json.dumps({'subscriptions':len(records),'owner_devices':len(own),'owner_device_summary':[{'created_utc':datetime.datetime.fromtimestamp(r.get('created',0),datetime.timezone.utc).isoformat(),'acknowledged_slots':r.get('slots',[])[-9:],'has_keys':bool(r.get('subscription',{}).get('keys',{}).get('p256dh') and r.get('subscription',{}).get('keys',{}).get('auth'))} for r in own]},ensure_ascii=False))
            for command in ['command -v php','command -v python3','crontab -l']:
             try:
              channel=t.open_session(timeout=10);channel.settimeout(10);channel.exec_command(command)
              out=channel.recv(65536);code=channel.recv_exit_status()
              print(json.dumps({'capability':command,'exit':code,'available':code==0,'output_bytes':len(out)}))
              channel.close()
             except Exception as e:print(json.dumps({'capability':command,'error_type':type(e).__name__}))
          print(json.dumps({'webpush_parameters':list(inspect.signature(webpush).parameters)}))
          with tempfile.TemporaryDirectory() as folder:
           keyfile=Path(folder)/'vapid.pem';keyfile.write_text(keys['private_pem']);keyfile.chmod(0o600)
           class NoRedirectSession(requests.Session):
            def request(self,*args,**kwargs):kwargs['allow_redirects']=False;return super().request(*args,**kwargs)
           for record in own:
            try:
             result=webpush(subscription_info=record['subscription'],data='{"title":"isolated encoding check"}',vapid_private_key=str(keyfile),vapid_claims={'sub':'https://skhnslu-busan.com/'},ttl=900,timeout=15,requests_session=NoRedirectSession(),curl=True)
             print(json.dumps({'dry_run_encoding':True,'network_send':False}))
            except Exception as e:print(json.dumps({'dry_run_encoding':False,'network_send':False,'error_type':type(e).__name__,'unsupported_session_parameter':'requests_session' in str(e),'private_key_error':'private key' in str(e).lower()}))
          PY
