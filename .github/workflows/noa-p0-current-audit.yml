name: NOA P0 current operating audit
on:
  pull_request:
    paths: ['scripts/noa_p0_current_audit.py','scripts/noa_p0_register_20261029.py','.github/workflows/noa-p0-current-audit.yml']
  push:
    branches: [main]
    paths: ['scripts/noa_p0_current_audit.py','scripts/noa_p0_register_20261029.py','.github/workflows/noa-p0-current-audit.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile scripts/noa_p0_current_audit.py scripts/noa_p0_register_20261029.py
  audit:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency: {group: noa-production-sftp, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install 'paramiko>=3,<5'
      - name: Preserve N80 directive then read SQL metadata, queue and runtime hashes
        env:
          NOA_SSH_HOST: ${{ secrets.NOA_SSH_HOST }}
          NOA_SSH_USER: ${{ secrets.NOA_SSH_USER }}
          NOA_SSH_PASSWORD: ${{ secrets.NOA_SSH_PASSWORD }}
          NOA_SSH_HOST_FINGERPRINT: ${{ secrets.NOA_SSH_HOST_FINGERPRINT }}
        run: |
          python scripts/noa_p0_register_20261029.py
          python scripts/noa_p0_current_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'p0-current-${{ github.run_id }}', path: p0-current-proof/, retention-days: 14}
