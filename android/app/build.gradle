plugins { id 'com.android.application' }
def noaBuildNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '14')
android {
    namespace 'kr.ai.noastudio'
    compileSdk 35
    sourceSets.main.assets.srcDir layout.buildDirectory.dir("generated/noaDesignAssets")
    sourceSets.main.res.srcDir layout.buildDirectory.dir("generated/noaBrandResources")
    defaultConfig { applicationId 'kr.ai.noastudio'; minSdk 26; targetSdk 35; versionCode noaBuildNumber; versionName '2.0.' + noaBuildNumber; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildTypes { debug { crunchPngs false }; release { crunchPngs false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

tasks.register('copyNoaDesign', Copy) {
    from rootProject.file('../deploy/noa-design.json')
    from rootProject.file('../deploy/noa-ui-words.json')
    into layout.buildDirectory.dir('generated/noaDesignAssets')
}
tasks.named('preBuild').configure { dependsOn 'copyNoaDesign' }

tasks.register('copyNoaSymbol', Copy) {
    from(rootProject.file('../public/icon-512.png')) { rename { 'noa_symbol.png' } }
    from(rootProject.file('../public/icon-maskable-512.png')) { rename { 'noa_install_symbol.png' } }
    into layout.buildDirectory.dir('generated/noaBrandResources/drawable-nodpi')
}
tasks.named('preBuild').configure { dependsOn 'copyNoaSymbol' }
