plugins { id 'com.android.application' }
def noaVersionSource = System.getenv('NOA_RELEASE_VERSION_CODE') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '14'
def noaBuildNumber = Integer.parseInt(noaVersionSource)
if (noaBuildNumber < 1 || noaBuildNumber >= 2100000000) throw new GradleException('Invalid Google Play versionCode')
android {
    namespace 'kr.ai.noastudio'
    compileSdk 36
    sourceSets.main.res.srcDir layout.buildDirectory.dir("generated/noaBrandResources")
    sourceSets.main.assets.srcDir layout.buildDirectory.dir("generated/n80BridgeAssets")
    defaultConfig { applicationId 'kr.ai.noastudio'; minSdk 26; targetSdk 36; versionCode noaBuildNumber; versionName '2.0.' + noaBuildNumber; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildTypes { debug { crunchPngs false }; release { crunchPngs false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

// Web design, labels and menus are served exclusively by the production PWA.

tasks.register('copyNoaSymbol', Copy) {
    from(rootProject.file('../public/icon-512.png')) { rename { 'noa_symbol.png' } }
    into layout.buildDirectory.dir('generated/noaBrandResources/drawable-nodpi')
}
tasks.named('preBuild').configure { dependsOn 'copyNoaSymbol' }

// Production APKs carry the receipt from the actual NOA host, bound to this bridge.
// Local debug builds remain possible without pretending they passed the host gate.
tasks.register('verifyN80HostBridge') {
    outputs.upToDateWhen { false }
    doLast {
        def output = layout.buildDirectory.dir('generated/n80BridgeAssets').get().asFile
        delete(output)
        def proofFile = rootProject.file('host-node-proof.json')
        if (!proofFile.exists()) {
            if (System.getenv('NOA_ANDROID_HOST_NODE') == '1') throw new GradleException('N80 host Node proof is required')
            return
        }
        def proof = new groovy.json.JsonSlurper().parse(proofFile)
        def bridgeHash = java.security.MessageDigest.getInstance('SHA-256').digest(file('src/main/assets/noa-native-bridge.js').bytes).encodeHex().toString()
        if (proof.authority != 'N80 Engine' || proof.operation != 'jukebox.android_bridge' ||
            proof.executionTarget != 'existing_noa_host' || proof.passed != true ||
            proof.sourceCommit != System.getenv('GITHUB_SHA') || proof.bridgeSha256 != bridgeHash ||
            proof.tests.tests < 16 || proof.tests.pass != proof.tests.tests ||
            ['fail','cancelled','skipped','todo'].any { proof.tests[it] != 0 }) {
            throw new GradleException('N80 host Node proof does not match this APK')
        }
        output.mkdirs()
        new File(output, 'n80-android-bridge.json').text = proofFile.text
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyN80HostBridge' }
