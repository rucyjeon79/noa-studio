name: NOA private song worker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noa-worker.yml','worker.py','agent.py','gemini.py','gemini_connect.py','gemini-connection.json','tests/gpt/test_gemini_connect.py','verify_agent.py','tests/gpt/test_gemini.py','tests/gpt/test_agent.py']
  workflow_dispatch:
    inputs:
      task_id:
        description: NOA song field request ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: noa-private-worker
  cancel-in-progress: false
jobs:
  generate:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select temporary login directory
        run: echo "CODEX_HOME=$RUNNER_TEMP/noa-codex" >> "$GITHUB_ENV"
      - name: Install Codex
        run: npm install --global @openai/codex@0.166.0
      - name: Restore private login
        env:
          INITIAL_AUTH: ${{ secrets.NOA_CODEX_AUTH }}
          ROTATION_TOKEN: ${{ secrets.NOA_SECRET_ROTATION_TOKEN }}
        run: |
          set -eu
          test -n "$ROTATION_TOKEN"
          umask 077
          mkdir -p "$CODEX_HOME"
          printf '%s' "$INITIAL_AUTH" | jq -ce 'select(.tokens.refresh_token | type == "string")' > "$CODEX_HOME/auth.json"
          cp "$CODEX_HOME/auth.json" "$RUNNER_TEMP/noa-auth-original"
      - name: Verify Gemini connection delivery
        run: PYTHONPATH=. python3 tests/gpt/test_gemini_connect.py
      - name: Process the requested Gemini connection
        if: github.event_name == 'push' && hashFiles('gemini-connection.json') != ''
        env:
          GH_TOKEN: ${{ secrets.NOA_SECRET_ROTATION_TOKEN }}
        run: python3 gemini_connect.py
      - name: Prepare optional Gemini subscription login
        env:
          GEMINI_AUTH: ${{ secrets.NOA_GEMINI_OAUTH }}
        run: |
          set -eu
          if test -z "$GEMINI_AUTH"; then
            echo 'N80_GEMINI_STATUS: gemini_login_required'
            exit 0
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/noa-gemini/.gemini"
          printf '%s' "$GEMINI_AUTH" | jq -ce 'select(.refresh_token | type == "string" and length > 0)' > "$RUNNER_TEMP/noa-gemini/.gemini/oauth_creds.json"
          cp "$RUNNER_TEMP/noa-gemini/.gemini/oauth_creds.json" "$RUNNER_TEMP/noa-gemini-original"
          printf '%s' '{"security":{"auth":{"selectedType":"oauth-personal","enforcedType":"oauth-personal"}},"telemetry":{"enabled":false},"mcpServers":{}}' > "$RUNNER_TEMP/noa-gemini/.gemini/settings.json"
          echo "GEMINI_CLI_HOME=$RUNNER_TEMP/noa-gemini" >> "$GITHUB_ENV"
          npm install --global @google/gemini-cli@0.67.0
      - name: Verify Gemini adapter boundaries
        run: PYTHONPATH=. python3 tests/gpt/test_gemini.py
      - name: Verify connected Gemini subscription
        if: github.event_name == 'push'
        run: python3 gemini.py
      - name: Verify commander boundaries
        run: PYTHONPATH=. python3 tests/gpt/test_agent.py
      - name: Verify hosted ChatGPT commander
        if: github.event_name == 'push' && hashFiles('gemini-connection.json') == ''
        run: python3 verify_agent.py
      - name: Generate the selected field
        if: github.event_name == 'workflow_dispatch'
        env:
          NOA_WORKER_KEY: ${{ secrets.NOA_WORKER_KEY }}
          NOA_TASK_ID: ${{ inputs.task_id }}
        run: python3 worker.py
      - name: Persist refreshed login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.NOA_SECRET_ROTATION_TOKEN }}
        run: |
          set -eu
          trap 'rm -rf "$CODEX_HOME" "$RUNNER_TEMP/noa-auth-original"' EXIT
          if test -s "$RUNNER_TEMP/noa-auth-original" && ! cmp -s "$CODEX_HOME/auth.json" "$RUNNER_TEMP/noa-auth-original"; then
            jq -e '.tokens.refresh_token | type == "string"' "$CODEX_HOME/auth.json" >/dev/null
            gh secret set NOA_CODEX_AUTH --repo "$GITHUB_REPOSITORY" < "$CODEX_HOME/auth.json"
          fi
      - name: Persist refreshed Gemini login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.NOA_SECRET_ROTATION_TOKEN }}
        run: |
          set -eu
          trap 'rm -rf "$RUNNER_TEMP/noa-gemini" "$RUNNER_TEMP/noa-gemini-original"' EXIT
          if test -s "$RUNNER_TEMP/noa-gemini-original" && ! cmp -s "$RUNNER_TEMP/noa-gemini/.gemini/oauth_creds.json" "$RUNNER_TEMP/noa-gemini-original"; then
            jq -e '.refresh_token | type == "string" and length > 0' "$RUNNER_TEMP/noa-gemini/.gemini/oauth_creds.json" >/dev/null
            gh secret set NOA_GEMINI_OAUTH --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/noa-gemini/.gemini/oauth_creds.json"
          fi
