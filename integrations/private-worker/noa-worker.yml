name: N80 private selected text task
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: NOA song field request ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: n80-runtime-integration-verification
  cancel-in-progress: false
jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate the explicit task ID
        env:
          NOA_TASK_ID: ${{ inputs.task_id }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          if not re.fullmatch('[a-f0-9]{32}', os.environ['NOA_TASK_ID']):
              raise SystemExit('Invalid N80 task ID')
          PYCODE
      - name: Install Codex
        run: npm install --global --ignore-scripts @openai/codex@0.166.0
      - name: Restore private login
        env:
          INITIAL_AUTH: ${{ secrets.NOA_CODEX_AUTH }}
          ROTATION_TOKEN: ${{ secrets.NOA_SECRET_ROTATION_TOKEN }}
        run: |
          set -eu
          test -n "$ROTATION_TOKEN"
          umask 077
          mkdir -p "$RUNNER_TEMP/noa-codex"
          printf '%s' "$INITIAL_AUTH" | jq -ce 'select(.tokens.refresh_token | type == "string")' > "$RUNNER_TEMP/noa-codex/auth.json"
          cp "$RUNNER_TEMP/noa-codex/auth.json" "$RUNNER_TEMP/noa-auth-original"
      - name: Generate the selected field
        env:
          CODEX_HOME: ${{ runner.temp }}/noa-codex
          NOA_WORKER_KEY: ${{ secrets.NOA_WORKER_KEY }}
          NOA_TASK_ID: ${{ inputs.task_id }}
        run: timeout --signal=TERM --kill-after=10s 420s python3 worker.py
      - name: Persist refreshed login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.NOA_SECRET_ROTATION_TOKEN }}
        run: |
          set -eu
          trap 'rm -rf "$RUNNER_TEMP/noa-codex" "$RUNNER_TEMP/noa-auth-original"' EXIT
          if test -s "$RUNNER_TEMP/noa-auth-original" && ! cmp -s "$RUNNER_TEMP/noa-codex/auth.json" "$RUNNER_TEMP/noa-auth-original"; then
            jq -e '.tokens.refresh_token | type == "string"' "$RUNNER_TEMP/noa-codex/auth.json" >/dev/null
            gh secret set NOA_CODEX_AUTH --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/noa-codex/auth.json"
          fi
